                            </div>
                            <div class="card-content">
                                <h3 class="option-title">魅惑烟熏眼妆</h3>
                                <p class="option-desc">微烟熏眼线+饱和睫毛，夜晚约会的微醺魅力画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>

                        <label class="option-card">
