    <title>爱老人关注：退休后你最想重拾的兴趣？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爱老人关注：退休后你最想重拾的兴趣？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果是爱老人用户，你最支持哪个选项：退休后最想重拾的兴趣？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="retirement" value="reading-books">
                            <div class="card-image">
                                <img src="images/reading-books.svg" alt="老人手捧书本阅读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安静读书、看报、学习新知识</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="gardening">
                            <div class="card-image">
                                <img src="images/gardening.svg" alt="老人浇花园艺场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">打理花草、阳台种菜，亲近自然</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="local-travel">
                            <div class="card-image">
                                <img src="images/local-travel.svg" alt="老年人旅行观光合影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">跟团或自驾游，看看周边风景</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="handicraft">
                            <div class="card-image">
                                <img src="images/handicraft.svg" alt="老人做手工的特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">刺绣、编织、木工等手作活动</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
