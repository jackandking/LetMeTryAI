    <h1 id="pageTitle">爱老人关注：退休后你最想重拾的兴趣？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果是爱老人用户，你最支持哪个选项：退休后最想重拾的兴趣？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="reading-books">
                    <img src="images/reading-books.svg" alt="老人手捧书本阅读" loading="lazy">
                    <span>安静读书、看报、学习新知识</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="gardening">
                    <img src="images/gardening.svg" alt="老人浇花园艺场景" loading="lazy">
                    <span>打理花草、阳台种菜，亲近自然</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="local-travel">
                    <img src="images/local-travel.svg" alt="老年人旅行观光合影" loading="lazy">
                    <span>跟团或自驾游，看看周边风景</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="handicraft">
                    <img src="images/handicraft.svg" alt="老人做手工的特写" loading="lazy">
                    <span>刺绣、编织、木工等手作活动</span>
                </label>
            </div>
        </div>
    </form>
