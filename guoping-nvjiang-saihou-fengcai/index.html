<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国乒女将赛后风采投票：你更中意哪种赛后气质？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国乒女将赛后风采投票：你更中意哪种赛后气质？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="ganlian-liluo">
                            <div class="card-image">
                                <img src="images/ganlian-liluo.svg" alt="干练利落赛后形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">干练利落</h3>
                                <p class="option-desc">短发与镇定神情，赛后显得利落有力，干练又自信。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wenwan-xiaorong">
                            <div class="card-image">
                                <img src="images/wenwan-xiaorong.svg" alt="温婉笑容赛后形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温婉笑容</h3>
                                <p class="option-desc">温柔的微笑与亲和力，赛后气氛更温暖柔和。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lengjing-zhuanzhu">
                            <div class="card-image">
                                <img src="images/lengjing-zhuanzhu.svg" alt="冷静专注赛后形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷静专注</h3>
                                <p class="option-desc">沉着的眼神与从容气场，赛后显得稳重和专业。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="qingchun-huoli">
                            <div class="card-image">
                                <img src="images/qingchun-huoli.svg" alt="青春活力赛后形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青春活力</h3>
                                <p class="option-desc">赛后朝气蓬勃，笑容与活力感染全场，充满青春感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
