<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 跨域调 letmetry.cn 时带上完整 referer 路径，让统一看板按 /quguona/ 前缀归因 -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta name="baidu_union_verify" content="a474889f17de23d877149d511beb790d">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <title>去过哪 - 中国足迹地图</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>去过哪</h1>
            <p class="subtitle">点击省份，标记你的足迹</p>
        </header>

        <div class="map-container">
            <svg id="china-map" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="tooltip" class="tooltip"></div>
        </div>

        <div class="stats">
            <span class="stats-text">你去过 <span id="visited-count" class="count">0</span> / 34 个省级行政区</span>
        </div>

        <div class="nickname-section">
            <input type="text" id="nickname-input" class="nickname-input" placeholder="输入你的昵称（显示在地图上）" maxlength="12">
        </div>

        <div class="actions">
            <button id="publish-btn" class="btn-primary">发布到我的快手</button>
            <button id="generate-btn" class="btn-secondary">生成图片</button>
        </div>

        <div id="publish-status" class="publish-status hidden">
            <p id="publish-msg"></p>
        </div>

        <div id="result-section" class="result-section hidden">
            <p class="result-tip">长按图片保存到相册</p>
            <img id="result-image" class="result-image" alt="足迹地图">
            <div id="buy-intent" class="buy-intent">
                <p class="buy-title">🖼️ 可以把它做成实木画框，寄到家</p>
                <input type="tel" id="buy-phone" placeholder="手机号（用于联系你）" maxlength="11">
                <button id="buy-submit" class="btn-primary">登记购买意向</button>
                <p class="buy-note">免费登记 · 确认后再付款</p>
            </div>
            <div id="buy-done" class="buy-done hidden">
                <p class="buy-done-msg">✅ 已登记！实物版正在小批量试制，制作约需 3-5 天，我们会尽快联系你确认款式与付款。</p>
            </div>
            <button id="close-result" class="btn-secondary">关闭</button>
        </div>

        <div class="region-list">
            <h2>按区域选择</h2>
            <div id="region-groups"></div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../util.js"></script>
    <script src="china-map.js"></script>
    <script src="app.js?v=3"></script>
</body>

</html>
