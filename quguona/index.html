<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 跨域调 letmetry.cn 时带上完整 referer 路径，让统一看板按 /quguona/ 前缀归因 -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta name="baidu_union_verify" content="a474889f17de23d877149d511beb790d">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <title>去过哪 - 中国足迹地图</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>去过哪</h1>
            <p class="subtitle">点击省份，标记你的足迹</p>
        </header>

        <div class="map-container">
            <svg id="china-map" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="tooltip" class="tooltip"></div>
        </div>

        <div class="stats">
            <span class="stats-text">你去过 <span id="visited-count" class="count">0</span> / 34 个省级行政区</span>
        </div>

        <div class="nickname-section">
            <input type="text" id="nickname-input" class="nickname-input" placeholder="输入你的昵称（显示在地图上）" maxlength="12">
        </div>

        <div class="actions">
            <button id="publish-btn" class="btn-primary">发布到我的快手</button>
            <button id="generate-btn" class="btn-secondary">生成图片</button>
        </div>

        <div id="publish-status" class="publish-status hidden">
            <p id="publish-msg"></p>
        </div>

        <div id="result-section" class="result-section hidden">
            <p class="result-tip">长按图片保存到相册</p>
            <img id="result-image" class="result-image" alt="足迹地图">
            <div id="buy-intent" class="buy-intent">
                <span class="product-badge">实物定制 · 顺丰包邮</span>
                <h2 class="product-title">把你的足迹，装进实木画框</h2>
                <p class="product-sub">高清印刷 · 实木装裱 · 30 × 40 cm</p>
                <img class="product-hero" src="images/frame-hero.jpg" alt="实木画框装裱的中国足迹地图实物效果图">
                <div class="product-meta">
                    <div class="product-price"><span class="price-symbol">¥</span>129<span class="price-suffix"> / 幅</span></div>
                    <div class="product-points">
                        <span>按你的足迹定制</span>
                        <span>装裱完成再发货</span>
                        <span>3–5 天到家</span>
                    </div>
                </div>
                <button id="buy-submit" class="btn-primary buy-cta">我要付款购买</button>
            </div>
            <button id="close-result" class="btn-secondary">关闭</button>
        </div>

        <div class="region-list">
            <h2>按区域选择</h2>
            <div id="region-groups"></div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../util.js"></script>
    <script src="china-map.js"></script>
    <script src="app.js?v=3"></script>
<div style="text-align:center;font-size:12px;color:#999;padding:8px 0 16px;"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:#999;text-decoration:none;">京ICP备2024092319号-1</a></div>
</body>

</html>
