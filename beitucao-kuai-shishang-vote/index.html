    <title>被吐槽的快时尚，你会怎么选？——你的穿搭与消费态度投票</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">被吐槽的快时尚，你会怎么选？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">被吐槽的快时尚，你会怎么选？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-for-trend">
                            <div class="card-image">
                                <img src="images/buy-for-trend.svg" alt="手拿多件潮流服饰准备试穿" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">追潮流换新</h3>
                                <p class="option-desc">价格便宜、款式多，想买就换，跟上当季潮流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prioritize-quality">
                            <div class="card-image">
                                <img src="images/prioritize-quality.svg" alt="展示高质感面料与做工细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">挑质量少买</h3>
                                <p class="option-desc">宁可少买几件，也选更耐穿的面料和做工。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="classic-invest">
                            <div class="card-image">
                                <img src="images/classic-invest.svg" alt="简约经典穿搭示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">选经典长期穿</h3>
                                <p class="option-desc">偏好百搭经典款，注重长期可搭配性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="reuse-resell">
                            <div class="card-image">
                                <img src="images/reuse-resell.svg" alt="寄售或二手衣物整齐摆放" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">二手/换购优先</h3>
                                <p class="option-desc">优先考虑二手、换购或循环使用，减少浪费。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
