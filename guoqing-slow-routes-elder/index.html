    <title>国庆带老人出游，你更爱哪种慢节奏线路？ — 情景化慢度假选项</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国庆带老人出游，你更爱哪种慢节奏线路？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国庆带老人出游，你更爱哪种慢节奏线路？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hot-springs-retreat">
                            <div class="card-image">
                                <img src="images/hot-springs-retreat.svg" alt="老人温泉泡汤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温泉养生慢游</h3>
                                <p class="option-desc">泡温泉+轻松按摩，晚上在民宿听雨水声，适合放慢节奏休息的假期画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-town-stroll">
                            <div class="card-image">
                                <img src="images/ancient-town-stroll.svg" alt="古镇散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古镇怀旧慢行</h3>
                                <p class="option-desc">古巷散步、老店小吃，和父母一起回味老照片里的街景与味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="seaside-tide-watch">
                            <div class="card-image">
                                <img src="images/seaside-tide-watch.svg" alt="海边看潮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">海边看潮慢度假</h3>
                                <p class="option-desc">傍晚看潮起潮落，听海风和贝壳声，适合静心谈天和轻松散步的线路。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tea-mountain-retreat">
                            <div class="card-image">
                                <img src="images/tea-mountain-retreat.svg" alt="茶园山间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">茶园山间静心</h3>
                                <p class="option-desc">茶园漫步、品一盏清茶，空气清新、步调缓慢的乡村静享体验。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
