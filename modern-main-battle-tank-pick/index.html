    <title>现代主战坦克，你更选谁？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">现代主战坦克，你更选谁？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更看好哪款现代主战坦克？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="t-14-armata">
                            <div class="card-image">
                                <img src="images/t-14-armata.svg" alt="T-14 阿玛塔 侧视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">俄罗斯 T-14 阿玛塔</h3>
                                <p class="option-desc">新一代俄系主战坦克，注重信息化与防护</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="m1a2-abrams">
                            <div class="card-image">
                                <img src="images/m1a2-abrams.svg" alt="M1A2 艾布拉姆斯 正面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">美国 M1A2 艾布拉姆斯</h3>
                                <p class="option-desc">美系重装甲与火力，实战经验丰富</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="type-99a">
                            <div class="card-image">
                                <img src="images/type-99a.svg" alt="99A 主战坦克 侧面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中国 99A 型</h3>
                                <p class="option-desc">国产主战坦克，兼顾火力与机动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="leopard-2a7">
                            <div class="card-image">
                                <img src="images/leopard-2a7.svg" alt="Leopard 2A7 在野外" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">德国 豹2A7</h3>
                                <p class="option-desc">欧洲高机动与高精度火控的代表</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
