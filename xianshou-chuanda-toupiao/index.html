    <title>显瘦穿搭投票 — 选出最显瘦的一套</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">显瘦穿搭投票 — 选出最显瘦的一套</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">显瘦穿搭投票：哪一种搭配最显瘦、最实用？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="high-waist-straight-jeans-short-boots">
                            <div class="card-image">
                                <img src="images/high-waist-straight-jeans-short-boots.svg" alt="高腰直筒牛仔裤配短靴的显瘦穿搭示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高腰直筒牛仔＋短靴拉长腿型</h3>
                                <p class="option-desc">高腰线拉长下半身，直筒裤收敛赘肉，短靴显腿长。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="a-line-midi-skirt-waist-cincher-top">
                            <div class="card-image">
                                <img src="images/a-line-midi-skirt-waist-cincher-top.svg" alt="A字中长裙配收腰上衣的显瘦穿搭示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">A字中长裙＋收腰上衣显腰线</h3>
                                <p class="option-desc">A字裙遮胯腿，收腰上衣打造逆天腰线感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="monochrome-layering-long-coat">
                            <div class="card-image">
                                <img src="images/monochrome-layering-long-coat.svg" alt="同色系叠穿配长款外套的显瘦穿搭示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同色系叠穿＋长款外套纵向拉伸</h3>
                                <p class="option-desc">同色上下装减少断层，长外套产生竖向延伸感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="v-neck-top-vertical-stripes">
                            <div class="card-image">
                                <img src="images/v-neck-top-vertical-stripes.svg" alt="V领上衣加竖条纹单品的显瘦穿搭示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">V领上衣＋竖条纹单品显瘦上身</h3>
                                <p class="option-desc">V领延长颈部线条，竖条纹有视觉收缩效果。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
