    <title>下大雨雷雨，你家孩子该待哪儿？家长避雨场景对比</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">下大雨雷雨，你家孩子该待哪儿？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下大雨雷雨，你家孩子会待在哪儿？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="livingroom-with-parents">
                            <div class="card-image">
                                <img src="images/livingroom-with-parents.svg" alt="孩子和父母在客厅一起看动画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">客厅和大人在一起</h3>
                                <p class="option-desc">和爸妈在客厅玩桌游、看动画或聊故事，大家在一起更踏实（离窗远一些）。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="own-room-with-curtains">
                            <div class="card-image">
                                <img src="images/own-room-with-curtains.svg" alt="孩子在自己房间看书关窗帘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自己的房间安静待着</h3>
                                <p class="option-desc">回到自己的房间玩玩具、看书或看动画，关窗、拉窗帘减少惊动。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="basement-safe-room">
                            <div class="card-image">
                                <img src="images/basement-safe-room.svg" alt="家人带孩子在无窗的内室避雨" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家里地下室或更安全的内室</h3>
                                <p class="option-desc">如果家中有地下室或无靠窗电器的内室，会带孩子去更内侧的安全空间待着。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="go-to-neighbor-or-relative">
                            <div class="card-image">
                                <img src="images/go-to-neighbor-or-relative.svg" alt="孩子和家长在邻居家客厅避雨" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">临时去邻居或亲戚家</h3>
                                <p class="option-desc">遇到屋内不便或停电时，临时到邻居或亲戚家一起避雨并互相照应。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
