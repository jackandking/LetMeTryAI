    <title>硬核对比：现代战机谁更强？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：现代战机谁更强？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款现代战机的综合作战力？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-22-raptor">
                            <div class="card-image">
                                <img src="images/f-22-raptor.svg" alt="F-22战斗机侧面高清图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-22 Raptor</h3>
                                <p class="option-desc">隐身优先，超视距制空利器</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="su-57">
                            <div class="card-image">
                                <img src="images/su-57.svg" alt="Su-57 战斗机机动姿态图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Su-57</h3>
                                <p class="option-desc">机动性强，近距空战优势明显</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="j-20">
                            <div class="card-image">
                                <img src="images/j-20.svg" alt="J-20 战斗机正面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">J-20</h3>
                                <p class="option-desc">隐身与巡航性能平衡型新秀</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="rafale">
                            <div class="card-image">
                                <img src="images/rafale.svg" alt="Rafale 多用途战机侧面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Rafale</h3>
                                <p class="option-desc">多用途灵活，传感器与武装配置均衡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
