    <title>台风天出门，你会选哪种防水妆？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风天出门，你会选哪种防水妆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风天出门，你会选哪种防水妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-longwear">
                            <div class="card-image">
                                <img src="images/light-longwear.svg" alt="轻薄持久底妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄持久底妆</h3>
                                <p class="option-desc">薄透粉底液+防水粉底，妆感自然，遇雨不易花妆，适合想清爽妆感的出门日常。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-oil-control">
                            <div class="card-image">
                                <img src="images/matte-oil-control.svg" alt="哑光控油妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">哑光控油型</h3>
                                <p class="option-desc">哑光粉底+控油散粉，吸油抗湿，适合易出油或高湿环境下保持清爽妆面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dewy-hydrate">
                            <div class="card-image">
                                <img src="images/dewy-hydrate.svg" alt="水光保湿妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水光保湿型</h3>
                                <p class="option-desc">保湿气垫或带光感防水底妆，雨天也能维持水润肌理，妆面看起来更有光泽感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spray-set-lock">
                            <div class="card-image">
                                <img src="images/spray-set-lock.svg" alt="定妆喷雾与局部加固示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">定妆喷雾+局部加固</h3>
                                <p class="option-desc">任意底妆配合定妆喷雾、眼唇防水产品与局部加固，适合长时间外出或需要应对大雨的场景。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
