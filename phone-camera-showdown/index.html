    <title>谁的拍照风格更合你胃口？手机拍照偏好投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">智能手机拍照偏好投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你在手机拍照时最看重哪类表现？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="low-light-performance">
                            <div class="card-image">
                                <img src="images/low-light-performance.svg" alt="夜景拍照示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夜景表现</h3>
                                <p class="option-desc">暗光下的噪点与细节还原是否出色</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="portrait-bokeh-skin">
                            <div class="card-image">
                                <img src="images/portrait-bokeh-skin.svg" alt="人像拍照示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">人像虚化与肤色</h3>
                                <p class="option-desc">人像处理的自然度与肤色还原</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wide-angle-detail">
                            <div class="card-image">
                                <img src="images/wide-angle-detail.svg" alt="超广角拍照示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">超广角与细节</h3>
                                <p class="option-desc">广角场景的构图与边缘细节表现</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
