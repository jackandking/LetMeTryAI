    <title>白头发多了，你更像哪种情况？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">白头发多了，你觉得更像哪种情况？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">白头发多了，你觉得更像哪种情况？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-aging">
                            <div class="card-image">
                                <img src="images/natural-aging.svg" alt="白发自然增长的老人侧脸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">岁月痕迹（自然变多）</h3>
                                <p class="option-desc">像时光留下的标记，和老照片一起回忆往事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stress-lifestyle">
                            <div class="card-image">
                                <img src="images/stress-lifestyle.svg" alt="熬夜后头发显白的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">作息压力（熬夜/劳累）</h3>
                                <p class="option-desc">最近忙、睡不好，早上镜子里多了几缕银丝</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-trait">
                            <div class="card-image">
                                <img src="images/family-trait.svg" alt="三代同堂的头发对比" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家族遗传（父母也早白）</h3>
                                <p class="option-desc">家里长辈也早白，像是家族里默默传下来的样子</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
