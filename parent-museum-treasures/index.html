    <title>博物馆镇馆之宝，孩子眼前一亮</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子逛博物馆，哪类镇馆之宝让他眼前一亮？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子逛博物馆，哪类镇馆之宝让他眼前一亮？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bronze-treasures">
                            <div class="card-image">
                                <img src="images/bronze-treasures.svg" alt="青铜重器类镇馆之宝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜重器</h3>
                                <p class="option-desc">后母戊鼎、四羊方尊，厚重青铜器让孩子感受古代工艺。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dinosaur-fossils">
                            <div class="card-image">
                                <img src="images/dinosaur-fossils.svg" alt="恐龙化石类镇馆之宝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">恐龙化石</h3>
                                <p class="option-desc">巨大的恐龙骨架和古生物化石，满足孩子对远古巨兽的想象。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gold-mask">
                            <div class="card-image">
                                <img src="images/gold-mask.svg" alt="黄金面具类镇馆之宝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">黄金面具</h3>
                                <p class="option-desc">三星堆神秘金面罩，造型奇特，让孩子一眼难忘。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-weapons">
                            <div class="card-image">
                                <img src="images/ancient-weapons.svg" alt="古代兵器类镇馆之宝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古代兵器</h3>
                                <p class="option-desc">越王剑、古代铠甲，孩子眼中的'真实版英雄装备'。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
