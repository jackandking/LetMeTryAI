<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>关注：最想参加的社区活动</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：最想参加的社区活动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持参加哪种社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="interest-groups">
                            <div class="card-image">
                                <img src="images/interest-groups.svg" alt="书法手工活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣小组（书画、手工）</h3>
                                <p class="option-desc">书画/手工小组，学东西又交朋友</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighborhood-gathering">
                            <div class="card-image">
                                <img src="images/neighborhood-gathering.svg" alt="邻里茶话会" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里聚会（茶话会）</h3>
                                <p class="option-desc">小区茶话会，邻里聊家常</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="volunteer-service">
                            <div class="card-image">
                                <img src="images/volunteer-service.svg" alt="志愿服务场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">志愿服务（助老/植绿）</h3>
                                <p class="option-desc">参加志愿服务，帮人也有收获</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="short-day-trip">
                            <div class="card-image">
                                <img src="images/short-day-trip.svg" alt="短途郊游" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短途郊游（一天行程）</h3>
                                <p class="option-desc">小团体短途游，轻松走走看看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    <script>
        (function() {

                const script = document.createElement('script');

                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
