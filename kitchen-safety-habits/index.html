    <title>洗菜做饭，哪个细节更该留意</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">洗菜做饭，哪个细节更该留意</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，洗菜做饭，哪个细节更该留意？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="no-rinse-raw-meat">
                            <div class="card-image">
                                <img src="images/no-rinse-raw-meat.svg" alt="生肉不直接冲洗配图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">生肉不直接用水冲</h3>
                                <p class="option-desc">避免细菌飞溅，更安全</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="separate-cutting-boards">
                            <div class="card-image">
                                <img src="images/separate-cutting-boards.svg" alt="砧板分开使用配图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">砧板生熟分开用</h3>
                                <p class="option-desc">防止交叉污染，更卫生</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="cool-leftovers-first">
                            <div class="card-image">
                                <img src="images/cool-leftovers-first.svg" alt="剩菜放凉冷藏配图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">剩菜放凉再冷藏</h3>
                                <p class="option-desc">避免细菌繁殖，更科学</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="no-sprouted-potatoes">
                            <div class="card-image">
                                <img src="images/no-sprouted-potatoes.svg" alt="不吃发芽土豆配图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">发芽土豆坚决不吃</h3>
                                <p class="option-desc">预防食物中毒，更放心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
