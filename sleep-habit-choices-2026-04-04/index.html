    <title>关注：哪种睡前小习惯最管用？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：哪种睡前小习惯最管用？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你觉得哪种睡前习惯最能帮你睡得好？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="consistent-schedule">
                            <div class="card-image">
                                <img src="images/consistent-schedule.svg" alt="床与闹钟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定作息</h3>
                                <p class="option-desc">每天同一时间上床和起床</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="less-screen-before-bed">
                            <div class="card-image">
                                <img src="images/less-screen-before-bed.svg" alt="关掉手机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前少看屏</h3>
                                <p class="option-desc">睡前一小时尽量不看手机或电视</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="foot-bath-before-sleep">
                            <div class="card-image">
                                <img src="images/foot-bath-before-sleep.svg" alt="泡脚盆" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前泡脚</h3>
                                <p class="option-desc">温水泡脚放松促眠</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="short-afternoon-nap">
                            <div class="card-image">
                                <img src="images/short-afternoon-nap.svg" alt="午休憩息" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">午后小憩</h3>
                                <p class="option-desc">午后短睡20-30分钟提神不影响夜眠</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

        </footer>
