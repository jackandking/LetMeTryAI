<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">一条龙舟背后的中华文明，你知道几个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">一条龙舟里，藏着哪一种中华文明？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dragon-head-symbol">
                            <div class="card-image">
                                <img src="images/dragon-head-symbol.svg" alt="龙舟龙头雕刻中的中华图腾文化" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">龙首图腾</h3>
                                <p class="option-desc">龙头、龙鳞、龙尾，藏着千年图腾崇拜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="duanwu-origin">
                            <div class="card-image">
                                <img src="images/duanwu-origin.svg" alt="端午节屈原故事与龙舟文化起源" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">端午起源</h3>
                                <p class="option-desc">屈原投江、粽子飘香，是家国情怀的起点</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="racing-spirit">
                            <div class="card-image">
                                <img src="images/racing-spirit.svg" alt="龙舟竞渡中展现的团结协作精神" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">竞渡精神</h3>
                                <p class="option-desc">鼓声一响，众桨齐发，团结比速度更重要</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="intangible-heritage">
                            <div class="card-image">
                                <img src="images/intangible-heritage.svg" alt="龙舟制作与竞渡的非物质文化遗产传承" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">非遗传承</h3>
                                <p class="option-desc">从古老河道划进现代赛场，传统也在创新</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
