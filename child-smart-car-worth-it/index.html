<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">那款儿童智能车，值不值得买？你家适合吗</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">那款儿童智能车，值不值得买？你会怎么选？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-now">
                            <div class="card-image">
                                <img src="images/buy-now.svg" alt="家长牵着孩子坐智能车笑容画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立刻入手</h3>
                                <p class="option-desc">功能齐全、颜值在线，直接买回家试用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-on-sale">
                            <div class="card-image">
                                <img src="images/buy-on-sale.svg" alt="促销标签与儿童智能车的展示图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">等到打折再买</h3>
                                <p class="option-desc">认可设计但觉得价格可以等优惠入手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="not-worth">
                            <div class="card-image">
                                <img src="images/not-worth.svg" alt="家长摇头看着儿童智能车的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会买，太贵/不实用</h3>
                                <p class="option-desc">预算或使用场景不匹配，倾向放弃</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-and-see">
                            <div class="card-image">
                                <img src="images/wait-and-see.svg" alt="家长在手机上翻看评价与视频" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先观望口碑</h3>
                                <p class="option-desc">想看更多长期体验与安全反馈后再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
