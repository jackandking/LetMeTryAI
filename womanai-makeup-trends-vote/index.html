<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你会优先尝试哪类美妆护肤趋势？选出你下一个要试的护肤方向</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会优先尝试哪类美妆护肤趋势？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hyaluronic-hydration">
                            <div class="card-image">
                                <img src="images/hyaluronic-hydration.svg" alt="玻尿酸保湿产品与水润肌肤示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">玻尿酸补水</h3>
                                <p class="option-caption">以高浓度玻尿酸为主的深度保湿方案，适合缺水肌</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ceramide-barrier-repair">
                            <div class="card-image">
                                <img src="images/ceramide-barrier-repair.svg" alt="神经酰胺精华和温和护理示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">屏障修护（神经酰胺）</h3>
                                <p class="option-caption">强调修复皮肤屏障、减少刺激并恢复健康肤感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="skinimalism-light-makeup">
                            <div class="card-image">
                                <img src="images/skinimalism-light-makeup.svg" alt="轻薄底妆与自然妆容示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄裸妆（skinimalism）</h3>
                                <p class="option-caption">以护肤为底、追求轻薄自然的底妆与简约妆容</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="active-serum-essence">
                            <div class="card-image">
                                <img src="images/active-serum-essence.svg" alt="功效精华瓶与涂抹示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">功效型精华（维C/视黄醇）</h3>
                                <p class="option-caption">使用维C、视黄醇等功能性精华有针对性改善肤质</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
