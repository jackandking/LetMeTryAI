<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">二战坦克对决 — 谁更强？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">二战中哪款坦克更值得你投票？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="t-34">
                            <div class="card-image">
                                <img src="images/t-34.svg" alt="t-34坦克侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">苏联 T-34</h3>
                                <p class="option-desc">T-34：平衡的装甲与机动性，战场担当</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="panther">
                            <div class="card-image">
                                <img src="images/panther.svg" alt="panther坦克" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">德國 Panther</h3>
                                <p class="option-desc">Panther：强劲火力与良好射控，技术代表</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="m4-sherman">
                            <div class="card-image">
                                <img src="images/m4-sherman.svg" alt="m4-sherman坦克" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">美國 M4 Sherman</h3>
                                <p class="option-desc">M4 Sherman：数量取胜、维护与配件优势</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="kv-1">
                            <div class="card-image">
                                <img src="images/kv-1.svg" alt="kv-1坦克" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">苏联 KV-1</h3>
                                <p class="option-desc">KV-1：厚重装甲、防护力出众</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
