    <title>春夏换季护肤：你最想试哪种方法？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春夏换季护肤小技巧</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季护肤你最想尝试哪种策略？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="moisture-lock">
                            <div class="card-image">
                                <img src="images/moisture-lock.svg" alt="补水保湿护肤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">补水并锁水</h3>
                                <p class="option-caption">强化补水 + 锁水，适合偏干肤质。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gentle-exfoliation">
                            <div class="card-image">
                                <img src="images/gentle-exfoliation.svg" alt="去角质护肤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温和去角质</h3>
                                <p class="option-caption">温和去角质促进吸收，建议控制频率。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sun-protection">
                            <div class="card-image">
                                <img src="images/sun-protection.svg" alt="防晒与隔离" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">强化防晒隔离</h3>
                                <p class="option-caption">每日做好防晒和物理隔离，防止光老化。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
