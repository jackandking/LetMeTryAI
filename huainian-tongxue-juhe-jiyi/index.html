<head>

    <title>怀念的同学聚会记忆</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">怀念的同学聚会记忆：哪些瞬间令你难忘</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在同学聚会上，你怀念哪类记忆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="old-photos">
                            <div class="card-image">
                                <img src="images/old-photos.jpg" alt="老照片与同学合影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">翻看老照片</h3>
                                <p class="option-caption">翻开相册，重温熟悉的面孔与笑容</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-style-meal">
                            <div class="card-image">
                                <img src="images/home-style-meal.jpg" alt="大家围桌吃饭的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一起吃家常菜</h3>
                                <p class="option-caption">围坐一桌，品尝熟悉的家常味道</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="singing-karaoke">
                            <div class="card-image">
                                <img src="images/singing-karaoke.svg" alt="老年人一起卡拉OK唱歌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">唱歌跳舞或卡拉OK</h3>
                                <p class="option-caption">点首老歌，大伙儿一起唱起来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sharing-stories">
                            <div class="card-image">
                                <img src="images/sharing-stories.jpg" alt="长者围坐分享故事" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲述旧日趣事</h3>
                                <p class="option-caption">轮流说起当年的趣闻与笑话，温馨又幽默</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                };

        })();
    </script>
</body>
</html>
