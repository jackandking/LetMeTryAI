<head>

    <title>屈原姓氏冷知识</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">屈原其实不姓屈，你知道他姓啥吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">屈原其实不姓屈，你知道他姓啥吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mi">
                            <div class="card-image">
                                <img src="images/option-mi.svg" alt="芈字书法" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">芈</h3>
                                <p class="option-desc">楚国贵族芈姓，屈原真正的本姓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="xiong">
                            <div class="card-image">
                                <img src="images/option-xiong.svg" alt="熊字书法" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">熊</h3>
                                <p class="option-desc">楚国国君姓熊，很多人会弄混</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chu">
                            <div class="card-image">
                                <img src="images/option-chu.svg" alt="楚字书法" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">楚</h3>
                                <p class="option-desc">来自楚国，常被误当成他的姓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ping">
                            <div class="card-image">
                                <img src="images/option-ping.svg" alt="平字书法" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">平</h3>
                                <p class="option-desc">这是屈原的名，不是姓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
