    <title>C罗新造型，你给打几分？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">C罗新造型亮相，你给打几分？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">C罗这个新造型，你给打几分？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="perfect-score">
                            <div class="card-image">
                                <img src="images/perfect-score.svg" alt="C罗新造型满分评价" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">满分，气场全开</h3>
                                <p class="option-desc">满分，C罗就是能驾驭任何风格，越看越帅。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bold-but-picky">
                            <div class="card-image">
                                <img src="images/bold-but-picky.svg" alt="C罗新造型大胆但挑人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">有想法，但挑人</h3>
                                <p class="option-desc">造型挺大胆，换成别人可能真hold不住。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="average-look">
                            <div class="card-image">
                                <img src="images/average-look.svg" alt="C罗新造型中规中矩" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中规中矩</h3>
                                <p class="option-desc">不算惊艳也不差，正常发挥吧。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="not-his-best">
                            <div class="card-image">
                                <img src="images/not-his-best.svg" alt="C罗新造型不如经典" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不如经典造型</h3>
                                <p class="option-desc">还是怀念他之前的经典形象，这个新风格不太适合他。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
