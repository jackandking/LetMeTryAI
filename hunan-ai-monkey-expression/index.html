    <div class="container">

            <h1 id="pageTitle">湖南卫视那只“AI猴子”，哪个表情更有画面感？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">湖南卫视那只“AI猴子”，哪个表情更有画面感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="jing-ya-deng-yan">
                            <div class="card-image">
                                <img src="images/jing-ya-deng-yan.svg" alt="AI猴子睁大眼睛惊讶表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">惊讶瞪眼</h3>
                                <p class="option-desc">眼睛睁大，像刚看到意外瞬间，画面感强烈。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="huai-xiao-pie-zui">
                            <div class="card-image">
                                <img src="images/huai-xiao-pie-zui.svg" alt="AI猴子坏笑撇嘴表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">坏笑撇嘴</h3>
                                <p class="option-desc">一抹坏笑，带点戏谑感，像有小心思在脑中转。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="yi-huo-wai-tou">
                            <div class="card-image">
                                <img src="images/yi-huo-wai-tou.svg" alt="AI猴子疑惑歪头表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">疑惑歪头</h3>
                                <p class="option-desc">微微歪头、眉间带问号，像在听到奇怪的解释。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chen-si-ning-shi">
                            <div class="card-image">
                                <img src="images/chen-si-ning-shi.svg" alt="AI猴子沉思凝视表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">沉思凝视</h3>
                                <p class="option-desc">低眉沉思、凝视前方，画面像在回味一个故事。</p>
