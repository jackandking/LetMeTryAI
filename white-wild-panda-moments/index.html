    <title>白色野生熊猫的那些震撼瞬间，你更心动哪一帧？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">那只白色野生熊猫的画面，你被哪个瞬间震到了？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">那只白色野生熊猫的画面，你被哪个瞬间震到了？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="snowy-look-up">
                            <div class="card-image">
                                <img src="images/white-wild-panda-look-up.svg" alt="白色野生熊猫在雪地抬头凝视的瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">雪地抬头凝视</h3>
                                <p class="option-desc">它在雪地抬头、眼神直视镜头，那一刻安静又有力量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cliff-grab-branch">
                            <div class="card-image">
                                <img src="images/white-wild-panda-cliff-grab.svg" alt="白色野生熊猫悬岩抓住树枝的瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">悬岩抓枝的身姿</h3>
                                <p class="option-desc">悬在峭壁间抓住树枝的动作，像在挑战重力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="playful-chase">
                            <div class="card-image">
                                <img src="images/white-wild-panda-playful-chase.svg" alt="白色野生熊猫与同伴追逐翻滚的瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">与同伴追逐翻滚</h3>
                                <p class="option-desc">它和小伙伴追逐翻滚，动感十足又萌力爆棚。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="windy-stare">
                            <div class="card-image">
                                <img src="images/white-wild-panda-windy-stare.svg" alt="白色野生熊猫在风雪中露出目光的瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">风雪掩面露目光</h3>
                                <p class="option-desc">风雪中探出头露出坚定目光，像电影里的定格镜头。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
