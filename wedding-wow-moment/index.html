    <title>结婚那天想在哪个瞬间惊艳全场？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">结婚那天，你想在哪个瞬间惊艳全场？揭面回眸还是誓词对视？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">结婚那天，你想在哪个瞬间惊艳全场？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="vow-eye-contact">
                            <div class="card-image">
                                <img src="images/vow-eye-contact.svg" alt="誓词时深情对视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">誓词深情对视</h3>
                                <p class="option-desc">交换誓言时与他深情对望，所有镜头都定格在那一刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="veil-reveal-smile">
                            <div class="card-image">
                                <img src="images/veil-reveal-smile.svg" alt="揭开面纱回眸微笑" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">揭面回眸一笑</h3>
                                <p class="option-desc">揭开面纱后的回眸一笑，像电影镜头般留下惊艳瞬间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="swirl-back-silhouette">
                            <div class="card-image">
                                <img src="images/swirl-back-silhouette.svg" alt="婚纱裙摆转身背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">裙摆转身背影杀</h3>
                                <p class="option-desc">旋转裙摆、背影落光，留下耐看又有画面感的瞬间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="grand-entrance">
                            <div class="card-image">
                                <img src="images/grand-entrance.svg" alt="走红毯亮相瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">走红毯瞬间亮相</h3>
                                <p class="option-desc">走红毯登场那刻抬头亮相，全场视线瞬间聚焦</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
