    <title>长者生活习惯你更认同哪种 — 爱老人投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">长者生活习惯你更认同哪种：作息与活动风格</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">长者生活习惯你更认同哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-routine">
                            <div class="card-image">
                                <img src="images/regular-routine.svg" alt="老人晨练散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">作息规律型</h3>
                                <p class="option-desc">早睡早起、固定三餐、每天散步或做轻体操，注重稳定与恢复体力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="flexible-pace">
                            <div class="card-image">
                                <img src="images/flexible-pace.svg" alt="老人休闲读书" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">灵活随性型</h3>
                                <p class="option-desc">睡眠与饮食按个人感觉调整，活动时间不固定，重视舒适与自由。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="social-interest">
                            <div class="card-image">
                                <img src="images/social-interest.svg" alt="老人手工活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣社交型</h3>
                                <p class="option-desc">以兴趣和社交为中心，参加手工、社团或聚会，活动量较高，精神更活跃。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
