    <title>陪爸妈看房，你更在意哪个细节？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">陪爸妈看房，你更在意哪个细节？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">陪爸妈看房，你更在意哪个细节？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="floor-lighting">
                            <div class="card-image">
                                <img src="images/floor-lighting.svg" alt="窗外采光和楼层" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">楼层与采光</h3>
                                <p class="option-desc">采光好、通风佳，白天活动更舒适，衣物晾晒也方便。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nearby-services">
                            <div class="card-image">
                                <img src="images/nearby-services.svg" alt="附近医院超市公交" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">交通与配套</h3>
                                <p class="option-desc">离医院、超市和公交近，日常看病买菜出行更省心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="elevator-accessibility">
                            <div class="card-image">
                                <img src="images/elevator-accessibility.svg" alt="电梯与无障碍设施" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电梯与无障碍</h3>
                                <p class="option-desc">有电梯、楼道宽敞、无障碍通道，便于行动不便的爸妈上下楼。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="safety-cleanliness">
                            <div class="card-image">
                                <img src="images/safety-cleanliness.svg" alt="小区安全与房屋卫生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安全与卫生</h3>
                                <p class="option-desc">小区安保、楼道与室内卫生让人放心，居住更有安全感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
