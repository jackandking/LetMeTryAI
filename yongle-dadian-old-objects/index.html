    <title>您家里还留着哪种老物件？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">《永乐大典》回家了，您家里还留着哪种老物件？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">您家里还留着哪种老物件？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="old-photos-albums">
                            <div class="card-image">
                                <img src="images/old-photos-albums.svg" alt="一摞泛黄的黑白老照片和相册" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老照片与相册</h3>
                                <p class="option-desc">夹在相册里的黑白照片，是岁月最温柔的证据。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ration-tickets">
                            <div class="card-image">
                                <img src="images/ration-tickets.svg" alt="粮票和布票老票据" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">粮票与布票</h3>
                                <p class="option-desc">当年凭票买东西的日子，每张票都藏着家的算计与温度。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="enamel-mugs">
                            <div class="card-image">
                                <img src="images/enamel-mugs.svg" alt="带怀旧图案的搪瓷茶缸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">搪瓷缸与茶缸</h3>
                                <p class="option-desc">掉漆的搪瓷缸，装着一杯茶和几十年的家长里短。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="old-radio-tapes">
                            <div class="card-image">
                                <img src="images/old-radio-tapes.svg" alt="老式收音机和磁带" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老收音机与磁带</h3>
                                <p class="option-desc">旋钮一拧，戏曲与相声响起，那是家里最早的背景音乐。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
