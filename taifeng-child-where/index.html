    <title>台风来时孩子该待哪里才省心？家长们的场景式选择</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风来时孩子该待哪里才省心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风来时，孩子待在哪个地方更让你省心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="stay-home">
                            <div class="card-image">
                                <img src="images/stay-home.svg" alt="孩子在家和父母一起避风" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">留在家里和家人一起</h3>
                                <p class="option-desc">在熟悉环境由父母或老人陪伴，随时能照看和取物品。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="relative-home">
                            <div class="card-image">
                                <img src="images/relative-home.svg" alt="孩子在亲友家避风" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">去可信亲友家暂避</h3>
                                <p class="option-desc">到亲友家互相照应，人手更多但路途与接送需评估。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="community-shelter">
                            <div class="card-image">
                                <img src="images/community-shelter.svg" alt="孩子在社区避难点" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">去社区或学校临时避难点</h3>
                                <p class="option-desc">去有组织的避难点或学校，安全措施较完善但环境较陌生。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hotel-stay">
                            <div class="card-image">
                                <img src="images/hotel-stay.svg" alt="孩子在酒店避风" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">订酒店或临时民宿避风</h3>
                                <p class="option-desc">住酒店环境舒适、独立但费用与撤离安排需考虑。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
