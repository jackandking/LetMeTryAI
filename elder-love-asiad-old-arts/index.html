            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看亚运开幕式，你更怀念哪种老式文艺表演？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="jing-ju">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">京剧唱段</h3>
                                <p class="option-desc">锣鼓一响、旦角台步，仿佛回到老戏院的红灯下。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="minzu-wu">
                            <div class="card-image">
                                <img src="images/minzu-wu.svg" alt="群舞演员身着民族服装" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">民族舞表演</h3>
                                <p class="option-desc">色彩服饰、群舞翻飞，像村晚或广场晚会的热闹场面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">杂技绝技</h3>
                                <p class="option-desc">空中翻转与顶碗瞬间，掌声与惊呼交织的惊险瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="he-chang">
                            <div class="card-image">
                                <img src="images/he-chang.svg" alt="老年合唱团在台上演唱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">合唱大联唱</h3>
                                <p class="option-desc">多人合声，熟悉旋律让全场跟着拍手，温暖又亲切。</p>
