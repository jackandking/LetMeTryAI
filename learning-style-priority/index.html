    <title>你更看重孩子哪种学习方式？家长怎么看</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你更看重孩子哪种学习方式？在家会选动手实践还是安静听讲？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你更看重孩子哪种学习方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hands-on-projects">
                            <div class="card-image">
                                <img src="images/hands-on-projects.svg" alt="孩子做手工实践场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动手做项目</h3>
                                <p class="option-desc">做中学：通过项目、实验和手工让孩子在实践里理解知识和解决问题。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="systematic-lecture">
                            <div class="card-image">
                                <img src="images/systematic-lecture.svg" alt="孩子认真听课做笔记" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">系统听讲笔记</h3>
                                <p class="option-desc">结构化讲解：老师讲解+笔记，适合建立知识框架和思路梳理。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="practice-drills">
                            <div class="card-image">
                                <img src="images/practice-drills.svg" alt="孩子在书桌前做练习题" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重复练习巩固</h3>
                                <p class="option-desc">大量练习与即时反馈，靠重复把技能打牢，适合应对课堂评测或技能记忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="group-collaboration">
                            <div class="card-image">
                                <img src="images/group-collaboration.svg" alt="孩子参与小组讨论互动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">小组合作讨论</h3>
                                <p class="option-desc">合作讨论：通过小组探讨和角色分工，培养表达、协作与解决问题的能力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
