    <title>香氛选择：你更爱哪类香调？</title>

<body>
    <h1 id="pageTitle">香氛选择：你更爱哪类香调？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果第一次入手香水，你会选哪类香调？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="womanai" value="floral-fresh">
                    <img src="images/floral-fresh.svg" alt="花香系" loading="lazy">
                    <span>适合温柔或想要甜美气质的人</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="citrus-fresh">
                    <img src="images/citrus-fresh.svg" alt="柑橘清新" loading="lazy">
                    <span>轻盈清爽，夏日或日常首选</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="woody-warm">
                    <img src="images/woody-warm.svg" alt="木质暖香" loading="lazy">
                    <span>偏成熟、适合秋冬或职场气质</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="gourmand-sweet">
                    <img src="images/gourmand-sweet.svg" alt="甜点香调" loading="lazy">
                    <span>甜美可人，适合想要少女感的人</span>
                </label>
            </div>
        </div>
    </form>
