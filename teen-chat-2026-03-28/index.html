    <title>家长话题：如何跟青春期孩子聊天</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：如何跟青春期孩子聊天</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：如何跟青春期孩子聊天？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="listen-first">
                            <div class="card-image">
                                <img src="images/listen-first.svg" alt="父母倾听孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先倾听少评价</h3>
                                <p class="option-desc">先让孩子表达感受，不急着给意见</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="scheduled-chat">
                            <div class="card-image">
                                <img src="images/scheduled-chat.svg" alt="父母与孩子坐在桌前聊天" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">约定时间定期聊</h3>
                                <p class="option-desc">设固定时间聊天，减少临场冲突</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="activity-bonding">
                            <div class="card-image">
                                <img src="images/activity-bonding.svg" alt="父母与孩子一起散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">通过共同行动交流</h3>
                                <p class="option-desc">边做事边聊，如散步或做饭更自然</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="third-party-help">
                            <div class="card-image">
                                <img src="images/third-party-help.svg" alt="咨询老师或顾问" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">必要时寻求第三方</h3>
                                <p class="option-desc">请老师或心理老师协助沟通时机</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
