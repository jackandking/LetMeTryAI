<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect fill="url(#bg2)" width="200" height="200"/>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="runShoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="runSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Speed lines -->
  <line x1="20" y1="40" x2="60" y2="40" stroke="#22c55e" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="50" y2="50" stroke="#22c55e" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <line x1="25" y1="30" x2="55" y2="30" stroke="#22c55e" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  
  <!-- Running Shoe -->
  <g transform="translate(25, 85)">
    <!-- Shoe sole -->
    <path d="M 5 55 Q 0 55 0 45 L 5 35 Q 8 30 20 30 L 110 25 Q 135 24 140 35 L 145 48 Q 147 55 140 57 L 5 55 Z" fill="url(#runSole)"/>
    <!-- Shoe upper -->
    <path d="M 10 38 Q 15 10 35 8 L 90 5 Q 115 3 125 20 L 135 40 L 10 38 Z" fill="url(#runShoe)"/>
    <!-- Mesh pattern -->
    <circle cx="50" cy="22" r="3" fill="white" opacity="0.3"/>
    <circle cx="60" cy="20" r="3" fill="white" opacity="0.3"/>
    <circle cx="70" cy="19" r="3" fill="white" opacity="0.3"/>
    <circle cx="55" cy="28" r="3" fill="white" opacity="0.3"/>
    <circle cx="65" cy="26" r="3" fill="white" opacity="0.3"/>
    <!-- Laces -->
    <line x1="40" y1="15" x2="70" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="22" x2="72" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Heel counter -->
    <path d="M 10 38 Q 8 25 15 18 L 25 17" fill="none" stroke="#16a34a" stroke-width="3"/>
    <!-- Brand mark -->
    <rect x="95" y="20" width="20" height="8" rx="2" fill="white" opacity="0.9"/>
  </g>
</svg>