<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect fill="url(#bg)" width="200" height="200"/>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="sole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
  </defs>
  
  <!-- Basketball -->
  <circle cx="150" cy="50" r="25" fill="#f97316" opacity="0.2"/>
  <circle cx="150" cy="50" r="20" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  <path d="M 135 50 Q 150 45 165 50" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  <path d="M 150 35 Q 155 50 150 65" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  
  <!-- Basketball Shoe -->
  <g transform="translate(30, 80)">
    <!-- Shoe sole -->
    <path d="M 10 70 Q 5 70 5 60 L 8 50 Q 10 45 20 45 L 100 42 Q 120 42 125 50 L 130 60 Q 132 68 125 70 L 10 70 Z" fill="url(#sole)"/>
    <!-- Shoe upper -->
    <path d="M 15 50 Q 20 20 40 15 L 80 12 Q 100 10 110 25 L 120 45 L 15 50 Z" fill="url(#shoe)"/>
    <!-- Ankle support -->
    <path d="M 35 20 L 45 5 Q 50 0 60 2 L 70 18" fill="#ea580c"/>
    <!-- Laces -->
    <line x1="50" y1="20" x2="75" y2="18" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="28" x2="78" y2="26" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="36" x2="80" y2="34" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Logo/detail -->
    <circle cx="95" cy="30" r="8" fill="white" opacity="0.9"/>
    <path d="M 92 30 L 98 30 M 95 27 L 95 33" stroke="#f97316" stroke-width="2"/>
  </g>
</svg>