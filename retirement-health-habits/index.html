    <title>退休生活里的小习惯：哪个能陪你走久一点？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">退休后你想坚持哪项健康习惯？早晨散步、拉伸还是社交活动？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">退休后你想坚持哪项健康习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="morning-walk">
                            <div class="card-image">
                                <img src="images/morning-walk.svg" alt="老人早晨散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">早晨散步</h3>
                                <p class="option-desc">每天清晨走一圈，呼吸新鲜空气、活动筋骨、心情开朗。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="daily-stretch-taiji">
                            <div class="card-image">
                                <img src="images/daily-stretch-taiji.svg" alt="老人做拉伸太极" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每日拉伸/太极</h3>
                                <p class="option-desc">家里做几组拉伸或太极动作，关节更灵活、精神更稳。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="balanced-diet">
                            <div class="card-image">
                                <img src="images/balanced-diet.svg" alt="均衡饮食盘子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">均衡饮食</h3>
                                <p class="option-desc">吃得清淡均衡，多蔬果粗粮，让晚年饮食更踏实安心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-social-activities">
                            <div class="card-image">
                                <img src="images/regular-social-activities.svg" alt="老人一起聊天活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定社交/兴趣班</h3>
                                <p class="option-desc">定期和朋友聚会或学兴趣，生活有乐趣也更有动力坚持下去。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
