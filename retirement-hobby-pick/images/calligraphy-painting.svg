<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#fdf8e8" rx="8"/>
  
  <!-- Table surface -->
  <rect x="10" y="75" width="100" height="35" fill="#c4a35a" opacity="0.3" rx="3"/>
  <line x1="10" y1="75" x2="110" y2="75" stroke="#8b6914" stroke-width="2"/>
  
  <!-- Xuan Paper (Rice Paper) -->
  <rect x="25" y="35" width="55" height="45" fill="#faf8f3" stroke="#e0d8c8" stroke-width="1"/>
  <!-- Paper texture effect -->
  <rect x="25" y="35" width="55" height="2" fill="#f0ebe0" opacity="0.5"/>
  <rect x="25" y="78" width="55" height="2" fill="#f0ebe0" opacity="0.5"/>
  
  <!-- Calligraphy characters (simplified art representation) -->
  <g fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round">
    <!-- Character strokes -->
    <line x1="35" y1="48" x2="50" y2="48"/>
    <line x1="42" y1="42" x2="42" y2="65"/>
    <line x1="35" y1="58" x2="48" y2="62"/>
    
    <line x1="58" y1="45" x2="70" y2="45"/>
    <line x1="58" y1="55" x2="70" y2="55"/>
    <line x1="64" y1="42" x2="64" y2="68"/>
    <line x1="58" y1="65" x2="70" y2="62"/>
  </g>
  
  <!-- Red seal/chop -->
  <rect x="52" y="58" width="12" height="12" fill="#c45c48" rx="1"/>
  <rect x="54" y="60" width="3" height="3" fill="#fff"/>
  <rect x="59" y="60" width="3" height="3" fill="#fff"/>
  <rect x="54" y="65" width="3" height="3" fill="#fff"/>
  <rect x="59" y="65" width="3" height="3" fill="#fff"/>
  
  <!-- Writing Brush -->
  <g transform="translate(85, 30) rotate(15)">
    <!-- Brush tip (inked part) -->
    <path d="M0 35 Q-3 45 0 55 Q3 45 0 35" fill="#2a2a2a"/>
    <!-- Brush ferrule -->
    <rect x="-2" y="25" width="4" height="12" fill="#8b6914"/>
    <!-- Brush handle -->
    <rect x="-3" y="5" width="6" height="22" fill="#5a4a3a" rx="1"/>
    <!-- Handle detail -->
    <circle cx="0" cy="15" r="1.5" fill="#c4a35a"/>
    <circle cx="0" cy="22" r="1.5" fill="#c4a35a"/>
    <!-- Brush end -->
    <ellipse cx="0" cy="5" rx="3" ry="2" fill="#4a3a2a"/>
  </g>
  
  <!-- Ink Stone -->
  <g transform="translate(82, 70)">
    <ellipse cx="15" cy="12" rx="18" ry="10" fill="#3a3a3a"/>
    <ellipse cx="15" cy="10" rx="14" ry="7" fill="#4a4a4a"/>
    <!-- Ink pool -->
    <ellipse cx="18" cy="11" rx="6" ry="3" fill="#1a1a1a"/>
    <!-- Ink liquid shine -->
    <ellipse cx="19" cy="10" rx="2" ry="1" fill="#666" opacity="0.5"/>
  </g>
  
  <!-- Ink Stick -->
  <g transform="translate(88, 62) rotate(-20)">
    <rect x="0" y="0" width="8" height="20" fill="#1a1a1a" rx="1"/>
    <rect x="1" y="1" width="6" height="3" fill="#333"/>
    <!-- Gold decoration on ink stick -->
    <rect x="2" y="8" width="4" height="1" fill="#c4a35a"/>
    <rect x="2" y="11" width="4" height="1" fill="#c4a35a"/>
  </g>
  
  <!-- Second brush (resting) -->
  <g transform="translate(15, 78) rotate(-5)">
    <rect x="0" y="0" width="4" height="25" fill="#6b510f" rx="1"/>
    <ellipse cx="2" cy="26" rx="3" ry="4" fill="#2a2a2a"/>
  </g>
  
  <!-- Scroll decoration in background -->
  <g transform="translate(5, 15)" opacity="0.3">
    <rect x="0" y="0" width="25" height="40" fill="#d4c4a4" rx="2"/>
    <line x1="0" y1="5" x2="25" y2="5" stroke="#8b6914" stroke-width="1"/>
    <line x1="0" y1="35" x2="25" y2="35" stroke="#8b6914" stroke-width="1"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="105" cy="20" r="4" fill="#c45c48" opacity="0.4"/>
  <circle cx="15" cy="100" r="3" fill="#8b6914" opacity="0.3"/>
</svg>
