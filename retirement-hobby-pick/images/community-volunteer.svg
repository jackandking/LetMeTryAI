<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#fdf8e8" rx="8"/>
  
  <!-- Community building silhouette (background) -->
  <g opacity="0.15">
    <rect x="15" y="30" width="25" height="50" fill="#8b6914" rx="2"/>
    <rect x="45" y="20" width="30" height="60" fill="#8b6914" rx="2"/>
    <rect x="80" y="35" width="25" height="45" fill="#8b6914" rx="2"/>
    <!-- Windows -->
    <rect x="20" y="38" width="6" height="8" fill="#fdf8e8"/>
    <rect x="29" y="38" width="6" height="8" fill="#fdf8e8"/>
    <rect x="20" y="52" width="6" height="8" fill="#fdf8e8"/>
    <rect x="29" y="52" width="6" height="8" fill="#fdf8e8"/>
    <rect x="52" y="28" width="7" height="9" fill="#fdf8e8"/>
    <rect x="62" y="28" width="7" height="9" fill="#fdf8e8"/>
    <rect x="52" y="43" width="7" height="9" fill="#fdf8e8"/>
    <rect x="62" y="43" width="7" height="9" fill="#fdf8e8"/>
  </g>
  
  <!-- Heart symbol (representing care/help) -->
  <g transform="translate(85, 15)">
    <path d="M10 5 Q15 0 20 5 Q25 0 30 5 L20 20 Z" fill="#c45c48" opacity="0.3" transform="scale(1.2)"/>
  </g>
  
  <!-- Elderly person (simplified figure) -->
  <g transform="translate(25, 45)">
    <!-- Body -->
    <ellipse cx="15" cy="35" rx="14" ry="18" fill="#7a9ab8"/>
    <!-- Head -->
    <circle cx="15" cy="12" r="10" fill="#e8c4a8"/>
    <!-- Hair (grey/white) -->
    <path d="M5 10 Q5 2 15 2 Q25 2 25 10" fill="none" stroke="#c0c0c0" stroke-width="3"/>
    <!-- Walking cane -->
    <line x1="32" y1="25" x2="32" y2="55" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="25" r="2.5" fill="#6b510f"/>
  </g>
  
  <!-- Volunteer (helper) -->
  <g transform="translate(58, 40)">
    <!-- Body -->
    <ellipse cx="18" cy="38" rx="15" ry="20" fill="#c45c48"/>
    <!-- Volunteer vest detail -->
    <rect x="8" y="28" width="20" height="20" fill="#d46c58" rx="3"/>
    <!-- Head -->
    <circle cx="18" cy="12" r="11" fill="#e8c4a8"/>
    <!-- Hair -->
    <path d="M7 10 Q7 0 18 0 Q29 0 29 10" fill="none" stroke="#4a3a2a" stroke-width="3"/>
    <!-- Arm (helping gesture) -->
    <path d="M32 30 Q42 25 48 20" fill="none" stroke="#e8c4a8" stroke-width="5" stroke-linecap="round"/>
    <!-- Hand on elderly person's shoulder -->
    <circle cx="50" cy="18" r="4" fill="#e8c4a8"/>
  </g>
  
  <!-- Volunteer badge/heart on vest -->
  <g transform="translate(68, 62)">
    <path d="M5 2 Q8 -1 10 2 Q12 -1 15 2 L10 10 Z" fill="#f5d76e"/>
  </g>
  
  <!-- Helping hands icon (symbolic) -->
  <g transform="translate(45, 85)">
    <!-- Two hands meeting -->
    <path d="M5 15 Q0 10 5 5 Q10 0 15 5" fill="none" stroke="#c45c48" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 15 Q30 10 25 5 Q20 0 15 5" fill="none" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
    <!-- Heart in center -->
    <path d="M12 8 Q15 4 18 8 Q21 4 24 8 L18 16 Z" fill="#c45c48" transform="scale(0.6) translate(8 5)"/>
  </g>
  
  <!-- Tree (community park element) -->
  <g transform="translate(5, 70)">
    <!-- Trunk -->
    <rect x="8" y="25" width="6" height="20" fill="#8b6914"/>
    <!-- Leaves -->
    <circle cx="11" cy="18" r="12" fill="#7bc47b" opacity="0.8"/>
    <circle cx="5" cy="22" r="8" fill="#8fd48f" opacity="0.7"/>
    <circle cx="17" cy="22" r="8" fill="#6eb46e" opacity="0.7"/>
  </g>
  
  <!-- Speech bubble (friendly chat) -->
  <g transform="translate(85, 50)">
    <ellipse cx="15" cy="12" rx="18" ry="12" fill="#fff" stroke="#c4a35a" stroke-width="1.5"/>
    <polygon points="10,22 5,28 18,23" fill="#fff" stroke="#c4a35a" stroke-width="1.5"/>
    <polygon points="10.5,22.5 6,27 17.5,23" fill="#fff"/>
    <!-- Dots representing conversation -->
    <circle cx="10" cy="12" r="2" fill="#c4a35a"/>
    <circle cx="15" cy="12" r="2" fill="#c4a35a"/>
    <circle cx="20" cy="12" r="2" fill="#c4a35a"/>
  </g>
  
  <!-- Decorative circles (community unity) -->
  <g opacity="0.3">
    <circle cx="15" cy="15" r="5" fill="#c45c48"/>
    <circle cx="100" cy="90" r="6" fill="#8b6914"/>
    <circle cx="105" cy="30" r="4" fill="#c4a35a"/>
  </g>
  
  <!-- Volunteer ribbon/banner -->
  <g transform="translate(35, 8)">
    <rect x="0" y="0" width="50" height="12" fill="#c45c48" rx="2"/>
    <text x="25" y="8.5" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">志愿者</text>
  </g>
</svg>
