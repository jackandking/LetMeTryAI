<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <rect width="120" height="120" fill="#fdf8e8" rx="8"/>
  
  <!-- Sky gradient effect -->
  <rect x="0" y="0" width="120" height="60" fill="#e8f4f8" opacity="0.5"/>
  
  <!-- Sun -->
  <circle cx="95" cy="20" r="10" fill="#f5d76e"/>
  
  <!-- Clouds -->
  <g fill="#fff" opacity="0.8">
    <ellipse cx="25" cy="25" rx="12" ry="7"/>
    <ellipse cx="35" cy="22" rx="10" ry="6"/>
    <ellipse cx="15" cy="27" rx="8" ry="5"/>
    
    <ellipse cx="75" cy="35" rx="10" ry="5"/>
    <ellipse cx="82" cy="33" rx="8" ry="4"/>
  </g>
  
  <!-- Mountains in background -->
  <path d="M0 60 L25 30 L50 55 L70 25 L95 50 L120 40 L120 60 Z" fill="#a8c4a8" opacity="0.6"/>
  <path d="M0 60 L30 40 L55 58 L85 35 L120 55 L120 60 Z" fill="#8ab48a" opacity="0.8"/>
  
  <!-- Camera -->
  <g transform="translate(70, 50)">
    <!-- Camera body -->
    <rect x="0" y="8" width="32" height="22" fill="#4a4a4a" rx="3"/>
    <!-- Camera top -->
    <rect x="8" y="4" width="16" height="6" fill="#3a3a3a"/>
    <!-- Lens -->
    <circle cx="16" cy="19" r="8" fill="#2a2a2a"/>
    <circle cx="16" cy="19" r="6" fill="#1a1a1a"/>
    <circle cx="16" cy="19" r="3" fill="#0a3a5a" opacity="0.6"/>
    <!-- Lens reflection -->
    <circle cx="14" cy="17" r="1.5" fill="#fff" opacity="0.5"/>
    <!-- Flash -->
    <rect x="24" y="10" width="5" height="4" fill="#888" rx="1"/>
    <!-- Button -->
    <rect x="26" y="5" width="4" height="3" fill="#c45c48" rx="1"/>
    <!-- Strap -->
    <path d="M0 12 Q-5 5 -3 0" fill="none" stroke="#6b510f" stroke-width="2"/>
  </g>
  
  <!-- Suitcase / Luggage -->
  <g transform="translate(20, 55)">
    <!-- Main body -->
    <rect x="5" y="15" width="38" height="42" fill="#c45c48" rx="4"/>
    <!-- Suitcase texture -->
    <rect x="10" y="20" width="28" height="32" fill="#d46c58" rx="2"/>
    <!-- Horizontal stripes -->
    <line x1="5" y1="28" x2="43" y2="28" stroke="#a03020" stroke-width="2"/>
    <line x1="5" y1="44" x2="43" y2="44" stroke="#a03020" stroke-width="2"/>
    <!-- Handle -->
    <path d="M18 15 L18 8 Q18 3 24 3 Q30 3 30 8 L30 15" fill="none" stroke="#4a4a4a" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="12" cy="60" r="4" fill="#4a4a4a"/>
    <circle cx="36" cy="60" r="4" fill="#4a4a4a"/>
    <!-- Stickers -->
    <circle cx="15" cy="35" r="4" fill="#f5d76e"/>
    <rect x="28" y="32" width="8" height="6" fill="#87ceeb" rx="1"/>
  </g>
  
  <!-- Small bag -->
  <g transform="translate(55, 70)">
    <rect x="0" y="10" width="22" height="18" fill="#8b6914" rx="2"/>
    <path d="M8 10 L8 5 Q8 2 11 2 Q14 2 14 5 L14 10" fill="none" stroke="#6b510f" stroke-width="2"/>
    <!-- Bag flap -->
    <path d="M0 15 L22 15 L22 20 Q22 22 20 22 L2 22 Q0 22 0 20 Z" fill="#a08020"/>
  </g>
  
  <!-- Map -->
  <g transform="translate(15, 20) rotate(-10)">
    <rect x="0" y="0" width="25" height="30" fill="#f5f0e0" stroke="#c4b494" stroke-width="1" rx="1"/>
    <!-- Map lines -->
    <path d="M3 8 Q8 5 12 10 Q16 15 22 12" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.6"/>
    <path d="M5 20 Q10 16 15 22 Q18 25 22 22" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.6"/>
    <!-- Location marker -->
    <circle cx="15" cy="12" r="2" fill="#c45c48"/>
  </g>
  
  <!-- Train/Transport hint -->
  <g transform="translate(85, 80)">
    <rect x="0" y="5" width="28" height="14" fill="#5a7a9a" rx="2"/>
    <rect x="2" y="7" width="8" height="6" fill="#87ceeb" opacity="0.6"/>
    <rect x="14" y="7" width="8" height="6" fill="#87ceeb" opacity="0.6"/>
    <circle cx="6" cy="21" r="3" fill="#4a4a4a"/>
    <circle cx="22" cy="21" r="3" fill="#4a4a4a"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="10" cy="100" r="3" fill="#c4a35a" opacity="0.4"/>
  <circle cx="110" cy="95" r="4" fill="#c4a35a" opacity="0.3"/>
</svg>
