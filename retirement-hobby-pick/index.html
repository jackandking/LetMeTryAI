    <title>爱老人关注：退休后想重拾的兴趣爱好</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爱老人关注：退休后想重拾的兴趣爱好</h1>
            <p class="subtitle">金色年华，精彩人生</p>
        </header>
        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果是爱老人用户，你最支持哪个选项：退休后最想重拾的兴趣爱好？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="gardening">
                            <div class="card-image">
                                <img src="images/gardening.svg" alt="老人园艺种花的场景" loading="lazy">
                            </div>
                            <span class="card-label">在家阳台或小花园种花种菜，身心放松</span>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="calligraphy-painting">
                            <div class="card-image">
                                <img src="images/calligraphy-painting.svg" alt="老人练习书法的手部特写" loading="lazy">
                            </div>
                            <span class="card-label">练字作画，安静又有成就感</span>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="light-travel">
                            <div class="card-image">
                                <img src="images/light-travel.svg" alt="老年人短途旅行拍照场景" loading="lazy">
                            </div>
                            <span class="card-label">周边短途走走，看风景、拍照留念</span>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="community-volunteer">
                            <div class="card-image">
                                <img src="images/community-volunteer.svg" alt="老人参与社区志愿服务的画面" loading="lazy">
                            </div>
                            <span class="card-label">参加志愿服务，结交邻里新朋友</span>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <p>正在汇总实时投票结果...</p>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>

            <div class="more" id="more"><a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a></div>
        </main>
    </div>

</body>
