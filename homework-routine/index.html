    <title>作业先做还是先休息？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <h1 id="pageTitle">作业先做还是先休息？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长爱用户视角，你会怎么选：孩子放学后是先写作业还是先休息？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="complete-homework-first">
                    <img src="images/complete-homework-first.svg" alt="孩子做作业的场景" loading="lazy">
                    <span>固定先写完，完成任务再放松。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="play-then-homework">
                    <img src="images/play-then-homework.svg" alt="孩子休息玩耍的场景" loading="lazy">
                    <span>放松后更专注，先休息再学习。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="scheduled-breaks">
                    <img src="images/scheduled-breaks.svg" alt="时间表与定时器图示" loading="lazy">
                    <span>定好时段，兼顾放松与效率。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="flexible-by-mood">
                    <img src="images/flexible-by-mood.svg" alt="家长观察孩子状态的场景" loading="lazy">
                    <span>根据孩子当天状态调整顺序。</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在汇总实时投票结果...</p>
    </div>

    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
