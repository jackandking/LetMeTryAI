<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Schedule Purple/Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e0d4f0"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#6a5acd"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#d8c8e8" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#d8c8e8" opacity="0.3"/>
  
  <!-- Large Central Clock -->
  <circle cx="200" cy="180" r="80" fill="white" stroke="url(#clockGrad)" stroke-width="8"/>
  
  <!-- Clock face -->
  <circle cx="200" cy="180" r="4" fill="#333"/>
  
  <!-- Hour markers -->
  <line x1="200" y1="110" x2="200" y2="120" stroke="#666" stroke-width="3"/>
  <line x1="200" y1="240" x2="200" y2="250" stroke="#666" stroke-width="3"/>
  <line x1="130" y1="180" x2="140" y2="180" stroke="#666" stroke-width="3"/>
  <line x1="260" y1="180" x2="270" y2="180" stroke="#666" stroke-width="3"/>
  
  <!-- Clock hands - showing time segments -->
  <line x1="200" y1="180" x2="200" y2="130" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="180" x2="240" y2="200" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Time segments visualization -->
  <path d="M200 120 A60 60 0 0 1 250 150" fill="none" stroke="#52c41a" stroke-width="6" stroke-linecap="round"/>
  <path d="M250 150 A60 60 0 0 1 260 190" fill="none" stroke="#ff9f43" stroke-width="6" stroke-linecap="round"/>
  <path d="M260 190 A60 60 0 0 1 240 230" fill="none" stroke="#52c41a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Schedule blocks below clock -->
  <rect x="80" y="290" width="60" height="35" fill="#52c41a" rx="6" opacity="0.9"/>
  <text x="110" y="314" text-anchor="middle" font-size="14" fill="white" font-weight="600">学习</text>
  
  <rect x="150" y="290" width="60" height="35" fill="#ff9f43" rx="6" opacity="0.9"/>
  <text x="180" y="314" text-anchor="middle" font-size="14" fill="white" font-weight="600">休息</text>
  
  <rect x="220" y="290" width="60" height="35" fill="#52c41a" rx="6" opacity="0.9"/>
  <text x="250" y="314" text-anchor="middle" font-size="14" fill="white" font-weight="600">学习</text>
  
  <!-- Arrows between blocks -->
  <path d="M140 307 L150 307" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M210 307 L220 307" fill="none" stroke="#999" stroke-width="2"/>
  
  <!-- Small icons -->
  <text x="300" y="140" font-size="30">📚</text>
  <text x="310" y="200" font-size="30">⏰</text>
  <text x="300" y="260" font-size="30">🎯</text>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6a5acd" font-weight="600">分时段安排</text>
</svg>