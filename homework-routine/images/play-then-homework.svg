<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Playful Green/Yellow Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f8e8"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a5a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#b8e8b8" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#b8e8b8" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="300" cy="100" r="35" fill="#ffd93d"/>
  <line x1="300" y1="50" x2="300" y2="60" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="140" x2="300" y2="150" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="100" x2="260" y2="100" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="100" x2="350" y2="100" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="65" x2="272" y2="72" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="328" y1="128" x2="335" y2="135" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ball -->
  <circle cx="150" cy="200" r="45" fill="url(#ballGrad)"/>
  <path d="M115 185 Q150 210 185 185" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>
  <path d="M110 200 Q150 220 190 200" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>
  
  <!-- Running figure silhouette -->
  <g transform="translate(220, 180)">
    <!-- Head -->
    <circle cx="30" cy="20" r="15" fill="#4a90d9"/>
    <!-- Body -->
    <line x1="30" y1="35" x2="30" y2="70" stroke="#4a90d9" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="30" y1="45" x2="10" y2="60" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="45" x2="55" y2="40" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs (running pose) -->
    <line x1="30" y1="70" x2="15" y2="95" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="70" x2="50" y2="90" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Toy blocks -->
  <rect x="80" y="280" width="30" height="30" fill="#ff9f43" rx="3"/>
  <text x="95" y="302" text-anchor="middle" font-size="16" fill="white" font-weight="bold">A</text>
  
  <rect x="115" y="290" width="30" height="30" fill="#4a90d9" rx="3"/>
  <text x="130" y="312" text-anchor="middle" font-size="16" fill="white" font-weight="bold">B</text>
  
  <rect x="85" y="315" width="30" height="30" fill="#52c41a" rx="3"/>
  <text x="100" y="337" text-anchor="middle" font-size="16" fill="white" font-weight="bold">C</text>
  
  <!-- Wind lines for motion -->
  <line x1="260" y1="200" x2="290" y2="195" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="265" y1="210" x2="295" y2="205" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#52c41a" font-weight="600">先玩一会</text>
</svg>