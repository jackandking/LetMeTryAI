<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Flexible Orange/Teal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#fdf0d0"/>
    </linearGradient>
    <linearGradient id="parentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#3a7bc8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#f0e0c0" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#f0e0c0" opacity="0.3"/>
  
  <!-- Parent figure -->
  <g transform="translate(180, 120)">
    <!-- Head -->
    <circle cx="20" cy="25" r="18" fill="#f4c2a1"/>
    <!-- Hair -->
    <path d="M2 20 Q20 -5 38 20" fill="#4a4a4a"/>
    <!-- Body -->
    <path d="M-5 50 L45 50 L40 120 L0 120 Z" fill="url(#parentGrad)" rx="10"/>
    <!-- Arms (thinking pose) -->
    <path d="M-5 60 Q-20 80 -10 100" fill="none" stroke="#f4c2a1" stroke-width="10" stroke-linecap="round"/>
    <path d="M45 60 Q60 70 55 85" fill="none" stroke="#f4c2a1" stroke-width="10" stroke-linecap="round"/>
    <!-- Hand on chin -->
    <circle cx="55" cy="90" r="8" fill="#f4c2a1"/>
  </g>
  
  <!-- Thought bubble -->
  <ellipse cx="280" cy="100" rx="50" ry="35" fill="white" stroke="#ddd" stroke-width="2"/>
  <circle cx="250" cy="140" r="5" fill="white" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="240" cy="155" r="3" fill="white" stroke="#ddd" stroke-width="1.5"/>
  
  <!-- Question mark in thought -->
  <text x="280" y="110" text-anchor="middle" font-size="36" fill="#ff9f43" font-weight="bold">?</text>
  
  <!-- Child figure -->
  <g transform="translate(100, 200)">
    <!-- Head -->
    <circle cx="25" cy="25" r="16" fill="#f4c2a1"/>
    <!-- Hair -->
    <circle cx="25" cy="15" r="14" fill="#8b4513"/>
    <!-- Body -->
    <path d="M5 45 L45 45 L40 100 L10 100 Z" fill="#ff9f43" rx="8"/>
    <!-- Expression indicators -->
    <circle cx="18" cy="22" r="2" fill="#333"/>
    <circle cx="32" cy="22" r="2" fill="#333"/>
    <!-- Neutral mouth -->
    <line x1="20" y1="32" x2="30" y2="32" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Mood indicators around child -->
  <g opacity="0.8">
    <!-- Energy level bars -->
    <rect x="60" y="170" width="8" height="20" fill="#52c41a" rx="2"/>
    <rect x="71" y="165" width="8" height="25" fill="#52c41a" rx="2"/>
    <rect x="82" y="160" width="8" height="30" fill="#ffd93d" rx="2"/>
  </g>
  
  <!-- Flexibility arrows -->
  <path d="M160 250 Q200 280 240 250" fill="none" stroke="#4a90d9" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round"/>
  <polygon points="235,245 245,250 235,255" fill="#4a90d9"/>
  <polygon points="165,255 155,250 165,245" fill="#4a90d9"/>
  
  <!-- Book / Homework icon -->
  <rect x="220" y="220" width="50" height="40" fill="white" stroke="#4a90d9" stroke-width="2" rx="3"/>
  <line x1="245" y1="225" x2="245" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="230" y1="235" x2="240" y2="235" stroke="#ccc" stroke-width="2"/>
  <line x1="230" y1="242" x2="260" y2="242" stroke="#ccc" stroke-width="2"/>
  <line x1="230" y1="249" x2="255" y2="249" stroke="#ccc" stroke-width="2"/>
  
  <!-- Balance scale symbol -->
  <g transform="translate(140, 310)">
    <line x1="30" y1="0" x2="30" y2="25" stroke="#666" stroke-width="2"/>
    <line x1="10" y1="0" x2="50" y2="0" stroke="#666" stroke-width="2"/>
    <line x1="10" y1="0" x2="5" y2="15" stroke="#666" stroke-width="2"/>
    <line x1="50" y1="0" x2="55" y2="15" stroke="#666" stroke-width="2"/>
    <rect x="0" y="15" width="15" height="12" fill="#ff9f43" rx="2"/>
    <rect x="45" y="15" width="15" height="12" fill="#52c41a" rx="2"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#ff9f43" font-weight="600">灵活安排</text>
</svg>