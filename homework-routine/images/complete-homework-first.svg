<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Study Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f2fc"/>
      <stop offset="100%" stop-color="#d0e3f5"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#3a7bc8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#b8d4f0" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#b8d4f0" opacity="0.3"/>
  
  <!-- Desk -->
  <rect x="60" y="220" width="280" height="20" fill="url(#deskGrad)" rx="4"/>
  <rect x="80" y="240" width="20" height="80" fill="#8b6f4e"/>
  <rect x="300" y="240" width="20" height="80" fill="#8b6f4e"/>
  
  <!-- Open Book -->
  <path d="M140 180 L200 200 L260 180 L260 210 L200 230 L140 210 Z" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <path d="M140 180 Q170 170 200 200 Q230 170 260 180" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <line x1="200" y1="200" x2="200" y2="230" stroke="#ddd" stroke-width="1"/>
  
  <!-- Book pages lines -->
  <line x1="150" y1="190" x2="190" y2="205" stroke="#ccc" stroke-width="2"/>
  <line x1="150" y1="198" x2="190" y2="213" stroke="#ccc" stroke-width="2"/>
  <line x1="210" y1="205" x2="250" y2="190" stroke="#ccc" stroke-width="2"/>
  <line x1="210" y1="213" x2="250" y2="198" stroke="#ccc" stroke-width="2"/>
  
  <!-- Pencil -->
  <rect x="280" y="160" width="12" height="60" fill="#ffd700" rx="2"/>
  <polygon points="286,160 286,150 292,150 292,160" fill="#ffa500"/>
  <polygon points="286,220 292,220 289,230" fill="#d4a574"/>
  
  <!-- Check mark -->
  <circle cx="120" cy="150" r="25" fill="#52c41a" opacity="0.9"/>
  <path d="M108 150 L116 158 L132 142" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Clock showing study time -->
  <circle cx="100" cy="280" r="30" fill="white" stroke="#4a90d9" stroke-width="3"/>
  <line x1="100" y1="280" x2="100" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="280" x2="115" y2="285" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="280" r="3" fill="#333"/>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#3a7bc8" font-weight="600">先完成作业</text>
</svg>