    <title>50万购车：宝马燃油车还是蔚来电动车</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">50万预算，你会买宝马燃油车还是蔚来电动车？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">50万预算，你会买宝马燃油车还是蔚来电动车？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bmw-fuel">
                            <div class="card-image">
                                <img src="images/bmw-fuel.svg" alt="宝马燃油车侧面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">买宝马燃油车</h3>
                                <p class="option-desc">稳重操控、加油方便、长途续航无焦虑</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nio-ev">
                            <div class="card-image">
                                <img src="images/nio-ev.svg" alt="蔚来电动车侧面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">买蔚来电动车</h3>
                                <p class="option-desc">智能座舱、换电/快充体验、日常用车更省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-or-other">
                            <div class="card-image">
                                <img src="images/wait-or-other.svg" alt="观望或其他车型抽象图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">继续观望或买其他品牌</h3>
                                <p class="option-desc">观望新款或考虑混合动力/其他品牌的性价比</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
