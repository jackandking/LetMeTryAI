    <title>新版地铁好在哪？带孩子去哪站更能拍照玩耍？</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">新版地铁好在哪？带孩子去哪站更能拍照玩耍？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你觉得新版地铁带孩子去哪个站更好拍照又能玩耍？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="spacious-hall">
                            <div class="card-image">
                                <img src="images/spacious-hall.svg" alt="孩子在宽敞站厅奔跑拍照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宽敞站厅能跑跳</h3>
                                <p class="option-desc">大站厅空旷，孩子能放心跑跳，抓拍背影和动感瞬间很容易。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="art-installation">
                            <div class="card-image">
                                <img src="images/art-installation.svg" alt="地铁里的艺术装置背景亲子照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">艺术装置打卡点</h3>
                                <p class="option-desc">彩色壁画与装置背景丰富，亲子合影更有趣味感和画面层次。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kids-play-corner">
                            <div class="card-image">
                                <img src="images/kids-play-corner.svg" alt="孩子在地铁儿童游乐角玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">儿童游乐角</h3>
                                <p class="option-desc">站内或出入口附近有小型游乐区，孩子玩耍时的自然表情最能打动家长镜头。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sunlit-platform">
                            <div class="card-image">
                                <img src="images/sunlit-platform.svg" alt="阳光照进地铁站平台亲子合影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">光影采光平台</h3>
                                <p class="option-desc">高天窗或大片玻璃引入自然光，适合拍出温暖、有层次的亲子照片。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
