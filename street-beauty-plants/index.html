    <title>街头超美植物，你会带回家养吗？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">街头超美植物，你会带回家养吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">街头超美植物，你会带回家养吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bring-home">
                            <div class="card-image">
                                <img src="images/bring-home.svg" alt="抱回家养的绿植摆在阳台上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抱回家养</h3>
                                <p class="option-desc">看见就想抱回家，想把它摆满窗台和阳台</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="take-photo">
                            <div class="card-image">
                                <img src="images/take-photo.svg" alt="用手机拍摄街头植物的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先拍照留念</h3>
                                <p class="option-desc">拍下美照就满足，不想被养护限制生活自由</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="consider-conditions">
                            <div class="card-image">
                                <img src="images/consider-conditions.svg" alt="在室内考虑摆放小型绿植的情境" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">想养但要考虑</h3>
                                <p class="option-desc">很喜欢但要看日照、空间或室友意见再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
