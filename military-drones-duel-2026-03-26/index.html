    <title>硬核对比：军用无人机对决</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：军用无人机对决</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你更看好哪款军用无人机？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="mq-9-reaper">
                            <div class="card-image">
                                <img src="images/mq-9-reaper.svg" alt="MQ-9 Reaper 无人机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">MQ-9 Reaper</h3>
                                <p class="option-desc">远程长航时、载荷大，擅长远程侦察与打击</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="bayraktar-tb2">
                            <div class="card-image">
                                <img src="images/bayraktar-tb2.svg" alt="Bayraktar TB2 无人机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Bayraktar TB2</h3>
                                <p class="option-desc">战术级侦察与精确打击，机动灵活、部署快捷</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="caihong-ch5">
                            <div class="card-image">
                                <img src="images/caihong-ch5.svg" alt="彩虹 CH-5 无人机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">彩虹 CH-5</h3>
                                <p class="option-desc">国产中空长航时平台，任务适配与成本比高</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
