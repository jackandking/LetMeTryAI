    <title>切开的西瓜能放多久？家长都怎么处理</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">切开的西瓜能放多久？家长都怎么处理</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你通常会怎么处理切开的西瓜？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-immediately">
                            <div class="card-image">
                                <img src="images/eat-immediately.svg" alt="切开西瓜立即食用" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">马上吃完</h3>
                                <p class="option-desc">切开后当餐吃完，不留剩余，省心也省事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="refrigerate-short-term">
                            <div class="card-image">
                                <img src="images/refrigerate-short-term.svg" alt="冰箱里的切开西瓜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冰箱冷藏（隔夜内吃）</h3>
                                <p class="option-desc">用保鲜膜或密封盒包好，放冷藏，尽量在第二天吃完</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="room-temp-few-hours">
                            <div class="card-image">
                                <img src="images/room-temp-few-hours.svg" alt="室温放置的西瓜盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常温短放（当天内）</h3>
                                <p class="option-desc">当天短时间放在室温，避免长时间放置或暴晒</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="freeze-for-later">
                            <div class="card-image">
                                <img src="images/freeze-for-later.svg" alt="冷冻西瓜块" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">切块冷冻备用</h3>
                                <p class="option-desc">切成小块冷冻，用于做冰沙或解渴零食</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
