    <title>动车旅行舒适配置选择 - 家长实用参考</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">动车旅行舒适配置选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">出行时你会优先为孩子选择哪种动车旅行舒适配置？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="window-seat-neck-pillow">
                            <div class="card-image">
                                <img src="images/window-seat-neck-pillow.svg" alt="孩子靠窗坐着用颈枕休息" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">靠窗座位与颈枕</h3>
                                <p class="option-desc">靠窗便于看风景与靠靠休息，配颈枕更利于孩子小睡。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="portable-snacks-thermos">
                            <div class="card-image">
                                <img src="images/portable-snacks-thermos.svg" alt="车厢内的便携餐点与保温杯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">便携餐点与保温杯</h3>
                                <p class="option-desc">备好易吃的点心与保温杯，随时补充能量与热饮，减少因饥饿产生的不适。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tablet-offline-headphones">
                            <div class="card-image">
                                <img src="images/tablet-offline-headphones.svg" alt="平板播放动画儿童戴着耳机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">离线平板与儿童耳机</h3>
                                <p class="option-desc">下载好动画或学习内容，配儿童耳机，既安静又能兼顾学习与娱乐。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="organizer-wipes">
                            <div class="card-image">
                                <img src="images/organizer-wipes.svg" alt="收纳包和湿巾摆放整齐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">旅行收纳包与湿巾</h3>
                                <p class="option-desc">分门别类的收纳包加上湿巾，取物方便、应急清洁效率高。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
