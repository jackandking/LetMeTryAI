            <h1 id="pageTitle">中国农机开进全球田野，哪个画面更带感？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">中国农机开进全球田野，哪个画面更带感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="african-wheat-harvester">
                            <div class="card-image">
                                <img src="images/african-wheat-harvester.svg" alt="中国收割机在非洲麦田作业" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">非洲麦田收割机</h3>
                                <p class="option-desc">金黄麦浪里，中国收割机一字排开，漫天麦香扑面而来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="southeast-asia-paddy-tractor">
                            <div class="card-image">
                                <img src="images/southeast-asia-paddy-tractor.svg" alt="国产拖拉机在东南亚水田里耕作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">东南亚稻田拖拉机</h3>
                                <p class="option-desc">水田里国产拖拉机卷起层层泥浪，耕出一片片希望</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="south-america-soybean-planter">
                            <div class="card-image">
                                <img src="images/south-america-soybean-planter.svg" alt="中国播种机在南美大豆田作业" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">南美大豆播种队</h3>
                                <p class="option-desc">广袤平原上，播种机画出笔直线条，一眼望不到头</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="central-asia-cotton-picker">
                            <div class="card-image">
                                <img src="images/central-asia-cotton-picker.svg" alt="中国采棉机在中亚棉田作业" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中亚棉花采摘场</h3>
                                <p class="option-desc">棉海如雪，采棉机穿梭成银色长龙，场面壮观又解压</p>
