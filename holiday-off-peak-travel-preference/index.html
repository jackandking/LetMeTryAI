    <title>假期错峰出游安排投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">假期错峰出游：你更偏好哪种安排？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">假期错峰出游你更偏好哪种安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="weekday-off-peak-short-trip">
                            <div class="card-image">
                                <img src="images/weekday-off-peak-short-trip.svg" alt="家庭在周中短途出行" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">周中错峰短途</h3>
                                <p class="option-desc">选择在非高峰日（如周中）出发，短途为主，避开假期人流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="early-morning-avoid-crowds">
                            <div class="card-image">
                                <img src="images/early-morning-avoid-crowds.svg" alt="清晨出发的亲子家庭" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清晨出发避开景点人流</h3>
                                <p class="option-desc">早起出发或优先游早间未拥挤的景点，白天安排轻松活动。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-holiday-departure">
                            <div class="card-image">
                                <img src="images/late-holiday-departure.svg" alt="假期尾段出行的家庭" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">假期尾段出发避开高峰</h3>
                                <p class="option-desc">把出发时间放在假期末段，返程拥堵更少，行程更从容。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nearby-drive-flexible-itinerary">
                            <div class="card-image">
                                <img src="images/nearby-drive-flexible-itinerary.svg" alt="近郊自驾游的亲子活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">近郊自驾与弹性行程</h3>
                                <p class="option-desc">选择近郊自驾、弹性停留与即兴调整，减少长时间排队和疲劳。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
