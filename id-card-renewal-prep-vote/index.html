    <title>居民身份证换证：准备方式你会怎么选？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">居民身份证换证准备方式投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果要去办理居民身份证换证，你通常会怎样准备？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="advance-appointment-prepare">
                            <div class="card-image">
                                <img src="images/advance-appointment-prepare.svg" alt="提前预约准备材料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">提前预约并按清单准备材料</h3>
                                <p class="option-desc">提前在官网或窗口预约，按材料清单准备证件、照片与表格，减少往返和等待时间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="walk-in-same-day">
                            <div class="card-image">
                                <img src="images/walk-in-same-day.svg" alt="现场排队办理" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">当天到现场临时办理并排队</h3>
                                <p class="option-desc">不提前预约，直接到派出所或办证点现场排队并现场补交材料，适合临时决定或附近办证点较方便的情况。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="entrust-family">
                            <div class="card-image">
                                <img src="images/entrust-family.svg" alt="委托亲友代办" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">委托子女或亲友代办</h3>
                                <p class="option-desc">由家人或熟悉的邻里代为跑腿和递交材料，适合行动不便或不熟流程的长者。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="community-home-service">
                            <div class="card-image">
                                <img src="images/community-home-service.svg" alt="社区代办上门服务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">使用社区或代办平台的上门/集中代办服务</h3>
                                <p class="option-desc">通过居委会或认证代办机构预约上门服务或社区集中代办，节省出行与排队时间，通常伴随简单指导。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
