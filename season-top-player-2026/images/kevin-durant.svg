<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="#2c5aa0" opacity="0.1"/>
  
  <!-- Basketball Player Silhouette - Kevin Durant (Slim Reaper) -->
  <g fill="#2c5aa0">
    <!-- Head -->
    <ellipse cx="60" cy="27" rx="12" ry="14"/>
    
    <!-- Slim neck -->
    <rect x="55" y="40" width="10" height="12"/>
    
    <!-- Torso/Jersey (Slim build) -->
    <path d="M42 52 L78 52 L74 88 L46 88 Z"/>
    
    <!-- Jersey Number 35 -->
    <text x="60" y="76" font-family="Arial Black, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="900">35</text>
    
    <!-- Left Arm (Shooting pose) -->
    <path d="M42 55 Q30 50 25 40 L20 42 Q28 56 42 62 Z"/>
    
    <!-- Right Arm (High release point) -->
    <path d="M78 55 Q90 45 95 30 L100 32 Q94 50 82 60 Z"/>
    
    <!-- Basketball leaving hand -->
    <circle cx="98" cy="25" r="10" fill="#ff6b35"/>
    <path d="M90 25 Q98 25 106 25" stroke="#1e4a80" stroke-width="2" fill="none"/>
    <path d="M98 15 Q98 25 98 35" stroke="#1e4a80" stroke-width="2" fill="none"/>
    
    <!-- Shooting arc line -->
    <path d="M100 32 Q110 20 120 15" stroke="#4a7ab8" stroke-width="2" stroke-dasharray="4,2" fill="none" opacity="0.6"/>
    
    <!-- Left Leg (Slim) -->
    <path d="M48 86 L44 108 L52 110 L54 88 Z"/>
    
    <!-- Right Leg -->
    <path d="M72 86 L76 108 L68 110 L66 88 Z"/>
    
    <!-- Basketball hoop accent -->
    <ellipse cx="110" cy="12" rx="12" ry="4" stroke="#4a7ab8" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Shooting motion lines -->
  <path d="M85 40 L95 28" stroke="#ff6b35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
