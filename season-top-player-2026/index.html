<body>
    <h1 id="pageTitle">本赛季谁最统治？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在男人宝用户视角，你更想把票投给谁：本赛季最具统治力球星？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="nanrenbao" value="lebron-james">
                    <img src="images/lebron-james.svg" alt="LeBron James 赛场图" loading="lazy">
                    <span>老将统治力与经验兼具</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="giannis-antetokounmpo">
                    <img src="images/giannis-antetokounmpo.svg" alt="Giannis 进攻图" loading="lazy">
                    <span>强力内线与冲击篮筐的统治力</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="kevin-durant">
                    <img src="images/kevin-durant.svg" alt="Kevin Durant 投篮图" loading="lazy">
                    <span>得分如探囊取物的明星得分手</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="luka-doncic">
                    <img src="images/luka-doncic.svg" alt="Luka Doncic 运球图" loading="lazy">
                    <span>全面组织与关键时刻得分能力</span>
                </label>
            </div>
        </div>
    </form>
