    <title>国庆第3天亲子换玩法·4个在家场景供你挑</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国庆长假第3天，和孩子在家你更想换哪个玩法？哪种更有画面感？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国庆长假第3天，和孩子在家你更想换哪个玩法？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-micro-museum">
                            <div class="card-image">
                                <img src="images/home-micro-museum.svg" alt="孩子在客厅布置小型家庭博物展" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭微展 · 小小博物馆</h3>
                                <p class="option-desc">把客厅变展厅：收集家中小物、做展牌，孩子当讲解员讲故事看细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="creative-craft-workshop">
                            <div class="card-image">
                                <img src="images/creative-craft-workshop.svg" alt="家长和孩子一起制作纸箱城堡和手工作品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">创意手作工坊</h3>
                                <p class="option-desc">纸箱、颜料、旧玩具变手作项目，亲子一起动手做出可玩的作品并拍短片。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="science-mini-experiments">
                            <div class="card-image">
                                <img src="images/science-mini-experiments.svg" alt="桌上进行小型安全科学实验的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">科学小实验</h3>
                                <p class="option-desc">安全又有仪式感的桌面实验（火山、魔法牛奶、气球吹升），边玩边讲科学小原理。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-theater-roleplay">
                            <div class="card-image">
                                <img src="images/family-theater-roleplay.svg" alt="孩子在客厅舞台上表演家庭小剧" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭剧场 · 角色扮演</h3>
                                <p class="option-desc">分角色、写台词、用道具把客厅变舞台，全家演一出短剧，增加表达与合作乐趣。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
