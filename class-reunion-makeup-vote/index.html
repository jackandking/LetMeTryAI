    <title>同学聚会妆容风格投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">同学聚会妆容风格投票 — 你会选择哪个妆容?</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">同学聚会你会选哪种妆容风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-fresh">
                            <div class="card-image">
                                <img src="images/natural-fresh.svg" alt="自然清新妆容示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然清新</h3>
                                <p class="option-caption">轻薄底妆、柔和腮红与裸色唇，日间聚会显气色且好交流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="glam-evening">
                            <div class="card-image">
                                <img src="images/glam-evening.svg" alt="精致闪耀妆容示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精致闪耀</h3>
                                <p class="option-caption">立体眼妆与光泽唇，适合夜间聚会与拍照提亮气场。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="retro-classic">
                            <div class="card-image">
                                <img src="images/retro-classic.svg" alt="复古经典妆容示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古经典</h3>
                                <p class="option-caption">细眼线搭配红唇与定妆粉，带一点怀旧与优雅气质。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cute-playful">
                            <div class="card-image">
                                <img src="images/cute-playful.svg" alt="可爱俏皮妆容示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可爱俏皮</h3>
                                <p class="option-caption">粉嫩眼影与亮点腮红，配合简单发饰，风格轻松活泼。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
