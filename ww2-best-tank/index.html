<body>
    <h1 id="pageTitle">二战最强坦克：你更看好谁？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">男人宝热榜：二战最强坦克，你更投谁？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="nanrenbao" value="tiger-i">
                    <img src="images/tiger-i.svg" alt="虎式坦克侧面实物图" loading="lazy">
                    <span>德国虎式：火力强、装甲厚，战场威慑力高。</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="t-34">
                    <img src="images/t-34.svg" alt="T-34 坦克行进照" loading="lazy">
                    <span>苏联T-34：机动与可靠兼备，产量与影响力巨大。</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="m4-sherman">
                    <img src="images/m4-sherman.svg" alt="M4 Sherman 坦克近照" loading="lazy">
                    <span>美军M4：移动率好、维修便捷，盟军主力坦克。</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="panther">
                    <img src="images/panther.svg" alt="豹式坦克正面照" loading="lazy">
                    <span>德国豹式：射控与速度优异，设计影响后续坦克。</span>
                </label>
            </div>
        </div>
    </form>
