<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">课外学习方法：你会怎样安排孩子的课外时间</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">课外学习方法：你会如何安排孩子的课外时间？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="fixed-tutoring-home-review">
                            <div class="card-image">
                                <img src="images/fixed-tutoring-home-review.svg" alt="固定课外班与家庭复习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定课外班 + 家庭复习</h3>
                                <p class="option-caption">周固定辅导班，平日家中短时复习巩固知识点。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="interest-based-projects">
                            <div class="card-image">
                                <img src="images/interest-based-projects.svg" alt="兴趣项目学习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以兴趣为主的项目学习</h3>
                                <p class="option-caption">按孩子兴趣安排项目或兴趣班，周末集中实践与展示。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="short-daily-practice">
                            <div class="card-image">
                                <img src="images/short-daily-practice.svg" alt="短时日常练习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短时日常练习 + 碎片化学习</h3>
                                <p class="option-caption">每天安排短时练习和碎片学习，保持稳定学习节奏。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-time-reading">
                            <div class="card-image">
                                <img src="images/family-time-reading.svg" alt="家庭活动与阅读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">减负为主的家庭活动与读书</h3>
                                <p class="option-caption">减少应试压力，安排家庭互动、阅读和亲子沟通时间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
