    <title>恋爱中让人心累的细节，你更不能忍哪一个？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">恋爱中让人心累的细节，你更不能忍哪一个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：恋爱中让人心累的细节？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="often-late">
                            <div class="card-image">
                                <img src="images/often-late.svg" alt="迟到的人影子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">经常迟到或爽约</h3>
                                <p class="option-desc">总是约会迟到或放鸽子</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="phone-distracted">
                            <div class="card-image">
                                <img src="images/phone-distracted.svg" alt="手机与聊天泡泡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">对话总是刷手机</h3>
                                <p class="option-desc">聊天时常看手机、不专心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="insensitive-words">
                            <div class="card-image">
                                <img src="images/insensitive-words.svg" alt="难过的表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">说话不顾及感受</h3>
                                <p class="option-desc">经常直接伤人、不考虑感受</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="avoid-responsibility">
                            <div class="card-image">
                                <img src="images/avoid-responsibility.svg" alt="回避的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">遇事不愿承担责任</h3>
                                <p class="option-desc">发生问题推卸、不承担责任</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
