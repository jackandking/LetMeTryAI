    <title>家里换手机，你先看哪个？家长常关注的4个场景</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里换手机，你先看哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里换手机，你先看哪个？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="xiangji-xian-kan">
                            <div class="card-image">
                                <img src="images/xiangji-xian-kan.svg" alt="以拍照能力为优先" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">相机</h3>
                                <p class="option-desc">先看拍照，记录孩子每个笑脸和重要瞬间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="xuchang-xian-kan">
                            <div class="card-image">
                                <img src="images/xuchang-xian-kan.svg" alt="以续航为优先" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">续航</h3>
                                <p class="option-desc">先看电池，外出带娃时不用担心没电断联</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pingmu-xian-kan">
                            <div class="card-image">
                                <img src="images/pingmu-xian-kan.svg" alt="以屏幕显示为优先" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">屏幕</h3>
                                <p class="option-desc">先看屏幕，护眼且适合孩子看教学视频或绘本</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="jiage-xian-kan">
                            <div class="card-image">
                                <img src="images/jiage-xian-kan.svg" alt="以价格和性价比为优先" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">价位</h3>
                                <p class="option-desc">先看价格／性价比，预算内兼顾实用需求</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
