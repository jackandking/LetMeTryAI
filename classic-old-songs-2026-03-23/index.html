<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">最经典的老歌，哪首触动你的回忆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪首经典老歌？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="tian-mi-mi">
                            <div class="card-image">
                                <img src="images/tian-mi-mi.svg" alt="甜蜜蜜封面或邓丽君照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甜蜜蜜 (邓丽君)</h3>
                                <p class="option-desc">邓丽君的温柔旋律，陪了多少青春。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="yue-liang-dai-biao-wo-de-xin">
                            <div class="card-image">
                                <img src="images/yue-liang-dai-biao-wo-de-xin.svg" alt="月亮代表我的心歌词卡片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">月亮代表我的心 (邓丽君/多版本)</h3>
                                <p class="option-desc">温柔情歌中的永恒经典。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="xiao-cheng-gu-shi">
                            <div class="card-image">
                                <img src="images/xiao-cheng-gu-shi.svg" alt="小城故事意象插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">小城故事 (甄妮)</h3>
                                <p class="option-desc">乡愁与生活的温暖画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="dan-yuan-ren-chang-jiu">
                            <div class="card-image">
                                <img src="images/dan-yuan-ren-chang-jiu.svg" alt="但愿人长久意境图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">但愿人长久 (王菲/古典版)</h3>
                                <p class="option-desc">传统婉约，适合团圆与思念。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
