    <title>身份证到期 — 社保卡要不要一起换？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">身份证到期，社保卡要不要一起换？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">身份证到期时，是否需要同时更换社保卡？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="change-both">
                            <div class="card-image">
                                <img src="images/change-both.svg" alt="同时更换身份证和社保卡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同时更换</h3>
                                <p class="option-desc">一次办好，避免多次跑腿，信息同步更新更方便。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="change-id-only">
                            <div class="card-image">
                                <img src="images/change-id-only.svg" alt="只更换身份证" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只换身份证</h3>
                                <p class="option-desc">先换身份证，若社保卡仍能使用则暂不更换，省时省事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="depends">
                            <div class="card-image">
                                <img src="images/depends.svg" alt="根据情况决定是否更换社保卡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">视情况而定</h3>
                                <p class="option-desc">根据社保卡有效性、当地办证流程和能否代办再决定是否一并更换。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="consult-family-community">
                            <div class="card-image">
                                <img src="images/consult-family-community.svg" alt="家属或社区代办证件" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">请家属或社区代办</h3>
                                <p class="option-desc">请子女或社区服务中心协助查询并代办，减少出行负担。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
