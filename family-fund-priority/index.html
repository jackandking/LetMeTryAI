    <title>家庭资金优先用在哪儿？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家庭资金优先用在哪儿？公积金用途变化下的选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在公积金用途变化的背景下，您会把家庭资金优先用在哪个方向？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mortgage-repayment">
                            <div class="card-image">
                                <img src="images/mortgage-repayment.svg" alt="偿还房贷示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优先偿还房贷</h3>
                                <p class="option-caption">减少债务压力，长期降低利息负担</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="education-savings">
                            <div class="card-image">
                                <img src="images/education-savings.svg" alt="教育储蓄示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优先教育储蓄</h3>
                                <p class="option-caption">为孩子学区、课外或未来教育准备资金</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-fund">
                            <div class="card-image">
                                <img src="images/emergency-fund.svg" alt="应急基金示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优先家庭应急与保障</h3>
                                <p class="option-caption">建立应急备用金与基本医疗/突发支出保障</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-improvement">
                            <div class="card-image">
                                <img src="images/home-improvement.svg" alt="改善家庭生活示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优先改善家庭生活</h3>
                                <p class="option-caption">升级居住环境或安排亲子活动以提升生活质量</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
