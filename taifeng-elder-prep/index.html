    <title>台风天家中老人备灾：哪些准备更实用？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风天，家里老人该准备什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风天，家里老人该准备哪些东西？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="meds-health-list">
                            <div class="card-image">
                                <img src="images/meds-health-list.svg" alt="药盒与血压计" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常用药与健康清单</h3>
                                <p class="option-desc">把处方药、常备药与健康记录放在易取处，备好血压计等简单测量工具。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-comm-charging">
                            <div class="card-image">
                                <img src="images/emergency-comm-charging.svg" alt="手机和充电宝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">应急通讯与充电</h3>
                                <p class="option-desc">备用手机、充电宝与家人联络表，停电时也能及时联系与求助。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-water-supply">
                            <div class="card-image">
                                <img src="images/food-water-supply.svg" alt="储备食物与水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">储备易食物与饮水</h3>
                                <p class="option-desc">准备易咀嚼的食品、罐头与足量饮用水，方便就地应急饮食。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-safety-lighting">
                            <div class="card-image">
                                <img src="images/home-safety-lighting.svg" alt="手电与加固窗户" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">居家安全与照明</h3>
                                <p class="option-desc">检查门窗固定、备手电与应急灯，提前确定家中避风安全区位置。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
