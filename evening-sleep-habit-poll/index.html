    <h1 id="pageTitle">关注：晚上助眠你更习惯哪种小方法？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">亲，你最支持哪个助眠小方法？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="gentle-stretch">

                <label class="option">
                    <input type="radio" name="elder-love" value="warm-drink">
                    <img src="images/warm-drink.svg" alt="一杯温牛奶或花草茶" loading="lazy">
                    <span>喝杯温牛奶或淡花草茶助放松</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="soft-music">
                    <img src="images/soft-music.svg" alt="老年人戴耳机听音乐放松" loading="lazy">
                    <span>播放舒缓音乐或熟悉老歌入眠</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="short-reading">
                    <img src="images/short-reading.svg" alt="老人床头阅读灯下看书" loading="lazy">
                    <span>看段短文或书籍让心情平静</span>
