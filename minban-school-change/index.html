<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">民办学校换局，你看重哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">民办学校换局，你看重哪点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="teacher-stability">
                            <div class="card-image">
                                <img src="images/teacher-stability.svg" alt="师资稳定" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">师资队伍稳定</h3>
                                <p class="option-desc">好老师留得住，教学延续性更有保障</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="curriculum-quality">
                            <div class="card-image">
                                <img src="images/curriculum-quality.svg" alt="课程质量" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教学与课程质量</h3>
                                <p class="option-desc">课程体系扎实，课堂教学有深度与方法</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tuition-transparency">
                            <div class="card-image">
                                <img src="images/tuition-transparency.svg" alt="学费透明" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">学费与资费透明</h3>
                                <p class="option-desc">费用公开合理，便于家庭长期预算安排</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="campus-safety">
                            <div class="card-image">
                                <img src="images/campus-safety.svg" alt="校园安全管理" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">校园管理与安全</h3>
                                <p class="option-desc">制度与日常管理到位，孩子在校生活更放心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
