    <title>关注：和孙辈相处，你最喜欢哪种方式？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：和孙辈相处，你最喜欢哪种方式？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个和孙辈互动的方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="story-time">
                            <div class="card-image">
                                <img src="images/story-time.svg" alt="老人给孙子讲故事" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陪孩子讲故事</h3>
                                <p class="option-desc">晚上给孙子孙女讲故事，是最温暖的时光。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="crafts-together">
                            <div class="card-image">
                                <img src="images/crafts-together.svg" alt="祖孙做手工" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一起做手工创意</h3>
                                <p class="option-desc">动手做小手工，培养兴趣又有回忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="park-walk">
                            <div class="card-image">
                                <img src="images/park-walk.svg" alt="祖孙公园散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">带他们去公园散步</h3>
                                <p class="option-desc">户外走走，看风景，既锻炼又聊天。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="teach-skill">
                            <div class="card-image">
                                <img src="images/teach-skill.svg" alt="教手艺给孙辈" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教他们家传手艺</h3>
                                <p class="option-desc">把拿手的手艺传给下一代，意义长久。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
