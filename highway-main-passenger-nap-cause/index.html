    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">高速上主副驾同时打盹，原因你怎么猜？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在高速上主副驾同时打盹，哪项是更可能的原因？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="driver-fatigue">
                            <div class="card-image">
                                <img src="images/driver-fatigue.svg" alt="司机疲劳导致打盹场景插图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">司机疲劳驾驶</h3>
                                <p class="option-desc">长时间驾驶或休息不足导致驾驶人和同伴都困倦。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="meds-or-alcohol">
                            <div class="card-image">
                                <img src="images/meds-or-alcohol.svg" alt="药物或饮酒影响导致昏睡示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">药物或饮酒影响</h3>
                                <p class="option-desc">药物副作用或饮酒后反应迟钝，双方都出现昏沉。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cabin-air-issue">
                            <div class="card-image">
                                <img src="images/cabin-air-issue.svg" alt="车内闷热空调问题示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">车内空气或温度问题</h3>
                                <p class="option-desc">闷热、缺氧或空调不当让人容易犯困。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="contagious-sleepiness">
                            <div class="card-image">
                                <img src="images/contagious-sleepiness.svg" alt="乘客互相影响而打盹示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">互相影响放松警惕</h3>
                                <p class="option-desc">一人休息、另一人放松警觉，导致双方同时打盹。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
