                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在男人宝用户视角，你更想把票投给谁：谁是当下最能带队的球星？</p>
                    <div class="options-grid" id="optionsContainer">

                                <h3 class="option-title">哈兰德</h3>
                                <p class="option-desc">强力中锋，终结能力爆表</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="vinicius-jr">

                            <div class="card-content">
                                <h3 class="option-title">维尼修斯</h3>

                            </div>

                        </label>
