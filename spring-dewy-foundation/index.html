    <title>哪种春季底妆更适合你？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季轻透底妆大比拼</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春天出门你更偏好哪种底妆风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dewy-glow">
                            <div class="card-image">
                                <img src="images/dewy-glow.svg" alt="轻薄水光底妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄水光底妆</h3>
                                <p class="option-caption">透亮轻薄，拍照有光泽，适合日常和约会。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-coverage">
                            <div class="card-image">
                                <img src="images/natural-coverage.svg" alt="自然无瑕妆感示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然无瑕妆感</h3>
                                <p class="option-caption">遮瑕与自然肤质平衡，看起来像好皮肤。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-longlasting">
                            <div class="card-image">
                                <img src="images/matte-longlasting.svg" alt="持久哑光妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">持久哑光控油</h3>
                                <p class="option-caption">控油持妆更耐热天和通勤环境，妆感精致。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
