<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：现代多用途战机你选谁</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款多用途战机的综合表现？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="j-20">
                            <div class="card-image">
                                <img src="images/j-20.svg" alt="歼-20 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">歼-20</h3>
                                <p class="option-desc">国产隐身机，着重突防与综合作战</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-35">
                            <div class="card-image">
                                <img src="images/f-35.svg" alt="F-35 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-35</h3>
                                <p class="option-desc">隐身与传感融合，注重网络协同能力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="su-57">
                            <div class="card-image">
                                <img src="images/su-57.svg" alt="苏-57 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">苏-57</h3>
                                <p class="option-desc">高机动与突防兼顾，强调动力与机动性</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="eurofighter-typhoon">
                            <div class="card-image">
                                <img src="images/eurofighter-typhoon.svg" alt="Eurofighter Typhoon 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">欧系台风</h3>
                                <p class="option-desc">航电与空战素质均衡，适配多国需求</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
