<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            hm.src = 'https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba';

    <title>最想参加的社区活动</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">最想参加的社区活动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="square-dance-tai-chi">
                            <div class="card-image">
                                <img src="images/community-square-dance.svg" alt="老人广场舞或太极活动照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞 / 太极</h3>
                                <p class="option-desc">热闹又健康，邻里一起活动身体</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="handicraft-calligraphy-class">
                            <div class="card-image">
                                <img src="images/community-handicraft-class.svg" alt="老人书画手工课堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手工 / 书画班</h3>
                                <p class="option-desc">动手又动脑，结交同好学新技艺</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="community-volunteer-service">
                            <div class="card-image">
                                <img src="images/community-volunteer.svg" alt="老人参与社区志愿服务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社区义工 / 志愿</h3>
                                <p class="option-desc">做力所能及的志愿，回馈邻里</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighborhood-dinner-tea">
                            <div class="card-image">
                                <img src="images/community-neighborhood-dinner.svg" alt="社区聚餐场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里聚餐 / 茶话会</h3>
                                <p class="option-desc">一起吃饭聊天，感受邻里温情</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);

                const script = document.createElement('script');

                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
