    <title>夏日露肩穿搭投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏日露肩穿搭你更想尝试哪种风格？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">夏天想试露肩穿搭，你更偏好哪种风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="off-shoulder">
                            <div class="card-image">
                                <img src="images/off-shoulder.svg" alt="一字领露肩上衣" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一字领（优雅）</h3>
                                <p class="option-desc">一字领露出锁骨，气质优雅又清爽</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="one-shoulder">
                            <div class="card-image">
                                <img src="images/one-shoulder.svg" alt="单肩不对称上衣" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">单肩不对称</h3>
                                <p class="option-desc">单肩剪裁更有结构感，适合晚间或派对</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ruffle-shoulder">
                            <div class="card-image">
                                <img src="images/ruffle-shoulder.svg" alt="荷叶边露肩装" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">露肩荷叶边</h3>
                                <p class="option-desc">荷叶边带来甜美与浪漫的夏日氛围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="strapless">
                            <div class="card-image">
                                <img src="images/strapless.svg" alt="抹胸无肩带上衣" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抹胸/无肩带</h3>
                                <p class="option-desc">清爽利落，适合高温与假日度假场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
