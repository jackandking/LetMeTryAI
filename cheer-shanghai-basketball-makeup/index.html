<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">去现场为上海男篮庆祝，你会画哪种妆？哪个更有赛场感？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">去现场为上海男篮庆祝，你会画哪种妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="vibrant-court-makeup">
                            <div class="card-image">
                                <img src="images/vibrant-court-makeup.svg" alt="活力元气球迷妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">活力元气球迷妆</h3>
                                <p class="option-desc">水润底妆+桃粉腮红，清爽利落，挥旗打call也显亲和力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="team-color-glitter">
                            <div class="card-image">
                                <img src="images/team-color-glitter.svg" alt="队色亮片妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">队色亮片应援妆</h3>
                                <p class="option-desc">用红蓝队色眼影或小面积亮片，眼神有戏，灯光下特别吸睛。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="smoky-chic-game">
                            <div class="card-image">
                                <img src="images/smoky-chic-game.svg" alt="烟熏赛场妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">时髦烟熏赛场妆</h3>
                                <p class="option-desc">薄雾感烟熏眼+防晕眼线，既有态度又耐看，适合夜场和强光环境。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-dewy-makeup">
                            <div class="card-image">
                                <img src="images/natural-dewy-makeup.svg" alt="自然清透耐汗妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然清透耐汗妆</h3>
                                <p class="option-desc">轻薄防汗底妆+定妆喷雾，保持清爽不浮粉，整场看起来像刚打完卡的好状态。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
