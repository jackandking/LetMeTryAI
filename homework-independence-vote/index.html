<body>
    <h1 id="pageTitle">孩子何时开始独立做作业？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长爱用户视角，你会怎么选：孩子何时开始独立做作业？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="grad1-2-progress">
                    <img src="images/homework-grad1-2.svg" alt="小学低年级独立做作业" loading="lazy">
                    <span>从简单任务开始培养自主性</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="grad3-6-official">
                    <img src="images/homework-grad3-6.svg" alt="小学中高年级独立做作业" loading="lazy">
                    <span>大约三年级起让孩子独立完成为主</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="start-junior-high">
                    <img src="images/homework-junior-high.svg" alt="初中独立做作业" loading="lazy">
                    <span>初中阶段自主学习为主，家长监督减少</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="always-accompany">
                    <img src="images/homework-always-accompany.svg" alt="家长陪伴做作业" loading="lazy">
                    <span>家长持续参与，按任务分层辅导</span>
                </label>
            </div>
        </div>
    </form>
