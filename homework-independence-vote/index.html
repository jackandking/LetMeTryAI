                            </div>
                            <div class="card-content">

                            </div>

                        </label>
                        <label class="option-card">
                            <input type="radio" name="viewport" value="grad3-6-official">

                            </div>
                            <div class="card-content">

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="viewport" value="always-accompany">
                            <div class="card-image">
                                <img src="images/homework-always-accompany.svg" alt="家长陪伴做作业" loading="lazy">
                            </div>
                            <div class="card-content">
