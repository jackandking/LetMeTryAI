<head>

    <title>巴西日本谁先进球？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">今晚巴西踢日本，你看好谁先进球？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你看好今晚谁先进球？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="brazil-strikes-first">
                            <div class="card-image">
                                <img src="images/brazil-strikes-first.svg" alt="巴西队先进球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">桑巴军团先进球</h3>
                                <p class="option-desc">内马尔领衔，桑巴进攻先声夺人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="japan-strikes-first">
                            <div class="card-image">
                                <img src="images/japan-strikes-first.svg" alt="日本队先进球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">蓝武士先进球</h3>
                                <p class="option-desc">日本团队配合，反击偷袭得手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="second-half-goal">
                            <div class="card-image">
                                <img src="images/second-half-goal.svg" alt="下半场才进球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">下半场才见分晓</h3>
                                <p class="option-desc">双方都谨慎，可能要等下半场</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
