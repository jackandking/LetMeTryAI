    <title>带孩子去黄山拍迎客松，你会选哪个画面？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">黄山迎客松开花了，带孩子去你想拍哪个画面?</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">黄山迎客松开花了，带孩子去你想拍哪个画面?</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-front-smile">
                            <div class="card-image">
                                <img src="images/family-front-smile.svg" alt="一家人在迎客松前正面合影笑容" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">全家正面笑脸合影</h3>
                                <p class="option-desc">一家人面对镜头、笑容满溢，把迎客松和孩子的笑脸都收进画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="child-back-looking-cloudsea">
                            <div class="card-image">
                                <img src="images/child-back-looking-cloudsea.svg" alt="孩子背影望向迎客松和云海" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">孩子背对镜头望云海</h3>
                                <p class="option-desc">孩子背对镜头，望向云海与迎客松，富有故事感的背影画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="closeup-hand-touch-needle">
                            <div class="card-image">
                                <img src="images/closeup-hand-touch-needle.svg" alt="孩子伸手触摸迎客松针叶的特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">特写牵手触碰松针</h3>
                                <p class="option-desc">抓住温馨瞬间：孩子伸手触摸松针的特写，细节氛围感强。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="silhouette-sunset-cloudsea">
                            <div class="card-image">
                                <img src="images/silhouette-sunset-cloudsea.svg" alt="孩子与迎客松在云海和夕阳下的剪影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">剪影与霞光云海背景</h3>
                                <p class="option-desc">在霞光或云海前拍出剪影，画面戏剧感强，适合傍晚或云海时段。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
