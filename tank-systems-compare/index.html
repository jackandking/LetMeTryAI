    <title>主战坦克对比投票 — 火力 / 装甲 / 机动</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">主战坦克：火力、装甲、机动哪个影响实际表现？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">选择坦克时，你最看重哪个指标？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="heavy-firepower">
                            <div class="card-image">
                                <img src="images/heavy-firepower.jpg" alt="坦克火炮近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">火力优先（强打击）</h3>
                                <p class="option-caption">火力强，摧毁目标能力突出，适合直接火力压制战术。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="balanced-protection">
                            <div class="card-image">
                                <img src="images/balanced-protection.jpg" alt="坦克装甲细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">装甲优先（防护强）</h3>
                                <p class="option-caption">装甲与生存能力高，更耐受打击，适合持续作战。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="high-mobility">
                            <div class="card-image">
                                <img src="images/high-mobility.jpg" alt="坦克行进场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">机动优先（快速机动）</h3>
                                <p class="option-caption">机动性强，突击与迂回能力好，适合机动作战与快速部署。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
