<svg width="320" height="213" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>
  <!-- Speed lines -->
  <line x1="60" y1="100" x2="120" y2="100" stroke="#e94560" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="115" x2="100" y2="115" stroke="#e94560" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="85" x2="110" y2="85" stroke="#e94560" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheel/Cog -->
  <circle cx="180" cy="110" r="50" fill="#4a5568" stroke="#718096" stroke-width="4"/>
  <circle cx="180" cy="110" r="35" fill="#2d3748"/>
  <!-- Spokes -->
  <line x1="180" y1="60" x2="180" y2="160" stroke="#718096" stroke-width="4"/>
  <line x1="130" y1="110" x2="230" y2="110" stroke="#718096" stroke-width="4"/>
  <line x1="145" y1="75" x2="215" y2="145" stroke="#718096" stroke-width="3"/>
  <line x1="215" y1="75" x2="145" y2="145" stroke="#718096" stroke-width="3"/>
  <!-- Center -->
  <circle cx="180" cy="110" r="15" fill="#e94560"/>
  <!-- Motion blur -->
  <ellipse cx="260" cy="110" rx="30" ry="20" fill="#e94560" opacity="0.3"/>
  <!-- Label -->
  <text x="50%" y="190" font-family="Arial" font-size="16" fill="#aaaaaa" text-anchor="middle">机动性能</text>
</svg>