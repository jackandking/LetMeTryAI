    <title>考完一科孩子的反应，你遇到过哪种？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">考完一科孩子这反应，你遇到过哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">考完一科孩子这反应，你遇到过哪种？选一个你常见的场景：</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="happy-relief">
                            <div class="card-image">
                                <img src="images/happy-relief.svg" alt="孩子考试后开心放松的表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">开心放松</h3>
                                <p class="option-desc">走出考场笑着说“终于做完了！”，回家情绪轻松，像放假一样。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="quiet-and-down">
                            <div class="card-image">
                                <img src="images/quiet-and-down.svg" alt="孩子低头沉默坐在桌前" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">低落沉默</h3>
                                <p class="option-desc">回家沉默不语、情绪低落，写作业也心不在焉，需要陪伴和倾听。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="review-and-learn">
                            <div class="card-image">
                                <img src="images/review-and-learn.svg" alt="孩子和家长一起看试卷讨论" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">主动复盘</h3>
                                <p class="option-desc">回家先看试题找错题，主动问老师或家长怎么改进，想把经验记住。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="make-excuses">
                            <div class="card-image">
                                <img src="images/make-excuses.svg" alt="孩子耸肩推脱的表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">找借口推脱</h3>
                                <p class="option-desc">说题目太刁钻或监考有问题，先为成绩找理由，想先逃避再说。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
