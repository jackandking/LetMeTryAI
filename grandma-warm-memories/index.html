    <title>哪种阿嬷的记忆让你心头一暖？分享那一刻</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种阿嬷的记忆让你心头一暖？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪种阿嬷的记忆让你心头一暖？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="kitchen-home-cooking">
                            <div class="card-image">
                                <img src="images/kitchen-home-cooking.svg" alt="厨房里阿嬷在炒菜，蒸气与香味弥漫" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厨房的饭菜香</h3>
                                <p class="option-desc">一进门就能闻到阿嬷的拿手菜香，像回到家一样安心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="old-photo-smile">
                            <div class="card-image">
                                <img src="images/old-photo-smile.svg" alt="旧照片中阿嬷露出温柔笑容" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">旧照片里的笑脸</h3>
                                <p class="option-desc">泛黄照片里她的笑容，总能把人心头暖化一角。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="handwritten-letters">
                            <div class="card-image">
                                <img src="images/handwritten-letters.svg" alt="摊开的手写信，笔迹端正且带有墨香痕迹" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">阿嬷的手写信</h3>
                                <p class="option-desc">那一页页字迹和墨香，像被时光紧紧拥抱的温柔。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="evening-walks">
                            <div class="card-image">
                                <img src="images/evening-walks.svg" alt="夕阳下阿嬷与家人并肩散步的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">傍晚一起散步的背影</h3>
                                <p class="option-desc">并肩慢走，看她的背影与落日，心里暖得像被照亮。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
