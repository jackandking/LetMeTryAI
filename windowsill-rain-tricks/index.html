<head>

    <title>窗台被雨灌水，先用哪招处理？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">下雨把窗台灌水，你会先用哪招处理？老办法还是新花样</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下雨把窗台灌水，你会先用哪招处理？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="wipe-with-cloth">
                            <div class="card-image">
                                <img src="images/wipe-with-cloth.svg" alt="老人用抹布擦窗台" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用抹布或拖把擦干</h3>
                                <p class="option-desc">拿抹布或拖把把水往下擦，最快见效且不留水渍。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="scoop-into-basin">
                            <div class="card-image">
                                <img src="images/scoop-into-basin.svg" alt="用盆舀出窗台积水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用盆/杯舀水倒掉</h3>
                                <p class="option-desc">用小盆或杯子把积水舀走，适合水量集中处置。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="towel-newspaper-absorb">
                            <div class="card-image">
                                <img src="images/towel-newspaper-absorb.svg" alt="毛巾和报纸吸水示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">毛巾＋旧报纸吸干缝隙</h3>
                                <p class="option-desc">用毛巾先吸大水，再用旧报纸塞缝吸湿，处理细缝更彻底。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="open-window-basin">
                            <div class="card-image">
                                <img src="images/open-window-basin.svg" alt="打开窗户放盆接水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">打开窗放盆接水并临时堵缝</h3>
                                <p class="option-desc">把盆放好接流出水，同时用毛巾临时堵缝，等雨小再彻底清理。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
