<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国庆出游妆容，你拍照会选哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国庆出游妆容，你拍照会选哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="nude-glow">
                            <div class="card-image">
                                <img src="images/nude-glow.svg" alt="自然裸光妆示例，阳光下透亮底妆" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然裸光妆</h3>
                                <p class="option-desc">透亮底妆+轻微高光，阳光下皮肤像会发光。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sweet-fairy">
                            <div class="card-image">
                                <img src="images/sweet-fairy.svg" alt="甜美仙女妆示例，粉色腮红与亮眼" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甜美仙女妆</h3>
                                <p class="option-desc">粉色腮红与柔和光泽，拍照有少女感滤镜效果。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="japanese-fresh">
                            <div class="card-image">
                                <img src="images/japanese-fresh.svg" alt="日系清透妆示例，薄透自然风" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">日系清透妆</h3>
                                <p class="option-desc">薄透底+淡色唇，靠近镜头也清新不厚重。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soft-smoky">
                            <div class="card-image">
                                <img src="images/soft-smoky.svg" alt="微烟熏妆示例，眼部层次分明" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">微烟熏高级感</h3>
                                <p class="option-desc">眼妆带一点烟熏感，近照更有层次和风格感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
