                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="accompany-and-share">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陪同参与</h3>
                                <p class="option-desc">和孩子一起看、讨论剧情与人物，借机建立信任并了解兴趣点。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="set-limits-and-guide">
                            <div class="card-image">
                                <img src="images/set-limits-and-guide.svg" alt="定时器与亲子约定" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">设限引导</h3>
                                <p class="option-desc">制定观看时长与内容规则，推荐适龄作品并明确完成作业等条件。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">鼓励兴趣延展</h3>
                                <p class="option-desc">把兴趣延展到绘画、手工或编程，鼓励实践与技能培养。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="observe-and-wait">
                            <div class="card-image">
                                <img src="images/observe-and-wait.svg" alt="家长静观孩子行为" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">观察再沟通</h3>
                                <p class="option-desc">先观察孩子变化与社交状况，避免过度干预，适时开展开放式对话。</p>
