<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">50岁后学新东西，你会选哪样？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">50岁后学新东西，你会选哪样？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="phone-photo-video">
                            <div class="card-image">
                                <img src="images/phone-photo-video.svg" alt="手机拍照和短视频学习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手机拍照剪视频</h3>
                                <p class="option-desc">想记录孙辈成长、旅行风景，学拍照和剪短视频</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="taiji-baduanjin">
                            <div class="card-image">
                                <img src="images/taiji-baduanjin.svg" alt="太极八段锦养生运动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太极八段锦</h3>
                                <p class="option-desc">早晚练一练，活动筋骨，身体更轻盈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="calligraphy-painting">
                            <div class="card-image">
                                <img src="images/calligraphy-painting.svg" alt="书法国画学习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书法或国画</h3>
                                <p class="option-desc">提笔练字、泼墨作画，静心养性慢慢来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="instrument-singing">
                            <div class="card-image">
                                <img src="images/instrument-singing.svg" alt="乐器唱歌学习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">乐器或唱歌</h3>
                                <p class="option-desc">学二胡、口琴或合唱，找一群老伙伴一起玩</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

                <div class="loading-state">
