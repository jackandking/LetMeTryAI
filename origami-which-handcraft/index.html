    <title>孩子沉迷折纸到这程度，鼓励哪种手作更能成长？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子沉迷折纸做到这程度，你会鼓励他继续做哪类手作？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子沉迷折纸做到这程度，你会鼓励他继续做哪类手作？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="art-origami">
                            <div class="card-image">
                                <img src="images/art-origami.svg" alt="孩子在做复杂的艺术折纸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">艺术折纸</h3>
                                <p class="option-desc">鼓励学习更复杂的造型与纸艺设计，培养审美与耐心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="practical-crafts">
                            <div class="card-image">
                                <img src="images/practical-crafts.svg" alt="折纸做成实用小物" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">实用手作</h3>
                                <p class="option-desc">引导把折纸做成书签、收纳等小物，体验实用成就感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="maker-projects">
                            <div class="card-image">
                                <img src="images/maker-projects.svg" alt="折纸与简单机械结合的作品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">创客结合</h3>
                                <p class="option-desc">把折纸与结构、简单机械或编程结合，打开跨学科思路。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="social-showcase">
                            <div class="card-image">
                                <img src="images/social-showcase.svg" alt="孩子向朋友展示折纸作品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社交展示</h3>
                                <p class="option-desc">鼓励参加小型展览或同伴分享，培养表达与自信心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
