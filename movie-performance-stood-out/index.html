<head>

            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";

    <title>新片表演谁更戳你</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这部新片里谁的表演更戳你？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在这部新片里，你被谁的表演打动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="protagonist-lowkey">
                            <div class="card-image">
                                <img src="images/protagonist-lowkey.jpg" alt="主角低调演绎海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">主角的低调演绎</h3>
                                <p class="option-desc">低调但有层次的表演，更像生活里的他</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="antagonist-explosive">
                            <div class="card-image">
                                <img src="images/antagonist-explosive.jpg" alt="反派爆发瞬间剧照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">反派的爆发瞬间</h3>
                                <p class="option-desc">那段情绪爆发让人眼前一亮</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="supporting-actor-subtle">
                            <div class="card-image">
                                <img src="images/supporting-actor-subtle.jpg" alt="配角细腻表演画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">配角的细腻小戏份</h3>
                                <p class="option-desc">短短几场戏却留下长期回味</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
