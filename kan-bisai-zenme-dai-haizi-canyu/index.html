    <title>看比赛时你会怎么带孩子参与？哪种方式更合适</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">看比赛时你会怎么带孩子参与？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看比赛时你会怎么带孩子参与？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="xianchang-lalaidui">
                            <div class="card-image">
                                <img src="images/xianchang-lalaidui.svg" alt="孩子挥旗加油的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">现场做小啦啦队</h3>
                                <p class="option-desc">和孩子一起挥小旗、学加油口号，体验现场氛围并教孩子安全礼仪。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fen-juese-jiangjie-guize">
                            <div class="card-image">
                                <img src="images/fen-juese-jiangjie-guize.svg" alt="父母给孩子讲比赛规则" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分角色讲解规则</h3>
                                <p class="option-desc">看比赛时用简单比喻或角色扮演向孩子解释规则，让他们更懂过程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bisai-xiao-renwu-ka">
                            <div class="card-image">
                                <img src="images/bisai-xiao-renwu-ka.svg" alt="孩子完成比赛任务卡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">比赛小任务卡</h3>
                                <p class="option-desc">给孩子发任务卡（找颜色、数进球），边做任务边看，提升专注与成就感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="anjing-guansai-saihou-taolun">
                            <div class="card-image">
                                <img src="images/anjing-guansai-saihou-taolun.svg" alt="家长与孩子赛后讨论比赛" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安静观赛+赛后讨论</h3>
                                <p class="option-desc">先以安静观赛为主，赛后和孩子聊亮点、情绪与观察到的团队精神。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
