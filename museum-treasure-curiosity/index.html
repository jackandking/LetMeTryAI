    <title>带孩子去博物馆：哪件镇馆之宝能点燃孩子的好奇心？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子去博物馆，哪个镇馆之宝能点燃好奇心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子去博物馆，哪个镇馆之宝能点燃好奇心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dinosaur-skeleton">
                            <div class="card-image">
                                <img src="images/dinosaur-skeleton.svg" alt="大型恐龙化石展" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">恐龙化石</h3>
                                <p class="option-desc">巨大的骨架与仿真场景，孩子会想靠近看、摸（观展时讲个古生物故事）。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-porcelain">
                            <div class="card-image">
                                <img src="images/ancient-porcelain.svg" alt="精美古代瓷器展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古代瓷器</h3>
                                <p class="option-desc">细腻的纹样和颜色，适合引导孩子想象古人的生活与工艺过程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="immersive-space-exhibit">
                            <div class="card-image">
                                <img src="images/immersive-space-exhibit.svg" alt="沉浸式宇宙互动展" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">沉浸式宇宙展</h3>
                                <p class="option-desc">灯光、声效和互动模块让孩子仿佛进入太空，直观触发探索欲。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="traditional-instruments">
                            <div class="card-image">
                                <img src="images/traditional-instruments.svg" alt="传统乐器展示与互动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统乐器</h3>
                                <p class="option-desc">看得见会响的展品，边听边动手体验，激发听觉与动手好奇。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
    </div>
