    <title>定期存款到期提醒，你会怎么做</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老人定期存款到期忘取，你会怎么提醒？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">老人定期存款到期忘取，你会怎么提醒？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="phone-call-remind">
                            <div class="card-image">
                                <img src="images/phone-call-remind.svg" alt="打电话提醒老人取款" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电话/视频提醒</h3>
                                <p class="option-desc">打电话或视频联系老人，说明到期时间和取款流程并提醒注意安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="visit-in-person">
                            <div class="card-image">
                                <img src="images/visit-in-person.svg" alt="陪老人去银行取款" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亲自上门陪同</h3>
                                <p class="option-desc">上门陪同或代带老人去银行，现场处理并陪同核实到账。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="delegate-child">
                            <div class="card-image">
                                <img src="images/delegate-child.svg" alt="委托家人代办取款" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">委托家人或邻居代办</h3>
                                <p class="option-desc">委托可信赖的子女或邻居代办并在事后确认结果。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bank-sms-reminder">
                            <div class="card-image">
                                <img src="images/bank-sms-reminder.svg" alt="银行短信或网银提醒" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">开通银行短信/网银提醒</h3>
                                <p class="option-desc">启用银行短信或网银到期提醒，保存凭证并设备忘。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
