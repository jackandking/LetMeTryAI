    <title>这秋天给孩子穿秋裤吗？出门/在家哪种更合适</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这秋天给孩子穿秋裤吗？家长都怎么安排</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这秋天给孩子穿秋裤吗？在家、出门或晚上你会怎么安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="wear-now">
                            <div class="card-image">
                                <img src="images/wear-now.svg" alt="孩子穿秋裤在公园玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一冷就先穿</h3>
                                <p class="option-desc">天气一有凉意就先加一层，省心不担心着凉</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wear-at-night-or-out">
                            <div class="card-image">
                                <img src="images/wear-at-night-or-out.svg" alt="孩子外出穿着秋裤和外套" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">白天活动多再等外出或晚上穿</h3>
                                <p class="option-desc">白天动得多不怕冷，外出或晚上再加秋裤更灵活</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="decide-by-temp-activity">
                            <div class="card-image">
                                <img src="images/decide-by-temp.svg" alt="家长测室温决定给孩子穿不穿秋裤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看温度和衣服厚度灵活决定</h3>
                                <p class="option-desc">根据当天气温、室内暖气和内搭厚度来调整</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-fixed-rule">
                            <div class="card-image">
                                <img src="images/no-fixed-rule.svg" alt="孩子穿薄款内搭在家玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不固定穿，喜欢薄款替代</h3>
                                <p class="option-desc">常不固定穿秋裤，优选轻薄内搭或叠穿应对早晚温差</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
    </div>
