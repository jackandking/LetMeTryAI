    <title>被带回家的国货美妆单品投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">被带回家的国货美妆单品：你会选择哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">出门旅行或逛街时，你最常把哪类国货美妆单品带回家？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="skincare-serums-creams">
                            <div class="card-image">
                                <img src="images/skincare-serums-creams.svg" alt="护肤精华与面霜摆放在化妆台上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">护肤精华/面霜</h3>
                                <p class="option-desc">注重修护与保湿的护肤单品，适合追求肌肤质感的人。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="makeup-lips-cheeks">
                            <div class="card-image">
                                <img src="images/makeup-lips-cheeks.svg" alt="口红和腮红样本展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">彩妆口红/腮红</h3>
                                <p class="option-desc">便于随身补妆的彩妆类，色号与质地是带回家的关键。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="masks-quick-care">
                            <div class="card-image">
                                <img src="images/masks-quick-care.svg" alt="多款面膜平铺展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">面膜/急救护理</h3>
                                <p class="option-desc">即时见效、补水或修护的面膜与急救护理单品，旅行常备。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fragrance-body-care">
                            <div class="card-image">
                                <img src="images/fragrance-body-care.svg" alt="香水与身体乳的摆拍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">香氛/身体护理</h3>
                                <p class="option-desc">提升生活品质的香氛与身体护理，适合注重仪式感的用户。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
