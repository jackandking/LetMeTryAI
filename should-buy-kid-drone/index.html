    <title>眼见大牌降价：要不要给孩子买无人机？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">眼见大牌降价，家里该给孩子买无人机吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">眼见大牌降价，家里该给孩子买无人机吗？你会怎么做？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-now">
                            <div class="card-image">
                                <img src="images/buy-now.svg" alt="孩子和无人机玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">趁降价买一台给孩子</h3>
                                <p class="option-desc">抓住折扣机会入手，让孩子尝试飞行与基础编程，但要提前准备监管与安全措施。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-entry-supervised">
                            <div class="card-image">
                                <img src="images/buy-entry-supervised.svg" alt="入门无人机与父母陪伴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">买入门机并陪玩</h3>
                                <p class="option-desc">选低价入门机，父母陪同学习与练习，降低摔坏与误操作风险。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-and-see">
                            <div class="card-image">
                                <img src="images/wait-and-see.svg" alt="孩子看无人机视频" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先不买，观察孩子兴趣</h3>
                                <p class="option-desc">先通过课程或短期体验判断兴趣，再决定是否投资整机，避免冲动消费。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="choose-alternative">
                            <div class="card-image">
                                <img src="images/choose-alternative.svg" alt="编程套件与机器人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不买，选替代玩具或课程</h3>
                                <p class="option-desc">改选编程套件、机器人或模型拼装，同样培养动手与编程能力，风险更低。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
