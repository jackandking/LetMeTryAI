<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">婆媳相处：哪种相处方式最让你崩溃？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在婆媳相处中，你最不能忍受哪种具体行为？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="interfere-child-rearing">
                            <div class="card-image">
                                <img src="images/interfere-child-rearing.jpg" alt="婆婆干涉孩子教养" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动不动干涉孩子教养</h3>
                                <p class="option-desc">对孩子教育、喂养、作息频繁指手画脚，让人无地自容。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="criticize-habits">
                            <div class="card-image">
                                <img src="images/criticize-habits.jpg" alt="批评生活习惯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">对你日常生活无休止挑剔</h3>
                                <p class="option-desc">从做饭到穿衣到卫生都被反复批评，像在被考核一样疲惫。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="silent-treatment">
                            <div class="card-image">
                                <img src="images/silent-treatment.jpg" alt="冷战不满" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷战、背后抱怨制造家里尴尬</h3>
                                <p class="option-desc">冷脸或背后讲短话，家里气氛瞬间僵硬，沟通无门。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="demand-extra-chores-money">
                            <div class="card-image">
                                <img src="images/demand-extra-chores-money.jpg" alt="要求额外家务金钱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无理由增加家务或金钱负担</h3>
                                <p class="option-desc">擅自安排你额外家务或经济支出，压力和委屈被不断叠加。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
