<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">换季护肤：你早晚保养的首要侧重点是什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季时你的早晚护肤最重视哪一点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="moisturize-first">
                            <div class="card-image">
                                <img src="images/moisturize-first.svg" alt="补水护肤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以保湿为主</h3>
                                <p class="option-caption">加强补水，注重面霜与面膜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="repair-first">
                            <div class="card-image">
                                <img src="images/repair-first.svg" alt="修护屏障" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以修护为主</h3>
                                <p class="option-caption">修护屏障、减少敏感反应</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="oil-control">
                            <div class="card-image">
                                <img src="images/oil-control.svg" alt="控油护肤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以控油为主</h3>
                                <p class="option-caption">白天控油、夜间清爽不厚重</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lightweight-care">
                            <div class="card-image">
                                <img src="images/lightweight-care.svg" alt="轻薄护肤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以轻薄为主</h3>
                                <p class="option-caption">偏好清爽质地与简化步骤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
