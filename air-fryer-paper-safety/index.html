    <title>空气炸锅用纸会有毒吗？你家也在用吗</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">空气炸锅用纸会有毒吗？你家也在用吗</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">空气炸锅用纸会有毒吗？你家也在用吗</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="never-use-paper">
                            <div class="card-image">
                                <img src="images/never-use-paper.svg" alt="空气炸锅直接放食材不铺纸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">从不铺纸</h3>
                                <p class="option-desc">直接放食材、清洗炸篮，省事但要多刷油渍</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="occasionally-use-paper">
                            <div class="card-image">
                                <img src="images/occasionally-use-paper.svg" alt="在空气炸锅中铺一次性烘焙纸的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">偶尔用一次性纸</h3>
                                <p class="option-desc">偶尔为方便或防粘而铺，平时不常用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="use-food-grade-paper">
                            <div class="card-image">
                                <img src="images/use-food-grade-paper.svg" alt="食品级隔油纸放在空气炸锅里的近景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常用食品级隔油纸</h3>
                                <p class="option-desc">选标注食品级、耐高温的专用纸以降低担忧</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="use-silicone-mat">
                            <div class="card-image">
                                <img src="images/use-silicone-mat.svg" alt="硅胶垫放在空气炸锅内的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用硅胶垫/可重复用</h3>
                                <p class="option-desc">用可重复清洗的垫子或烤网，环保且省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
