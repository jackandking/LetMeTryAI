    <title>和孙辈在一起你最喜欢做什么？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">和孙辈在一起你最喜欢做什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你和孙辈一起最喜欢做哪个活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="story-reading">
                            <div class="card-image">
                                <img src="images/story-reading.svg" alt="讲故事与孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲故事读书</h3>
                                <p class="option-desc">给孩子讲故事或一起读书</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="crafts-together">
                            <div class="card-image">
                                <img src="images/crafts-together.svg" alt="手工活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一起做手工</h3>
                                <p class="option-desc">动手制作小作品，增进互动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="park-walks">
                            <div class="card-image">
                                <img src="images/park-walks.svg" alt="公园散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">公园散步郊游</h3>
                                <p class="option-desc">带孙辈去公园玩耍、亲近自然</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="teach-cooking">
                            <div class="card-image">
                                <img src="images/teach-cooking.svg" alt="做饭教学" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教做家常菜</h3>
                                <p class="option-desc">一起下厨，传授家传菜谱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
