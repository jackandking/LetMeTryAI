<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="baidu_union_verify" content="a474889f17de23d877149d511beb790d">

        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <title>世界杯冠军预测</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这届世界杯，你看好谁夺冠？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这届世界杯，你看好谁夺冠？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="argentina">
                            <div class="card-image">
                                <img src="images/argentina.svg" alt="阿根廷国旗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">阿根廷</h3>
                                <p class="option-desc">梅西带队，卫冕热门</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="brazil">
                            <div class="card-image">
                                <img src="images/brazil.svg" alt="巴西国旗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">巴西</h3>
                                <p class="option-desc">桑巴军团，攻防均衡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="france">
                            <div class="card-image">
                                <img src="images/france.svg" alt="法国国旗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">法国</h3>
                                <p class="option-desc">阵容豪华，夺冠常客</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="germany">
                            <div class="card-image">
                                <img src="images/germany.svg" alt="德国国旗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">德国</h3>
                                <p class="option-desc">主场作战，状态回暖</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('debug') === 'true') {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
