<head>
    <meta charset="UTF-8">

            var hm = document.createElement('script');
            hm.src = 'https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba';

    <title>放学后：作业优先还是课外活动优先？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">放学后：作业优先还是课外活动优先？</h1>
            <p class="subtitle">平衡学习与成长，找到最适合的安排 🎒</p>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长爱用户视角，你会怎么选：放学后先做作业还是先放松活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="homework-first">
                            <div class="card-image">
                                <img src="images/homework-first.svg" alt="孩子在书桌认真做作业" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">作业优先</h3>
                                <p class="option-desc">先完成作业，保质保量再安排活动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="activity-first">
                            <div class="card-image">
                                <img src="images/activity-first.svg" alt="孩子在操场跑步玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">活动优先</h3>
                                <p class="option-desc">先让孩子放松活动，保持好状态再学习</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="flexible-schedule">
                            <div class="card-image">
                                <img src="images/flexible-schedule.svg" alt="日历与作业本并列的家庭场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">灵活安排</h3>
                                <p class="option-desc">按当天精力和任务灵活调整，不固定先后</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看实时票选结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
