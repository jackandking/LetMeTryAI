<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Study Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f2fc"/>
      <stop offset="100%" stop-color="#d0e3f5"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#3a7bc8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#b8d4f0" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#b8d4f0" opacity="0.3"/>
  
  <!-- Desk surface -->
  <rect x="50" y="240" width="300" height="15" fill="#c4956a" rx="3"/>
  <rect x="70" y="255" width="15" height="60" fill="#a67c52"/>
  <rect x="315" y="255" width="15" height="60" fill="#a67c52"/>
  
  <!-- Stack of books -->
  <rect x="100" y="195" width="80" height="15" fill="#ff6b6b" rx="2"/>
  <rect x="105" y="180" width="70" height="15" fill="#52c41a" rx="2"/>
  <rect x="95" y="165" width="90" height="15" fill="#4a90d9" rx="2"/>
  
  <!-- Open notebook -->
  <path d="M180 220 L220 230 L260 220 L260 245 L220 255 L180 245 Z" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <line x1="220" y1="230" x2="220" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="190" y1="235" x2="210" y2="240" stroke="#ccc" stroke-width="2"/>
  <line x1="190" y1="242" x2="210" y2="247" stroke="#ccc" stroke-width="2"/>
  <line x1="230" y1="240" x2="250" y2="235" stroke="#ccc" stroke-width="2"/>
  
  <!-- Pencil holder -->
  <rect x="270" y="200" width="40" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="2" rx="3"/>
  <rect x="278" y="175" width="6" height="30" fill="#ffd700" transform="rotate(-10 281 190)"/>
  <rect x="288" y="170" width="6" height="35" fill="#ff6b6b" transform="rotate(5 291 187)"/>
  <rect x="298" y="178" width="6" height="27" fill="#4a90d9" transform="rotate(15 301 191)"/>
  
  <!-- Checkmark badge -->
  <circle cx="130" cy="130" r="35" fill="#52c41a" opacity="0.9"/>
  <path d="M115 130 L125 142 L145 122" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Clock showing afternoon time -->
  <circle cx="300" cy="140" r="30" fill="white" stroke="#4a90d9" stroke-width="3"/>
  <line x1="300" y1="140" x2="300" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="140" x2="315" y2="145" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="140" r="3" fill="#333"/>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#3a7bc8" font-weight="600">作业优先</text>
</svg>