<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Active Green/Orange Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f8e8"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="50" fill="#b8e8b8" opacity="0.5"/>
  <circle cx="60" cy="320" r="70" fill="#b8e8b8" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="80" cy="80" r="30" fill="#ffd93d"/>
  <line x1="80" y1="40" x2="80" y2="50" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="110" x2="80" y2="120" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="50" y2="80" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="80" x2="120" y2="80" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Running track/field -->
  <ellipse cx="200" cy="300" rx="150" ry="40" fill="#90d690" opacity="0.5"/>
  
  <!-- Running child figure -->
  <g transform="translate(150, 180)">
    <!-- Head -->
    <circle cx="50" cy="30" r="20" fill="#f4c2a1"/>
    <!-- Hair -->
    <path d="M30 25 Q50 5 70 25" fill="#8b4513"/>
    <!-- Body -->
    <rect x="35" y="50" width="30" height="50" fill="#ff6b6b" rx="5"/>
    <!-- Arms running -->
    <line x1="35" y1="60" x2="10" y2="45" stroke="#f4c2a1" stroke-width="10" stroke-linecap="round"/>
    <line x1="65" y1="60" x2="90" y2="40" stroke="#f4c2a1" stroke-width="10" stroke-linecap="round"/>
    <!-- Legs running -->
    <line x1="42" y1="100" x2="25" y2="130" stroke="#4a4a4a" stroke-width="12" stroke-linecap="round"/>
    <line x1="58" y1="100" x2="80" y2="125" stroke="#4a4a4a" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Basketball -->
  <circle cx="280" cy="220" r="35" fill="#ff6b6b"/>
  <path d="M255 205 Q280 235 305 205" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="185" x2="280" y2="255" stroke="#fff" stroke-width="2" opacity="0.6"/>
  
  <!-- Jump rope -->
  <path d="M100 200 Q140 280 180 200" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="200" r="5" fill="#4a90d9"/>
  <circle cx="180" cy="200" r="5" fill="#4a90d9"/>
  
  <!-- Motion lines -->
  <line x1="260" y1="180" x2="300" y2="170" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="265" y1="190" x2="305" y2="180" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Energetic sparkles -->
  <text x="290" y="140" font-size="24" fill="#ffd93d">✦</text>
  <text x="110" y="150" font-size="20" fill="#ff6b6b">✦</text>
  <text x="320" y="250" font-size="18" fill="#52c41a">✦</text>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#52c41a" font-weight="600">活动优先</text>
</svg>