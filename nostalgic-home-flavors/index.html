        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你怀念的家常味是哪一种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="lao-mu-ji-dun-tang">
                            <div class="card-image">
                                <img src="images/lao-mu-ji-dun-tang.svg" alt="老母鸡汤碗上热气腾腾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老母鸡炖汤</h3>
                                <p class="option-desc">一碗热腾腾的老母鸡汤，喝一口暖回记忆中的餐桌</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mama-hong-shao-rou">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">妈妈的红烧肉</h3>
                                <p class="option-desc">酱香浓郁、入口化开的那一块，是家的味道</p>

                        </label>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">葱姜蒜爆香的热菜</h3>
                                <p class="option-desc">锅里油热、葱花跳动的声音，一下子回到小时候的厨房</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="qingchen-xizhou-you-tiao">
                            <div class="card-image">
                                <img src="images/qingchen-xizhou-you-tiao.svg" alt="稀粥碗旁放着金黄油条" loading="lazy">
