    <title>超好听广场舞曲目投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">超好听广场舞曲目投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">您平时跳广场舞时，更喜欢哪种风格的伴奏曲目？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="classic-pop">
                            <div class="card-image">
                                <img src="images/classic-pop.svg" alt="经典流行风格广场舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">经典流行</h3>
                                <p class="option-caption">旋律熟悉、朗朗上口，老少皆宜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="folk-style">
                            <div class="card-image">
                                <img src="images/folk-style.svg" alt="民族风情广场舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">民族风情</h3>
                                <p class="option-caption">节奏鲜明、热情洋溢，带动全场气氛</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="slow-ballad">
                            <div class="card-image">
                                <img src="images/slow-ballad.svg" alt="抒情慢板广场舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抒情慢板</h3>
                                <p class="option-caption">动作舒缓、优雅大方，适合修身养性</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="upbeat-rhythm">
                            <div class="card-image">
                                <img src="images/upbeat-rhythm.svg" alt="动感节拍广场舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动感节拍</h3>
                                <p class="option-caption">活力四射、节拍强劲，跳起来精神抖擞</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
