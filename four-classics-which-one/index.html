        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">四大名著你站哪一部？从热血智谋到江湖豪气、从取经冒险到荣宁悲欢，你最认同哪本的魅力与影响？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="romance-of-three-kingdoms">
                            <div class="card-image">
                                <img src="images/romance-of-three-kingdoms.svg" alt="三国演义 英雄与战旗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">三国演义 — 智谋与军略的史诗</h3>
                                <p class="option-desc">群雄逐鹿、军师纵横；若爱兵法与策略，把票投给三国的热血与智略。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="water-margin">
                            <div class="card-image">

                                <p class="option-desc">梁山好汉的豪迈与义气，铁血兄弟、武艺招式，适合爱硬派江湖故事的你。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="journey-to-the-west">
                            <div class="card-image">
                                <img src="images/journey-to-the-west.svg" alt="西游记 孙悟空与取经队伍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">西游记 — 奇幻冒险与机智取胜</h3>
                                <p class="option-desc">取经路上的妖魔与法术、智慧与团队配合，偏爱冒险与超能设定就选西游。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="dream-of-the-red-chamber">
