    <title>春季亲子出游：你偏好哪种安排</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季亲子出游，你偏好哪种安排</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春季亲子出游，你偏好哪种安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="short-half-day">
                            <div class="card-image">
                                <img src="images/short-half-day.svg" alt="短途半日行 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短途半日行</h3>
                                <p class="option-caption">就在附近公园、博物馆或动物园，行程轻松，适合小年龄孩子和午睡需求。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="one-day-picnic">
                            <div class="card-image">
                                <img src="images/one-day-picnic.svg" alt="一天轻旅行 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一天轻旅行</h3>
                                <p class="option-caption">郊区野餐或农场体验，时间充裕、互动活动多，需准备午餐与换洗衣物。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="weekend-multi-day">
                            <div class="card-image">
                                <img src="images/weekend-multi-day.svg" alt="周末多日游 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">周末多日游</h3>
                                <p class="option-caption">住民宿、走访景点，适合想稍作远行并深度体验的家庭，但需更充分准备。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-theme-day">
                            <div class="card-image">
                                <img src="images/home-theme-day.svg" alt="在家主题亲子日 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">在家主题亲子日</h3>
                                <p class="option-caption">宅家手作、主题料理或家庭电影节，成本低且适合日程紧张或天气不稳时选择。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
