    <title>28斤榴莲只花300多 — 划算吗？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">28斤榴莲只花300多，你觉得划算吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看到“28斤榴莲只花300多”，你会如何判断它是否划算？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-now">
                            <div class="card-image">
                                <img src="images/buy-now.svg" alt="认为划算并准备购买" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立刻入手</h3>
                                <p class="option-desc">觉得价格划算，愿意马上下单省钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-and-see">
                            <div class="card-image">
                                <img src="images/wait-and-see.svg" alt="观望评价和来源" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">再观望</h3>
                                <p class="option-desc">价格诱人但想看评价、来源或实物图再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="suspect-quality">
                            <div class="card-image">
                                <img src="images/suspect-quality.svg" alt="怀疑质量或称重问题" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可能有问题</h3>
                                <p class="option-desc">价格过低，担心品质、称重或信息不实</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="depends-on-variety">
                            <div class="card-image">
                                <img src="images/depends-on-variety.svg" alt="关注产地和品种信息" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看产地与品种</h3>
                                <p class="option-desc">需确认产地、品种和保鲜配送后再决定是否划算</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
