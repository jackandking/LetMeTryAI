    <title>抹茶这么火，你更爱哪种抹茶画面？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">抹茶这么火，你更爱哪种抹茶画面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">抹茶这么火，你更喜欢哪种画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="matcha-latte">
                            <div class="card-image">
                                <img src="images/matcha-latte.svg" alt="抹茶拿铁拉花杯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抹茶拿铁</h3>
                                <p class="option-desc">暖色咖啡馆内，奶泡拉花上的浅绿抹茶漩涡，手握杯沿的温感画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="traditional-matcha">
                            <div class="card-image">
                                <img src="images/traditional-matcha.svg" alt="传统抹茶茶碗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统抹茶</h3>
                                <p class="option-desc">和风茶室里，竹筅打出的浓绿泡沫，茶碗与庭院景致同框的静谧瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matcha-dessert">
                            <div class="card-image">
                                <img src="images/matcha-dessert.svg" alt="抹茶甜点切面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抹茶甜点</h3>
                                <p class="option-desc">精致甜点盘中，抹茶千层或慕斯切面层层绿色绽放的诱人镜头。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matcha-ice">
                            <div class="card-image">
                                <img src="images/matcha-ice.svg" alt="抹茶冰淇淋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抹茶冰品</h3>
                                <p class="option-desc">街头清爽抹茶霜淇淋或刨冰，阳光下翠绿与果酱点缀形成强烈视觉冲击。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
