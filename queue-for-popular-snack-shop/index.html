    <title>你会为热门零食店排队吗？— 排队态度投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你会为热门零食店排队吗？投票说说你的态度</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会为热门零食店排队吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="willing-to-queue">
                            <div class="card-image">
                                <img src="images/willing-to-queue.svg" alt="排队尝鲜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">愿意排队尝鲜</h3>
                                <p class="option-caption">愿意为限量口味或口碑好店排队，享受尝鲜和社交体验。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="check-reviews-first">
                            <div class="card-image">
                                <img src="images/check-reviews-first.svg" alt="先看评价" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先看评价再决定</h3>
                                <p class="option-caption">会先查看评价或短视频试吃，再决定是否排队，注重性价比。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wont-queue-for-snacks">
                            <div class="card-image">
                                <img src="images/wont-queue-for-snacks.svg" alt="不会排队" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会为零食排队</h3>
                                <p class="option-caption">不愿意为零食花时间，觉得不划算或排队体验不好。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="only-for-deals">
                            <div class="card-image">
                                <img src="images/only-for-deals.svg" alt="只为优惠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只为优惠或限定时排队</h3>
                                <p class="option-caption">只有遇到折扣、联名或限量发售时才会排队，平时不会。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
