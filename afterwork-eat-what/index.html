    <title>下班吃啥：外卖、下厨还是约朋友？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">下班饿了：外卖还是自己做？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">今天下班你更想怎么吃？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="takeout-easy">
                            <div class="card-image">
                                <img src="images/takeout-easy.svg" alt="外卖送到餐桌画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">叫外卖 省事惬意</h3>
                                <p class="option-desc">懒得动手，想早点放松</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cook-at-home">
                            <div class="card-image">
                                <img src="images/cook-at-home.svg" alt="家常菜下厨场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自己下厨 健康实惠</h3>
                                <p class="option-desc">想吃得清爽又省钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dine-with-friends">
                            <div class="card-image">
                                <img src="images/dine-with-friends.svg" alt="朋友聚餐举杯画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">约朋友 聚餐更带劲</h3>
                                <p class="option-desc">和朋友边聊边吃更开心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
