<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏天手上常起小水疱，你更在意哪个问题？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">夏天手上常起小水疱，你更在意哪个问题？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="itchy-pain">
                            <div class="card-image">
                                <img src="images/itchy-pain.svg" alt="老人手背有小水疱，表情难受" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">经常痒又疼，睡不好</h3>
                                <p class="option-desc">晚上发作又痒又痛，睡眠受影响</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="affect-chores">
                            <div class="card-image">
                                <img src="images/affect-chores.svg" alt="手指处小水疱破溃，沾到洗碗液" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">做家务时容易破溃出血</h3>
                                <p class="option-desc">洗衣做饭一碰就破，家务受限</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="recur-frequently">
                            <div class="card-image">
                                <img src="images/recur-frequently.svg" alt="手掌有多处小水疱，反复出现的示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">反复发作，总也好不了</h3>
                                <p class="option-desc">反复复发、换季或出汗时常见</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="worry-contagious">
                            <div class="card-image">
                                <img src="images/worry-contagious.svg" alt="老人握手时略有顾虑，手上小水疱可见" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">担心会传给家人或传染</h3>
                                <p class="option-desc">怕传给小孩或家人，不敢近距离接触</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
