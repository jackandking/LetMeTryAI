<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>网红美食下单意愿投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你会为网红美食下单尝鲜吗？来投票说说你的选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看到网红推荐的美食，你会为网红美食下单尝鲜吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="order-now">
                            <div class="card-image">
                                <img src="images/order-now.jpg" alt="美食图片-立即尝鲜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立刻下单尝鲜</h3>
                                <p class="option-desc">看起来好吃，想马上试试新品或限量款。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-for-reviews">
                            <div class="card-image">
                                <img src="images/wait-for-reviews.jpg" alt="查看评价与测评" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先看评价再决定</h3>
                                <p class="option-desc">倾向参考他人测评、口碑或开箱后再下单。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="try-once">
                            <div class="card-image">
                                <img src="images/try-once.jpg" alt="小份尝鲜示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">尝试一次看口味</h3>
                                <p class="option-desc">好奇心驱动，会买小份或第一次尝试看看是否喜欢。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="never-order">
                            <div class="card-image">
                                <img src="images/never-order.jpg" alt="不下单示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会下单/不感兴趣</h3>
                                <p class="option-desc">不跟风或对网红美食类别本身不感兴趣。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
