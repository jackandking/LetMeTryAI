    <title>带孩子去滕王阁｜先看哪种镇馆之宝最有画面感？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子去滕王阁，你会先看哪种镇馆之宝？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子去滕王阁，你会先带他看哪一种镇馆之宝？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-paintings">
                            <div class="card-image">
                                <img src="images/ancient-paintings.svg" alt="古代书画特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古代书画</h3>
                                <p class="option-desc">细看笔墨与人物故事，适合给孩子讲朝代与人物小故事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fine-ceramics">
                            <div class="card-image">
                                <img src="images/fine-ceramics.svg" alt="精美瓷器展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精美瓷器</h3>
                                <p class="option-desc">色彩与纹饰吸睛，适合让孩子找颜色、比图案并拍照留念。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="historic-sculptures">
                            <div class="card-image">
                                <img src="images/historic-sculptures.svg" alt="名家雕塑或石刻" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">名家雕塑</h3>
                                <p class="option-desc">立体造型有画面感，适合让孩子模仿姿势或编小剧。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
