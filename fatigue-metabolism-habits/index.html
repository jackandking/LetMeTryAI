    <title>总犯困、代谢慢？真相是哪种日常习惯在作怪？——爱老人</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">总犯困、代谢慢？真相是哪种日常习惯在作怪？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你觉得导致总犯困、代谢慢的主要日常习惯是哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="irregular-sleep">
                            <div class="card-image">
                                <img src="images/irregular-sleep.svg" alt="老人晚上失眠白天打盹的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">作息零散（晚睡/午睡不稳）</h3>
                                <p class="option-desc">晚上翻来覆去，白天又常打瞌睡，生物钟乱了？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sedentary-lifestyle">
                            <div class="card-image">
                                <img src="images/sedentary-lifestyle.svg" alt="老人在沙发上久坐看电视的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">久坐少动/不主动活动</h3>
                                <p class="option-desc">整天坐着看电视、少散步，身体像不开机一样慢热。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-heavy-meals">
                            <div class="card-image">
                                <img src="images/late-heavy-meals.svg" alt="老人夜间吃宵夜的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">饮食重油重糖/吃太晚</h3>
                                <p class="option-desc">晚饭丰盛又靠夜宵，饭后就困，代谢可能受影响。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="low-water-intake">
                            <div class="card-image">
                                <img src="images/low-water-intake.svg" alt="老人杯中少量水放在桌旁的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝水少/忽视日常补水</h3>
                                <p class="option-desc">一天喝水少、口干才想起喝，身体运转像缺润滑。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
