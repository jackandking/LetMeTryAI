        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：香水入门推荐？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="floral-fresh">
                            <div class="card-image">
                                <img src="images/floral-fresh.svg" alt="淡雅花束与香水瓶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花香清新款</h3>
                                <p class="option-desc">温柔花香，日常通勤与约会皆可</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="woody-warm">
                            <div class="card-image">
                                <img src="images/woody-warm.svg" alt="木质元素与香水瓶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木质暖香款</h3>
                                <p class="option-desc">略带沉稳气质，适合秋冬或成熟风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="fruity-sweet">
                            <div class="card-image">
                                <img src="images/fruity-sweet.svg" alt="多汁水果与香水瓶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">果香甜美款</h3>
                                <p class="option-desc">俏皮果香，年轻活力的选择</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
