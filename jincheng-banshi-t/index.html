    <title>这件“进城办事”T你敢穿出街吗？— 女人爱</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这件“进城办事”T你敢穿出街吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看到这件“进城办事”T，你会怎么做？直接穿出街、只在家/活动穿，还是不会穿出街？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dare-wear">
                            <div class="card-image">
                                <img src="images/dare-wear.svg" alt="女生穿着进城办事T在街头自信背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敢穿出街</h3>
                                <p class="option-desc">直接穿出街，配短裤或高腰裤，背影也够抢镜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-or-event">
                            <div class="card-image">
                                <img src="images/home-or-event.svg" alt="居家场景穿着进城办事T的放松姿态" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只在家或特定活动穿</h3>
                                <p class="option-desc">只在家里或朋友聚会、主题活动里穿，日常低调处理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wont-wear">
                            <div class="card-image">
                                <img src="images/wont-wear.svg" alt="女生把进城办事T收进衣橱的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会穿出街</h3>
                                <p class="option-desc">觉得太招摇或尴尬，宁愿不出街穿这件</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
