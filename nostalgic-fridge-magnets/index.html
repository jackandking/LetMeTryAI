<head>

    <title>怀旧冰箱贴投票页</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">怀旧冰箱贴，你更喜欢哪种款式？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">怀旧冰箱贴，你更喜欢哪种款式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="retro-movie-poster">
                            <div class="card-image">
                                <img src="images/retro-movie-poster.svg" alt="老电影海报风格冰箱贴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老电影海报风</h3>
                                <p class="option-desc">仿旧电影海报，色调怀旧有故事感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sepia-photo-collage">
                            <div class="card-image">
                                <img src="images/sepia-photo-collage.svg" alt="老照片拼贴风格冰箱贴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老照片拼贴</h3>
                                <p class="option-desc">家庭老照片拼贴，温暖怀念</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="folk-patterns">
                            <div class="card-image">
                                <img src="images/folk-patterns.svg" alt="传统民俗花纹冰箱贴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统民俗花纹</h3>
                                <p class="option-desc">传统花纹与吉祥元素，亲切熟悉</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="calligraphy-poem">
                            <div class="card-image">
                                <img src="images/calligraphy-poem.svg" alt="书法诗词风格冰箱贴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书法诗词款</h3>
                                <p class="option-desc">简约书法搭配短句，雅致耐看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
