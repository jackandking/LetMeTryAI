    <title>闺蜜翻脸：你最无法接受哪种行为？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">闺蜜翻脸：你最无法接受哪种行为？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">最容易让闺蜜翻脸的原因是哪一个？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="reveal-secret">
                            <div class="card-image">
                                <img src="images/reveal-secret.svg" alt="出卖秘密的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">出卖秘密</h3>
                                <p class="option-desc">把她的秘密告诉别人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="badmouthing">
                            <div class="card-image">
                                <img src="images/badmouthing.svg" alt="背后议论的插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">背后说坏话</h3>
                                <p class="option-desc">背后说她的坏话或取笑</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="borrow-and-not-return">
                            <div class="card-image">
                                <img src="images/borrow-and-not-return.svg" alt="钱款纠纷示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">借钱不还</h3>
                                <p class="option-desc">借钱后长期拖延不还</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="ambiguous-affair">
                            <div class="card-image">
                                <img src="images/ambiguous-affair.svg" alt="感情插足的象征图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暧昧插足/优先另一方</h3>
                                <p class="option-desc">介入感情或把你放在次要位置</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
