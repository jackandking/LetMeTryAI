    <title>揭秘：孩子看运动员，会想试哪种运动？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子看运动员，会想试哪种运动？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子看运动员，会想试哪种运动？看到哪个动作会忍不住模仿？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="football">
                            <div class="card-image">
                                <img src="images/football.svg" alt="孩子模仿足球射门" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">足球</h3>
                                <p class="option-desc">看到球场奔跑和射门，想试着带球进网的快感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="swimming">
                            <div class="card-image">
                                <img src="images/swimming.svg" alt="孩子模仿游泳动作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">游泳</h3>
                                <p class="option-desc">看到泳池劈水冲刺，想学在水里飞起来的感觉</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gymnastics">
                            <div class="card-image">
                                <img src="images/gymnastics.svg" alt="孩子模仿体操翻滚" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">体操</h3>
                                <p class="option-desc">看到翻腾与优雅的空中动作，想试着翻跟头或做平衡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="basketball">
                            <div class="card-image">
                                <img src="images/basketball.svg" alt="孩子模仿篮球投篮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">篮球</h3>
                                <p class="option-desc">看到高高跃起的投篮和运球过人，想学投篮和带球突破</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
