    <title>睡眠日常：睡觉时经常这样，你会在意吗？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">睡觉时经常这样，你会在意吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">睡觉时经常这样，你会在意吗？哪种情况更让你或家人注意？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-snoring">
                            <div class="card-image">
                                <img src="images/light-snoring.svg" alt="轻微打鼾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻微打鼾</h3>
                                <p class="option-desc">睡到一半会轻轻打鼾，家人说有点响但白天精神还好。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tossing-turning">
                            <div class="card-image">
                                <img src="images/tossing-turning.svg" alt="翻来覆去" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">整夜翻来覆去</h3>
                                <p class="option-desc">整晚翻身很多，总感觉没睡踏实，早上疲惫感强。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nightly-get-ups">
                            <div class="card-image">
                                <img src="images/nightly-get-ups.svg" alt="半夜起夜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">半夜频繁起床</h3>
                                <p class="option-desc">夜里醒来好几次上厕所或醒着走动，睡眠被打断。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="talk-in-sleep">
                            <div class="card-image">
                                <img src="images/talk-in-sleep.svg" alt="梦话" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡着说话/梦话</h3>
                                <p class="option-desc">睡着时会轻声说话或偶尔动弹，家人听了既好笑又有点担心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
