    <title>温和日常习惯，守护晚年活力</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老年人日常健康小习惯</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">平时您更常做哪类有助于日常活力的习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="walking-exercise">
                            <div class="card-image">
                                <img src="images/walking-exercise.svg" alt="老人在公园散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">健步走或慢走</h3>
                                <p class="option-desc">每天散步或快走，活动筋骨</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tai-chi-qigong">
                            <div class="card-image">
                                <img src="images/tai-chi-qigong.svg" alt="太极动作示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太极或气功轻练</h3>
                                <p class="option-desc">轻柔运动，呼吸与伸展结合</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="early-sleep">
                            <div class="card-image">
                                <img src="images/early-sleep.svg" alt="温馨卧室与夜灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">规律作息早睡早起</h3>
                                <p class="option-desc">保持固定睡眠作息，白天精力更佳</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-hydration">
                            <div class="card-image">
                                <img src="images/regular-hydration.svg" alt="杯子与健康餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">定时喝水、均衡饮食</h3>
                                <p class="option-desc">提醒自己喝水并注意均衡饮食</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
