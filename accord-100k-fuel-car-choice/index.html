<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">雅阁降到10万级，你还会选合资燃油车吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">雅阁降到10万级，你还会选合资燃油车吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="accord-still-buy">
                            <div class="card-image">
                                <img src="images/accord-still-buy.svg" alt="雅阁燃油车推荐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">必选雅阁，真香</h3>
                                <p class="option-desc">降到这个价，合资B级车的牌面还要啥自行车</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="switch-new-energy">
                            <div class="card-image">
                                <img src="images/switch-new-energy.svg" alt="新能源汽车选择" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">转头新能源，不犹豫</h3>
                                <p class="option-desc">电价便宜、智驾好用，现在谁还死磕油车</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cheapest-wins">
                            <div class="card-image">
                                <img src="images/cheapest-wins.svg" alt="优惠力度决定买车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看优惠力度，价低者赢</h3>
                                <p class="option-desc">谁降到更低就买谁，钱包说了算</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="loyal-fuel-fan">
                            <div class="card-image">
                                <img src="images/loyal-fuel-fan.svg" alt="燃油车老车主" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">怀旧老车主，再来一辆</h3>
                                <p class="option-desc">开了多年油车，踏实省心，再来一辆也无妨</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
