    <title>遇到倒流瀑布：哪种pose更有电影感？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到倒流瀑布，你会用哪种pose拍出电影感？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到倒流瀑布，你会用哪种pose拍出电影感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="back-dress-sway">
                            <div class="card-image">
                                <img src="images/back-dress-sway.svg" alt="背影长裙飘起pose" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">背影长裙飘起</h3>
                                <p class="option-desc">长裙随风，背影拉满电影感，适合远景和慢镜头感觉</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="turn-and-glance">
                            <div class="card-image">
                                <img src="images/turn-and-glance.svg" alt="转身回眸pose" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">转身回眸一笑</h3>
                                <p class="option-desc">一个转身回眸的瞬间，捕捉人物情绪与叙事感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="arms-open">
                            <div class="card-image">
                                <img src="images/arms-open.svg" alt="张臂迎风pose" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">张臂迎风开阔感</h3>
                                <p class="option-desc">双臂展开营造自由与张力，画面更有冲击力和层次</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="low-squat-closeup">
                            <div class="card-image">
                                <img src="images/low-squat-closeup.svg" alt="下蹲近景pose" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">低姿下蹲近景情绪</h3>
                                <p class="option-desc">靠近镜头的低姿态，放大细节与情绪，适合特写镜头</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
