    <title>看女排后想学哪个团队运动？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子看女排比赛，会想学哪种团队运动？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子看女排比赛，会想学哪种团队运动？哪个场景最能打动你家孩子？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="volleyball">
                            <div class="card-image">
                                <img src="images/volleyball.svg" alt="孩子看女排想学排球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">排球</h3>
                                <p class="option-desc">被队员的高高弹跳和配合吸引，爱模仿拦网与传球动作。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="basketball">
                            <div class="card-image">
                                <img src="images/basketball.svg" alt="孩子看女排后想学篮球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">篮球</h3>
                                <p class="option-desc">被突破和灌篮的视觉冲击吸引，喜欢带球和团队轮转的节奏。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="football">
                            <div class="card-image">
                                <img src="images/football.svg" alt="孩子看女排后想学足球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">足球</h3>
                                <p class="option-desc">被奔跑与配合传球的场面打动，享受大场地和群体协作。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="other-team-sports">
                            <div class="card-image">
                                <img src="images/other-team-sports.svg" alt="孩子看女排想学其他团队运动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">其他团队运动</h3>
                                <p class="option-desc">比如手球、橄榄球或接力类，孩子对不同配合形式更感兴趣。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
