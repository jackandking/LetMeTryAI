    <title>外卖涨价后的常见糟心体验对比</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">外卖涨价后你遇到过哪些糟心事？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">外卖涨价后，哪种糟心情况你经常遇到？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-delivery">
                            <div class="card-image">
                                <img src="images/late-delivery.jpg" alt="外卖骑手推车配送" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">配送慢或迟到</h3>
                                <p class="option-desc">骑手迟到或配送远超预期，饭菜凉了</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="missing-items">
                            <div class="card-image">
                                <img src="images/missing-items.jpg" alt="外卖盒打开后缺少菜品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">缺少菜品或少份量</h3>
                                <p class="option-desc">下单后少了菜或少了分量，影响口感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="extra-fee">
                            <div class="card-image">
                                <img src="images/extra-fee.jpg" alt="账单显示额外费用" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">出现隐形收费</h3>
                                <p class="option-desc">配送费/包装费突然增加或弹出额外费用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wrong-item">
                            <div class="card-image">
                                <img src="images/wrong-item.jpg" alt="外卖与菜单不一致" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">送错或口味与描述不符</h3>
                                <p class="option-desc">收到与页面描述不一致的餐品或口味偏差</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    </script>
</body>
</html>
