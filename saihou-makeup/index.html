            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">赛后她们的妆容，你想试哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dewy-natural">

                                <img src="images/dewy-natural.svg" alt="淡雅通透妆容示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">淡雅通透妆</h3>
                                <p class="option-desc">轻薄底妆＋自然光感高光，日常也能驾驭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="smoky-glam">
                            <div class="card-image">
                                <img src="images/smoky-glam.svg" alt="烟熏魅眼妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">烟熏魅眼妆</h3>
                                <p class="option-desc">深邃眼影＋柔和晕染，适合晚宴或派对</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="retro-red-lip">

                                <img src="images/retro-red-lip.svg" alt="复古红唇妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古红唇妆</h3>
                                <p class="option-desc">干练红唇＋精致眼线，复古又有气场</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stage-glow">
                            <div class="card-image">
                                <img src="images/stage-glow.svg" alt="舞台亮泽高光妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">舞台亮泽高光妆</h3>
                                <p class="option-desc">镜面高光＋亮片眼妆，镜头下更抓眼球</p>
