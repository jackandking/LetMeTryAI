    <title>雨天出门妆容对比：哪种让你更放心？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">雨天出门，哪种妆你更放心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">雨天出门，哪种妆你更放心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="waterproof-high-coverage">
                            <div class="card-image">
                                <img src="images/waterproof-high-coverage.svg" alt="防水高遮瑕妆容" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防水持妆·高遮瑕</h3>
                                <p class="option-desc">高遮瑕粉底 + 防水定妆，一整天不易脱妆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-sheer">
                            <div class="card-image">
                                <img src="images/natural-sheer.svg" alt="自然薄透妆容" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然薄透·轻妆感</h3>
                                <p class="option-desc">轻薄底妆+少量防水睫毛膏，透气不闷</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-makeup-waterproof-mascara">
                            <div class="card-image">
                                <img src="images/no-makeup-waterproof-mascara.svg" alt="无妆感搭配防水睫毛膏" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新无妆感·防水睫毛</h3>
                                <p class="option-desc">几乎无底妆，靠防水睫毛膏营造精致感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-longwear-lip">
                            <div class="card-image">
                                <img src="images/matte-longwear-lip.svg" alt="哑光持色口红妆容" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">口红焦点·哑光持色</h3>
                                <p class="option-desc">面部轻薄，以哑光长效口红为亮点、减少补妆频率</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>

                </div>
