    <title>路见不平，你会主动出手吗？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">路见不平，你会主动出手吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">路见不平，你会主动出手吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="step-forward">
                            <div class="card-image">
                                <img src="images/step-forward.svg" alt="挺身而出帮助他人的场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">挺身而出</h3>
                                <p class="option-desc">该出手时就出手，不能眼睁睁看着</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="record-evidence">
                            <div class="card-image">
                                <img src="images/record-evidence.svg" alt="用手机记录现场留证据的场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先留证据</h3>
                                <p class="option-desc">打开手机录像，既能帮忙也保护自己</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="assess-situation">
                            <div class="card-image">
                                <img src="images/assess-situation.svg" alt="冷静观察情况后再行动的场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看情况帮</h3>
                                <p class="option-desc">先判断风险，量力而行更稳妥</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stay-safe">
                            <div class="card-image">
                                <img src="images/stay-safe.svg" alt="选择保护自身安全的场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">明哲保身</h3>
                                <p class="option-desc">先保证自身安全，不添乱就好</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
