    <title>新学期每天抓好这三件事，你会先做哪一项？（家长版）</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">新学期每天抓好这三件事，你会先做哪一项？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">新学期每天抓好这三件事，你会先做哪一项？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="check-homework">
                            <div class="card-image">
                                <img src="images/check-homework.svg" alt="家长在桌前和孩子一起做作业的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先检查并辅导作业</h3>
                                <p class="option-desc">和孩子一起看作业、讲解错题，确保当天学习任务到位。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="read-together">
                            <div class="card-image">
                                <img src="images/read-together.svg" alt="家长和孩子在沙发上共读的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先读书讲故事一段</h3>
                                <p class="option-desc">共读10–20分钟的故事或图书，培养阅读习惯和亲子连接。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="plan-and-talk">
                            <div class="card-image">
                                <img src="images/plan-and-talk.svg" alt="家长与孩子在餐桌上讨论当天计划的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先定好作息并聊聊心情</h3>
                                <p class="option-desc">和孩子商定日程并听他/她说说感受，减少摩擦、利于情绪稳定。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
