    <title>家长话题：周末亲子活动，哪种安排更合适？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：周末亲子活动，哪种安排更合适？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：周末亲子活动以哪种方式为主？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="outdoor-adventure">
                            <div class="card-image">
                                <img src="images/outdoor-adventure.svg" alt="孩子在公园玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">户外探险</h3>
                                <p class="option-desc">远离屏幕，去公园/短途郊游亲近自然</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="home-craft">
                            <div class="card-image">
                                <img src="images/home-craft.svg" alt="父母和孩子做手工" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭手工与游戏</h3>
                                <p class="option-desc">在家做手工或桌游，增强互动与创造力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="quiet-reading">
                            <div class="card-image">
                                <img src="images/quiet-reading.svg" alt="孩子听故事" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安静阅读时光</h3>
                                <p class="option-desc">阅读或讲故事，营造稳定的亲子陪伴时刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
