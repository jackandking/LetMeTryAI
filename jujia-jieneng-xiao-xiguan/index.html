    <title>居家节能小习惯，你常做哪条？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">居家节能小习惯投票：你现在常做哪一项？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下面这些居家节能小习惯，你平时会做哪一项？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sui-shou-guan-deng">
                            <div class="card-image">
                                <img src="images/sui-shou-guan-deng.svg" alt="随手关灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">随手关灯</h3>
                                <p class="option-desc">离开房间就把灯关了，省电又更安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="huan-led-jieneng-deng">
                            <div class="card-image">
                                <img src="images/huan-led-jieneng-deng.svg" alt="更换节能灯泡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">换节能/LED灯</h3>
                                <p class="option-desc">把旧灯换成节能灯或LED，长期省电又省心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="shezhi-reshuiqi-dingshi">
                            <div class="card-image">
                                <img src="images/shezhi-reshuiqi-dingshi.svg" alt="热水器定时设置" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">热水器定时</h3>
                                <p class="option-desc">设置定时加热，避免整天待机空耗。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ba-diao-dai-ji-dian-yuan">
                            <div class="card-image">
                                <img src="images/ba-diao-dai-ji-dian-yuan.svg" alt="拔掉插头" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">拔掉待机电源</h3>
                                <p class="option-desc">不用电器就拔掉插头，减少待机电量损耗。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
