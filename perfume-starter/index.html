    <title>哪种香调更打动你？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种香调更打动你？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你最喜欢哪种香调的香水？投一票告诉大家你的气质首选。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="floral-sweet">
                            <div class="card-image">
                                <img src="images/floral-sweet.svg" alt="花香轻甜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花香轻甜</h3>
                                <p class="option-desc">温柔甜美，适合日常与约会的女孩感香调</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="woody-warm">
                            <div class="card-image">
                                <img src="images/woody-warm.svg" alt="木质温暖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木质温暖</h3>
                                <p class="option-desc">成熟稳重，带一点性感沉稳的职场/秋冬感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="fresh-fruity">
                            <div class="card-image">
                                <img src="images/fresh-fruity.svg" alt="清新果香" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新果香</h3>
                                <p class="option-desc">活泼清爽，元气少女或春夏首选</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="soft-vanilla">
                            <div class="card-image">
                                <img src="images/soft-vanilla.svg" alt="轻柔香草" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻柔香草</h3>
                                <p class="option-desc">温柔舒适，适合慵懒居家或亲密场合</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
