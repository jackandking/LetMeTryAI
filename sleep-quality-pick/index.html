        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个睡眠改善方法？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="consistent-schedule">
                            <div class="card-image">
                                <img src="images/consistent-schedule.svg" alt="闹钟与床铺的温馨场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定作息</h3>
                                <p class="option-desc">每天同一时间上床和起床，建立生物钟</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="bedtime-relaxation">
                            <div class="card-image">
                                <img src="images/bedtime-relaxation.svg" alt="脚盆和杯热茶的特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前放松</h3>
                                <p class="option-desc">睡前泡脚、深呼吸或听轻音乐放松身心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="bedroom-environment">
                            <div class="card-image">
                                <img src="images/bedroom-environment.svg" alt="遮光窗帘与整洁床铺" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优化卧室环境</h3>
                                <p class="option-desc">改善光线、隔音与床品，让睡眠更稳定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="chinese-medicine-tips">
                            <div class="card-image">
                                <img src="images/chinese-medicine-tips.svg" alt="中医杯与温和茶饮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中医与食疗小法</h3>
                                <p class="option-desc">借助中医建议与季节饮食调整助眠</p>
                            </div>
                            <div class="check-indicator">✓</div>
