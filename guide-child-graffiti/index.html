    <title>孩子在公共牌匾或墙面涂鸦，家长如何引导</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子在公共牌匾或墙面涂鸦，你会怎样引导？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果发现孩子在公共牌匾或墙面涂鸦，你会选择怎样的引导方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="talk-and-clean">
                            <div class="card-image">
                                <img src="images/talk-and-clean.svg" alt="家长与孩子一起清理涂鸦，温和沟通" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温和沟通并示范清理</h3>
                                <p class="option-desc">先冷静询问原因，表达界限，再与孩子一起清理并说明公共财物的重要性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="set-limits-and-offer">
                            <div class="card-image">
                                <img src="images/set-limits-and-offer.svg" alt="为孩子准备替代的画板或指定墙面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">限制后允许创作替代</h3>
                                <p class="option-desc">明确告知公共场所不允许，同时提供家中或画板作为创作空间以尊重孩子的创意。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="responsibility-and-apology">
                            <div class="card-image">
                                <img src="images/responsibility-and-apology.svg" alt="孩子参与清理并向他人致歉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">引导承担责任并道歉</h3>
                                <p class="option-desc">让孩子承担清理和修复的责任，并在适当场合向受影响方道歉以培养责任感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="strict-consequence">
                            <div class="card-image">
                                <img src="images/strict-consequence.svg" alt="家长与孩子讨论规则并暂时收回特权" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">规则明确并收回部分特权</h3>
                                <p class="option-desc">以规则为主，说明后果并临时收回部分特权以示约束，随后再以沟通恢复信任。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
