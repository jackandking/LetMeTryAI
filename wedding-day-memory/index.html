    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你结婚那天怀念哪一幕？</h1>

            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你结婚那天怀念哪一幕？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="father-walk-aisle">
                            <div class="card-image">
                                <img src="images/father-walk-aisle.svg" alt="父亲牵着新娘的手走过礼堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">父亲牵手送你入场</h3>
                                <p class="option-desc">父亲把你的手交到另一半手里，既温暖又带着不舍。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="first-look">
                            <div class="card-image">
                                <img src="images/first-look.svg" alt="新人第一次四目相对的瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">第一次看见对方的眼神</h3>
                                <p class="option-desc">那一眼的惊喜与笑意，像电影里的定格画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-toast">
                            <div class="card-image">
                                <img src="images/family-toast.svg" alt="婚宴上亲友举杯喧闹热闹" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宴席上全家举杯欢笑</h3>
                                <p class="option-desc">长辈们举杯祝福，热闹的笑声和亲切的寒暄让人暖心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="group-photo-with-elders">
                            <div class="card-image">
                                <img src="images/group-photo-with-elders.svg" alt="婚礼上和父母及长辈的合影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">和长辈一起拍的那张合影</h3>
                                <p class="option-desc">老照片里全家挤在一起的合影，年代感和亲情同在。</p>
                            </div>
                            <div class="check-indicator">✓</div>
