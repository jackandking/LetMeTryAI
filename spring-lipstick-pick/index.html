    <h1 id="pageTitle">春季口红：你最想种草哪个？</h1>

    <form id="questionnaire">

            <p id="questionText">如果是女人爱用户，你会把这一票投给谁：春季口红色号，你最想种草哪个？</p>

                    <input type="radio" name="womanai" value="bright-red">

                </label>

                <label class="option">
