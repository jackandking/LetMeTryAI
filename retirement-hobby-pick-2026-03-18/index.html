    <title>退休后最想重拾的兴趣</title>

<body>
    <h1 id="pageTitle">退休后最想重拾的兴趣</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果是爱老人用户，你最支持哪个选项：退休后你最想重拾哪项兴趣？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="hobby-gardening">
                    <img src="images/hobby-gardening.svg" alt="老人种花浇水的场景" loading="lazy">
                    <span>在阳台或社区花园种菜养花，动手又有成就感</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="hobby-painting">
                    <img src="images/hobby-painting.svg" alt="老人画国画或油画的场景" loading="lazy">
                    <span>拿起画笔，重温创作与静心的乐趣</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="hobby-tai-chi">
                    <img src="images/hobby-tai-chi.svg" alt="太极或广场舞队形画面" loading="lazy">
                    <span>温和运动，强身又结交朋友</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="hobby-travel">
                    <img src="images/hobby-travel.svg" alt="老年人旅游合影或风景" loading="lazy">
                    <span>出游看风景，拓展社交与生活体验</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在汇总实时投票结果...</p>
    </div>

    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
