        <main>

                    <p id="questionText" class="question-text">宝石色系妆容你会怎么选？约会、出街还是派对时更想画哪款？</p>
                    <div class="options-grid" id="optionsContainer">

                            <div class="card-image">
                                <img src="images/emerald-electric-eye.svg" alt="绿宝石色眼影搭配细闪睫毛的电眼妆" loading="lazy">
                            </div>
                            <div class="card-content">

                                <p class="option-desc">深绿渐变＋细闪，打造冷冽有神的电眼效果，适合夜晚或舞台感妆容。</p>
                            </div>

                            </div>

                                <img src="images/ruby-stain-lip.svg" alt="红宝石色泽的唇妆特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红宝石绯唇</h3>
                                <p class="option-desc">饱和红唇或渐变唇，温柔又有存在感，约会和拍照都能吸睛。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="amethyst-dream">
                            <div class="card-image">
                                <img src="images/amethyst-dream.svg" alt="紫水晶色眼影搭配柔和腮红的妆容" loading="lazy">
