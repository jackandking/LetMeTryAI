<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">换季护肤大作战，你的肌肤正在经历什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季期间，你的皮肤最容易出现哪种状况？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dry-flaking">
                            <div class="card-image">
                                <img src="images/dry-flaking.svg" alt="干燥起皮肌肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">干燥起皮</h3>
                                <p class="option-caption">脸颊紧绷、上妆卡粉，急需补水保湿</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sensitive-redness">
                            <div class="card-image">
                                <img src="images/sensitive-redness.svg" alt="敏感泛红肌肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敏感泛红</h3>
                                <p class="option-caption">气温不稳定，皮肤容易刺痛泛红</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="oily-acne">
                            <div class="card-image">
                                <img src="images/oily-acne.svg" alt="出油长痘肌肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">出油长痘</h3>
                                <p class="option-caption">T区泛油光，闭口痘痘频繁冒出</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dull-glowless">
                            <div class="card-image">
                                <img src="images/dull-glowless.svg" alt="暗沉无光肌肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暗沉无光</h3>
                                <p class="option-caption">肤色不均匀，看起来疲惫没气色</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

        </footer>
