<head>

    <title>春季养生茶饮 - 爱老人</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季养生茶饮</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">您平时最喜欢喝哪种养生茶？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="chrysanthemum-tea">
                            <div class="card-image">
                                <img src="images/chrysanthemum-tea.jpg" alt="一杯清香的菊花茶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">菊花茶</h3>
                                <p class="option-caption">清肝明目，适合春季饮用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="goji-tea">
                            <div class="card-image">
                                <img src="images/goji-tea.jpg" alt="一杯红亮的枸杞茶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">枸杞茶</h3>
                                <p class="option-caption">滋补肝肾，温润养人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="red-date-longan-tea">
                            <div class="card-image">
                                <img src="images/red-date-longan-tea.jpg" alt="一杯甜香的红枣桂圆茶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红枣桂圆茶</h3>
                                <p class="option-caption">补气养血，暖心暖胃</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="green-tea">
                            <div class="card-image">
                                <img src="images/green-tea.jpg" alt="一杯碧绿的绿茶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">绿茶</h3>
                                <p class="option-caption">清香解腻，提神醒脑</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
