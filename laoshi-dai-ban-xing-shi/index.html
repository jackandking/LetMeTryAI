    <title>老师这样带班，孩子会更愿学吗？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老师这样带班，孩子会更愿学吗？哪种做法你更认同</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">老师这样带班，孩子会更愿学吗？你更赞同哪种做法？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="encourage-small-goals">
                            <div class="card-image">
                                <img src="images/encourage-small-goals.svg" alt="老师鼓励孩子完成小目标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">鼓励与小目标</h3>
                                <p class="option-desc">常夸进步、分解任务，让孩子敢尝试、少畏难</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fun-interactive-lessons">
                            <div class="card-image">
                                <img src="images/fun-interactive-lessons.svg" alt="趣味互动课堂场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">趣味互动教学</h3>
                                <p class="option-desc">把知识融入游戏和故事，课堂更有趣、注意力更集中</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="strict-discipline">
                            <div class="card-image">
                                <img src="images/strict-discipline.svg" alt="严格管理的课堂秩序" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">严格管理型</h3>
                                <p class="option-desc">规则明确、节奏紧凑，学习效率高但压力可能更大</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="individual-support">
                            <div class="card-image">
                                <img src="images/individual-support.svg" alt="老师一对一关注学生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">个别关注与陪伴</h3>
                                <p class="option-desc">老师耐心辅导、关注差异，建立信任感促进长期学习动机</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
