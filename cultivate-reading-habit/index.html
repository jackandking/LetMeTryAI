    <title>家长话题：如何培养孩子的阅读习惯</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：如何培养孩子的阅读习惯</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：培养孩子的阅读习惯的方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="daily-parent-child-reading">
                            <div class="card-image">
                                <img src="images/daily-parent-child-reading.svg" alt="每日亲子共读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每日亲子共读15分钟</h3>
                                <p class="option-desc">每天固定短时共读，强化陪伴与示范</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="reading-corner-fixed-time">
                            <div class="card-image">
                                <img src="images/reading-corner-fixed-time.svg" alt="家庭阅读角" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定阅读角+固定时间</h3>
                                <p class="option-desc">打造书角并设固定阅读时段，形成环境提示</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="interest-booklist-rewards">
                            <div class="card-image">
                                <img src="images/interest-booklist-rewards.svg" alt="兴趣书单与奖励" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣书单+小奖励</h3>
                                <p class="option-desc">按兴趣推荐书单，达标给小奖励提高动力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
