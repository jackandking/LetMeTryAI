    <title>电影 vs 网剧：你的观影偏好投票</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">电影和网剧你更喜欢哪个观影方式？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">空闲时间你倾向选择看电影还是追网剧？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="watch-movie">
                            <div class="card-image">
                                <img src="images/watch-movie.svg" alt="电影院观影场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">去电影院看电影</h3>
                                <p class="option-caption">大银幕沉浸式体验</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watch-series">
                            <div class="card-image">
                                <img src="images/watch-series.svg" alt="沙发追剧场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">在家追网剧</h3>
                                <p class="option-caption">分集连看享受剧情</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="both-movie-and-series">
                            <div class="card-image">
                                <img src="images/both-movie-and-series.svg" alt="电影与剧集混合图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电影和网剧都喜欢</h3>
                                <p class="option-caption">看心情切换方式</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="rarely-watch">
                            <div class="card-image">
                                <img src="images/rarely-watch.svg" alt="不常看影视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">很少看影视内容</h3>
                                <p class="option-caption">更偏向其他休闲方式</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    </script>
</body>
</html>
