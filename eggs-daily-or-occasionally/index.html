    <title>天天吃鸡蛋还是偶尔吃，你会怎么选？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">天天吃鸡蛋还是偶尔吃，你会怎么选？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">天天吃鸡蛋还是偶尔吃，你会怎么选？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-everyday">
                            <div class="card-image">
                                <img src="images/eat-everyday.svg" alt="每天吃鸡蛋的早餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">天天吃</h3>
                                <p class="option-desc">早餐必备，一天从鸡蛋开始，元气感满满</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-occasionally">
                            <div class="card-image">
                                <img src="images/eat-occasionally.svg" alt="偶尔吃鸡蛋的轻食搭配" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">偶尔吃</h3>
                                <p class="option-desc">视情况搭配，喜欢换着吃，追求均衡感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="rarely-eat">
                            <div class="card-image">
                                <img src="images/rarely-eat.svg" alt="用植物蛋白替代鸡蛋的餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">很少吃/替代</h3>
                                <p class="option-desc">不常吃或用植物蛋白/其他替代，讲究 variety</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>

        </main>

        <footer class="page-footer">
