<head>

    <title>轻松带孩子逛河南博物院</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">轻松带孩子逛河南博物院</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你带孩子逛河南博物院，更倾向于哪种方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="pre-study">
                            <div class="card-image">
                                <img src="images/pre-study.svg" alt="提前做功课参观博物院" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">提前做功课</h3>
                                <p class="option-caption">去之前和孩子一起看纪录片、读绘本，了解镇馆之宝，参观时更有目标感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="treasure-hunt">
                            <div class="card-image">
                                <img src="images/treasure-hunt.svg" alt="寻宝打卡参观博物院" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">寻宝打卡</h3>
                                <p class="option-caption">把参观变成寻宝游戏，给孩子一张文物清单，边找边盖章，玩中学习不枯燥。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="guided-tour">
                            <div class="card-image">
                                <img src="images/guided-tour.svg" alt="听讲解跟随参观博物院" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">听讲解跟随</h3>
                                <p class="option-caption">请讲解员或租语音导览，让孩子听故事学历史，系统了解展品背后的文化。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="free-explore">
                            <div class="card-image">
                                <img src="images/free-explore.svg" alt="自由探索参观博物院" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自由探索</h3>
                                <p class="option-caption">不设固定路线，让孩子自己挑选感兴趣的展厅，保持好奇心和轻松节奏。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
