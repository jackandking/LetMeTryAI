<head>

    <title>爸妈看手机提醒哪个更顺眼？4种常见提醒样式，一眼看懂</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爸妈看手机提醒哪个更顺眼？哪种样式更亲切好看</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">爸妈看手机提醒哪个更顺眼？选出你觉得最亲切的样式。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="red-dot-with-count">
                            <div class="card-image">
                                <img src="images/red-dot-with-count.svg" alt="红点带数字提醒图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红点带数字</h3>
                                <p class="option-desc">屏幕角落红点加数字，一目了然知道有多少未读</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="plain-red-dot">
                            <div class="card-image">
                                <img src="images/plain-red-dot.svg" alt="纯红点徽章图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">纯红点徽章</h3>
                                <p class="option-desc">只有小红点，不显示数字，视觉干扰更少</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="banner-text">
                            <div class="card-image">
                                <img src="images/banner-text.svg" alt="横幅文字提醒图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">横幅文字提醒</h3>
                                <p class="option-desc">屏幕中间短横幅，搭配大字说明和来源，更直观易读</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="voice-plus-icon">
                            <div class="card-image">
                                <img src="images/voice-plus-icon.svg" alt="语音加图标提醒图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">语音+图标提醒</h3>
                                <p class="option-desc">配合熟悉的语音提示和图标，听觉优先、对视力不便更友好</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
