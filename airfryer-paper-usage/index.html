    <title>家里还用空气炸锅纸吗？长辈厨房的实用做法与注意点</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里还用空气炸锅纸吗？实测用法和坑揭秘</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你家还用空气炸锅纸吗？哪种做法更像你家的习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="always-use-paper">
                            <div class="card-image">
                                <img src="images/always-use-paper.svg" alt="空气炸锅内铺着炸锅纸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一直铺纸</h3>
                                <p class="option-desc">每次都铺纸，炸完取出少刷洗，省事但要注意透气</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-paper-spray">
                            <div class="card-image">
                                <img src="images/no-paper-spray.svg" alt="在空气炸锅内喷油避免粘连" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不用纸，喷油或刷油</h3>
                                <p class="option-desc">不铺纸，薄喷油或刷油防粘，更节省且少耗材</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="use-for-sticky-foods">
                            <div class="card-image">
                                <img src="images/use-for-sticky-foods.svg" alt="鱼或带酱食材放在炸篮上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只在易黏食材时用</h3>
                                <p class="option-desc">只有做鱼或带浓酱的肉类时才铺纸，兼顾清洁与效果</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="use-silicone-mat">
                            <div class="card-image">
                                <img src="images/use-silicone-mat.svg" alt="硅胶垫放在空气炸锅篮中" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">换用硅胶垫重复使用</h3>
                                <p class="option-desc">用可重复清洗的硅胶垫，长期省钱且耐用（需注意清洗）</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
