            <form id="questionnaire">

                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="captain-sitting-alone">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">队长孤坐场边</h3>
                                <p class="option-desc">队长独自坐在场边，低头沉思的那一刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fans-applauding">
                            <div class="card-image">
                                <img src="images/fans-applauding.svg" alt="看台球迷为球队鼓掌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">球迷久久鼓掌</h3>
                                <p class="option-desc">赛后看台上球迷仍站起为球队鼓掌</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="opponent-celebration">

                            <div class="card-content">
                                <h3 class="option-title">对方庆祝瞬间</h3>
                                <p class="option-desc">日本球员拥抱庆祝进球的高光瞬间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bench-comfort">
                            <div class="card-image">
                                <img src="images/bench-comfort.svg" alt="替补席上安慰队友的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">替补席互相安慰</h3>
                                <p class="option-desc">替补队员上前搀扶、安慰落寞的队友</p>
