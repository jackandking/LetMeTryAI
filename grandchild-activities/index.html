    <title>和孙辈的快乐时光：你最喜欢做什么？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">和孙辈的快乐时光：你最喜欢做什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个选项：和孙辈在一起最让你开心的事是什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="making-handicrafts">
                            <div class="card-image">
                                <img src="images/making-handicrafts.svg" alt="祖孙一起做手工插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">做手工/画画</h3>
                                <p class="option-desc">一起动手，培养感情与耐心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="telling-stories">
                            <div class="card-image">
                                <img src="images/telling-stories.svg" alt="祖父母给孙辈讲故事插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲故事/读书</h3>
                                <p class="option-desc">传承记忆，增进交流</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="cooking-together">
                            <div class="card-image">
                                <img src="images/cooking-together.svg" alt="祖孙一起包饺子插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一起做饭/包饺子</h3>
                                <p class="option-desc">美味又温馨的家庭时刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="outing-walk">
                            <div class="card-image">
                                <img src="images/outing-walk.svg" alt="祖孙郊游散步插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">带出去散步/郊游</h3>
                                <p class="option-desc">走出家门，享受阳光与运动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
