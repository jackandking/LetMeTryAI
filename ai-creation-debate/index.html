<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="baidu_union_verify" content="a474889f17de23d877149d511beb790d">

    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();

    <title>AI 创作与人工原创：你怎么看？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">AI 创作与人工原创态度调查</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在内容创作中，你更倾向于哪种方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="support-ai-assisted">
                            <div class="card-image">
                                <img src="images/support-ai-assisted.svg" alt="支持AI辅助创作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">支持 AI 辅助创作</h3>
                                <p class="option-desc">AI 帮忙但保留人工把关</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prefer-human-original">
                            <div class="card-image">
                                <img src="images/prefer-human-original.svg" alt="更偏好人工原创" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">更偏好人工原创</h3>
                                <p class="option-desc">更看重作者原创性与个人风格</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="case-by-case">
                            <div class="card-image">
                                <img src="images/case-by-case.svg" alt="看情境决定" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看情境决定</h3>
                                <p class="option-desc">视项目类型和用途决定是否使用 AI</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    <script>

                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
