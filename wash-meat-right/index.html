    <title>洗生肉这件小事，你家做对了吗？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">洗生肉这件小事，你家做对了吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">洗生肉这件小事，你家做对了吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="faucet-rinse">
                            <div class="card-image">
                                <img src="images/faucet-rinse.svg" alt="水龙头下冲洗生肉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水龙头直冲</h3>
                                <p class="option-caption">习惯了开着水龙头直接冲，觉得水流带走杂质更干净。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bowl-soak">
                            <div class="card-image">
                                <img src="images/bowl-soak.svg" alt="盆里浸泡清洗生肉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">盆里浸泡洗</h3>
                                <p class="option-caption">把肉放进盆里接水浸泡、轻轻搓洗，避免水花四溅。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="paper-wipe">
                            <div class="card-image">
                                <img src="images/paper-wipe.svg" alt="用厨房纸擦拭生肉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厨房纸擦拭</h3>
                                <p class="option-caption">不水洗，直接用厨房纸吸干表面血水，减少细菌交叉污染。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cook-directly">
                            <div class="card-image">
                                <img src="images/cook-directly.svg" alt="生肉不清洗直接烹饪" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不洗直接烹饪</h3>
                                <p class="option-caption">买回来不洗，直接下锅焯水或高温烹熟，认为加热足以杀菌。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
