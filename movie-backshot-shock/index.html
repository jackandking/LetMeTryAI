    <title>背影杀观察：谁的镜头更惊艳</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这位演员的背影更让你惊艳?</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看预告或海报，谁的背影让你更记住这部片/这位演员？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="young-charm-backshot">
                            <div class="card-image">
                                <img src="images/young-charm-backshot.svg" alt="少年感背影海报风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">少年感背影</h3>
                                <p class="option-desc">清新少年感，镜头有故事感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mature-hero-backshot">
                            <div class="card-image">
                                <img src="images/mature-hero-backshot.svg" alt="成熟硬汉背影的电影海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">成熟硬汉背影</h3>
                                <p class="option-desc">沉稳硬朗的镜头语言</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="contrast-smile-backshot">
                            <div class="card-image">
                                <img src="images/contrast-smile-backshot.svg" alt="带反差笑容的背影镜头" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">反差笑容背影</h3>
                                <p class="option-desc">背影带笑，反差吸睛</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
