    <title>孩子在博物馆会被哪些画面惊到？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">博物馆里，什么场景会让孩子蹦出“哇”？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">博物馆里，什么场景会让孩子蹦出“哇”？选出你家孩子最可能当场惊叹的那个画面：</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dinosaur-skeleton">
                            <div class="card-image">
                                <img src="images/dinosaur-skeleton.svg" alt="孩子在恐龙骨架前惊叹" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">恐龙骨架</h3>
                                <p class="option-desc">站在高大的恐龙骨架下，孩子仰头看到长长的脊背和巨型颅骨，天然产生敬畏感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="interactive-light-installation">
                            <div class="card-image">
                                <img src="images/interactive-light-installation.svg" alt="孩子与互动光影装置互动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">互动光影装置</h3>
                                <p class="option-desc">踏上感应地面或挥手就能触发光影与音效变化，瞬间把孩子吸引得手舞足蹈。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hands-on-dig">
                            <div class="card-image">
                                <img src="images/hands-on-dig.svg" alt="孩子在沙盘考古体验发现化石" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动手考古体验</h3>
                                <p class="option-desc">拿起小铲子和刷子亲手发掘“化石”，发现瞬间的惊喜和成就感最直观。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="life-size-diorama">
                            <div class="card-image">
                                <img src="images/life-size-diorama.svg" alt="孩子在现场复原场景里好奇张望" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">生活场景复原</h3>
                                <p class="option-desc">走进古人家屋或历史市集的实景复原，栩栩如生的场面让孩子像穿越回过去。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

            </div>
        </footer>
