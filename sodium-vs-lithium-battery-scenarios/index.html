    <title>钠离子 vs 锂电：应用场景投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">钠离子电池与锂电池，你更看好哪种应用场景？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">钠离子电池与锂电池，你更看好哪种应用场景？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sodium-grid-storage">
                            <div class="card-image">
                                <img src="images/sodium-grid-storage.svg" alt="钠离子电池用于电网储能示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">钠离子：电网储能/固定储能</h3>
                                <p class="option-desc">适合大规模储能与电网调峰，成本优势明显。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sodium-economy-ev">
                            <div class="card-image">
                                <img src="images/sodium-economy-ev.svg" alt="钠离子电池小型电动车示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">钠离子：低成本城市代步电动车</h3>
                                <p class="option-desc">面向入门级电动车与短途通勤，成本与安全具吸引力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lithium-mobile-devices">
                            <div class="card-image">
                                <img src="images/lithium-mobile-devices.svg" alt="锂电池在手机与笔记本中的应用示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">锂电：高性能手机与便携数码</h3>
                                <p class="option-desc">高能量密度适配手机、笔记本等便携设备，体积轻、续航优先。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lithium-high-performance-ev">
                            <div class="card-image">
                                <img src="images/lithium-high-performance-ev.svg" alt="锂电高性能电动车示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">锂电：高续航电动车与高功率场景</h3>
                                <p class="option-desc">适配中高端电动车与高功率需求场景，能量密度与充放电性能优秀。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

            </div>
        </footer>
