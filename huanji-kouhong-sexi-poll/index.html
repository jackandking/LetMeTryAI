    <title>换季口红色系偏好投票：你换季更爱哪个色？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">换季口红色系偏好投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季时你偏好哪类口红色系？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="nude-pink-warm-brown">
                            <div class="card-image">
                                <img src="images/nude-pink-warm-brown.svg" alt="裸粉暖棕色口红样式" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">裸粉暖棕</h3>
                                <p class="option-caption">自然温柔，日常与职场都好搭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="classic-red">
                            <div class="card-image">
                                <img src="images/classic-red.svg" alt="经典正红口红样式" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">经典正红</h3>
                                <p class="option-caption">提气色、利落有气场的安全选择</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="plum-purple">
                            <div class="card-image">
                                <img src="images/plum-purple.svg" alt="梅子紫色口红样式" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">梅子紫调</h3>
                                <p class="option-caption">低调有个性，适合秋冬与夜间活动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="coral-orange">
                            <div class="card-image">
                                <img src="images/coral-orange.svg" alt="珊瑚橘色口红样式" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">珊瑚橘</h3>
                                <p class="option-caption">活力明亮，衬肤色又显年轻感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
