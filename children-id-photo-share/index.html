<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";

    <title>孩子证件照分享投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子证件照如何安全分享：亲友、学校与社交场景的选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在兼顾隐私与便利的前提下，你更倾向采用哪种方式分享孩子的证件照？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-in-person">
                            <div class="card-image">
                                <img src="images/share-in-person.svg" alt="家长与亲友面对面交换证件照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">线下当面或打印交付</h3>
                                <p class="option-desc">当面出示或交付打印件，避免网络传播和长期存留</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-private-link">
                            <div class="card-image">
                                <img src="images/share-private-link.svg" alt="手机显示受保护的私密链接界面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">使用加密私有链接分享</h3>
                                <p class="option-desc">通过受限访问的私密链接并设密码/有效期，便于远程安全传送</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-anonymized">
                            <div class="card-image">
                                <img src="images/share-anonymized.svg" alt="证件照局部模糊处理示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">去识别化后再上传或发送</h3>
                                <p class="option-desc">裁剪或模糊姓名、证件号等敏感信息，降低被滥用风险</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-school-only">
                            <div class="card-image">
                                <img src="images/share-school-only.svg" alt="学校官方上传表单界面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只通过学校或官方渠道提交</h3>
                                <p class="option-desc">仅使用学校/政府指定入口上传，保留访问记录与权限控制</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
