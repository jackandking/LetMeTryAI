    <title>遇到那只刷屏小猫，拍照你会怎么摆？哪种姿势更上镜</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到那只刷屏小猫，拍照你会怎么摆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到那只刷屏小猫，拍照你会怎么摆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="kneel-close">
                            <div class="card-image">
                                <img src="images/kneel-close.svg" alt="蹲下与小猫同框的近景照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">靠近蹲拍</h3>
                                <p class="option-desc">蹲下与猫同高度，近距离捕捉萌脸与眼神，亲密感满分。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="top-down">
                            <div class="card-image">
                                <img src="images/top-down.svg" alt="从上方俯拍小猫萌脸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">俯拍萌脸</h3>
                                <p class="option-desc">把手机举高俯拍，突出圆圆脑袋和小耳朵，萌感十足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="backwide">
                            <div class="card-image">
                                <img src="images/backwide.svg" alt="远景背影与小猫互动的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">背影远景</h3>
                                <p class="option-desc">保持距离拍背影或环境感，画面有故事感与层次。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="reach-touch">
                            <div class="card-image">
                                <img src="images/reach-touch.svg" alt="伸手与小猫互动的瞬间特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">伸手互动</h3>
                                <p class="option-desc">伸手轻抚或握手，捕捉互动瞬间的温度与表情变化。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>

            </div>
