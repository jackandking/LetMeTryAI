    <title>你家的月饼记忆是哪一种？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你家的月饼记忆是哪一种？哪种味道把你带回童年？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你家的月饼记忆是哪一种？选一个最像你家节日场景的答案。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-handmade-mooncakes">
                            <div class="card-image">
                                <img src="images/home-handmade-mooncakes.svg" alt="手工月饼在木桌上切开散发馅料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家里手工月饼</h3>
                                <p class="option-desc">奶奶或父母在厨房手工制作，馅香皮软，整个家都飘着味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="store-gift-box">
                            <div class="card-image">
                                <img src="images/store-gift-box.svg" alt="封好的礼盒月饼摆放在餐桌上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精美礼盒月饼</h3>
                                <p class="option-desc">商店礼盒、漂亮包装，节日里当做正式的仪式感呈现。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="modern-creative-mooncakes">
                            <div class="card-image">
                                <img src="images/modern-creative-mooncakes.svg" alt="色彩鲜艳的创意月饼切面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">创意新口味月饼</h3>
                                <p class="option-desc">抹茶、芒果等新潮口味，和孩子一起尝新鲜、拍照分享。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mooncake-as-snack">
                            <div class="card-image">
                                <img src="images/mooncake-as-snack.svg" alt="随手掰开的月饼与茶杯近景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">随手当零食的月饼</h3>
                                <p class="option-desc">没太多仪式感，平时当零食随手掰一块就吃，常见且亲切。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>

        </footer>
