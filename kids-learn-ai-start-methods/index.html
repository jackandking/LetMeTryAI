    <title>孩子要不要学AI？哪种起步方式更靠谱？家长视角</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子要不要学AI？哪种起步方式更靠谱？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子要不要学AI？哪种起步方式你更倾向在家里先试试？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="block-based-programming">
                            <div class="card-image">
                                <img src="images/block-based-programming.svg" alt="孩子在平板上拼积木式编程界面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">图形化编程入门</h3>
                                <p class="option-desc">用积木式编程或可视化工具（像Scratch）从逻辑和界面搭建起手，适合低龄孩子和亲子陪玩。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chatgpt-and-prompting">
                            <div class="card-image">
                                <img src="images/chatgpt-and-prompting.svg" alt="孩子在电脑前与AI助手互动的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">跟工具学（ChatGPT/AI助手）</h3>
                                <p class="option-desc">从ChatGPT等工具开始学提问、找资料和写小脚本，低门槛、随时可练、注重表达与问题拆解能力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="robot-and-projects">
                            <div class="card-image">
                                <img src="images/robot-and-projects.svg" alt="孩子与可编程机器人做任务的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">项目驱动＋机器人玩具</h3>
                                <p class="option-desc">通过小机器人或可编程玩具做具体项目（赛道、遥控、任务），把抽象概念变成看得见的成果，增强动手和长期兴趣。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="math-and-logical-thinking">
                            <div class="card-image">
                                <img src="images/math-and-logical-thinking.svg" alt="孩子在做数学逻辑训练题的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">逻辑思维与数学基础</h3>
                                <p class="option-desc">先夯实逻辑、算法思维与基础数学（图形、序列、概率），为后续系统学习编程和AI概念打底。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

            <div class="more" id="more">

            </div>
        </footer>
