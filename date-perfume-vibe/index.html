    <title>约会你会选哪种香水调性？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">约会你会选哪种香水调性？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：约会你会选哪种香水调性？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="floral">
                            <div class="card-image">
                                <img src="images/floral.svg" alt="花香调" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花香调</h3>
                                <p class="option-desc">轻柔浪漫，适合温柔氛围的约会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="woody">
                            <div class="card-image">
                                <img src="images/woody.svg" alt="木质调" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木质调</h3>
                                <p class="option-desc">稳重有质感，适合成熟沉稳的氛围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="oriental">
                            <div class="card-image">
                                <img src="images/oriental.svg" alt="东方调" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">东方调</h3>
                                <p class="option-desc">暖性感带有神秘感，适合晚间约会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="fruity">
                            <div class="card-image">
                                <img src="images/fruity.svg" alt="果香调" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">果香调</h3>
                                <p class="option-desc">活泼清新，适合午后甜蜜约会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
