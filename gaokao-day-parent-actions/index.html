<head>

    <title>高考那天，你会做哪件事？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">高考那天，你会做哪件事？家长会怎么做</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">高考那天，你会做哪件事？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="accompany-child-to-exam">
                            <div class="card-image">
                                <img src="images/accompany-child-to-exam.svg" alt="家长陪孩子走进考场的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陪孩子走进考场</h3>
                                <p class="option-desc">亲自送到考场门口，给个拥抱或一句鼓励再离开</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-outside-exam">
                            <div class="card-image">
                                <img src="images/wait-outside-exam.svg" alt="家长在考点外耐心等候" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">在考点外等信息</h3>
                                <p class="option-desc">留在考点附近，等孩子考完再接回家或一起吃饭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stay-home-prepare-meal">
                            <div class="card-image">
                                <img src="images/stay-home-prepare-meal.svg" alt="家长在厨房准备营养餐的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">留在家里做饭准备</h3>
                                <p class="option-desc">在家准备营养餐、安静环境和备考小物，等考后汇报</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="send-encouraging-message">
                            <div class="card-image">
                                <img src="images/send-encouraging-message.svg" alt="用手机发送鼓励消息的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不打扰，发条鼓励消息</h3>
                                <p class="option-desc">只发短信或语音鼓励，避免临考前打扰，考后再详聊</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
