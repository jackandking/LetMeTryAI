<body>
    <h1 id="pageTitle">家长话题：孩子手机使用时间怎么管？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长视角，你会怎么选：孩子手机使用时间怎么管？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="fixed-daily-limit">
                    <img src="images/fixed-daily-limit.svg" alt="固定每日时长示意图" loading="lazy">
                    <span>每天设固定上限，便于量化与监督</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="time-slot-use">
                    <img src="images/time-slot-use.svg" alt="分时段使用示意图" loading="lazy">
                    <span>把使用时间分配到特定时段，更有规矩感</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="parent-co-use">
                    <img src="images/parent-co-use.svg" alt="家长陪同使用场景图" loading="lazy">
                    <span>与孩子一起使用，增加陪伴与引导</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="reward-based-time">
                    <img src="images/reward-based-time.svg" alt="奖励兑换示意图" loading="lazy">
                    <span>通过表现奖励额外使用时间，兼顾激励</span>
                </label>
            </div>
        </div>
    </form>
