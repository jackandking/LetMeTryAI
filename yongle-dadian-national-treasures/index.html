    <title>《永乐大典》回家了，你想带娃先看哪类国宝？</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">《永乐大典》回家了，你想带娃先看哪类国宝？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">《永乐大典》回家了，你想带娃先看哪类国宝？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bronze-treasures">
                            <div class="card-image">
                                <img src="images/bronze-treasures.svg" alt="博物馆青铜器展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜重器</h3>
                                <p class="option-desc">司母戊鼎、四羊方尊……带娃摸一摸历史的厚重感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="painting-calligraphy">
                            <div class="card-image">
                                <img src="images/painting-calligraphy.svg" alt="博物馆书画展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书画珍品</h3>
                                <p class="option-desc">《千里江山图》《兰亭序》……让孩子看见笔墨里的山河。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-books">
                            <div class="card-image">
                                <img src="images/ancient-books.svg" alt="博物馆古籍文献展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古籍档案</h3>
                                <p class="option-desc">从《永乐大典》到敦煌卷子，带娃翻翻古人写下的答案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gold-jade">
                            <div class="card-image">
                                <img src="images/gold-jade.svg" alt="博物馆金玉饰品展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">金玉华彩</h3>
                                <p class="option-desc">金缕玉衣、翡翠白菜……闪闪发光的国宝孩子一眼爱上。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
