    <title>哪张太空画面更燃？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪张太空画面更燃？红火星背光还是湛蓝星云？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪张太空画面更燃？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="red-planet-backlight">
                            <div class="card-image">
                                <img src="images/red-planet-backlight.svg" alt="红色行星背光，燃烧感强烈的太空画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红色行星背光</h3>
                                <p class="option-desc">赤红行星在背光下像燃烧的球体，画面热烈又有层次感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="blue-nebula-eruption">
                            <div class="card-image">
                                <img src="images/blue-nebula-eruption.svg" alt="湛蓝星云喷发，电光与云雾交错的太空景象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">湛蓝星云喷发</h3>
                                <p class="option-desc">深蓝与电光交织的星云，带来冷峻又震撼的视效</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="astronaut-earth-frame">
                            <div class="card-image">
                                <img src="images/astronaut-earth-frame.svg" alt="宇航员近景与地球同框，具有代入感的太空画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宇航员与地球同框</h3>
                                <p class="option-desc">近景宇航员与远方地球同框，情绪代入强，适合手机壁纸</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ship-lighttrail-warp">
                            <div class="card-image">
                                <img src="images/ship-lighttrail-warp.svg" alt="航天器穿越光带，动感十足的太空场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">光带穿梭航天器</h3>
                                <p class="option-desc">巨型航天器穿越光带，动态感强，视觉冲击力十足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
