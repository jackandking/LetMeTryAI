    <title>明星夜宵图鉴：哪个画面更有食欲？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪个明星的夜宵让你想吃？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看这些明星的夜宵图，你会选哪一种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="chicken-beer">
                            <div class="card-image">
                                <img src="images/chicken-beer.svg" alt="炸鸡与啤酒的夜宵画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">炸鸡啤酒组合</h3>
                                <p class="option-desc">酥脆炸鸡配冰啤酒，追剧配餐的放松感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="seafood-hotpot">
                            <div class="card-image">
                                <img src="images/seafood-hotpot.svg" alt="火锅与海鲜的夜宵画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">火锅涮海鲜</h3>
                                <p class="option-desc">热气腾腾的火锅配大块海鲜，热闹又下饭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-night-bento">
                            <div class="card-image">
                                <img src="images/late-night-bento.svg" alt="便当与冷面的夜宵画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">便当冷面简单吃</h3>
                                <p class="option-desc">简便便当或冷面，赶戏后随手一口的实用感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
