<head>

    <title>关注：最想参加的社区活动</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：最想参加的社区活动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持参加哪种社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="volunteer-service">
                            <div class="card-image">
                                <img src="images/volunteer-service.svg" alt="老人参与志愿服务活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">志愿服务</h3>
                                <p class="option-desc">参与社区志愿帮扶，助人为乐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="square-dance-fitness">
                            <div class="card-image">
                                <img src="images/square-dance-fitness.svg" alt="广场舞队伍在公园" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞/健身角</h3>
                                <p class="option-desc">一起跳舞或做简单健身，热闹又健康</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="hobby-club-calligraphy-crafts">
                            <div class="card-image">
                                <img src="images/hobby-club-calligraphy-crafts.svg" alt="老人书法和手工作品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣小组（书画/手工）</h3>
                                <p class="option-desc">书画或手工班，动手又交朋友</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="short-group-trips">
                            <div class="card-image">
                                <img src="images/short-group-trips.svg" alt="社区短途游巴士和笑脸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短途集体游</h3>
                                <p class="option-desc">社区组织一日或半日短途游，轻松出行</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
