<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子偷偷给游戏充值，你会先做什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子偷偷给游戏充值，你会先做什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="talk-calmly">
                            <div class="card-image">
                                <img src="images/talk-calmly.svg" alt="家长与孩子平静交谈了解原因" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷静沟通</h3>
                                <p class="option-desc">先稳定情绪，坐下来问问孩子为什么想充值</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="refund-first">
                            <div class="card-image">
                                <img src="images/refund-first.svg" alt="家长联系游戏平台申请退款" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">申请退款</h3>
                                <p class="option-desc">第一时间联系游戏平台客服，争取把这笔钱退回来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="restrict-device">
                            <div class="card-image">
                                <img src="images/restrict-device.svg" alt="家长制定手机使用规则" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">限制设备</h3>
                                <p class="option-desc">暂时没收手机或平板，重新约定游戏时间和规则</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-consequence">
                            <div class="card-image">
                                <img src="images/natural-consequence.svg" alt="孩子通过劳动弥补充值损失" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自己承担</h3>
                                <p class="option-desc">让孩子用做家务或扣零花钱的方式承担这次损失</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
