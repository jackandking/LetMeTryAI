    <title>天天吃鸡蛋还是偶尔吃？你早餐怎么安排</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">天天吃鸡蛋还是偶尔吃？你早餐怎么安排</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">天天吃鸡蛋还是偶尔吃？你早餐怎么安排</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-eggs-everyday">
                            <div class="card-image">
                                <img src="images/eat-eggs-everyday.svg" alt="每天吃鸡蛋的早餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每天都吃</h3>
                                <p class="option-desc">每天早餐一枚煎蛋或水煮蛋，简单稳定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="only-on-workdays">
                            <div class="card-image">
                                <img src="images/only-on-workdays.svg" alt="上班早餐鸡蛋便当" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">工作日固定吃</h3>
                                <p class="option-desc">上班日靠鸡蛋撑场，周末随性变换</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sometimes-with-others">
                            <div class="card-image">
                                <img src="images/sometimes-with-others.svg" alt="混合搭配的早餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">偶尔吃，搭配其他</h3>
                                <p class="option-desc">喜欢换着吃：蛋卷、麦片、粥轮流上</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-eggs-other">
                            <div class="card-image">
                                <img src="images/no-eggs-other.svg" alt="不含鸡蛋的早餐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不吃鸡蛋改别的</h3>
                                <p class="option-desc">选择粥/面包/奶昔等更轻便的替代品</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
