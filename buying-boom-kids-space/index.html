    <title>买房热：先改孩子的哪处空间更实用？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">买房热，你会先为孩子改哪一处家里空间？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">买房热，你会先为孩子改哪一处家里空间？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="child-bedroom">
                            <div class="card-image">
                                <img src="images/child-bedroom.svg" alt="温馨的儿童房一角，床与收纳柜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">独立儿童房</h3>
                                <p class="option-desc">给孩子一个独立房间，放下床、玩具和专属收纳，晚上更安稳。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="study-zone">
                            <div class="card-image">
                                <img src="images/study-zone.svg" alt="儿童书桌与书架的学习场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安静学习间</h3>
                                <p class="option-desc">把一间安静书房做成孩子的学习角，桌椅与书架为主，让学习更专注。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="living-room-activity-area">
                            <div class="card-image">
                                <img src="images/living-room-activity-area.svg" alt="家庭客厅的亲子活动场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">客厅活动区</h3>
                                <p class="option-desc">把客厅局部改成亲子活动区，铺柔软地垫，留玩耍与团聚空间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kitchen-family-hub">
                            <div class="card-image">
                                <img src="images/kitchen-family-hub.svg" alt="明亮的餐厨区域，家人围坐场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">餐厨陪伴角</h3>
                                <p class="option-desc">把厨房/餐厅改成家庭互动区，做饭带娃两不误，更利于日常陪伴。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
