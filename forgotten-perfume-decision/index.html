<head>

    <title>被忘的香水，你会怎么处理</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里有被忘好久的香水，你会怎么处理？留着当回忆还是改造再用？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里有被忘好久的香水，你会怎么处理？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="throw-away">
                            <div class="card-image">
                                <img src="images/throw-away.svg" alt="把香水放进垃圾桶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">直接丢掉</h3>
                                <p class="option-desc">过期或不喜欢就清掉，给柜子腾地方。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mix-and-use">
                            <div class="card-image">
                                <img src="images/mix-and-use.svg" alt="几瓶香水和身体乳摆在一起" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">留着偶尔兑用</h3>
                                <p class="option-desc">和身体乳或不同香型轻调混合，旧瓶也能继续用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gift-to-friend">
                            <div class="card-image">
                                <img src="images/gift-to-friend.svg" alt="递出礼物盒里的香水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">送给闺蜜/亲友</h3>
                                <p class="option-desc">把有故事的香水送人，分享回忆比丢掉更温暖。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="repurpose-diffuser">
                            <div class="card-image">
                                <img src="images/repurpose-diffuser.svg" alt="家中扩香瓶和香氛棒" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">改造成居家香氛</h3>
                                <p class="option-desc">做成喷雾或扩香液，让旧香味变成家居氛围。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
