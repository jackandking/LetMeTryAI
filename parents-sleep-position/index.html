    <title>爸妈睡哪种姿势你更放心？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爸妈睡哪种姿势你更放心？仰卧 / 侧卧 / 俯卧哪个画面更安心</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">爸妈睡哪种姿势你更放心？仰卧 / 侧卧 / 俯卧哪个画面更安心</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="yang-wo">
                            <div class="card-image">
                                <img src="images/yang-wo.svg" alt="老人平躺睡觉的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">仰卧</h3>
                                <p class="option-desc">平躺看天花板，整个人放松，画面让人觉得安稳又宁静。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ce-wo">
                            <div class="card-image">
                                <img src="images/ce-wo.svg" alt="老人侧卧睡姿侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">侧卧</h3>
                                <p class="option-desc">侧身睡更像熟睡状态，换位照护也更方便，画面亲切自然。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fu-wo">
                            <div class="card-image">
                                <img src="images/fu-wo.svg" alt="老人俯卧睡姿背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">俯卧</h3>
                                <p class="option-desc">趴着睡的画面更贴近放松，还是让人多看两眼更放心？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
