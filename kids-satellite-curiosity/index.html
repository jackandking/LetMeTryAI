    <title>孩子看到卫星发射会好奇什么？家长能和TA聊哪些内容</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子看到卫星发射会好奇什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子看到卫星发射会好奇什么？选出你家孩子会先问哪个</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="appearance-flight-principle">
                            <div class="card-image">
                                <img src="images/appearance-flight-principle.svg" alt="孩子看着升空的火箭好奇卫星长相" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">它长什么样、怎么飞起来</h3>
                                <p class="option-desc">孩子关注外形、颜色和飞行方式，想象卫星像玩具或飞船。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="purpose-and-use">
                            <div class="card-image">
                                <img src="images/purpose-and-use.svg" alt="孩子问卫星的用途" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">卫星是做什么用的</h3>
                                <p class="option-desc">孩子想知道发射的目的：天气、导航还是拍照？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="earth-impact">
                            <div class="card-image">
                                <img src="images/earth-impact.svg" alt="孩子担心卫星是否影响生活" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会不会影响地球上的生活</h3>
                                <p class="option-desc">孩子好奇发射后会不会看到变化，或会不会影响信号和天气。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="humans-and-exploration">
                            <div class="card-image">
                                <img src="images/humans-and-exploration.svg" alt="孩子幻想太空人和探险故事" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">和太空、宇航员有关的故事</h3>
                                <p class="option-desc">孩子联想到太空人、探险和科幻故事，想听冒险情节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
