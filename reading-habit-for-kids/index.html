    <title>哪种方法最能帮孩子养成阅读习惯？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种方法最能帮孩子养成阅读习惯？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：如何培养孩子的阅读习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="parent-child-daily-reading">
                            <div class="card-image">
                                <img src="images/parent-child-daily-reading.svg" alt="父母和孩子一起读书" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亲子共读每日例行</h3>
                                <p class="option-desc">固定时间亲子共读，每天短时间坚持</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="home-reading-corner">
                            <div class="card-image">
                                <img src="images/home-reading-corner.svg" alt="家庭读书角布置图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭读书角+自由选书</h3>
                                <p class="option-desc">打造舒适读书角，让孩子自由挑选兴趣书</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="reading-reward-chart">
                            <div class="card-image">
                                <img src="images/reading-reward-chart.svg" alt="阅读奖励表示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">阅读奖励表/小目标</h3>
                                <p class="option-desc">用打卡或奖励表激励短期阅读习惯形成</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="library-borrowing-routine">
                            <div class="card-image">
                                <img src="images/library-borrowing-routine.svg" alt="图书馆亲子活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">借阅+亲子图书馆行程</h3>
                                <p class="option-desc">定期去图书馆或借书，培养阅读节奏与选择力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
