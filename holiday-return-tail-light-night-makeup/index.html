                            </div>
                            <div class="card-content">

                            </div>

                            <div class="card-content">
                                <h3 class="option-title">烟熏魅眼</h3>

                            <div class="card-content">

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="luozhuang-nuangguang">
                            <div class="card-image">
                                <img src="images/luozhuang-nuangguang.svg" alt="暖光裸妆在夜间场景" loading="lazy">
