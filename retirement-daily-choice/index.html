<body>
    <h1 id="pageTitle">爱老人关注：退休后你最想坚持的日常</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果是爱老人用户，你最支持哪个选项：退休后你最想坚持的日常？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="learn-painting">
                    <img src="images/learn-painting.svg" alt="老人学画画" loading="lazy">
                    <span>拿起画笔，慢慢享受创作时光</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="short-trip-travel">
                    <img src="images/short-trip-travel.svg" alt="短途旅行" loading="lazy">
                    <span>和老友或家人周边走走看看</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="gardening">
                    <img src="images/gardening.svg" alt="种花养草" loading="lazy">
                    <span>阳台或小院种植，让生活更有仪式感</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="neighborhood-social">
                    <img src="images/neighborhood-social.svg" alt="社区活动" loading="lazy">
                    <span>参加社区活动，结识新朋友、丰富社交</span>
                </label>
            </div>
        </div>
    </form>
