<head>
    <meta charset="UTF-8">

    <title>家庭电话与信息安全守则投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家庭电话与信息安全规则投票：家长守则选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在家庭中，你支持以下哪种家庭电话与信息安全规则？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="confirm-caller-before-answer">
                            <div class="card-image">
                                <img src="images/confirm-caller-before-answer.svg" alt="确认来电者身份" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">接听前确认身份</h3>
                                <p class="option-desc">先问是谁与目的，确认后再接听或回拨。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="text-first-ignore-call">
                            <div class="card-image">
                                <img src="images/text-first-ignore-call.svg" alt="先发短信确认" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">遇陌生先发信息不接听</h3>
                                <p class="option-desc">不直接接陌生来电，先发短信或信息确认身份与目的再处理。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-emergency-contacts">
                            <div class="card-image">
                                <img src="images/share-emergency-contacts.svg" alt="共享紧急联系人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">共享紧急联系人名单</h3>
                                <p class="option-desc">家庭成员共享并定期更新紧急联系人与应急流程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="keep-call-content-private">
                            <div class="card-image">
                                <img src="images/keep-call-content-private.svg" alt="通话内容仅家庭内部使用" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">通话内容仅家庭内部讨论</h3>
                                <p class="option-desc">通话要点仅在家人间讨论，不随意录音或外传。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

        })();
    </script>
</body>
</html>
