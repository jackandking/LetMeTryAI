<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">张雪机车赛场上的飒爽造型，你被哪一面吸引？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">张雪机车赛场上的飒爽造型，你被哪一面吸引？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="leather-rider-style">
                            <div class="card-image">
                                <img src="images/leather-rider-style.svg" alt="张雪皮衣骑士造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">皮衣骑士风</h3>
                                <p class="option-desc">紧身皮衣+长靴，赛道上的酷飒骑士</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sunglasses-cool-style">
                            <div class="card-image">
                                <img src="images/sunglasses-cool-style.svg" alt="张雪墨镜冷艳造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">墨镜冷艳风</h3>
                                <p class="option-desc">黑超遮面气场全开，冷艳女王既视感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="full-helmet-style">
                            <div class="card-image">
                                <img src="images/full-helmet-style.svg" alt="张雪头盔全盔造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">头盔全盔风</h3>
                                <p class="option-desc">全盔一戴神秘感十足，像从漫画里走出来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="track-heroine-style">
                            <div class="card-image">
                                <img src="images/track-heroine-style.svg" alt="张雪赛道巾帼造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">赛道巾帼风</h3>
                                <p class="option-desc">谁说赛车场只有男生帅？飒爽身影圈粉无数</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

                <div class="loading-state">
