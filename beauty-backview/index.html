    <title>哪种背影最容易回头看？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种女神背影会让你多看一眼？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到这样的背影，你会回头看哪一种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="flowing-dress">
                            <div class="card-image">
                                <img src="images/flowing-dress.svg" alt="长裙随风飘逸的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">长裙飘逸</h3>
                                <p class="option-desc">长裙随风，步伐轻盈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="casual-tee-jeans">
                            <div class="card-image">
                                <img src="images/casual-tee-jeans.svg" alt="简约T恤配牛仔的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">简约T恤牛仔</h3>
                                <p class="option-desc">清爽随性，日常却好看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sporty-vibe">
                            <div class="card-image">
                                <img src="images/sporty-vibe.svg" alt="运动装的动感背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">运动风活力</h3>
                                <p class="option-desc">跑步或球场的动感背影</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
