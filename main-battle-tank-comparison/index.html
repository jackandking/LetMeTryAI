<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="fighter" content="width=device-width, initial-scale=1.0">
    <meta name="baidu_union_verify" content="a474889f17de23d877149d511beb790d">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();

    <title>主战坦克机动/防护/火力对比投票页</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">主战坦克对比：机动性、防护与火力</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在机动性、防护和火力的综合表现上，你更看好哪款主战坦克？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="m1a2-abrams">
                            <div class="card-image">
                                <img src="images/m1a2-abrams.svg" alt="M1A2 Abrams 坦克侧面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">M1A2 Abrams</h3>
                                <p class="option-caption">美制重型设计，动力与防护兼顾</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="t-90m">
                            <div class="card-image">
                                <img src="images/t-90m.svg" alt="T-90M 坦克照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">T-90M</h3>
                                <p class="option-caption">俄系设计，机动性与火控现代化提升</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="type-99">
                            <div class="card-image">
                                <img src="images/type-99.svg" alt="Type 99 坦克图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Type 99</h3>
                                <p class="option-caption">国产改进型，兼顾本土战场需求与综合性能</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('debug') === 'true') {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
