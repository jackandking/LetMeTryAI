        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子的零花钱你会怎么存？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cash-jar">
                            <div class="card-image">
                                <img src="images/cash-jar.svg" alt="孩子把钱放进罐子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">现金罐子</h3>
                                <p class="option-desc">把零花放进透明罐，硬币可见，能直观看到存钱进度。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bank-card">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">银行卡/储蓄卡</h3>
                                <p class="option-desc">开孩子名下卡或子账户，学会用银行账户管理零花钱。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="parent-managed-pocket">
                            <div class="card-image">
                                <img src="images/parent-managed-pocket.svg" alt="家长用手机发放零花钱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家长管理的奖励账户</h3>
                                <p class="option-desc">家长通过APP或记账发放奖励，完成任务或达到目标才发放，便于引导规划。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
