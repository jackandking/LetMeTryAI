    <title>家长话题：护眼台灯怎么选，哪种更适合孩子？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：护眼台灯怎么选，哪种更适合孩子？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：护眼台灯哪种更适合孩子？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="adjustable-color-temp">
                            <div class="card-image">
                                <img src="images/adjustable-color-temp.svg" alt="色温可调台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">色温可调＋无频闪（多场景）</h3>
                                <p class="option-desc">亮度与色温可调，适应阅读与写作等不同场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="high-cri-uniform">
                            <div class="card-image">
                                <img src="images/high-cri-uniform.svg" alt="高显色台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高显色＋均匀发光（护眼优先）</h3>
                                <p class="option-desc">显色好、光线均匀，减少眩光和影子对阅读的影响</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="basic-durable">
                            <div class="card-image">
                                <img src="images/basic-durable.svg" alt="经济款台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">简约耐用＋经济款（入门推荐）</h3>
                                <p class="option-desc">结构简单、价格实惠，满足日常照明需求且耐用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="combo-reading-light">
                            <div class="card-image">
                                <img src="images/combo-reading-light.svg" alt="组合照明台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">组合式（主灯＋阅读夹灯）</h3>
                                <p class="option-desc">主灯＋可调夹灯组合，可分区照明更灵活</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
