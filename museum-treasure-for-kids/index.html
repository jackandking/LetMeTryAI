    <title>带孩子看馆藏：博物馆里哪个文物的故事会让孩子眼睛亮？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">博物馆里哪个文物的故事会让孩子眼睛亮？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">博物馆里哪个文物的故事会让孩子眼睛亮？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mysterious-bronze-mask">
                            <div class="card-image">
                                <img src="images/mysterious-bronze-mask.svg" alt="青铜面具特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">神秘青铜面具</h3>
                                <p class="option-desc">古老的青铜面具上刻着奇怪纹路，像不像隐藏着一段考古谜团？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="talking-clay-figurine">
                            <div class="card-image">
                                <img src="images/talking-clay-figurine.svg" alt="彩绘陶俑侧面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会说话的彩绘陶俑</h3>
                                <p class="option-desc">彩绘陶俑身上有小人物的日常场景，像一幅会动的古代漫画。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="terracotta-warrior-secret">
                            <div class="card-image">
                                <img src="images/terracotta-warrior-secret.svg" alt="兵马俑侧影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">整齐列队的兵马俑</h3>
                                <p class="option-desc">一排排兵马俑像守护队伍，孩子会想象它们夜里会不会走动。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-bell-that-sings">
                            <div class="card-image">
                                <img src="images/ancient-bell-that-sings.svg" alt="古代编钟特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会发声的古代编钟</h3>
                                <p class="option-desc">敲一下古钟，想象不同声音像故事的节拍，孩子会被古代科技惊艳到。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
