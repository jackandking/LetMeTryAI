    <title>关注：晚上你会尝试哪种助眠小习惯？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：晚上你会尝试哪种助眠小习惯？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个选项：晚上你会尝试哪种助眠小习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="warm-milk">
                            <div class="card-image">
                                <img src="images/warm-milk.svg" alt="温牛奶杯子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝一杯温牛奶</h3>
                                <p class="option-desc">睡前喝少量温牛奶，温暖又舒缓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="listen-music">
                            <div class="card-image">
                                <img src="images/listen-music.svg" alt="听轻音乐的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">听轻音乐或电台</h3>
                                <p class="option-desc">用柔和声音帮助放松入睡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="foot-bath">
                            <div class="card-image">
                                <img src="images/foot-bath.svg" alt="泡脚盆和毛巾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温水泡脚</h3>
                                <p class="option-desc">泡脚放松、促进夜间舒缓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="stretching-breathing">
                            <div class="card-image">
                                <img src="images/stretching-breathing.svg" alt="伸展与深呼吸动作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">简单伸展与深呼吸</h3>
                                <p class="option-desc">轻缓伸展加呼吸练习，平稳心情</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
