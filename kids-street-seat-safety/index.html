    <title>孩子上街坐哪种儿童座驾更安心？家长实用对比</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子上街坐哪种儿童座驾更安心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子上街坐哪种儿童座驾更让你放心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="five-point-stroller">
                            <div class="card-image">
                                <img src="images/five-point-stroller.svg" alt="五点式安全带推车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">带五点安全带的推车</h3>
                                <p class="option-desc">适合短途逛街，坐姿稳固，家长可近距离看护并随时停靠。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bike-mounted-seat">
                            <div class="card-image">
                                <img src="images/bike-mounted-seat.svg" alt="成人自行车儿童座椅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安装在成人车上的儿童座椅</h3>
                                <p class="option-desc">骑行同步移动省力，安装要稳固并配合头盔与防护措施。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bike-trailer">
                            <div class="card-image">
                                <img src="images/bike-trailer.svg" alt="自行车拖挂式儿童车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自行车拖挂式儿童车（拖车）</h3>
                                <p class="option-desc">低位重心更稳、能带行李，适合路况较好且家长熟练骑行时使用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kids-electric-cart">
                            <div class="card-image">
                                <img src="images/kids-electric-cart.svg" alt="儿童电动车或踏板车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">儿童电动小车或踏板车</h3>
                                <p class="option-desc">孩子喜欢、画面感强，适合人少平坦场地，需密切看护与限速规则。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
