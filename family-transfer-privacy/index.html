    <title>你会查看家人或伴侣的转账记录吗？— 隐私与信任投票</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你会查看家人或伴侣的转账记录吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会查看家人或伴侣的转账记录吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="check-occasionally">
                            <div class="card-image">
                                <img src="images/check-occasionally.svg" alt="用手机查看转账记录的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会，偶尔核对</h3>
                                <p class="option-desc">偶尔查看，确认异常交易或防止被骗</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="check-when-suspect">
                            <div class="card-image">
                                <img src="images/check-when-suspect.svg" alt="认真查看账单和交易明细的示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会，必要时全面查看</h3>
                                <p class="option-desc">出现异常或怀疑时会彻底核查</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="respect-privacy">
                            <div class="card-image">
                                <img src="images/respect-privacy.svg" alt="象征隐私保护的图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会，尊重隐私</h3>
                                <p class="option-desc">认为账务属于个人隐私，不会私自查看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="talk-first">
                            <div class="card-image">
                                <img src="images/talk-first.svg" alt="两人对话与沟通的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会，但会先沟通</h3>
                                <p class="option-desc">选择先和对方沟通，再决定是否查看记录</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
