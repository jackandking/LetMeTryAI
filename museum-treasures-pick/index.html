    <title>带孩子去博物馆：你更想看哪个镇馆之宝？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子去博物馆，你更想看哪个镇馆之宝？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子去博物馆，你更想看哪个镇馆之宝？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="tyrannosaurus-skeleton">
                            <div class="card-image">
                                <img src="images/tyrannosaurus-skeleton.svg" alt="霸王龙骨架正面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">霸王龙骨架（自然史）</h3>
                                <p class="option-desc">高大震撼的恐龙骨架，孩子可以站在‘侏罗纪现场’想象史前世界。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bronze-ding">
                            <div class="card-image">
                                <img src="images/bronze-ding.svg" alt="青铜大鼎侧影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">商周青铜大鼎（历史博物馆）</h3>
                                <p class="option-desc">古朴厚重的青铜器，适合给孩子讲王朝故事与古代工艺为什么重要。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dunhuang-mural">
                            <div class="card-image">
                                <img src="images/dunhuang-mural.svg" alt="敦煌壁画细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敦煌壁画局部（艺术馆）</h3>
                                <p class="option-desc">色彩与故事并存的壁画细节，激发孩子的想象力和文化好奇心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="imperial-robe">
                            <div class="card-image">
                                <img src="images/imperial-robe.svg" alt="宫廷服饰展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宫廷服饰展（龙袍与绣品）</h3>
                                <p class="option-desc">绣工与纹样近距离观赏，适合带孩子做角色扮演的趣味环节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
