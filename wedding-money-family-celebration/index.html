    <title>结婚发钱，带孩子的家庭庆祝你会怎么安排？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">结婚发钱，带孩子的家庭庆祝你会怎么安排？带娃去热闹还是在家静静庆祝？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">结婚发钱，带孩子的家庭庆祝你会怎么安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bring-kids-to-wedding">
                            <div class="card-image">
                                <img src="images/bring-kids-to-wedding.svg" alt="全家参加婚礼，孩子穿礼服送花" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">带孩子参加婚礼</h3>
                                <p class="option-desc">全家一起去，让孩子穿礼服、参与小环节，现场拍照留念，感受热闹氛围。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="adult-only-with-grandparents">
                            <div class="card-image">
                                <img src="images/adult-only-with-grandparents.svg" alt="孩子由爷奶在家照看，夫妻参加婚礼" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夫妻到场，孩子交给长辈</h3>
                                <p class="option-desc">夫妻参加婚礼，孩子由爷奶或保姆照看，晚些时间短聚或回家团圆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-parenting-party">
                            <div class="card-image">
                                <img src="images/home-parenting-party.svg" alt="家庭在家举办亲子派对，气球和蛋糕" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">留在家办亲子派对</h3>
                                <p class="option-desc">不去现场，在家办小型主题派对，做游戏、拍家庭照，让孩子也成为当天主角。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="quiet-celebration-save-education">
                            <div class="card-image">
                                <img src="images/quiet-celebration-save-education.svg" alt="父母把红包存入孩子教育账户" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">低调庆祝并存入教育金</h3>
                                <p class="option-desc">选择简单庆祝，把红包或礼金存入孩子教育/储蓄账户，或用作家庭短途旅行基金。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
