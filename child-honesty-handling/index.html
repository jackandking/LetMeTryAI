    <title>家长话题：孩子说谎该怎么处理</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：孩子说谎该怎么处理</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：孩子说谎应如何处理？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="patient-communication">
                            <div class="card-image">
                                <img src="images/patient-communication.svg" alt="家长与孩子耐心沟通的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">耐心沟通，找出原因</h3>
                                <p class="option-desc">温和询问原因并引导反思</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="set-consequences">
                            <div class="card-image">
                                <img src="images/set-consequences.svg" alt="家长说明规则与后果的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">设定后果，让其承担责任</h3>
                                <p class="option-desc">通过合理后果纠正行为</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="observe-not-overreact">
                            <div class="card-image">
                                <img src="images/observe-not-overreact.svg" alt="家长暗中观察孩子行为的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">观察一段时间不给过度反应</h3>
                                <p class="option-desc">先观察并记录再决定处理方式</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-honesty">
                            <div class="card-image">
                                <img src="images/praise-honesty.svg" alt="家长表扬孩子诚实的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">表扬并强化诚实时刻</h3>
                                <p class="option-desc">鼓励诚实行为，正向强化</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
