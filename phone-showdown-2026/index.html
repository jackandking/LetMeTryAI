<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);

    <title>投票：你更看好哪款新手机？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">手机对比：iPhone 与安卓旗舰</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果要换手机，你会选择哪一类？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="iphone-2026">
                            <div class="card-image">
                                <img src="images/iphone-2026.svg" alt="iPhone 手机 正面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">iPhone 系列</h3>
                                <p class="option-desc">iPhone，新系统与生态体验</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="android-flagship">
                            <div class="card-image">
                                <img src="images/android-flagship.svg" alt="安卓旗舰 手机 正面图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安卓旗舰</h3>
                                <p class="option-desc">安卓旗舰，性能与硬件配置</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-and-see">
                            <div class="card-image">
                                <img src="images/wait-and-see.svg" alt="观望 二字 图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">再等等 / 观望</h3>
                                <p class="option-desc">继续观望新技术或降价时再入手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
