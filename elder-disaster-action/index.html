    <title>家里遇到灾害，老人先做哪件事？你会怎么选</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里遇到灾害，老人先做哪件事？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里遇到灾害，老人先做哪件事？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="protect-head">
                            <div class="card-image">
                                <img src="images/protect-head.svg" alt="老人护住头部靠墙避险" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">护住头部并找安全角落</h3>
                                <p class="option-desc">用双手护头，靠近结实家具或低位避险，减少被砸或跌倒伤害。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="grab-docs-meds">
                            <div class="card-image">
                                <img src="images/grab-docs-meds.svg" alt="老人拿着证件和药物撤离" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">带上证件与常用药迅速撤离</h3>
                                <p class="option-desc">拿好证件、手机和长期服用的药，按最近安全出口离开房屋。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hide-under-furniture">
                            <div class="card-image">
                                <img src="images/hide-under-furniture.svg" alt="老人躲在结实家具旁避险" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">躲到坚固家具旁或承重墙下</h3>
                                <p class="option-desc">靠近承重墙或稳固家具，避开窗户与悬挂物以防碎裂伤害。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wake-and-help">
                            <div class="card-image">
                                <img src="images/wake-and-help.svg" alt="家人互相扶助撤离场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">叫醒家人并互相扶助撤离</h3>
                                <p class="option-desc">通知并扶助同住的人一起离开，按家庭预定集合点行动，互相照应。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
