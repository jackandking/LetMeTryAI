<body>
    <header>
        <a href="index.html" class="nav-back">← 返回</a>
        <h1>上传帅哥</h1>
        <div class="points-display">💎 <span id="pointsValue">0</span> 分</div>
    </header>
    
    <div class="container">
        <div class="upload-form">
           

            <form id="uploadForm">
                <div class="form-group">
                    <label for="imageUrl">帅哥图片链接:</label>
                    <input 
                        type="url" 
                        id="imageUrl" 
                        name="imageUrl" 
                        placeholder="请输入图片URL"
                    >
                </div>

                <div class="upload-or-divider">— 或者选择本地图片 —</div>

                <div class="form-group">
                    <label>本地图片上传：</label>
                    <div class="file-upload-row">
                        <input type="file" id="localFileInput" accept="image/*" style="display:none">
                        <button type="button" id="localFileBtn" class="file-btn">📁 选择本地图片</button>
                        <span id="localFileName" class="file-name">未选择文件</span>
                    </div>
                    <div class="compress-hint">📦 本地图片将自动压缩至500KB以内，适合手机浏览</div>
                </div>

                <div class="preview-section" id="previewSection" style="display: none;">
                    <h3>预览:</h3>
                    <img id="previewImage" alt="预览图片">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">上传图片</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>
    <div id="pointsNotification" class="points-notice"></div>
    
    <footer>
        <p>&copy; 2025 女人爱. 保留所有权利.</p>
    </footer>

    <script src="url-validator.js"></script>
    <script>
        const imageUrlInput = document.getElementById('imageUrl');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const pointsValue = document.getElementById('pointsValue');
        const pointsNotification = document.getElementById('pointsNotification');

        function updatePointsDisplay() {
            if (pointsValue && window.PointsSystem) {
                pointsValue.textContent = PointsSystem.getPoints();
            }
        }

        function showPointsNotification(text) {
            if (!pointsNotification) return;
            pointsNotification.textContent = text;
            pointsNotification.style.display = 'block';
            setTimeout(() => { pointsNotification.style.display = 'none'; }, 2600);
        }

        function initPoints() {
            if (!window.PointsSystem) return;
            const info = PointsSystem.initialize();
            updatePointsDisplay();
            if (info.isNewUser) {
                showPointsNotification(`欢迎新用户！+${PointsSystem.POINTS_CONFIG.NEW_USER} 分`);
            }
            if (info.dailyVisit && info.dailyVisit.awarded) {
                showPointsNotification(`每日签到 +${info.dailyVisit.points} 分`);
                updatePointsDisplay();
            }
        }

        // Local file state
        var localFile = null;

        // File input elements
        var localFileInput = document.getElementById('localFileInput');
        var localFileBtn = document.getElementById('localFileBtn');
        var localFileNameEl = document.getElementById('localFileName');

        // File button click
        localFileBtn.addEventListener('click', function() {
            localFileInput.click();
        });

        // File selected
        localFileInput.addEventListener('change', function() {
            var file = this.files && this.files[0];
            if (file) {
                localFile = file;
                localFileNameEl.textContent = file.name;
                localFileNameEl.className = 'file-name selected';
                // Clear URL input when file is selected
                imageUrlInput.value = '';
                previewSection.style.display = 'none';
                // Show local preview
                var objectUrl = URL.createObjectURL(file);
                previewImage.onload = function() { URL.revokeObjectURL(objectUrl); };
                previewImage.src = objectUrl;
                previewSection.style.display = 'block';
            } else {
                localFile = null;
                localFileNameEl.textContent = '未选择文件';
                localFileNameEl.className = 'file-name';
            }
        });

        // Generate UUID for unique filenames
        function generateUUID() {
            if (window.crypto && window.crypto.randomUUID) {
                return window.crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Compress image file to ≤500KB
        function compressImageFile(file, maxWidth, maxHeight, quality) {
            maxWidth = maxWidth || 800;
            maxHeight = maxHeight || 1440;
            quality = quality || 0.85;
            var MAX_FILE_SIZE = 500 * 1024;
            var MIN_QUALITY = 0.3;
            var QUALITY_STEP = 0.1;
            return new Promise(function(resolve, reject) {
                var img = new Image();
                var objectUrl = URL.createObjectURL(file);
                img.onload = function() {
                    URL.revokeObjectURL(objectUrl);
                    var w = img.naturalWidth || img.width;
                    var h = img.naturalHeight || img.height;
                    if (w > maxWidth || h > maxHeight) {
                        var ratio = Math.min(maxWidth / w, maxHeight / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    var currentQuality = quality;
                    function attempt() {
                        canvas.toBlob(function(blob) {
                            if (!blob) { return reject(new Error('图片压缩失败')); }
                            if (blob.size > MAX_FILE_SIZE && currentQuality > MIN_QUALITY) {
                                currentQuality = Math.max(Math.round((currentQuality - QUALITY_STEP) * 10) / 10, MIN_QUALITY);
                                attempt();
                            } else {
                                var uuid = generateUUID();
                                resolve(new File([blob], uuid + '.jpg', { type: 'image/jpeg', lastModified: Date.now() }));
                            }
                        }, 'image/jpeg', currentQuality);
                    }
                    attempt();
                };
                img.onerror = function() { URL.revokeObjectURL(objectUrl); reject(new Error('图片加载失败')); };
                img.src = objectUrl;
            });
        }

        // Upload file to image API and return response JSON
        async function uploadFileToImageApi(file) {
            var formData = new FormData();
            formData.append('file', file);
            var resp;
            try {
                resp = await fetch(window.API_ENDPOINTS.IMAGE_UPLOAD, { method: 'POST', body: formData });
            } catch (err) {
                throw new Error('上传请求失败：' + (err.message || '网络错误'));
            }
            if (!resp.ok) {
                var bodyText = '';
                try { bodyText = await resp.text(); } catch (e) { bodyText = ''; }
                var msg = bodyText ? ('图片上传失败：' + bodyText) : ('图片上传失败：HTTP ' + resp.status);
                throw new Error(msg);
            }
            try {
                return await resp.json();
            } catch (err) {
                try { return { url: await resp.text() }; } catch (e) { throw new Error('图片上传后解析响应失败: ' + e.message); }
            }
        }

        // Extract image URL from API response
        function extractImageUrlFromResponse(json) {
            if (!json) { return null; }
            if (json.url) { return json.url; }
            if (json.path) { return json.path.startsWith('http') ? json.path : window.getImageUrl(json.path); }
            if (json.data && json.data.url) { return json.data.url; }
            if (json.file && json.file.url) { return json.file.url; }
            for (var v of Object.values(json)) {
                if (typeof v === 'string' && v.startsWith('http')) { return v; }
            }
            return null;
        }

        // Preview image when URL is entered (on blur)
        imageUrlInput.addEventListener('input', function() {
            // Clear local file when user types a URL
            if (this.value.trim()) {
                localFile = null;
                localFileInput.value = '';
                localFileNameEl.textContent = '未选择文件';
                localFileNameEl.className = 'file-name';
            }
        });

        imageUrlInput.addEventListener('blur', function() {
            var url = this.value.trim();
            if (url && isValidUrl(url)) {
                previewImage.src = url;
                previewSection.style.display = 'block';
                previewImage.onerror = function() {
                    previewSection.style.display = 'none';
                    showMessage('无法加载预览图片，请检查URL是否正确', 'error');
                };
            } else if (!url) {
                previewSection.style.display = 'none';
            }
        });

        // Handle form submission
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var urlValue = imageUrlInput.value.trim();

            // Must have either a local file or a URL
            if (!localFile && !urlValue) {
                showMessage('请输入图片URL或选择本地图片', 'error');
                return;
            }

            submitBtn.disabled = true;

            var imageUrl = urlValue;

            // --- Local file upload path ---
            if (localFile) {
                try {
                    submitBtn.textContent = '压缩中...';
                    var compressed = await compressImageFile(localFile);
                    submitBtn.textContent = '上传图片中...';
                    var apiResponse = await uploadFileToImageApi(compressed);
                    var uploadedUrl = extractImageUrlFromResponse(apiResponse);
                    if (!uploadedUrl) {
                        throw new Error('未能从服务器响应中获取图片URL');
                    }
                    imageUrl = uploadedUrl;
                } catch (err) {
                    console.error('Local file upload error:', err);
                    showMessage('本地图片上传失败：' + (err.message || '请稍后重试'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '上传图片';
                    return;
                }
            } else {
                // Validate URL
                if (!isValidUrl(imageUrl)) {
                    showMessage('请输入有效的图片URL', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '上传图片';
                    return;
                }

                // Validate domain
                if (!isAllowedDomain(imageUrl)) {
                    showMessage('该图片来源域名不在允许列表中，请使用小红书、知乎、Instagram等平台的图片', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '上传图片';
                    return;
                }
            }

            submitBtn.textContent = '上传中...';

            try {
                // Insert image URL into database using parameterized query
                const sql = 'INSERT INTO handsome_images (image_url, created_at) VALUES (?, NOW())';
                const params = [imageUrl];
                
                const response = await fetch(API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ sql, params })
                });

                if (!response.ok) {
                    throw new Error('上传失败');
                }

                const result = await response.json();
                
                if (result.affectedRows > 0) {
                    showMessage('上传成功！感谢分享 😊', 'success');
                    try {
                        if (window.PointsSystem) {
                            const newTotal = PointsSystem.awardUploadPoints();
                            updatePointsDisplay();
                            showPointsNotification(`上传奖励 +${PointsSystem.POINTS_CONFIG.UPLOAD_IMAGE} 分，当前 ${newTotal} 分`);
                        }
                    } catch (err) {
                        console.warn('points award failed', err);
                    }
                    imageUrlInput.value = '';
                    localFile = null;
                    localFileNameEl.textContent = '未选择文件';
                    localFileNameEl.className = 'file-name';
                    previewSection.style.display = 'none';
                    
                    // Redirect to appreciate page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'appreciate.html';
                    }, 2000);
                } else {
                    throw new Error(result.error || '上传失败');
                }

            } catch (error) {
                console.error('Upload error:', error);
                
                if (error.message.includes('Duplicate')) {
                    showMessage('这张图片已经存在了！', 'error');
                } else {
                    showMessage('上传失败: ' + error.message, 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传图片';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function isValidUrl(url) {
            try {
                new URL(url);
                return url.startsWith('http://') || url.startsWith('https://');
            } catch {
                return false;
            }
        }

        // VConsole for debugging
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                document.head.appendChild(script);
            }
        })();

        // Init points after scripts loaded
        initPoints();
    </script>
</body>
