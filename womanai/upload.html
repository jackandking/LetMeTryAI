<body>
    <header>
        <a href="index.html" class="nav-back">← 返回</a>
        <h1>上传帅哥</h1>
    </header>
    
    <div class="container">
        <div class="upload-form">
           

            <form id="uploadForm">
                <div class="form-group">
                    <label for="imageUrl">帅哥图片链接:</label>
                    <input 
                        type="url" 
                        id="imageUrl" 
                        name="imageUrl" 
                        placeholder="请输入图片URL" 
                        required
                    >
                </div>

                <div class="preview-section" id="previewSection" style="display: none;">
                    <h3>预览:</h3>
                    <img id="previewImage" alt="预览图片">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">上传图片</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    </footer>

    <script src="url-validator.js"></script>
    <script>
        const imageUrlInput = document.getElementById('imageUrl');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Preview image when URL is entered
        imageUrlInput.addEventListener('input', function() {
            const url = this.value.trim();
            if (url && isValidUrl(url)) {
                previewImage.src = url;
                previewSection.style.display = 'block';
                
                previewImage.onerror = function() {
                    previewSection.style.display = 'none';
                    showMessage('无法加载预览图片，请检查URL是否正确', 'error');
                };
            } else {
                previewSection.style.display = 'none';
            }
        });

        // Handle form submission
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const imageUrl = imageUrlInput.value.trim();
            
            // Validate URL
            if (!isValidUrl(imageUrl)) {
                showMessage('请输入有效的图片URL', 'error');
                return;
            }

            // Validate domain
            if (!isAllowedDomain(imageUrl)) {
                showMessage('该图片来源域名不在允许列表中，请使用小红书、知乎、Instagram等平台的图片', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '上传中...';

            try {
                // Insert image URL into database using parameterized query
                const sql = 'INSERT INTO handsome_images (image_url, created_at) VALUES (?, NOW())';
                const params = [imageUrl];
                
                const response = await fetch(API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ sql, params })
                });

                if (!response.ok) {
                    throw new Error('上传失败');
                }

                const result = await response.json();
                
                if (result.success || result.data) {
                    showMessage('上传成功！感谢分享 😊', 'success');
                    imageUrlInput.value = '';
                    previewSection.style.display = 'none';
                    
                    // Redirect to appreciate page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'appreciate.html';
                    }, 2000);
                } else {
                    throw new Error(result.error || '上传失败');
                }

            } catch (error) {
                console.error('Upload error:', error);
                
                if (error.message.includes('Duplicate')) {
                    showMessage('这张图片已经存在了！', 'error');
                } else {
                    showMessage('上传失败: ' + error.message, 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传图片';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function isValidUrl(url) {
            try {
                new URL(url);
                return url.startsWith('http://') || url.startsWith('https://');
            } catch {
                return false;
            }
        }

        // VConsole for debugging
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                document.head.appendChild(script);
            }
        })();
    </script>
