<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱美容 - 女人爱</title>
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    <script src="../../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>爱美容</h1>
            <p class="subtitle">分享美容小技巧和好物推荐</p>
            <p class="description">上传美容心得、产品链接或短视频，和大家一起变美！</p>
        </header>

        <div class="section posts-section">
            <h2>大家的美容分享</h2>
            <div id="loadingMessage" class="loading-message">正在加载...</div>
            <div id="postsList" class="dishes-list">
                <!-- Posts will be dynamically loaded here -->
            </div>
        </div>

        <div class="section upload-section">
            <h2>分享您的美容内容</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="postTitle">标题：</label>
                    <input type="text" id="postTitle" name="postTitle" placeholder="例如：晚间护肤流程" required>
                </div>

                <div class="form-group">
                    <label for="imageLink">图片或短视频链接（可选）：</label>
                    <input type="url" id="imageLink" name="imageLink" placeholder="粘贴图片或视频链接">
                    <small style="color: #7f8c8d; font-size: 0.9em;">支持粘贴任意包含链接的文本，页面会自动提取第一个 URL。</small>
                </div>

                <div class="form-group">
                    <label for="description">简单描述（可选）：</label>
                    <textarea id="description" name="description" placeholder="分享您的经验或产品使用感受" rows="3"></textarea>
                </div>

                <button type="submit" class="submit-btn">提交分享</button>
            </form>
        </div>

        <div class="section vote-entry">
            <h2>投票互动</h2>
            <p>参与投票，选出大家最喜欢的美容分享</p>
            <div style="text-align:center; margin-top:12px;">
                <a href="vote.html" class="submit-btn" style="display:inline-block; width:auto; padding:10px 18px;">去投票</a>
            </div>
        </div>

        <div class="back-link">
            <a href="../">← 返回女人爱主页</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            if (debugMode) {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
