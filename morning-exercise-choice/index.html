    <title>老人晨练方式：你更喜欢哪一种？</title>
    <script src="../util.js"></script>

<body>
    <h1 id="pageTitle">老人晨练方式：你更喜欢哪一种？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">早晨起床后，你最常做/最想尝试的晨练方式是？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="park-walking">
                    <img src="images/park-walking.svg" alt="公园散步慢走" loading="lazy">
                    <span>清新空气、慢走散步，随走随停最舒服</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="tai-chi-qigong">
                    <img src="images/tai-chi-qigong.svg" alt="老人练太极" loading="lazy">
                    <span>柔和舒缓，讲究呼吸与身法的传统养生操</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="home-stretch-exercise">
                    <img src="images/home-stretch-exercise.svg" alt="居家拉伸健身操" loading="lazy">
                    <span>在家做简单拉伸或健身操，方便又安全</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="breathing-meditation">
                    <img src="images/breathing-meditation.svg" alt="静坐呼吸放松" loading="lazy">
                    <span>安静坐一会儿，做深呼吸放松身心</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
