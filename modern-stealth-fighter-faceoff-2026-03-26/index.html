<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">现代隐身战机对决</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">现代隐身战机中，你更看好哪款制空/突防能力？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-22-raptor">
                            <div class="card-image">
                                <img src="images/f-22-raptor.svg" alt="F-22战斗机侧视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-22 Raptor</h3>
                                <p class="option-desc">美制隐身制空战机，机动与隐身均衡。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-35-lightning-ii">
                            <div class="card-image">
                                <img src="images/f-35-lightning-ii.svg" alt="F-35战机俯视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-35 Lightning II</h3>
                                <p class="option-desc">多用途隐身战机，传感与网络化优势明显。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="j-20">
                            <div class="card-image">
                                <img src="images/j-20.svg" alt="歼-20战机侧视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">歼-20 (J-20)</h3>
                                <p class="option-desc">国产隐身重型战机，注重远程突防与态势感知。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="su-57">
                            <div class="card-image">
                                <img src="images/su-57.svg" alt="Su-57战机侧视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Su-57</h3>
                                <p class="option-desc">俄制第五代战机，强调机动与超机动性能。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>

        </footer>
