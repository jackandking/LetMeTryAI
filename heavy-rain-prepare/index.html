    <title>暴雨来临，家里先准备哪件事？——家长实用对比</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">暴雨来临，家里先准备哪件事？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">暴雨来临，家里先准备哪件事？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="prepare-power-light">
                            <div class="card-image">
                                <img src="images/prepare-power-light.svg" alt="桌上放着充电宝和手电筒" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">充电宝与照明</h3>
                                <p class="option-desc">给手机充满电，备好充电宝和手电筒，放在易取处</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="secure-windows-balcony">
                            <div class="card-image">
                                <img src="images/secure-windows-balcony.svg" alt="阳台上的花盆被收起并固定" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">窗门加固与收阳台物</h3>
                                <p class="option-desc">锁好窗户，收起盆栽与轻飘物，防止被风吹落</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stock-food-water">
                            <div class="card-image">
                                <img src="images/stock-food-water.svg" alt="桌上摆放着干粮和矿泉水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">备足食物與饮用水</h3>
                                <p class="option-desc">准备几份干粮和矿泉水，放在干燥随手可取处</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-safety-plan">
                            <div class="card-image">
                                <img src="images/family-safety-plan.svg" alt="一家人在房间里布置避险点并摆放毛毯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">确定避险房间与看护计划</h3>
                                <p class="option-desc">定好家中避险点，分配照看孩子与老人职责，备毛毯与小玩具</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
