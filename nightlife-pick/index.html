    <title>下班后你爱去哪种夜生活？来选一个最想去的场景</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">下班后你爱去哪种夜生活？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下班后你最想去哪种夜生活场景？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bbq-street">
                            <div class="card-image">
                                <img src="images/bbq-street.svg" alt="街边烧烤摊热闹场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">街边烧烤摊</h3>
                                <p class="option-desc">烤串配啤酒，热闹摆摊氛围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="craft-bar">
                            <div class="card-image">
                                <img src="images/craft-bar.svg" alt="温暖灯光的精酿酒吧吧台" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精酿小酒吧</h3>
                                <p class="option-desc">低光氛围，和朋友细聊喝几杯</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-night-diner">
                            <div class="card-image">
                                <img src="images/late-night-diner.svg" alt="深夜食堂小桌和热汤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">深夜食堂</h3>
                                <p class="option-desc">暖汤暖胃的深夜安慰角落</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="esports-cafe">
                            <div class="card-image">
                                <img src="images/esports-cafe.svg" alt="电竞房间带RGB灯光" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电竞网咖</h3>
                                <p class="option-desc">跟队友开黑，光影和热血并存</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
