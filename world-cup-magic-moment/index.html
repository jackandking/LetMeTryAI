<head>

    <title>世界杯神仙画面票选</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">世界杯上哪个神仙画面戳中了你？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">世界杯上哪个神仙画面戳中了你？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="last-second-goal">
                            <div class="card-image">
                                <img src="images/last-second-goal.svg" alt="读秒绝杀庆祝插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">读秒绝杀庆祝</h3>
                                <p class="option-desc">哨响前最后一刻进球，全场沸腾的拥抱画面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="goalkeeper-save">
                            <div class="card-image">
                                <img src="images/goalkeeper-save.svg" alt="门将飞身扑救插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">门将飞身神扑</h3>
                                <p class="option-desc">腾空而起把球挡出门线，力量感拉满</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="star-face">
                            <div class="card-image">
                                <img src="images/star-face.svg" alt="球星高颜值特写插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">球星神仙颜值</h3>
                                <p class="option-desc">镜头拉近时那张让人心跳漏拍的脸</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="team-celebration">
                            <div class="card-image">
                                <img src="images/team-celebration.svg" alt="全队拥抱庆祝插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">全队拥抱庆祝</h3>
                                <p class="option-desc">一群人围成圈欢呼，情绪感染力爆棚</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
