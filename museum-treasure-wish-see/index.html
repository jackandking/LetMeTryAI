    <title>博物馆里哪个镇馆之宝想去看？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">博物馆里哪个镇馆之宝想去看？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在博物馆里，你想近距离看哪个镇馆之宝？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="qin-shi-huang-terracotta-army">
                            <div class="card-image">
                                <img src="images/qin-shi-huang-terracotta-army.svg" alt="秦始皇兵马俑侧面群像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">秦始皇兵马俑</h3>
                                <p class="option-desc">排成方阵的陶俑群，像历史的一列军队向你走来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sanxingdui-bronze-mask">
                            <div class="card-image">
                                <img src="images/sanxingdui-bronze-mask.svg" alt="三星堆青铜面具特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">三星堆青铜面具</h3>
                                <p class="option-desc">巨眼与金属光泽，像从远古走出的神秘面孔</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dunhuang-flying-mural">
                            <div class="card-image">
                                <img src="images/dunhuang-flying-mural.svg" alt="敦煌飞天壁画局部" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敦煌飞天壁画</h3>
                                <p class="option-desc">穹顶上的飞天在色彩中舞动，像被时间吹起的丝绸</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gugong-gold-jade-armor">
                            <div class="card-image">
                                <img src="images/gugong-gold-jade-armor.svg" alt="金缕玉衣细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">故宫金缕玉衣</h3>
                                <p class="option-desc">细密金线与玉片交织，近看像织成的时间纹理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
