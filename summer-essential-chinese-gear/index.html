    <title>夏天出门必备神器｜男人宝</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏天出门，你离不开哪件中国神器？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">夏天出门，你离不开哪件中国神器？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="portable-fan">
                            <div class="card-image">
                                <img src="images/portable-fan.svg" alt="手持小风扇插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手持小风扇</h3>
                                <p class="option-desc">走到哪吹到哪，公交地铁救命神器</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cooling-sleeves">
                            <div class="card-image">
                                <img src="images/cooling-sleeves.svg" alt="防晒冰袖插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防晒冰袖</h3>
                                <p class="option-desc">防晒又降温，骑行开车都离不开</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cooling-spray">
                            <div class="card-image">
                                <img src="images/cooling-spray.svg" alt="降温喷雾插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">降温喷雾</h3>
                                <p class="option-desc">喷一喷瞬间清凉，户外运动续命</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mini-umbrella">
                            <div class="card-image">
                                <img src="images/mini-umbrella.svg" alt="便携遮阳伞插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">便携遮阳伞</h3>
                                <p class="option-desc">小巧能塞包，烈日下照样潇洒走</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
