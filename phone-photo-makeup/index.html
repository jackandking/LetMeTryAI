    <title>一部手机走天下，你更爱哪种手机拍照妆？看图挑妆感</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">一部手机走天下，你更爱哪种手机拍照妆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">一部手机走天下，你更爱哪种手机拍照妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-nude">
                            <div class="card-image">
                                <img src="images/natural-nude.svg" alt="自然裸光妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然裸光</h3>
                                <p class="option-desc">轻薄底妆、自然光下透亮，日常拍照更好看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dewy-glass-skin">
                            <div class="card-image">
                                <img src="images/dewy-glass-skin.svg" alt="水光玻璃肌妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水光玻璃肌</h3>
                                <p class="option-desc">肌肤水润有光，手机直拍呈现润泽光感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="high-contrast-look">
                            <div class="card-image">
                                <img src="images/high-contrast-look.svg" alt="高对比镜头妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高对比镜头感</h3>
                                <p class="option-desc">轮廓分明、色彩饱和，照片更有戏剧感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="art-filter-look">
                            <div class="card-image">
                                <img src="images/art-filter-look.svg" alt="艺术滤镜妆示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">艺术滤镜妆</h3>
                                <p class="option-desc">带色调与小造型，照片更有风格与故事感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
