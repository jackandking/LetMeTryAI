    <title>老人每天睡几个小时你觉得合适？大家怎么安排睡眠</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老人每天睡几个小时你觉得合适？说说你的选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">老人每天睡几个小时你觉得合适？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="under-5-hours">
                            <div class="card-image">
                                <img src="images/under-5-hours.svg" alt="老人短睡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">5小时以下</h3>
                                <p class="option-desc">睡得少，白天可能靠小憩补充精神</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="6-7-hours">
                            <div class="card-image">
                                <img src="images/6-7-hours.svg" alt="6-7小时睡眠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">6-7小时</h3>
                                <p class="option-desc">中等时长，很多家庭的常见作息</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="7-9-hours">
                            <div class="card-image">
                                <img src="images/7-9-hours.svg" alt="7-9小时睡眠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">7-9小时</h3>
                                <p class="option-desc">睡得比较充足，白天状态通常较稳定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="late-night-plus-nap">
                            <div class="card-image">
                                <img src="images/late-night-plus-nap.svg" alt="晚睡午休" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">晚睡但午休补觉</h3>
                                <p class="option-desc">夜里睡得晚，但靠午休补回精力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
