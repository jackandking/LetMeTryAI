    <title>改善睡眠的小习惯投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">改善睡眠的小习惯投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，哪个小习惯最能帮你睡个好觉？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="wen-niunai">
                            <div class="card-image">
                                <img src="images/wen-niunai.svg" alt="一杯温牛奶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前喝一杯温牛奶</h3>
                                <p class="option-desc">温暖助眠，老少皆宜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="fixed-sleep-schedule">
                            <div class="card-image">
                                <img src="images/fixed-sleep-schedule.svg" alt="规律作息时钟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定睡眠时间（早睡早起）</h3>
                                <p class="option-desc">规律作息，长期见效</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="read-or-soft-music">
                            <div class="card-image">
                                <img src="images/read-or-soft-music.svg" alt="睡前读书场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前读书或听轻音乐</h3>
                                <p class="option-desc">放松身心，助力入睡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="avoid-phone-before-bed">
                            <div class="card-image">
                                <img src="images/avoid-phone-before-bed.svg" alt="放下手机的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前减少手机/屏幕使用</h3>
                                <p class="option-desc">远离蓝光，延缓兴奋感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
