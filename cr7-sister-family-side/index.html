        </header>

            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">C罗姐姐赛后发声，你更关注球星家人的哪一面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="passionate-cheer">
                            <div class="card-image">
                                <img src="images/passionate-cheer.svg" alt="球星家人热血助威" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">热血助威</h3>

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="warm-daily">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温暖日常</h3>
                                <p class="option-desc">晒全家福、陪娃互动，明星也有接地气的一面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="firm-protection">
                            <div class="card-image">

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
