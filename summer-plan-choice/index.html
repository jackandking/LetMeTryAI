    <title>暑假安排：平衡成长还是侧重兴趣？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">暑假安排：平衡成长还是侧重兴趣？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：孩子的暑假计划你更倾向哪种安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="self-reading-goals">
                            <div class="card-image">
                                <img src="images/self-reading-goals.svg" alt="孩子读书打卡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自主阅读+小目标打卡</h3>
                                <p class="option-desc">鼓励每日阅读并设小目标，培养习惯与思考力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="sports-and-outdoor">
                            <div class="card-image">
                                <img src="images/sports-and-outdoor.svg" alt="孩子体育运动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">体育训练+户外时间</h3>
                                <p class="option-desc">安排固定运动与户外活动，增强体能与专注力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="family-travel-experience">
                            <div class="card-image">
                                <img src="images/family-travel-experience.svg" alt="家庭旅行实践" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭旅行+生活实践</h3>
                                <p class="option-desc">通过旅行与生活实践学知识、开眼界并培养独立性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
