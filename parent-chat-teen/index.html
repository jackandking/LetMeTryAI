    <title>家长话题：如何跟青春期孩子聊天更有效</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：如何跟青春期孩子聊天更有效</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：如何跟青春期孩子聊天更有效？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="open-questions">
                            <div class="card-image">
                                <img src="images/open-questions.jpg" alt="开放式提问" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">开放式问题</h3>
                                <p class="option-desc">用开放式问题引导孩子说心里话</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="give-space">
                            <div class="card-image">
                                <img src="images/give-space.jpg" alt="给孩子空间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">给空间不逼问</h3>
                                <p class="option-desc">留时间和空间，让孩子主动分享</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="fixed-chat-time">
                            <div class="card-image">
                                <img src="images/fixed-chat-time.jpg" alt="固定聊天时间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">定期固定聊天时间</h3>
                                <p class="option-desc">固定每周一次专属聊天时段，建立信任例行</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="use-interests">
                            <div class="card-image">
                                <img src="images/use-interests.jpg" alt="兴趣切入" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用兴趣切入</h3>
                                <p class="option-desc">从孩子兴趣或共同活动切入话题更容易打开话匣子</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
