    <title>多喝白开水能让皮肤更水润吗？你平时怎么喝水</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">多喝白开水能让皮肤看起来更水润吗？你平时怎么喝水？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">多喝白开水能让皮肤看起来更水润吗？你平时怎么喝水？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="daily-timed-water">
                            <div class="card-image">
                                <img src="images/daily-timed-water.svg" alt="桌边一杯白开水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每天定时喝足</h3>
                                <p class="option-desc">按计划喝水，全天均匀补水（约2000ml），看起来更有光泽感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="only-when-thirsty">
                            <div class="card-image">
                                <img src="images/only-when-thirsty.svg" alt="有人喝水解渴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">渴了才喝</h3>
                                <p class="option-desc">不刻意补水，口渴时才喝，皮肤容易忽冷忽热。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prefer-drinks">
                            <div class="card-image">
                                <img src="images/prefer-drinks.svg" alt="杯中果茶带冰块" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常喝果茶或饮料</h3>
                                <p class="option-desc">以果茶/饮料为主，白开水较少，口感好但不一定补水到位。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="night-heavy-morning-light">
                            <div class="card-image">
                                <img src="images/night-heavy-morning-light.svg" alt="夜晚桌上水杯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">白天少晚上多</h3>
                                <p class="option-desc">白天忙碌少喝，晚上一次性补水，对观感影响有限。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
