    <title>能源转型关切：普通人更关注哪方面？ — 投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">能源转型关切：普通人更关注哪方面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在能源转型过程中，您更关注以下哪一方面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cost-and-bills">
                            <div class="card-image">
                                <img src="images/cost-and-bills.svg" alt="电表和账单示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电费与生活成本</h3>
                                <p class="option-desc">担心电价或相关费用上升，影响日常开销与家庭预算。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="jobs-and-industry">
                            <div class="card-image">
                                <img src="images/jobs-and-industry.svg" alt="就业与工厂示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">就业影响与产业机会</h3>
                                <p class="option-desc">关注产业结构调整带来的岗位变化、再培训与新经济机会。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="grid-reliability">
                            <div class="card-image">
                                <img src="images/grid-reliability.svg" alt="电网与输电塔示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电力供应稳定性</h3>
                                <p class="option-desc">重视供电可靠性、停电风险及在极端天气下的应对能力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="environmental-benefits">
                            <div class="card-image">
                                <img src="images/environmental-benefits.svg" alt="城市与蓝天示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">环境与空气质量改善</h3>
                                <p class="option-desc">期望通过清洁能源降低污染，改善空气与生活环境。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
