        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪一幕会让你怀念起小时候看《94版三国》？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="san-gu-mao-lu">
                            <div class="card-image">
                                <img src="images/san-gu-mao-lu.svg" alt="刘备三顾茅庐的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">三顾茅庐</h3>
                                <p class="option-desc">刘备三次登门请诸葛亮，那份诚意与谦卑的画面让人记住</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cao-chuan-jie-jian">
                            <div class="card-image">
                                <img src="images/cao-chuan-jie-jian.svg" alt="草船借箭的江面与草船" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">草船借箭</h3>
                                <p class="option-desc">诸葛亮借东风、草船满载箭矢的静谧又机智的一幕</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chi-bi-huo-gong">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">赤壁火攻</h3>
                                <p class="option-desc">火光映江、连环火攻的壮阔画面，总能勾起磅礴记忆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chang-ban-po-zhao-yun">
                            <div class="card-image">
                                <img src="images/chang-ban-po-zhao-yun.svg" alt="赵云长坂坡单骑救主" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">长坂坡赵云救主</h3>
                                <p class="option-desc">赵云一人闯敌营、单骑救主的惊险与忠义让人热泪盈眶</p>
