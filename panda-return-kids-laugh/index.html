    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">熊猫回归，孩子会被哪种萌态逗笑？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">熊猫回归，孩子会被哪种萌态逗笑？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="panda-snooze">
                            <div class="card-image">
                                <img src="images/panda-snooze.svg" alt="熊猫打盹睡姿" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">憨睡姿</h3>
                                <p class="option-desc">瞌睡中翻身打盹，迷糊又可爱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="panda-roll">
                            <div class="card-image">
                                <img src="images/panda-roll.svg" alt="熊猫翻滚画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">笨拙滚动</h3>
                                <p class="option-desc">笨拙翻滚或滚下小坡，一脸惊讶</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="panda-bamboo-munch">
                            <div class="card-image">
                                <img src="images/panda-bamboo-munch.svg" alt="熊猫吃竹子萌态" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抢竹子吃相</h3>
                                <p class="option-desc">抓竹子大口啃，手忙脚乱超萌</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="panda-playful-hop">
                            <div class="card-image">
                                <img src="images/panda-playful-hop.svg" alt="熊猫玩耍跳跃" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">耍宝玩耍</h3>
                                <p class="option-desc">跳跃嬉闹或做滑稽动作逗笑孩子</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
