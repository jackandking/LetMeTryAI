<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">方桃子封面你更想看到哪种风格？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你更想在方桃子封面看到哪种风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="qingxin-shaonv">
                            <div class="card-image">
                                <img src="images/qingxin-shaonv.svg" alt="清新少女风方桃子封面示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新少女感</h3>
                                <p class="option-desc">自然柔光＋淡雅妆容，清新氛围感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gaoji-lengyan">
                            <div class="card-image">
                                <img src="images/gaoji-lengyan.svg" alt="高级冷艳风方桃子封面示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高级冷艳感</h3>
                                <p class="option-desc">雕塑感轮廓＋暗色基调，气场强烈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dianying-zhigan">
                            <div class="card-image">
                                <img src="images/dianying-zhigan.svg" alt="电影质感方桃子封面示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电影质感人像</h3>
                                <p class="option-desc">暖色胶片感＋光影故事，引人好奇</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="keai-chaoliu-hua">
                            <div class="card-image">
                                <img src="images/keai-chaoliu-hua.svg" alt="可爱潮流插画风方桃子封面示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可爱潮流插画</h3>
                                <p class="option-desc">插画/图像化处理，趣味与识别度高</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
