<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">跟着非遗魅力，带孩子先体验哪一项？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">跟着非遗魅力，带孩子先体验哪一项？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="shadow-puppet-play">
                            <div class="card-image">
                                <img src="images/shadow-puppet-play.svg" alt="亲子体验皮影戏非遗项目" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">皮影戏</h3>
                                <p class="option-desc">看影子讲故事，孩子能动手演一段传统戏</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="paper-cutting">
                            <div class="card-image">
                                <img src="images/paper-cutting.svg" alt="亲子体验剪纸非遗项目" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">剪纸</h3>
                                <p class="option-desc">一把剪刀一张纸，剪出年味和生肖图案</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chinese-opera">
                            <div class="card-image">
                                <img src="images/chinese-opera.svg" alt="亲子体验传统戏曲非遗项目" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统戏曲</h3>
                                <p class="option-desc">听唱腔、学身段，近距离感受舞台魅力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="folk-instrument">
                            <div class="card-image">
                                <img src="images/folk-instrument.svg" alt="亲子体验民族器乐非遗项目" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">民族器乐</h3>
                                <p class="option-desc">认识古筝、二胡，亲手拨出第一个音符</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

                <div class="loading-state">
