    <title>能源卫星升空画面，你选哪张？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">中国能源卫星升空，你更想看哪个画面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">中国能源卫星升空，你更想看哪个画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="engine-flame">
                            <div class="card-image">
                                <img src="images/engine-flame.svg" alt="推进器点火时的蓝白火焰近景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">推进器点火蓝焰</h3>
                                <p class="option-desc">近景：发动机点火，蓝白火焰撕裂天幕的瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="solar-array-deploy">
                            <div class="card-image">
                                <img src="images/solar-array-deploy.svg" alt="太阳能阵列展开特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太阳能阵列展开</h3>
                                <p class="option-desc">特写：太阳能翼缓缓展开，金属光泽在阳光下闪耀。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="night-grid-orbit">
                            <div class="card-image">
                                <img src="images/night-grid-orbit.svg" alt="卫星俯瞰夜间城市电网灯光" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">卫星俯瞰夜间电网</h3>
                                <p class="option-desc">轨道视角：夜色中城市灯光连成有序的电网图案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ground-control-cheer">
                            <div class="card-image">
                                <img src="images/ground-control-cheer.svg" alt="地面指挥中心庆祝升空的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">地面指挥与欢呼</h3>
                                <p class="option-desc">地面镜头：科研人员对着屏幕注视，升空瞬间掌声与欢呼。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
