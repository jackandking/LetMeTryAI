    <title>小时候和爸妈看台球比赛，你记得哪个画面？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">小时候和爸妈看台球比赛，你记得哪个画面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">小时候和爸妈看台球比赛，你记得哪个画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cue-strike">
                            <div class="card-image">
                                <img src="images/cue-strike.svg" alt="台球杆击球瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">台球杆击球瞬间</h3>
                                <p class="option-desc">台球杆刚碰白球、球线飞出的动感，父母目光都聚焦在台面上。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="parents-whisper">
                            <div class="card-image">
                                <img src="images/parents-whisper.svg" alt="爸妈低声讨论比分" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">爸妈低声讨论比分</h3>
                                <p class="option-desc">两人靠得很近，低声估算落袋和比分，像在分享小秘密。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="audience-cheer">
                            <div class="card-image">
                                <img src="images/audience-cheer.svg" alt="观众起立鼓掌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">观众起立鼓掌那刻</h3>
                                <p class="option-desc">台下突然爆发掌声，大家起立为精彩一杆喝彩，氛围热烈。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="child-watching">
                            <div class="card-image">
                                <img src="images/child-watching.svg" alt="孩子看球进袋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">孩子抬头看球进袋</h3>
                                <p class="option-desc">你坐在一旁抬头看球入袋的惊喜表情，兴奋又好奇的瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
