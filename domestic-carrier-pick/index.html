    <title>国产航母热血之选</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国产航母里，哪一艘让你热血沸腾？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国产航母里，哪一艘让你热血沸腾？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="liaoning-ship">
                            <div class="card-image">
                                <img src="images/liaoning-ship.svg" alt="辽宁舰航母" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">辽宁舰</h3>
                                <p class="option-desc">中国航母梦开始的地方</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="shandong-ship">
                            <div class="card-image">
                                <img src="images/shandong-ship.svg" alt="山东舰航母" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">山东舰</h3>
                                <p class="option-desc">首艘国产航母，意义非凡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fujian-ship">
                            <div class="card-image">
                                <img src="images/fujian-ship.svg" alt="福建舰航母" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">福建舰</h3>
                                <p class="option-desc">电磁弹射，国产航母新高度</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hainan-ship">
                            <div class="card-image">
                                <img src="images/hainan-ship.svg" alt="海南舰两栖攻击舰" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">海南舰</h3>
                                <p class="option-desc">两栖攻击舰，立体登陆新力量</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
