    <title>孩子长大后，你更看重哪种能力？家长都在想什么</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子长大后，你更看重哪种能力？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子长大后，你更看重哪种能力？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="independent-living">
                            <div class="card-image">
                                <img src="images/independent-living.svg" alt="孩子自己做早餐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">独立生活能力</h3>
                                <p class="option-desc">会自己做早餐、整理房间、规划时间，离开家庭也能自理。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="communication-empathy">
                            <div class="card-image">
                                <img src="images/communication-empathy.svg" alt="父母与孩子交流" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">沟通与情绪管理</h3>
                                <p class="option-desc">能表达想法、控制情绪、妥善处理冲突，与人相处更顺畅。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="self-learning">
                            <div class="card-image">
                                <img src="images/self-learning.svg" alt="孩子在看书学习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">学习与自学能力</h3>
                                <p class="option-desc">遇到新问题会主动查资料、持续学习，不靠别人推动成长。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="problem-solving">
                            <div class="card-image">
                                <img src="images/problem-solving.svg" alt="孩子思考解决问题" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抗挫与解决问题能力</h3>
                                <p class="option-desc">面对困难能冷静分析、尝试方案并坚持到找到解决办法。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
