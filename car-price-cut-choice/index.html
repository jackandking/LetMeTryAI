    <title>面对车企降价你会怎么选？投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">面对车企降价你会怎么选？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">面对车企降价，你会如何做出选择？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-now">
                            <div class="card-image">
                                <img src="images/buy-now.svg" alt="趁降价马上买车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立刻入手</h3>
                                <p class="option-caption">抓住降价机会，马上买新车</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-for-better">
                            <div class="card-image">
                                <img src="images/wait-for-better.svg" alt="等待更低价格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">继续观望</h3>
                                <p class="option-caption">觉得还会更低价，选择再等等</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="upgrade-while-discounted">
                            <div class="card-image">
                                <img src="images/upgrade-while-discounted.svg" alt="趁降价升级换购" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">升级换购</h3>
                                <p class="option-caption">用降价时机换购更高配置或更合适的车型</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="keep-or-buy-used">
                            <div class="card-image">
                                <img src="images/keep-or-buy-used.svg" alt="保持现车或关注二手市场" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">保持现状或买二手</h3>
                                <p class="option-caption">暂不换新，或关注二手车与保值情况再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

        </footer>
