    <title>带孩子看哪件考古镇馆之宝？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">考古出土的镇馆之宝，你带孩子更想看哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">考古出土的镇馆之宝，你带孩子更想看哪个？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="terracotta-warrior">
                            <div class="card-image">
                                <img src="images/terracotta-warrior.svg" alt="兵马俑陶俑群像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兵马俑</h3>
                                <p class="option-desc">成排陶俑像真的士兵，现场有阵列感，适合讲古代军队与守护故事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="han-bronze-mirror">
                            <div class="card-image">
                                <img src="images/han-bronze-mirror.svg" alt="汉代花纹铜镜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">汉代铜镜</h3>
                                <p class="option-desc">光亮的铜镜与精美花纹，可和孩子一起做光影游戏，讲古代生活与工艺。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dunhuang-mural">
                            <div class="card-image">
                                <img src="images/dunhuang-mural.svg" alt="敦煌壁画局部彩绘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敦煌彩绘壁画</h3>
                                <p class="option-desc">色彩绚丽的壁画里有神话和人物，能引发孩子的想象与画面讲述练习。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="shipwreck-treasure">
                            <div class="card-image">
                                <img src="images/shipwreck-treasure.svg" alt="沉船出水的宝物" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">沉船出水的珍宝</h3>
                                <p class="option-desc">从海底打捞出的金银器与生活器具，带来探险感和历史之谜的好奇话题。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
