    <title>世界杯看球快乐标配</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">世界杯熬夜看球，你的快乐标配是什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">世界杯熬夜看球，你的快乐标配是什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="beer-bbq">
                            <div class="card-image">
                                <img src="images/beer-bbq.svg" alt="冰镇啤酒配烤串看球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冰镇啤酒配烤串</h3>
                                <p class="option-desc">冰啤加烤串，进球瞬间爽翻天</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cola-chips">
                            <div class="card-image">
                                <img src="images/cola-chips.svg" alt="可乐薯片看球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">肥宅快乐水配薯片</h3>
                                <p class="option-desc">经典搭配，简单快乐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="coffee-chicken">
                            <div class="card-image">
                                <img src="images/coffee-chicken.svg" alt="咖啡炸鸡看球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">咖啡炸鸡配外卖</h3>
                                <p class="option-desc">深夜补给，越夜越精神</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="goji-seeds">
                            <div class="card-image">
                                <img src="images/goji-seeds.svg" alt="枸杞瓜子看球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">养生枸杞配瓜子</h3>
                                <p class="option-desc">年纪到了，看球也要养生</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
