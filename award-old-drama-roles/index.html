<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">颁奖礼上的老剧角色，你会和家人先说起谁？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">颁奖礼上的老剧角色，你会和家人先说起谁？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="tiegu-nan-zhu">
                            <div class="card-image">
                                <img src="images/tiegu-nan-zhu.svg" alt="铁骨男主在舞台上举杯的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">铁骨男主（正气/乡情）</h3>
                                <p class="option-desc">颁奖台上想起他那句铿锵台词和为家乡付出的背影。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nuanxin-mu-nai">
                            <div class="card-image">
                                <img src="images/nuanxin-mu-nai.svg" alt="温柔母亲在厨房微笑的侧脸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暖心母亲/奶奶</h3>
                                <p class="option-desc">家里聚会总有人先念起她的叮咛、做菜和温柔眼神。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="xiao-dian-peijue">
                            <div class="card-image">
                                <img src="images/xiao-dian-peijue.svg" alt="喜剧配角在台上夸张表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">笑点担当（喜剧配角）</h3>
                                <p class="option-desc">一句俏皮话就能让全家笑出声的配角形象。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fuza-fanpai">
                            <div class="card-image">
                                <img src="images/fuza-fanpai.svg" alt="深情的反派在颁奖礼上低头" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复杂反派（让人爱恨）</h3>
                                <p class="option-desc">虽是反派，但他的内心戏和转折常成家人话题焦点。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
