    <title>上班通勤的那些尴尬事，你遇到过哪种？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">上班通勤的那些尴尬事，你遇到过哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">上下班路上你最常遇到哪种尴尬行为？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="seat-hoarding">
                            <div class="card-image">
                                <img src="images/seat-hoarding.svg" alt="占座行为" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">别人霸占座位/占位不让</h3>
                                <p class="option-desc">遇到站着却有人占空位不让人坐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="loud-phone-call">
                            <div class="card-image">
                                <img src="images/loud-phone-call.svg" alt="高声通话" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">车厢内高声通话</h3>
                                <p class="option-desc">有人在车上大声通电话影响周围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cutting-in-line">
                            <div class="card-image">
                                <img src="images/cutting-in-line.svg" alt="插队画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">插队/拥挤时被挤</h3>
                                <p class="option-desc">排队被插或上车被挤的那一刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="eating-on-transit">
                            <div class="card-image">
                                <img src="images/eating-on-transit.svg" alt="车上吃东西" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">随地吃喝/味道很重</h3>
                                <p class="option-desc">有人在密闭车厢里吃有强烈气味的食物</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
