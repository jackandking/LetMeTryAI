    <title>春季亲子种植｜和孩子一起动手的小玩法</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季亲子种植：你会怎么和孩子一起动手？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在这个春天，你会选择哪种方式和孩子一起动手种植？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="balcony-mini-garden">
                            <div class="card-image">
                                <img src="images/balcony-mini-garden.svg" alt="父母和孩子在阳台花盆中种菜的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">阳台小菜园（种蔬菜）</h3>
                                <p class="option-caption">和孩子一起种叶菜或小番茄，收获可吃的成果。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="flower-pot-play">
                            <div class="card-image">
                                <img src="images/flower-pot-play.svg" alt="孩子与家长在花盆里种花并观察花朵" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花盆观赏（种花学美感）</h3>
                                <p class="option-caption">选择易养花卉，让孩子学习观察花期与配色。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="seed-science-observe">
                            <div class="card-image">
                                <img src="images/seed-science-observe.svg" alt="透明容器中可见发芽过程的种子实验" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">种子发芽小实验</h3>
                                <p class="option-caption">用透明容器做发芽实验，引导科学观察与记录。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="succulent-craft-garden">
                            <div class="card-image">
                                <img src="images/succulent-craft-garden.svg" alt="孩子与家长一起制作瓶中微景观或摆放多肉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手作微景观（多肉/瓶中园艺）</h3>
                                <p class="option-caption">结合手工制作与种植，适合短时注意力的孩子。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
