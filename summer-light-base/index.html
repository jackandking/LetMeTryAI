    <title>夏日轻薄底妆比一比</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏日底妆谁更清透？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你更爱哪种夏日底妆风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="water-glow-base">
                            <div class="card-image">
                                <img src="images/water-glow-base.svg" alt="水光感底妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水光感底妆</h3>
                                <p class="option-desc">光泽感，皮肤看起来水润有光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="airy-bare-foundation">
                            <div class="card-image">
                                <img src="images/airy-bare-foundation.svg" alt="无感轻薄底妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无感轻薄底妆</h3>
                                <p class="option-desc">超薄贴肤，像没化妆一样清爽</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="coverage-longwear">
                            <div class="card-image">
                                <img src="images/coverage-longwear.svg" alt="遮瑕持久底妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">遮瑕持久底妆</h3>
                                <p class="option-desc">遮瑕效果好，适合控油与出汗场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
