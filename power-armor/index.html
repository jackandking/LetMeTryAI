<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">动力装甲：未来单兵战神</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪种动力装甲设计将主宰未来战场？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="armor" value="heavy">
                            <div class="card-image">
                                <img src="https://picsum.photos/seed/heavy/300/200" alt="重型突击" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重型突击 (Heavy)</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="armor" value="scout">
                            <div class="card-image">
                                <img src="https://picsum.photos/seed/scout/300/200" alt="敏捷侦察" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敏捷侦察 (Scout)</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="armor" value="support">
                            <div class="card-image">
                                <img src="https://picsum.photos/seed/support/300/200" alt="后勤支援" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">后勤支援 (Support)</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="armor" value="stealth">
                            <div class="card-image">
                                <img src="https://picsum.photos/seed/stealth/300/200" alt="隐身特战" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">隐身特战 (Stealth)</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="armor" value="commander">
                            <div class="card-image">
                                <img src="https://picsum.photos/seed/commander/300/200" alt="指挥中枢" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">指挥中枢 (Command)</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

                <div class="loading-state">
