    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：分手后最难忘的瞬间</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">分手后，哪一刻最让你至今难忘？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="received-reply-message">
                            <div class="card-image">
                                <img src="images/received-reply-message.svg" alt="手机消息气泡封面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">收到对方的道歉或复合消息</h3>
                                <p class="option-desc">那条让心又痛又暖的消息</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="visit-memory-place">
                            <div class="card-image">
                                <img src="images/visit-memory-place.svg" alt="空旷的咖啡馆或街景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">回到曾经一起去过的地方</h3>
                                <p class="option-desc">熟悉的街角瞬间泛起回忆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="see-photo-or-item">
                            <div class="card-image">
                                <img src="images/see-photo-or-item.svg" alt="散落的照片或纪念物" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看到共同的照片或他留的物品</h3>
                                <p class="option-desc">一张照片/一件小物勾起千言万语</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="see-them-move-on">
                            <div class="card-image">
                                <img src="images/see-them-move-on.svg" alt="社交媒体动态截屏风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">发现对方已开始新生活</h3>
                                <p class="option-desc">看到ta的更新才知道已彻底过去</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
