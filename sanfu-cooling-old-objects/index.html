    <title>三伏天降温，您离不开哪样老物件？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">三伏天降温，您离不开哪样老物件？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">三伏天降温，您离不开哪样老物件？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="palm-leaf-fan">
                            <div class="card-image">
                                <img src="images/palm-leaf-fan.svg" alt="大蒲扇插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">大蒲扇</h3>
                                <p class="option-desc">一把蒲扇摇一夜，风不大却格外亲切。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bamboo-mat">
                            <div class="card-image">
                                <img src="images/bamboo-mat.svg" alt="竹凉席插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">竹凉席</h3>
                                <p class="option-desc">铺开凉席，躺在堂屋里听蝉鸣，暑气散了一半。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="enamel-mug">
                            <div class="card-image">
                                <img src="images/enamel-mug.svg" alt="搪瓷茶缸插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">搪瓷茶缸</h3>
                                <p class="option-desc">凉白开或绿豆汤，倒进搪瓷缸里才够味。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bamboo-recliner">
                            <div class="card-image">
                                <img src="images/bamboo-recliner.svg" alt="竹躺椅插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">竹躺椅</h3>
                                <p class="option-desc">傍晚搬把竹椅到门口，邻里闲聊最是凉快。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>

                </div>
            </div>
