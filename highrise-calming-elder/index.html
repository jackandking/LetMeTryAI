    <title>高楼晃动时，你家老人会想要哪样安抚？四种常见反应哪个最接地气</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">高楼晃动时，你家老人会想要哪样安抚？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">高楼晃动时，你家老人会想要哪样安抚？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hold-handrail-sit">
                            <div class="card-image">
                                <img src="images/hold-handrail-sit.svg" alt="老人握扶手坐下示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">握稳扶手、慢慢坐下</h3>
                                <p class="option-desc">扶着栏杆或墙壁坐稳，稳住步伐和重心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="look-family-photo">
                            <div class="card-image">
                                <img src="images/look-family-photo.svg" alt="老人看家人照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">拿出家人照片或熟物</h3>
                                <p class="option-desc">看熟悉的照片或握着熟悉小物，心情安定下来。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="drink-warm-water">
                            <div class="card-image">
                                <img src="images/drink-warm-water.svg" alt="杯中热茶示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝口温开水或热茶</h3>
                                <p class="option-desc">缓缓喝一口热饮，借此放松与转移注意力（非医疗动作）。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="listen-familiar-song">
                            <div class="card-image">
                                <img src="images/listen-familiar-song.svg" alt="播放老歌或轻声安抚" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">听熟悉的老歌或家人说话</h3>
                                <p class="option-desc">放首熟悉老歌或听亲人轻声安慰，让情绪慢慢平复。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
