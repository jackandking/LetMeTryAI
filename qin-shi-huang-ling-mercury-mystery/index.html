            <h1 id="pageTitle">秦始皇陵的水银之谜，孩子会好奇哪一点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">秦始皇陵的水银之谜，孩子会好奇哪一点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="how-much-mercury">
                            <div class="card-image">
                                <img src="images/how-much-mercury.svg" alt="想象中大量水银像河流在陵墓中" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水银真的很多吗？</h3>
                                <p class="option-desc">想象陵墓里像小河一样流满水银的画面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="why-buried-mercury">
                            <div class="card-image">
                                <img src="images/why-buried-mercury.svg" alt="考古学家讨论水银用途的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">为什么会放水银？</h3>
                                <p class="option-desc">是为了防腐、象征权力，还是古人的想象？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="can-see-mercury">
                            <div class="card-image">
                                <img src="images/can-see-mercury.svg" alt="小朋友想象掀开盖子看到水银的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水银会流出来吗？能看到吗？</h3>
                                <p class="option-desc">孩子会好奇能否打开看见闪亮的液体</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="is-mercury-harmful">
                            <div class="card-image">
                                <img src="images/is-mercury-harmful.svg" alt="家长向孩子解释水银安全的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水银会不会有危险？</h3>
                                <p class="option-desc">担心有毒、会不会伤人，适合家长解释安全常识</p>
                            </div>
                            <div class="check-indicator">✓</div>
