    <title>老房子怀旧角落：你先想起哪个地方？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老房子里你怀念哪个角落？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">老房子里你怀念哪个角落？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="chufang-lao-zao-tai">
                            <div class="card-image">
                                <img src="images/chufang-lao-zao-tai.svg" alt="厨房老灶台" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厨房老灶台</h3>
                                <p class="option-desc">还能想起炉火、锅铲和饭菜香</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chuang-tai-yang-guang-jiao">
                            <div class="card-image">
                                <img src="images/chuang-tai-yang-guang-jiao.svg" alt="窗台阳光" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">窗台的阳光角</h3>
                                <p class="option-desc">午后阳光洒在旧窗台上的慵懒时光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="yang-tai-lao-mu-yi">
                            <div class="card-image">
                                <img src="images/yang-tai-lao-mu-yi.svg" alt="阳台老木椅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">阳台老木椅</h3>
                                <p class="option-desc">晒太阳、下棋或缝补衣物的老木椅记忆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="yuan-zi-xiao-tian-jing">
                            <div class="card-image">
                                <img src="images/yuan-zi-xiao-tian-jing.svg" alt="院子天井" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">院子的小天井</h3>
                                <p class="option-desc">老树、晾衣绳和邻里唠嗑的院落味道</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
