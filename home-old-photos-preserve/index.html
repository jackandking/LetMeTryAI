    <title>珍藏家中旧影像与老照片的方式</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家中旧影像与老照片，你会如何处理或珍藏？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家中旧影像与老照片，你通常会如何处理或珍藏？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="digitize-and-backup">
                            <div class="card-image">
                                <img src="images/digitize-and-backup.svg" alt="扫描老照片并数字存档" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">数字化备份</h3>
                                <p class="option-caption">扫描或拍照存入云端/硬盘，方便长久保存与远程分享。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="album-and-frame-display">
                            <div class="card-image">
                                <img src="images/album-and-frame-display.svg" alt="精装相册和相框展示老照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手工相册与相框展示</h3>
                                <p class="option-caption">整理进相册或装框摆放，作为家中纪念与展示空间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pass-to-family">
                            <div class="card-image">
                                <img src="images/pass-to-family.svg" alt="将老照片传给家人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传给家人保存</h3>
                                <p class="option-caption">把原件或复制件分发给子女、亲友，作为家族传承的一部分。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="creative-reuse-collage">
                            <div class="card-image">
                                <img src="images/creative-reuse-collage.svg" alt="用老照片制作拼贴或纪念品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">创意再利用（拼贴/影集/礼物）</h3>
                                <p class="option-caption">制作拼贴、影集或纪念礼物，让老照片获得新用途与故事延续。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    </script>
</body>
</html>
