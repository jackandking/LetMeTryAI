    <title>家里停水停电，爸妈先准备哪样应急物资？场景对比</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里停水停电，爸妈先准备哪样应急物资？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里停水停电，爸妈会先准备哪样应急物资？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="reserve-water">
                            <div class="card-image">
                                <img src="images/reserve-water.svg" alt="水桶和矿泉水摆在厨房台面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">备用饮用水</h3>
                                <p class="option-desc">装满矿泉水和水桶，优先保证喝水与做饭用水。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="power-bank">
                            <div class="card-image">
                                <img src="images/power-bank.svg" alt="放着充电宝和充电线的客厅小桌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">移动电源（充电宝）</h3>
                                <p class="option-desc">给手机、医用设备和台灯供电，保持联络与简单用电。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-light">
                            <div class="card-image">
                                <img src="images/emergency-light.svg" alt="手电筒和小台灯在床边" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">应急照明（手电/应急灯）</h3>
                                <p class="option-desc">手电或充电应急灯，夜间行动安全省心首选。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-food">
                            <div class="card-image">
                                <img src="images/emergency-food.svg" alt="罐头和饼干整齐摆放在储物柜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">应急食品（罐头/干粮）</h3>
                                <p class="option-desc">罐头、干粮和方便食品，短期内解决就餐问题。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
    </div>
