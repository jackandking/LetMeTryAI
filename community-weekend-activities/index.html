    <title>周末社区活动你会选哪个？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">周末社区活动你会选哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个选项：周末社区活动你更愿意参加哪类？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="square-dance">
                            <div class="card-image">
                                <img src="images/square-dance.svg" alt="老人广场舞场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞</h3>
                                <p class="option-desc">和邻居一起动起来，社交又锻炼</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="taiji">
                            <div class="card-image">
                                <img src="images/taiji.svg" alt="公园太极拳练习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太极拳</h3>
                                <p class="option-desc">舒缓有节奏，适合长期坚持</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="calligraphy-painting-class">
                            <div class="card-image">
                                <img src="images/calligraphy-painting.svg" alt="书法绘画课堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书法与绘画兴趣班</h3>
                                <p class="option-desc">安静学习，培养兴趣与审美</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="volunteer-service">
                            <div class="card-image">
                                <img src="images/volunteer-service.svg" alt="老人参与志愿服务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">志愿服务与公益</h3>
                                <p class="option-desc">助人也愉悦，参与社区志愿活动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
