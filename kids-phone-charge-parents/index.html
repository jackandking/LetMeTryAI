<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子用长辈手机大额充值，你遇到过吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子用长辈手机大额充值，你家遇到过吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="strict-password-control">
                            <div class="card-image">
                                <img src="images/strict-password.svg" alt="家长严格管理手机支付密码" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">严管支付密码</h3>
                                <p class="option-desc">遇到过，现在把支付密码、人脸识别都管得很严。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="communication-education">
                            <div class="card-image">
                                <img src="images/talk-education.svg" alt="家长通过沟通教育孩子正确消费" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">主要靠沟通</h3>
                                <p class="option-desc">遇到过，但更会和孩子讲道理，让他理解钱的概念。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="preventive-rules">
                            <div class="card-image">
                                <img src="images/prevent-rules.svg" alt="家长提前设立手机消费规则" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">提前立规矩</h3>
                                <p class="option-desc">还没遇到过，但已经提前约定了手机使用和消费规则。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="self-disciplined-child">
                            <div class="card-image">
                                <img src="images/self-discipline.svg" alt="孩子自觉理性使用手机消费" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">孩子较自觉</h3>
                                <p class="option-desc">没遇到过，孩子平时花钱比较有分寸。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
