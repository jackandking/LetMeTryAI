<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风夜停电，家里老人更需要哪样应急物品？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风夜停电，家里老人更需要哪样应急物品？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="flashlight-batteries">
                            <div class="card-image">
                                <img src="images/flashlight-batteries.svg" alt="手电筒照亮室内走廊" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手电筒与备用电池</h3>
                                <p class="option-desc">黑暗中有光，走路和找东西更安全</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="power-bank-cables">
                            <div class="card-image">
                                <img src="images/power-bank-cables.svg" alt="充电宝和充电线放在桌上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">充电宝与多口充电线</h3>
                                <p class="option-desc">给手机和必要设备续电，随时联系更安心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="blanket-hand-warmers">
                            <div class="card-image">
                                <img src="images/blanket-hand-warmers.svg" alt="叠好的保暖被与暖手宝放床边" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">保暖被与暖手宝</h3>
                                <p class="option-desc">台风夜气温变低，保暖让老人睡得稳</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-water-pack">
                            <div class="card-image">
                                <img src="images/food-water-pack.svg" alt="应急食品罐头与矿泉水" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">应急食物与饮水</h3>
                                <p class="option-desc">即食热食或矿泉水，夜里补充能量和水分</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
