    <title>社区活动投票</title>
    <script src="../util.js"></script>

<body>
    <h1 id="pageTitle">社区活动投票</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">亲，你最支持哪个选项：邻里活动你最想参加哪种？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="community-calligraphy-class">
                    <img src="images/community-calligraphy-class.svg" alt="书法与国画课程现场" loading="lazy">
                    <span>和邻居一起写字画画，轻松交流</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="community-volunteer-service">
                    <img src="images/community-volunteer-service.svg" alt="邻里志愿者帮助场景" loading="lazy">
                    <span>参与助老、送餐或公益小活动</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="community-square-dance-group">
                    <img src="images/community-square-dance-group.svg" alt="广场舞队伍活动" loading="lazy">
                    <span>大家一起跳舞或做体操，热闹又健康</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="community-weekend-market">
                    <img src="images/community-weekend-market.svg" alt="社区集市摊位" loading="lazy">
                    <span>周末逛市集，交流手作与家常好物</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在汇总实时投票结果...</p>
    </div>

    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>

    <div class="more" id="more"><a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a></div>
