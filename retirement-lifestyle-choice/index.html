    <title>爱老人关注：退休后你最想尝试的生活方式</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爱老人关注：退休后你最想尝试的生活方式</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果是爱老人用户，你最支持哪个选项：退休后最想尝试的生活方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="retirement" value="retirement-travel">
                            <div class="card-image">
                                <img src="images/retirement-travel.svg" alt="退休旅行照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">背起行囊，和家人或朋友去看世界。</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="retirement-gardening">
                            <div class="card-image">
                                <img src="images/retirement-gardening.svg" alt="花园和盆栽" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">种花种菜，享受慢生活和阳台/庭院时光。</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="retirement-volunteering">
                            <div class="card-image">
                                <img src="images/retirement-volunteering.svg" alt="志愿服务场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用时间和经验回馈社区，有意义又充实。</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="retirement" value="retirement-learning">
                            <div class="card-image">
                                <img src="images/retirement-learning.svg" alt="课堂学习场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">学习书法、绘画或智能手机使用，保持头脑活力。</h3>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
