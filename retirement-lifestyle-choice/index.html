    <title>爱老人关注：退休后你最想尝试的生活方式</title>

<body>
    <h1 id="pageTitle">爱老人关注：退休后你最想尝试的生活方式</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果是爱老人用户，你最支持哪个选项：退休后最想尝试的生活方式？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="retirement-travel">
                    <img src="images/retirement-travel.svg" alt="退休旅行照片" loading="lazy">
                    <span>背起行囊，和家人或朋友去看世界。</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="retirement-gardening">
                    <img src="images/retirement-gardening.svg" alt="花园和盆栽" loading="lazy">
                    <span>种花种菜，享受慢生活和阳台/庭院时光。</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="retirement-volunteering">
                    <img src="images/retirement-volunteering.svg" alt="志愿服务场景" loading="lazy">
                    <span>用时间和经验回馈社区，有意义又充实。</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="retirement-learning">
                    <img src="images/retirement-learning.svg" alt="课堂学习场景" loading="lazy">
                    <span>学习书法、绘画或智能手机使用，保持头脑活力。</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在汇总实时投票结果...</p>
    </div>

    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
