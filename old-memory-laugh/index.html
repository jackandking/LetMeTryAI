    <title>哪段老回忆，一想起来就让你笑？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪段老回忆，一想起来就让你笑？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪段老回忆，一想起来就让你笑？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="childhood-mischief">
                            <div class="card-image">
                                <img src="images/childhood-mischief.svg" alt="童年捣蛋回忆插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">童年捣蛋篇</h3>
                                <p class="option-desc">偷摘果子、闯祸被追、和小伙伴满街跑，想起来就咧嘴笑。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="old-games">
                            <div class="card-image">
                                <img src="images/old-games.svg" alt="童年老游戏回忆插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老游戏时光</h3>
                                <p class="option-desc">滚铁环、跳房子、弹玻璃球，那些简单快乐现在依然闪光。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="first-date-awkward">
                            <div class="card-image">
                                <img src="images/first-date-awkward.svg" alt="青涩约会回忆插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青涩约会糗事</h3>
                                <p class="option-desc">第一次牵手紧张出汗、说错话脸红，现在想想又好笑又甜。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="neighborhood-fun">
                            <div class="card-image">
                                <img src="images/neighborhood-fun.svg" alt="街坊邻里回忆插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">街坊邻里热闹</h3>
                                <p class="option-desc">谁家做了好吃的都互相送，大院里笑声不断，人情味满满。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>

        <footer class="page-footer">
