    <title>iPhone降价了，家里会趁机会给孩子换手机吗？家长都怎么想</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">iPhone降价了，家里会趁机会给孩子换手机吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">iPhone降价了，家里会趁机会给孩子换手机吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-new">
                            <div class="card-image">
                                <img src="images/buy-new.svg" alt="家长给孩子换新手机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会，趁机换新的</h3>
                                <p class="option-desc">把降价当福利，给孩子换新机并设置家长管控</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="keep-old">
                            <div class="card-image">
                                <img src="images/keep-old.svg" alt="孩子继续用旧手机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会，继续用现有手机</h3>
                                <p class="option-desc">现在手机还能用，先不换，把预算留给学习或活动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-with-rules">
                            <div class="card-image">
                                <img src="images/buy-with-rules.svg" alt="家长设置手机使用规则" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会，但有限制</h3>
                                <p class="option-desc">同意换机但约定使用时段、安装必要的家长控制或监护软件</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-alternative">
                            <div class="card-image">
                                <img src="images/buy-alternative.svg" alt="用平板或二手机替代" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不买新机，改买平板或二手</h3>
                                <p class="option-desc">选择更经济的平板或二手机，兼顾学习需求与成本</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        </footer>
