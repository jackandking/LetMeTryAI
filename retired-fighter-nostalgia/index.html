    <title>退役战机情怀对比</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">退役战机情怀对比</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为装备党，你更怀念哪款退役战机？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="jian-6">
                            <div class="card-image">
                                <img src="images/jian-6.svg" alt="歼-6 退役战机侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">歼-6</h3>
                                <p class="option-desc">老牌喷气机，承载退役年代的机械记忆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="mig-21">
                            <div class="card-image">
                                <img src="images/mig-21.svg" alt="mig-21 退役战机正面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">米格-21</h3>
                                <p class="option-desc">简洁利落的冷战经典，机身线条硬朗</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-4-phantom">
                            <div class="card-image">
                                <img src="images/f-4-phantom.svg" alt="f-4 幻影战机机腹照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-4 幻影</h3>
                                <p class="option-desc">多用途老将，代表时代的动力与造型美学</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
