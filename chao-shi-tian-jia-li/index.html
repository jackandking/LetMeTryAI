<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">潮湿天家里你在意哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">潮湿天家里你在意哪点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="clothes-damp-smell">
                            <div class="card-image">
                                <img src="images/clothes-damp-smell.svg" alt="潮湿导致衣物发霉和异味" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">衣服和被褥潮臭</h3>
                                <p class="option-desc">衣服晾不干、被子发潮有味，晾晒成日常烦恼</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mold-on-walls-furniture">
                            <div class="card-image">
                                <img src="images/mold-on-walls-furniture.svg" alt="墙面发霉和家具受潮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">墙面／家具发霉变色</h3>
                                <p class="option-desc">墙角、木柜长斑，老家具受潮变形让人心疼</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="slippery-floors-safety">
                            <div class="card-image">
                                <img src="images/slippery-floors-safety.svg" alt="潮湿天地面湿滑的危险" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">地面湿滑有摔倒风险</h3>
                                <p class="option-desc">地板潮湿容易滑倒，家里老人走路更让人担心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stuffy-air-breathing">
                            <div class="card-image">
                                <img src="images/stuffy-air-breathing.svg" alt="房间空气闷和潮湿霉味" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">室内闷湿有霉味</h3>
                                <p class="option-desc">屋里空气闷、霉味难散，想通风又怕更潮</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
