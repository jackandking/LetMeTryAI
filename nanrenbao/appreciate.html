<body>
    <header>
        <a href="index.html" class="nav-back">← 返回</a>
        <h1>欣赏美女</h1>
    </header>
    
    <div class="container">
        <div id="loading">正在加载图片...</div>
        <div id="no-images">暂无图片，快去上传吧！</div>
        <div id="gallery" class="gallery"></div>
    </div>
    
    <footer>
        <p>&copy; 2025 男人宝. 保留所有权利.</p>
    </footer>

    <script>
        // Load images from database
        async function loadImages() {
            const loading = document.getElementById('loading');
            const gallery = document.getElementById('gallery');
            const noImages = document.getElementById('no-images');

            try {
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'SELECT id, image_url, created_at FROM beauty_images ORDER BY created_at DESC',
                        params: []
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data && data.length > 0) {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';
                        
                        const img = document.createElement('img');
                        img.src = item.image_url;
                        img.alt = '美女图片';
                        img.onerror = function() {
                            // 图片加载失败时隐藏整个图片容器
                            div.style.display = 'none';
                            console.log('图片加载失败，已隐藏:', item.image_url);
                        };
                        
                        div.appendChild(img);
                        gallery.appendChild(div);
                    });
                } else {
                    noImages.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                loading.textContent = '加载失败，请稍后重试';
            }
        }

        // Load images when page loads
        window.addEventListener('DOMContentLoaded', loadImages);
    </script>
