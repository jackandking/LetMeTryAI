    <script>
        // Check URL parameters for ad completion
        function handleAdReturn() {
            const urlParams = new URLSearchParams(window.location.search);
            const finishedAd = urlParams.get('finishedAd');
            
            if (finishedAd !== null) {
                let pointsToAdd = 0;
                let message = '';
                
                if (finishedAd === 'true') {
                    // User watched full ad
                    pointsToAdd = 10;
                    message = '🎉 感谢观看完整广告！获得 10 积分';
                } else {
                    // User didn't finish ad
                    pointsToAdd = 3;
                    message = '👍 感谢观看！获得 3 积分';
                }
                
                // Award points
                PointsSystem.addPoints(pointsToAdd);
                
                // Update display
                updatePointsDisplay();
                
                // Show notification
                showPointsNotification(message);
                
                // Clean URL without page reload
                const cleanUrl = window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        }

        /**
         * Shows advertisement for earning points
         */
        function showAdForPoints() {
                const urlParams = new URLSearchParams(window.location.search);
                const debugMode = urlParams.get('debug') === 'true';
                if (debugMode) {
                    // In non-miniapp debug mode, directly award full ad points
                    PointsSystem.addPoints(PointsSystem.POINTS_CONFIG.AD_FULL);
                    updatePointsDisplay();
                    showPointsNotification(`🎉 Debug 模式：已获得 ${PointsSystem.POINTS_CONFIG.AD_FULL} 积分`);
                    return;
                }

                if (typeof ks !== 'undefined' && ks.navigateTo) {
                    ks.navigateTo({
                        url: "/pages/showRewardedVideoAd/showRewardedVideoAd?result_page_id=nanrenbao/appreciate",
                    });
                } else {
                    // Fallback for testing in browser
                    console.log('Mini-program navigation not available');
                    showPointsNotification('⚠️ 广告功能仅在小程序中可用');
                }
        }

        /**
         * 转发得积分（H5 荣誉体系，浏览器无法验证是否真转发，每日限 10 次）。
         * 优先调起系统分享面板；不支持时用「复制链接」兜底，再发分。
         * 注：快手小程序内此按钮会被隐藏（见 IS_KUAISHOU 处理），避免「点一下就误发分」。
         */
        async function shareForPoints() {
            const shareUrl = (window.location.origin + '/nanrenbao/appreciate.html');
            const shareData = {
                title: '男人宝 · 欣赏美女',
                text: '来看看男人宝的美女画廊，转发还能赚积分~',
                url: shareUrl
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // 用户主动取消分享：不发分
                    if (err && err.name === 'AbortError') {
                        showPointsNotification('已取消转发，未获得积分');
                        return;
                    }
                    // 其他异常（如环境不允许）继续走兜底发分
                }
            } else {
                // 桌面端 / 不支持 Web Share：复制链接兜底
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    showPointsNotification('🔗 链接已复制，转发到微信/快手即可得积分');
                } catch (e) {
                    showPointsNotification('请手动复制地址栏链接转发');
                }
            }

            // 发分（每日限 10 次，由 PointsSystem 控制）
            const result = PointsSystem.awardSharePoints();
            updatePointsDisplay();
            showPointsNotification(result.message);
            updateShareButton();
        }

        /**
         * 刷新转发按钮状态：显示今日剩余次数；快手内该按钮已隐藏，直接返回。
         */
        function updateShareButton() {
            const btn = document.getElementById('shareForPointsBtn');
            if (!btn) return;
            if (IS_KUAISHOU) {
                // 快手内隐藏转发得积分（点一下就误发分，且无平台回执校验）
                btn.style.display = 'none';
                return;
            }
            const remaining = PointsSystem.getShareRemainingToday();
            if (remaining <= 0) {
                btn.disabled = true;
                btn.textContent = '✅ 今日已拿满';
            } else {
                btn.disabled = false;
                btn.textContent = `🔗 转发得积分（剩 ${remaining} 次）`;
            }
        }

        /**
         * 运行环境检测：页面同时跑在浏览器和快手小程序 webview 里，两端各只显示能正常工作的入口。
         * - 看广告得积分：仅快手内可用（ks.navigateTo 拉起激励视频），浏览器隐藏
         * - 转发得积分：仅浏览器可用（honor-system），快手内误发分，隐藏
         */
        const IS_KUAISHOU = (typeof ks !== 'undefined' && typeof ks.navigateTo === 'function');
        function applyEnvAwareButtons() {
            const watchAdBtn = document.getElementById('watchAdBtn');
            const shareBtn = document.getElementById('shareForPointsBtn');
            // 看广告：仅快手可见
            if (watchAdBtn) watchAdBtn.style.display = IS_KUAISHOU ? '' : 'none';
            // 转发：仅浏览器可见（快手内隐藏）
            if (shareBtn) {
                if (IS_KUAISHOU) shareBtn.style.display = 'none';
            }
        }

        // Initialize points system (don't handle ad return yet)
        const pointsInfo = PointsSystem.initialize();
        const pointsValueElement = document.getElementById('pointsValue');
        const pointsNotification = document.getElementById('pointsNotification');

        // Update points display
        function updatePointsDisplay() {
            pointsValueElement.textContent = PointsSystem.getPoints();
        }

        // Show points notification
        function showPointsNotification(message) {
            pointsNotification.textContent = message;
            pointsNotification.style.display = 'block';
            
            setTimeout(() => {
                pointsNotification.style.display = 'none';
            }, 3000);
        }

        // 通用埋点：复用后端 /api/track（与充值页 payment_intent 同源），
        // 用于统计「积分墙」使用意愿（points_blocked / points_blocked_cta）。
        const TRACK_ENDPOINT = 'https://letmetry.cn/api/track';
        function trackEvent(event, extra) {
            try {
                const payload = Object.assign({
                    event: event,
                    appId: 'nanrenbao-appreciate',
                    userUuid: (PointsSystem && PointsSystem.getUserUUID) ? PointsSystem.getUserUUID() : null,
                    timestamp: Date.now(),
                    date: new Date().toISOString().split('T')[0]
                }, extra || {});
                const body = JSON.stringify(payload);
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(TRACK_ENDPOINT, body);
                } else {
                    fetch(TRACK_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
                }
            } catch (e) { /* 埋点失败静默 */ }
        }

        // 本会话已上报过「积分墙」事件的图片（去重，避免同一张图重复计数）
        const blockedReported = new Set();

        function showPointsBlockedModal(imageId, sourceImageUrl) {
            const need = PointsSystem.POINTS_CONFIG.VIEW_IMAGE;
            const msg = document.getElementById('pbcMessage');
            if (msg) msg.innerHTML = `查看这张美图需要 ${need} 积分，当前积分不够啦。<br>充值或转发都能快速获得积分~`;

            // 上报积分墙事件（每图每会话仅一次）
            if (imageId != null && !blockedReported.has(imageId)) {
                blockedReported.add(imageId);
                trackEvent('points_blocked', { imageId: imageId, pointsLeft: PointsSystem.getPoints() });
            }

            const overlay = document.getElementById('pointsBlockedModal');
            const adBtn = document.getElementById('pbcAdBtn');
            if (adBtn) adBtn.style.display = IS_KUAISHOU ? 'block' : 'none';
            if (overlay) overlay.classList.add('show');

            // CTA 只绑定一次
            if (overlay && !overlay.dataset.bound) {
                overlay.dataset.bound = '1';
                document.getElementById('pbcRechargeBtn').onclick = function () {
                    trackEvent('points_blocked_cta', { cta: 'recharge', imageId: imageId });
                    window.location.href = 'recharge.html';
                };
                document.getElementById('pbcShareBtn').onclick = function () {
                    trackEvent('points_blocked_cta', { cta: 'share', imageId: imageId });
                    hidePointsBlockedModal();
                    shareForPoints();
                };
                document.getElementById('pbcAdBtn').onclick = function () {
                    trackEvent('points_blocked_cta', { cta: 'watch_ad', imageId: imageId });
                    hidePointsBlockedModal();
                    showAdForPoints();
                };
                document.getElementById('pbcDismissBtn').onclick = function () {
                    trackEvent('points_blocked_cta', { cta: 'dismiss', imageId: imageId });
                    hidePointsBlockedModal();
                };
                overlay.onclick = function (e) {
                    if (e.target === overlay) hidePointsBlockedModal();
                };
            }
        }

        function hidePointsBlockedModal() {
            const overlay = document.getElementById('pointsBlockedModal');
            if (overlay) overlay.classList.remove('show');
        }

        // Initialize display
        updatePointsDisplay();
        applyEnvAwareButtons();
        updateShareButton();

        // Show notifications for new user or daily visit
        if (pointsInfo.isNewUser) {
            showPointsNotification(`🎉 欢迎新用户！获得 ${PointsSystem.POINTS_CONFIG.NEW_USER} 积分`);
        } else if (pointsInfo.dailyVisit.awarded) {
            showPointsNotification(`✨ 每日签到奖励！+${pointsInfo.dailyVisit.points} 积分`);
        }

        // Modal functionality
        const fullModal = document.getElementById('fullImageModal');
        const fullImg = document.getElementById('fullImageModalImg');

        // Keep existing database records unchanged while serving legacy image
        // paths from the new backend host.
        function normalizeStoredImageUrl(imageUrl) {
            if (typeof imageUrl !== 'string') return imageUrl;
            try {
                const url = new URL(imageUrl, window.location.origin);
                if (url.hostname === 'letmetry.cn' || url.hostname === 'museumcheck.cn') {
                    url.protocol = 'https:';
                    url.hostname = 'letmetry.cn';
                    return url.toString();
                }
            } catch (error) {
                // Keep malformed or relative values unchanged.
            }
            return imageUrl;
        }

        function shuffleImages(images) {
            const shuffled = images.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Update blur overlay for unlocked image
        function updateBlurOverlay(imageUrl, sourceImageUrl = imageUrl) {
            // Find the gallery item with this image URL
            const galleryItems = document.querySelectorAll('.gallery-item');
            function normalize(u) {
                try {
                    const o = new URL(u, window.location.origin);
                    o.search = '';
                    return o.href.replace(/\/$/, '');
                } catch (e) {
                    return (u || '').split('?')[0].replace(/\/$/, '');
                }
            }

            const target = normalize(imageUrl);
            galleryItems.forEach(item => {
                const img = item.querySelector('img');
                if (!img) return;
                const src = normalize(img.src);
                // consider match if normalized URLs equal or one contains the other (handle truncated/params)
                const matched = src === target || src.startsWith(target) || target.startsWith(src) || src.includes(target) || target.includes(src);
                if (!matched) return;

                const blurOverlay = item.querySelector('.blur-overlay');
                if (!blurOverlay) return;
                const viewStatus = PointsSystem.canViewImage(sourceImageUrl);
                if (!viewStatus.needsPayment) {
                    // Update to unlocked state
                    blurOverlay.innerHTML = `<div style="font-size: 0.9em;">已解锁 ${viewStatus.daysLeft} 天</div>`;
                    blurOverlay.style.background = 'linear-gradient(to bottom, transparent 70%, rgba(76, 175, 80, 0.9))';
                    blurOverlay.style.backdropFilter = 'none';
                    blurOverlay.style.webkitBackdropFilter = 'none';
                }
            });
        }

        async function showModal(imageUrl, sourceImageUrl = imageUrl) {
            // 后宫激活后，自动收录图片且无需再花积分
            if (window.isHaremActivated && window.isHaremActivated()) {
                if (window.addHaremImage) window.addHaremImage(imageUrl);
                if (PointsSystem && typeof PointsSystem.markImageViewed === 'function') {
                    await PointsSystem.markImageViewed(sourceImageUrl);
                }
                updateBlurOverlay(imageUrl, sourceImageUrl);
                if (window.NbbExp) window.NbbExp.logView(getImageIdFromUrl(sourceImageUrl));
                // Show fullscreen image for better viewing experience
                showFullImage(imageUrl);
                return;
            }

            // Check if user can view the image
            const viewStatus = PointsSystem.canViewImage(sourceImageUrl);
            if (!viewStatus.canView) {
                // 积分不足：弹出引导面板（含充值/转发/看广告入口），并上报后台事件用于统计使用意愿
                showPointsBlockedModal(getImageIdFromUrl(sourceImageUrl), sourceImageUrl);
                return;
            }
            // Process the view (deduct points if needed)
            const result = await PointsSystem.viewImage(sourceImageUrl);
            if (!result.success) {
                showPointsNotification(`❌ ${result.message}`);
                return;
            }
            // A/B 实验埋点：成功查看大图
            if (window.NbbExp) window.NbbExp.logView(getImageIdFromUrl(sourceImageUrl));
            // 自动收录到后宫（如果已激活）
            if (window.isHaremActivated && window.isHaremActivated()) {
                if (window.addHaremImage) window.addHaremImage(imageUrl);
            }
            // Update points display
            updatePointsDisplay();
            if (result.pointsSpent > 0) {
                showPointsNotification(`💎 ${result.message}`);
                updateBlurOverlay(imageUrl, sourceImageUrl);
            }
            showFullImage(imageUrl);
        }

        // A/B 实验埋点：sourceImageUrl → beauty_images.id 映射（查看事件定位图片用）
        const imageIdByUrl = {};
        function getImageIdFromUrl(url) {
            var id = imageIdByUrl[url];
            return id == null ? null : id;
        }

        // Fullscreen modal helpers
        function showFullImage(url) {
            if (!fullModal || !fullImg) return;
            fullImg.src = url;
            fullModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function hideFullImage() {
            if (!fullModal || !fullImg) return;
            fullModal.style.display = 'none';
            fullImg.src = '';
            document.body.style.overflow = '';
        }

        // Close fullscreen modal with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && fullModal && fullModal.style.display && fullModal.style.display !== 'none') {
                hideFullImage();
            }
        });

        // Load images from database
        async function loadImages() {
            const loading = document.getElementById('loading');
            const gallery = document.getElementById('gallery');
            const noImages = document.getElementById('no-images');

            try {
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        // Only return approved images that are not marked deleted
                        // subject：人物名称实验数据源（prompt_dna.subject，无则为 NULL）
                        sql: `SELECT id, image_url, view_count, coverage_pct, created_at, JSON_UNQUOTE(JSON_EXTRACT(prompt_dna, '$.subject')) AS subject FROM beauty_images WHERE deleted = 0 AND review_status = ? ORDER BY view_count DESC, created_at DESC`,
                        params: ['approved']
                    })
                });

                let data = await response.json();
                loading.style.display = 'none';

                // 后宫门禁：遮蔽度 coverage_pct < 50 的图仅对已激活「后宫」的用户展示。
                // 说明：此规则只作用于欣赏美女页；快手任务落地页(beauty-scratch)与
                // 刮刮乐(scratch-lottery)不做过滤。NULL=未知遮蔽度（如 legacy 存量）不拦截。
                if (!(window.isHaremActivated && window.isHaremActivated())) {
                    const before = data && data.length ? data.length : 0;
                    data = (data || []).filter(item => item.coverage_pct == null || Number(item.coverage_pct) >= 50);
                    const hidden = before - data.length;
                    if (hidden > 0) {
                        const notice = document.getElementById('harem-gate-notice');
                        const text = document.getElementById('harem-gate-text');
                        if (text) text.textContent = `还有 ${hidden} 幅作品在密室中等你。`;
                        if (notice) notice.style.display = 'block';
                    }
                }

                // Shuffle on every load so popularity does not determine exposure order.
                if (data && data.length > 0) {
                    data = shuffleImages(data);
                }

                if (data && data.length > 0) {
                    data.forEach(item => {
                        try {
                            const sourceImageUrl = item.image_url;
                            imageIdByUrl[sourceImageUrl] = item.id;
                            const imageUrl = normalizeStoredImageUrl(sourceImageUrl);
                            const div = document.createElement('div');
                            div.className = 'gallery-item';
                            div.id = 'img-' + item.id; // 深链锚点：审核后可 #img-<id> 直达此卡片
                            div.dataset.imgId = item.id; // 曝光埋点定位用
                            
                            const imageWrapper = document.createElement('div');
                            imageWrapper.className = 'image-wrapper';
                            
                            const img = document.createElement('img');
                            img.src = imageUrl;
                            img.alt = '美女图片';
                            img.onerror = function() {
                                // 图片加载失败时隐藏整个图片容器
                                div.style.display = 'none';
                                console.log('图片加载失败，已隐藏:', imageUrl);
                            };
                            
                            const blurOverlay = document.createElement('div');
                            blurOverlay.className = 'blur-overlay';
                            
                            // Check if image has been viewed
                            try {
                                const viewStatus = PointsSystem.canViewImage(sourceImageUrl);
                                const viewCount = item.view_count || 0;
                                const viewCountText = viewCount > 0 ? `<div style="font-size: 0.7em; margin-top: 3px; opacity: 0.8;">🔥 ${viewCount}人已看</div>` : '';
                                
                                if (viewStatus.needsPayment) {
                                    // Not viewed or expired - show cost with blur
                                    blurOverlay.innerHTML = `<div>点击查看</div><div style="font-size: 0.8em; margin-top: 5px;">消费 ${PointsSystem.POINTS_CONFIG.VIEW_IMAGE} 积分</div>${viewCountText}`;
                                    imageWrapper.appendChild(blurOverlay);
                                } else {
                                    // Already viewed - no blur, just show small indicator
                                    blurOverlay.innerHTML = `<div style="font-size: 0.9em;">已解锁 ${viewStatus.daysLeft} 天</div>${viewCountText}`;
                                    blurOverlay.style.background = 'linear-gradient(to bottom, transparent 70%, rgba(76, 175, 80, 0.9))';
                                    blurOverlay.style.backdropFilter = 'none';
                                    blurOverlay.style.webkitBackdropFilter = 'none';
                                    imageWrapper.appendChild(blurOverlay);
                                }
                            } catch (err) {
                                // Fallback to default display if check fails
                                console.warn('查看状态检查失败:', err);
                                blurOverlay.innerHTML = `<div>点击查看</div><div style="font-size: 0.8em; margin-top: 5px;">消费 ${PointsSystem.POINTS_CONFIG.VIEW_IMAGE} 积分</div>`;
                                imageWrapper.appendChild(blurOverlay);
                            }
                            
                                imageWrapper.appendChild(img);
                                div.appendChild(imageWrapper);

                                // Small top-right delete X (non-obtrusive)
                                const deleteX = document.createElement('button');
                                deleteX.className = 'delete-x';
                                deleteX.textContent = '✕';
                                deleteX.title = '标记删除（消耗 ' + PointsSystem.POINTS_CONFIG.DELETE_IMAGE + ' 积分）';
                                deleteX.onclick = async function(e) {
                                    e.stopPropagation();
                                    const ok = window.confirm('确认消耗 ' + PointsSystem.POINTS_CONFIG.DELETE_IMAGE + ' 积分将该图片标记为删除吗？');
                                    if (!ok) return;
                                    try {
                                        const res = await PointsSystem.deleteImage(sourceImageUrl);
                                        updatePointsDisplay();
                                        showPointsNotification(res.message || (res.success ? '已标记为删除' : '删除失败'));
                                        if (res.success) div.style.display = 'none';
                                    } catch (err) {
                                        console.error('删除请求异常:', err);
                                        showPointsNotification('删除失败，请稍后重试');
                                    }
                                };

                                // append delete X to image wrapper so it doesn't cover the image center
                                imageWrapper.appendChild(deleteX);

                                // Click to view full image
                                div.onclick = function() {
                                    // Mark as viewed for prioritization
                                    PointsSystem.markImageIdAsViewed(item.id, 'beauty');
                                    // A/B 实验埋点：点击意图（先于积分校验，积分不足也计数）
                                    if (window.NbbExp) window.NbbExp.logClick(item.id);
                                    showModal(imageUrl, sourceImageUrl);
                                };

                                gallery.appendChild(div);
                        } catch (itemError) {
                            console.error('创建图片项失败:', itemError, item);
                        }
                    });
                    // A/B 实验：渲染完成后加名称角标 + 启动曝光追踪
                    if (window.NbbExp) window.NbbExp.onGalleryRendered(data);
                } else {
                    noImages.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                loading.textContent = '加载失败，请稍后重试';
            }
        }

        // Load images and handle ad return when page loads
        window.addEventListener('DOMContentLoaded', function() {
            // First, handle ad return to update points
            handleAdReturn();
            
            // Then load images
            loadImages();
        });
    </script>
    
    <!-- VConsole for mobile debugging - loads only when ?debug=true is in URL -->
    <script>
        // Load and initialize VConsole only if debug parameter is present
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                // Dynamically load VConsole script only when needed
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                script.onerror = function() {
                    console.warn('Failed to load VConsole. Debug mode unavailable.');
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
