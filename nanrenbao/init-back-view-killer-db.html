<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背影杀数据库初始化</title>
    <script src="../config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            text-align: center;
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.9em;
        }

        .log {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ 背影杀数据库初始化</h1>
        
        <div id="status" class="status"></div>
        
        <div style="margin: 20px 0;">
            <p><strong>此页面将创建以下数据库表：</strong></p>
            <pre>back_view_images
- id (INT, Primary Key)
- back_image_url (VARCHAR, 背影图片URL)
- front_image_url (VARCHAR, 正面图片URL)
- click_count (INT, 点击次数)
- created_at (DATETIME)
- updated_at (DATETIME)</pre>
        </div>

        <button id="initBtn" onclick="initializeDatabase()">🚀 初始化数据库</button>

        <div id="log" class="log" style="display: none;">
            <h3>执行日志：</h3>
            <div id="logEntries"></div>
        </div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function addLogEntry(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const logEntries = document.getElementById('logEntries');
            
            logDiv.style.display = 'block';
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#333';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            
            logEntries.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function initializeDatabase() {
            const btn = document.getElementById('initBtn');
            btn.disabled = true;
            btn.textContent = '正在初始化...';

            showStatus('正在创建数据库表...', 'info');
            addLogEntry('开始初始化数据库');

            const createTableSQL = `
                CREATE TABLE IF NOT EXISTS back_view_images (
                    id INT AUTO_INCREMENT PRIMARY KEY,
                    back_image_url VARCHAR(2048) NOT NULL COMMENT 'URL of the back view image',
                    front_image_url VARCHAR(2048) NOT NULL COMMENT 'URL of the front view image',
                    click_count INT DEFAULT 0 NOT NULL COMMENT 'Number of times the back view has been clicked to reveal front',
                    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                    updated_at DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                    INDEX idx_created_at (created_at),
                    INDEX idx_click_count (click_count),
                    UNIQUE INDEX idx_back_image (back_image_url(255)),
                    UNIQUE INDEX idx_front_image (front_image_url(255))
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci
            `;

            try {
                addLogEntry('发送创建表请求到服务器...');
                
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: createTableSQL,
                        params: []
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const result = await response.json();
                addLogEntry('数据库表创建成功', 'success');
                addLogEntry(JSON.stringify(result, null, 2));

                // Verify table structure
                addLogEntry('验证表结构...');
                const verifyResponse = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'DESCRIBE back_view_images',
                        params: []
                    })
                });

                if (verifyResponse.ok) {
                    const schema = await verifyResponse.json();
                    addLogEntry('表结构验证成功', 'success');
                    addLogEntry('表结构：\n' + JSON.stringify(schema, null, 2));
                    
                    showStatus('✅ 数据库初始化成功！back_view_images 表已创建', 'success');
                } else {
                    addLogEntry('无法验证表结构，但表可能已创建', 'info');
                    showStatus('✅ 数据库表已创建（无法验证结构）', 'success');
                }

                btn.textContent = '✅ 初始化完成';
                
            } catch (error) {
                console.error('Initialization error:', error);
                addLogEntry('初始化失败: ' + error.message, 'error');
                showStatus('❌ 初始化失败: ' + error.message, 'error');
                
                btn.disabled = false;
                btn.textContent = '🚀 重试初始化';
            }
        }
    </script>
</body>
</html>
