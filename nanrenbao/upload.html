<body>
    <header>
        <a href="index.html" class="nav-back">← 返回</a>
        <h1>上传美女</h1>
        <div class="points-display">
            <span class="points-icon">💎</span>
            <span id="pointsValue">0</span> 分
        </div>
    </header>

    <!-- Points notification -->
    <div id="pointsNotification" class="points-notification"></div>
    
    <div class="container">
        <div class="upload-form">
            <div class="maintenance-banner" id="maintenanceBanner" style="display:none;">
                <strong>内部使用</strong>
                此页面仅供内部管理使用，不对外公开链接。
            </div>
            <form id="uploadForm">
                <input type="hidden" id="imageUrl" name="imageUrl">

                <div class="form-group upload-control">
                    <label>本地图片上传：</label>
                    <div class="file-upload-row">
                        <input type="file" id="localFileInput" accept="image/*" style="display:none">
                        <button type="button" id="localFileBtn" class="file-btn">📁 选择本地图片</button>
                        <span id="localFileName" class="file-name">未选择文件</span>
                    </div>
                    <div class="compress-hint">📦 本地图片将自动压缩至500KB以内，适合手机浏览</div>
                </div>

                <div class="allowed-domains upload-control" style="background-color: #e8f5e9; border: 1px solid #4caf50;">
                    <h3>💎 积分获取方式：</h3>
                    <ul>
                        <li>每日访问：+10 积分</li>
                        <li>上传图片：+10 积分/张</li>
                        <li>查看图片消费：-1 积分/张（3天内免费重看）</li>
                    </ul>
                </div>

                <div class="preview-area upload-control" id="previewArea">
                    <img id="previewImage" alt="预览图片">
                </div>

                <button type="submit" class="submit-btn upload-control" id="submitBtn">提交上传</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>
    
    <footer>

    <script>
        const UPLOAD_DISABLED = false;
        const UPLOAD_DISABLED_MESSAGE = '上传功能暂时关闭，请稍后重试。';
        const REVIEW_PENDING_STATUS = 'pending';

        // Initialize points system
        const pointsInfo = PointsSystem.initialize();
        const pointsValueElement = document.getElementById('pointsValue');
        const pointsNotification = document.getElementById('pointsNotification');

        // Update points display
        function updatePointsDisplay() {
            pointsValueElement.textContent = PointsSystem.getPoints();
        }

        // Show points notification
        function showPointsNotification(message) {
            pointsNotification.textContent = message;
            pointsNotification.style.display = 'block';
            
            setTimeout(() => {
                pointsNotification.style.display = 'none';
            }, 3000);
        }

        // Initialize display
        updatePointsDisplay();

        // Show notifications for new user or daily visit
        if (pointsInfo.isNewUser) {
            showPointsNotification(`🎉 欢迎新用户！获得 ${PointsSystem.POINTS_CONFIG.NEW_USER} 积分`);
        } else if (pointsInfo.dailyVisit.awarded) {
            showPointsNotification(`✨ 每日签到奖励！+${pointsInfo.dailyVisit.points} 积分`);
        }

        // 现在直接使用 window.isValidImageUrl(url)

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Local file state
        let localFile = null;

        // File input elements
        const localFileInput = document.getElementById('localFileInput');
        const localFileBtn = document.getElementById('localFileBtn');
        const localFileNameEl = document.getElementById('localFileName');

        // File button click
        localFileBtn.addEventListener('click', function() {
            localFileInput.click();
        });

        // File selected
        localFileInput.addEventListener('change', function() {
            const file = this.files && this.files[0];
            if (file) {
                localFile = file;
                localFileNameEl.textContent = file.name;
                localFileNameEl.className = 'file-name selected';
                // Clear URL input when file is selected
                imageUrlInput.value = '';
                previewArea.style.display = 'none';
                // Show local preview
                const objectUrl = URL.createObjectURL(file);
                previewImage.onload = function() { URL.revokeObjectURL(objectUrl); };
                previewImage.src = objectUrl;
                previewArea.style.display = 'block';
            } else {
                localFile = null;
                localFileNameEl.textContent = '未选择文件';
                localFileNameEl.className = 'file-name';
            }
        });

        // Generate UUID for unique filenames
        function generateUUID() {
            if (window.crypto && window.crypto.randomUUID) {
                return window.crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Compress image file to ≤500KB
        async function compressImageFile(file, maxWidth, maxHeight, quality) {
            maxWidth = maxWidth || 800;
            maxHeight = maxHeight || 1440;
            quality = quality || 0.85;
            var MAX_FILE_SIZE = 500 * 1024;
            var MIN_QUALITY = 0.3;
            var QUALITY_STEP = 0.1;
            return new Promise(function(resolve, reject) {
                var img = new Image();
                var objectUrl = URL.createObjectURL(file);
                img.onload = function() {
                    URL.revokeObjectURL(objectUrl);
                    var w = img.naturalWidth || img.width;
                    var h = img.naturalHeight || img.height;
                    if (w > maxWidth || h > maxHeight) {
                        var ratio = Math.min(maxWidth / w, maxHeight / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    var currentQuality = quality;
                    function attempt() {
                        canvas.toBlob(function(blob) {
                            if (!blob) { return reject(new Error('图片压缩失败')); }
                            if (blob.size > MAX_FILE_SIZE && currentQuality > MIN_QUALITY) {
                                currentQuality = Math.max(Math.round((currentQuality - QUALITY_STEP) * 10) / 10, MIN_QUALITY);
                                attempt();
                            } else {
                                var uuid = generateUUID();
                                resolve(new File([blob], uuid + '.jpg', { type: 'image/jpeg', lastModified: Date.now() }));
                            }
                        }, 'image/jpeg', currentQuality);
                    }
                    attempt();
                };
                img.onerror = function() { URL.revokeObjectURL(objectUrl); reject(new Error('图片加载失败')); };
                img.src = objectUrl;
            });
        }

        // Upload file to image API and return response JSON
        async function uploadFileToImageApi(file) {
            var formData = new FormData();
            formData.append('file', file);
            var resp;
            try {
                resp = await fetch(window.API_ENDPOINTS.IMAGE_UPLOAD, { method: 'POST', body: formData });
            } catch (err) {
                throw new Error('上传请求失败：' + (err.message || '网络错误'));
            }
            if (!resp.ok) {
                var bodyText = '';
                try { bodyText = await resp.text(); } catch (e) { bodyText = ''; }
                var msg = bodyText ? ('图片上传失败：' + bodyText) : ('图片上传失败：HTTP ' + resp.status);
                throw new Error(msg);
            }
            try {
                return await resp.json();
            } catch (err) {
                try { return { url: await resp.text() }; } catch (e) { throw new Error('图片上传后解析响应失败: ' + e.message); }
            }
        }

        // Extract image URL from API response.
        // Tries known response shapes in order; falls back to the first http string value.
        function extractImageUrlFromResponse(json) {
            if (!json) { return null; }
            if (json.url) { return json.url; }
            if (json.path) { return json.path.startsWith('http') ? json.path : window.getImageUrl(json.path); }
            if (json.data && json.data.url) { return json.data.url; }
            if (json.file && json.file.url) { return json.file.url; }
            for (var v of Object.values(json)) {
                if (typeof v === 'string' && v.startsWith('http')) { return v; }
            }
            return null;
        }

        // Preview image from URL input
        const imageUrlInput = document.getElementById('imageUrl');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');

        imageUrlInput.addEventListener('input', function() {
            // Clear local file when user types a URL
            if (this.value.trim()) {
                localFile = null;
                localFileInput.value = '';
                localFileNameEl.textContent = '未选择文件';
                localFileNameEl.className = 'file-name';
            }
        });

        imageUrlInput.addEventListener('blur', function() {
            const url = this.value.trim();
            if (url) {
                const validation = isValidImageUrl(url);
                if (validation.valid) {
                    previewImage.src = url;
                    previewArea.style.display = 'block';
                    previewImage.onerror = function() {
                        showMessage('图片加载失败，请检查URL是否正确', 'error');
                        previewArea.style.display = 'none';
                    };
                } else {
                    showMessage(validation.error, 'error');
                    previewArea.style.display = 'none';
                }
            } else {
                previewArea.style.display = 'none';
            }
        });

        // Submit form
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const uploadFormCard = document.querySelector('.upload-form');

        if (UPLOAD_DISABLED) {
            uploadFormCard.classList.add('is-disabled');
        }

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (UPLOAD_DISABLED) {
                showMessage(UPLOAD_DISABLED_MESSAGE, 'error');
                return;
            }

            // Only local files are accepted. The image service generates the
            // stored URL after the file upload completes.
            if (!localFile) {
                showMessage('请选择本地图片后再提交', 'error');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;

            let url = '';

            // --- Local file upload path ---
            if (localFile) {
                try {
                    submitBtn.textContent = '压缩中...';
                    const compressed = await compressImageFile(localFile);
                    submitBtn.textContent = '上传图片中...';
                    const apiResponse = await uploadFileToImageApi(compressed);
                    const uploadedUrl = extractImageUrlFromResponse(apiResponse);
                    if (!uploadedUrl) {
                        throw new Error('未能从服务器响应中获取图片URL');
                    }
                    url = uploadedUrl;
                } catch (err) {
                    console.error('Local file upload error:', err);
                    showMessage('本地图片上传失败：' + (err.message || '请稍后重试'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交上传';
                    return;
                }
            }

            submitBtn.textContent = '检查中...';

            try {
                // Check if image URL already exists
                const checkResponse = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'SELECT id FROM beauty_images WHERE image_url = ?',
                        params: [url]
                    })
                });

                const existingImages = await checkResponse.json();
                
                if (existingImages && existingImages.length > 0) {
                    showMessage('⚠️ 该图片已存在，请勿重复上传', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交上传';
                    return;
                }

                // Image doesn't exist, proceed with submission
                submitBtn.textContent = '提交审核中...';

                const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
                const sourceType = 'local_file';
                
                // Insert into database
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'INSERT INTO beauty_images (image_url, created_at, review_status, submitted_at, source_type) VALUES (?, ?, ?, ?, ?)',
                        params: [url, now, REVIEW_PENDING_STATUS, now, sourceType]
                    })
                });

                if (!response.ok) {
                    throw new Error('上传失败');
                }

                const result = await response.json();
                
                if (result.affectedRows > 0) {
                    showMessage('提交成功！图片已进入审核队列，审核通过后才会展示并发放积分。', 'success');
                    showPointsNotification('🛡️ 内容审核中，审核通过后发放上传积分');
                    
                    uploadForm.reset();
                    localFile = null;
                    localFileNameEl.textContent = '未选择文件';
                    localFileNameEl.className = 'file-name';
                    previewArea.style.display = 'none';
                    
                    // Redirect to appreciate page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    throw new Error('提交审核失败');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('提交审核失败，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交上传';
            }
        });
    </script>
    
    <!-- VConsole for mobile debugging - loads only when ?debug=true is in URL -->
    <script>
        // Load and initialize VConsole only if debug parameter is present
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                // Dynamically load VConsole script only when needed
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                script.onerror = function() {
                    console.warn('Failed to load VConsole. Debug mode unavailable.');
                };
                document.head.appendChild(script);
            }
        })();
    </script>
