<body>
    <header>
        <a href="index.html" class="nav-back">← 返回</a>
        <h1>上传美女</h1>
        <div class="points-display">
            <span class="points-icon">💎</span>
            <span id="pointsValue">0</span> 分
        </div>
    </header>

    <!-- Points notification -->
    <div id="pointsNotification" class="points-notification"></div>
    
    <div class="container">
        <div class="upload-form">
            <form id="uploadForm">
                <div class="form-group">
                    <label for="imageUrl">图片URL地址：</label>
                    <input 
                        type="url" 
                        id="imageUrl" 
                        name="imageUrl" 
                        placeholder="请输入图片URL地址（https://...）"
                        required
                    >
                </div>

                <div class="allowed-domains" style="background-color: #e8f5e9; border: 1px solid #4caf50;">
                    <h3>💎 积分获取方式：</h3>
                    <ul>
                        <li>每日访问：+10 积分</li>
                        <li>上传图片：+10 积分/张</li>
                        <li>查看图片消费：-1 积分/张（3天内免费重看）</li>
                    </ul>
                </div>

                <div class="preview-area" id="previewArea">
                    <img id="previewImage" alt="预览图片">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">提交上传</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 男人宝. 保留所有权利.</p>
    </footer>

    <script>
        // Initialize points system
        const pointsInfo = PointsSystem.initialize();
        const pointsValueElement = document.getElementById('pointsValue');
        const pointsNotification = document.getElementById('pointsNotification');

        // Update points display
        function updatePointsDisplay() {
            pointsValueElement.textContent = PointsSystem.getPoints();
        }

        // Show points notification
        function showPointsNotification(message) {
            pointsNotification.textContent = message;
            pointsNotification.style.display = 'block';
            
            setTimeout(() => {
                pointsNotification.style.display = 'none';
            }, 3000);
        }

        // Initialize display
        updatePointsDisplay();

        // Show notifications for new user or daily visit
        if (pointsInfo.isNewUser) {
            showPointsNotification(`🎉 欢迎新用户！获得 ${PointsSystem.POINTS_CONFIG.NEW_USER} 积分`);
        } else if (pointsInfo.dailyVisit.awarded) {
            showPointsNotification(`✨ 每日签到奖励！+${pointsInfo.dailyVisit.points} 积分`);
        }

        // NOTE: This validation logic is duplicated from url-validator.js for simplicity
        // since this HTML page uses inline JavaScript without a module bundler.
        // If you update these domains, also update url-validator.js to maintain consistency.
        
        // Allowed domains pattern
        const allowedDomains = [
            'eb118-file.cdn.bcebos.com',
            '.myqcloud.com',
            '.byteimg.com',
            'letmetry.cloud',
            '.qpic.cn'
        ];

        // Validate URL
        function isValidImageUrl(url) {
            try {
                const urlObj = new URL(url);
                
                // Check if it's HTTPS
                if (urlObj.protocol !== 'https:') {
                    return { valid: false, error: '仅支持HTTPS链接' };
                }

                // Check if domain is allowed
                const hostname = urlObj.hostname;
                const isAllowed = allowedDomains.some(domain => {
                    if (domain.startsWith('.')) {
                        return hostname.endsWith(domain.slice(1)) || hostname === domain.slice(1);
                    }
                    return hostname === domain;
                });

                if (!isAllowed) {
                    const supportedDomains = allowedDomains.map(domain => 
                        domain.startsWith('.') ? `*${domain}` : domain
                    ).join('、');
                    return { 
                        valid: false, 
                        error: `不支持的图片来源。支持的域名：${supportedDomains}` 
                    };
                }

                return { valid: true };
            } catch (e) {
                return { valid: false, error: '无效的URL格式' };
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Preview image
        const imageUrlInput = document.getElementById('imageUrl');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');

        imageUrlInput.addEventListener('blur', function() {
            const url = this.value.trim();
            if (url) {
                const validation = isValidImageUrl(url);
                if (validation.valid) {
                    previewImage.src = url;
                    previewArea.style.display = 'block';
                    previewImage.onerror = function() {
                        showMessage('图片加载失败，请检查URL是否正确', 'error');
                        previewArea.style.display = 'none';
                    };
                } else {
                    showMessage(validation.error, 'error');
                    previewArea.style.display = 'none';
                }
            } else {
                previewArea.style.display = 'none';
            }
        });

        // Submit form
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = imageUrlInput.value.trim();
            
            // Validate URL
            const validation = isValidImageUrl(url);
            if (!validation.valid) {
                showMessage(validation.error, 'error');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '检查中...';

            try {
                // Check if image URL already exists
                const checkResponse = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'SELECT id FROM beauty_images WHERE image_url = ?',
                        params: [url]
                    })
                });

                const existingImages = await checkResponse.json();
                
                if (existingImages && existingImages.length > 0) {
                    showMessage('⚠️ 该图片已存在，请勿重复上传', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交上传';
                    return;
                }

                // Image doesn't exist, proceed with upload
                submitBtn.textContent = '上传中...';
                
                // Insert into database
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'INSERT INTO beauty_images (image_url, created_at) VALUES (?, ?)',
                        params: [url, new Date().toISOString().slice(0, 19).replace('T', ' ')]
                    })
                });

                if (!response.ok) {
                    throw new Error('上传失败');
                }

                const result = await response.json();
                
                if (result.affectedRows > 0) {
                    // Award upload points
                    const newTotal = PointsSystem.awardUploadPoints();
                    updatePointsDisplay();
                    
                    showMessage(`上传成功！获得 ${PointsSystem.POINTS_CONFIG.UPLOAD_IMAGE} 积分`, 'success');
                    showPointsNotification(`🎁 上传奖励！+${PointsSystem.POINTS_CONFIG.UPLOAD_IMAGE} 积分`);
                    
                    uploadForm.reset();
                    previewArea.style.display = 'none';
                    
                    // Redirect to appreciate page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'appreciate.html';
                    }, 2000);
                } else {
                    throw new Error('上传失败');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('上传失败，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交上传';
            }
        });
    </script>
    
    <!-- VConsole for mobile debugging - loads only when ?debug=true is in URL -->
    <script>
        // Load and initialize VConsole only if debug parameter is present
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                // Dynamically load VConsole script only when needed
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                script.onerror = function() {
                    console.warn('Failed to load VConsole. Debug mode unavailable.');
                };
                document.head.appendChild(script);
            }
        })();
    </script>
