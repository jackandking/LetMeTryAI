<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>投稿预览 · 男人宝</title>
<style>
  body { margin:0; font-family:'Arial',sans-serif; min-height:100vh;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; }
  .wrap { max-width:560px; margin:0 auto; padding:40px 20px; }
  h1 { color:#fff; font-size:1.6em; }
  .card { background:rgba(255,255,255,.12); border-radius:16px; padding:28px; margin-top:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.25); backdrop-filter:blur(6px); }
  .badge { display:inline-block; padding:6px 14px; border-radius:20px; font-weight:bold; font-size:.9em; }
  .pending { background:#ffd700; color:#5a4500; }
  .approved { background:#4caf50; color:#fff; }
  .rejected { background:#e57373; color:#fff; }
  .ph { width:100%; aspect-ratio:3/4; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(45deg,#5a5a8a,#5a5a8a 12px,#6a6aa0 12px,#6a6aa0 24px); color:#eee; font-size:1.1em; text-align:center; }
  img.shot { width:100%; border-radius:12px; display:block; }
  .link { margin-top:16px; word-break:break-all; color:#ffe9a8; }
  .btn { display:inline-block; margin-top:14px; padding:12px 22px; border-radius:24px; text-decoration:none;
    background:linear-gradient(135deg,#ffd700,#ffed4e); color:#333; font-weight:bold; }
  .muted { opacity:.85; font-size:.9em; line-height:1.7; }
  .ai-tag { font-size:.8em; opacity:.8; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📤 投稿预览 · 男人宝</h1>
  <div id="content" class="card"><p class="muted">加载中…</p></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const tableParam = params.get('table') || 'beauty';
  const table = tableParam === 'back_view' ? 'back_view_images' : 'beauty_images';
  const galleryPage = tableParam === 'back_view' ? 'back-view-killer.html' : 'appreciate.html';
  const galleryUrl = `https://letmetry.cn/nanrenbao/${galleryPage}#img-${id}`;

  async function load() {
    const el = document.getElementById('content');
    if (!id) { el.innerHTML = '<p>缺少 id 参数</p>'; return; }
    let rec;
    try {
      const r = await fetch('https://letmetry.cn/mysql/getById', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ table, id })
      });
      rec = await r.json();
    } catch (e) { el.innerHTML = '<p>加载失败：'+e.message+'</p>'; return; }

    const status = (rec && rec.review_status) || 'pending';
    const reason = rec && rec.review_reason ? rec.review_reason : '';

    if (status === 'approved') {
      let media;
      if (table === 'back_view_images') {
        media = `<img class="shot" src="${rec.back_image_url}" alt="back" />
                 <img class="shot" style="margin-top:12px" src="${rec.front_image_url}" alt="front" />`;
      } else {
        media = `<img class="shot" src="${rec.image_url}" alt="photo" />`;
      }
      el.innerHTML = `
        <span class="badge approved">✅ 已通过审核</span>
        <div style="margin-top:16px">${media}</div>
        <a class="btn" href="${galleryUrl}" target="_blank">前往站内查看我的照片 →</a>
        <p class="ai-tag">本作品由 AI 生成。</p>`;
    } else if (status === 'rejected') {
      el.innerHTML = `
        <span class="badge rejected">⛔ 未通过审核</span>
        <p class="muted" style="margin-top:14px">原因：${reason || '未符合社区准则'}</p>
        <p class="muted">可调整提示词后重新投稿。</p>`;
    } else {
      el.innerHTML = `
        <span class="badge pending">⏳ 审核中</span>
        <div class="ph" style="margin-top:16px">审核中<br/>通过后将在此展示你的照片</div>
        <p class="muted" style="margin-top:16px">已提交，通常 1–2 个工作日内完成审核。<br/>
        审核通过后，下方链接即可访问你在站内的真实照片：</p>
        <div class="link">${galleryUrl}</div>
        <p class="ai-tag">本作品由 AI 生成，将按平台要求标注。</p>`;
    }
  }
  load();
</script>
</body>
</html>
