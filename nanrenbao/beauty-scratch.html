<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美图欣赏</title>
<script>
    var _hmt = _hmt || [];
    (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);

</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#0d0d14; color:#fff; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(env(safe-area-inset-top) + 10px);
    background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);
  }
  .topbar .title{ font-size:18px; font-weight:600; letter-spacing:1px; }
  .topbar .counter{ font-size:13px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); padding:4px 12px; border-radius:20px; }
  .stage{ position:fixed; inset:0; overflow:hidden; }
  .stage img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; }
  #scratch{ position:absolute; inset:0; width:100%; height:100%; z-index:2; }
  .hint{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 30px); z-index:15;
    transform:translateX(-50%); font-size:14px; color:#fff; background:rgba(0,0,0,.55);
    padding:8px 20px; border-radius:30px; white-space:nowrap; transition:opacity .3s;
  }
  .progress{
    position:absolute; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 88px); z-index:15;
    height:5px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden;
  }
  .progress>i{ display:block; height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#ff5f8f,#ff9a5f); transition:width .15s ease-out; }
  .panel{
    position:absolute; left:0; right:0; bottom:0; z-index:30;
    padding:30px 20px calc(env(safe-area-inset-bottom) + 26px);
    background:linear-gradient(0deg,rgba(0,0,0,.93),rgba(0,0,0,.55) 62%,transparent);
    text-align:center; opacity:0; pointer-events:none; transform:translateY(22px);
    transition:opacity .35s,transform .35s;
  }
  .panel.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .done-title{ font-size:26px; font-weight:700; margin-bottom:6px; background:linear-gradient(90deg,#ffd86b,#ff6f91); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .done-sub{ font-size:14px; color:rgba(255,255,255,.82); margin-bottom:22px; }
  .btn{
    display:block; width:100%; max-width:340px; margin:0 auto 12px; padding:15px 0; border-radius:32px;
    font-size:17px; font-weight:600; border:none; cursor:pointer; color:#fff;
    background:linear-gradient(90deg,#ff5f8f,#ff9a5f);
  }
  .btn.ghost{ background:rgba(255,255,255,.15); }
  .btn:active{ transform:scale(.98); }
  .footer-note{ font-size:12px; color:rgba(255,255,255,.5); margin-top:6px; }
  #loading{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0d0d14; gap:14px;
  }
  .spinner{ width:34px; height:34px; border:3px solid rgba(255,255,255,.2); border-top-color:#ff5f8f; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .save-tip{ display:none; font-size:12px; color:rgba(255,255,255,.6); margin-top:10px; }
  .save-tip.show{ display:block; }
  .exp-tag{ position:fixed; top:calc(env(safe-area-inset-top) + 50px); left:16px; z-index:21; font-size:11px; color:rgba(255,255,255,.6); background:rgba(0,0,0,.4); padding:3px 9px; border-radius:12px; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div>正在加载美图…</div></div>

<div class="topbar">
  <div class="title">🌸 美图欣赏</div>
  <div class="counter" id="counter">1/6</div>
</div>

<div class="stage">
  <img class="bg" id="bg" alt="美图" crossorigin="anonymous">
  <canvas id="scratch"></canvas>
</div>

<div class="progress"><i id="bar"></i></div>
<div class="hint" id="hint">↓ 手指擦开马赛克，看美女真容</div>
<div class="exp-tag" id="expTag" style="display:none;"></div>

<div class="panel" id="panel">
  <div class="done-title">真容解锁 ✨</div>
  <div class="done-sub" id="doneSub">这张美图专属于你</div>
  <button class="btn" id="nextBtn">▶ 看下一张（观看广告解锁）</button>
  <button class="btn ghost" id="downloadBtn" style="display:none;">⬇ 保存美图到相册</button>
  <button class="btn ghost" id="homeBtn">← 返回男人宝主页</button>
  <div class="footer-note">艺术写真 / 时尚美图，仅供欣赏</div>
  <div class="save-tip" id="saveTip">若未自动下载，可长按上方图片或点击链接保存到相册</div>
</div>

<script>
(function(){
  'use strict';

  // ---- 男人宝图库（beauty_images 已审核，approve状态）{id, url} ----
  var IMAGES = [
    { id: 621, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-12T12-16-27-c.jpg" },
    { id: 581, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-08T23-36-44-c.jpg" },
    { id: 580, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-08T04-11-48-c.jpg" },
    { id: 575, url: "https://letmetry.cn/images/nanrenbao_beauty_20261002.jpg" },
    { id: 568, url: "https://letmetry.cn/images/30f5c5d9-acba-4ec8-a899-a79a60099fc3.jpg" },
    { id: 561, url: "https://letmetry.cn/images/79b959cd-5a66-47e3-9147-7b257fab60d4.jpg" },
    { id: 559, url: "https://letmetry.cn/images/c434df35-d1c3-4396-95b6-8ebadd01f100.jpg" },
    { id: 557, url: "https://letmetry.cn/images/3c7c5563-488d-418e-83ff-58876a64dfd2.jpg" },
    { id: 555, url: "https://letmetry.cn/images/141f60c5-33bc-4a6b-bd1e-95635a5cce73.jpg" },
    { id: 554, url: "https://letmetry.cn/images/4b76a095-7803-40bc-813f-4897158d1c94.jpg" },
    { id: 553, url: "https://letmetry.cn/images/9b04ed43-70b2-4561-9701-0de1ee60832d.jpg" },
    { id: 552, url: "https://letmetry.cn/images/3d5fd918-b432-40b6-8f38-94ca6e7ed08e.jpg" },
    { id: 551, url: "https://letmetry.cn/images/0832cd8b-3094-49d4-8ece-e0939ca5fb54.jpg" },
    { id: 550, url: "https://letmetry.cn/images/8acbc421-1124-40e3-b26d-fc5eae209f23.jpg" },
    { id: 549, url: "https://letmetry.cn/images/1c47501f-d218-4f30-aff7-7426af3f86d0.jpg" },
    { id: 548, url: "https://letmetry.cn/images/a7c4e3b4-5001-4c74-a278-8b2ccc76789b.jpg" },
    { id: 547, url: "https://letmetry.cn/images/18c918b1-c647-40aa-b380-b005db6988f3.jpg" },
    { id: 546, url: "https://letmetry.cn/images/15a2805f-3cbf-4f23-9452-7ef8ea801513.jpg" },
    { id: 545, url: "https://letmetry.cn/images/bf619830-4628-495c-af89-293febed967f.jpg" },
    { id: 544, url: "https://letmetry.cn/images/71b10305-7176-4919-865b-f325a21feb99.jpg" },
    { id: 543, url: "https://letmetry.cn/images/4c816795-1b81-44ce-b645-d2489f6769e1.jpg" },
    { id: 542, url: "https://letmetry.cn/images/cf5fc079-fc90-45ce-8232-8fee400394bd.jpg" },
    { id: 541, url: "https://letmetry.cn/images/e24bf687-5233-4f84-9de4-4b8d02e76aa3.jpg" },
    { id: 540, url: "https://letmetry.cn/images/4f957fbc-cdc6-4974-af56-8c87a878d902.jpg" },
    { id: 539, url: "https://letmetry.cn/images/8c347da2-d365-4bba-9f12-b63fd7407a80.jpg" }
  ];
  var THUMB = 140;         // 马赛克单元参考
  var UNLOCK = 0.30;       // 擦除30%解锁（control 刮擦臂）
  var MASK_W = 96;         // 面积统计mask宽度(css px基准)

  // ====== 实验臂配置（刮刮乐遮挡交互 A/n 实验）======
  // vid 0 = control（旧刮擦 + 30% 全清）；vid 1..4 = 分块揭示，n 为方块数（正方形网格）
  var EXP = {
    VARIANTS: [
      { mode:'scratch', n:0,  label:'control' },
      { mode:'tile',   n:4,   label:'tile_4'  },
      { mode:'tile',   n:9,   label:'tile_9'  },
      { mode:'tile',   n:16,  label:'tile_16' },
      { mode:'tile',   n:25,  label:'tile_25' }
    ]
  };
  // FNV-1a 哈希：把 id 映射成稳定伪随机臂（同一张图永远同一臂，整体近似均匀）
  function hashStr(s){ var h=2166136261; s=String(s); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
  function variantForId(id){ var vid = hashStr('nrbsalt_'+id) % EXP.VARIANTS.length; return { vid:vid, v:EXP.VARIANTS[vid] }; }
  // QA 覆盖：?exp=control|tile_4|tile_9|tile_16|tile_25 可强制某个臂
  var _expOverride = (function(){ try { return new URLSearchParams(location.search).get('exp'); } catch(e){ return null; } })();
  // QA 覆盖：?img=<url> 临时换图（本地调试用，图床防盗链拦 localhost 时指向本地图片即可）
  var _imgOverride = (function(){ try { return new URLSearchParams(location.search).get('img'); } catch(e){ return null; } })();
  function resolveVariant(id){
    if (_expOverride) {
      for (var k=0;k<EXP.VARIANTS.length;k++){ if (EXP.VARIANTS[k].label === _expOverride) return { vid:k, v:EXP.VARIANTS[k] }; }
    }
    return variantForId(id);
  }

  var idx=0;
  var img=new Image();
  var bg=$('bg'), cv=$('scratch'), ctx=cv.getContext('2d');
  var bar=$('bar'), panel=$('panel'), hint=$('hint'), loading=$('loading'), counter=$('counter'), expTag=$('expTag');
  var nextBtn=$('nextBtn'), downloadBtn=$('downloadBtn'), saveTip=$('saveTip'), doneSub=$('doneSub');
  var W=0,H=0;              // canvas 像素
  var fitRect={dx:0,dy:0,dw:0,dh:0};
  var mask, mctx;           // 面积统计（仅 control 刮擦臂用）
  var unlocked=false;
  var scratching=false;   // 修复: 之前未声明导致 pointerdown 抛 ReferenceError，擦除全失效
  var downloadUnlocked=false;

  // 实验臂 + 分块状态
  var variant = { vid:0, v:EXP.VARIANTS[0] };
  var cols=1, rows=1, tileW=0, tileH=0;
  var tileState=[], tileRevealed=[], revealedCount=0;
  var coverCanvas=null;     // 离屏马赛克（仅 tile 臂用）
  var startLogged=false, halfLogged=false;

  // ---- 单图模式解析（星火计划任务通过 ?id=<mysql_id> 深链）----
  // showRewardedVideoAd 返回时拼成 "?id=581?finishedAd=true"（query 被覆盖），
  // 用 split('?')[0] 取 id，用 includes 判 finishedAd，无需改小程序。
  var _q = new URLSearchParams(location.search);
  var _rawId = _q.get('id');
  if (_rawId) _rawId = String(_rawId).split('?')[0];
  var finishedAd = location.search.indexOf('finishedAd=true') !== -1;
  // 只要带了 ?id 就尝试单图模式：命中写死数组秒开，否则按 id 动态取图
  // （治本修复：622 等未写死 id 不再退化成轮播，任何已审图都能单图+看广告下载）
  var singleMode = !!_rawId;
  var singleItem = null;   // 单图对象 {id, url}，命中数组或动态取图后填充
  var singleIdx = -1;      // 命中写死 IMAGES 时的下标（兼容旧轮播下标逻辑）
  if (singleMode) {
    singleIdx = IMAGES.findIndex(function(x){ return String(x.id) === String(_rawId); });
    if (singleIdx >= 0) singleItem = IMAGES[singleIdx];
  }

  // 按 id 从后端动态取图（不在写死数组时使用）。后端 /mysql/query 已开启 CORS(*)
  function fetchBeautyUrl(id){
    var safeId = parseInt(id, 10);
    if (isNaN(safeId)) return Promise.resolve(null);
    return fetch('https://letmetry.cn/mysql/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql: "SELECT image_url FROM beauty_images WHERE id=" + safeId + " AND deleted=0 AND review_status='approved'" })
    }).then(function(r){ return r.json(); }).then(function(arr){
      if (Array.isArray(arr) && arr.length) return arr[0].image_url || null;
      if (arr && arr.data && arr.data.length) return arr.data[0].image_url || null;
      return null;
    }).catch(function(){ return null; });
  }

  // 刮擦乐单图深链计入 view_count（星火计划任务引流计量）。
  // 走后端 /mysql/query 的计数器白名单例外（与画廊页 incrementViewCount 同一通道），
  // 失败静默不影响刮擦体验；sessionStorage 防同一会话内广告返回刷新重复计数。
  function bumpViewCount(id, url){
    if (!url) return;
    try {
      var key = 'bs_view_bumped_' + id;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
    } catch(e){}
    try {
      fetch('https://letmetry.cn/mysql/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sql: 'UPDATE beauty_images SET view_count = view_count + 1 WHERE image_url = ?',
          params: [url]
        })
      }).catch(function(){});
    } catch(e){}
  }

  function $(id){return document.getElementById(id);}
  function dpr(){ return Math.min(window.devicePixelRatio||1,2); }

  // ====== 实验事件埋点（百度统计 _trackEvent，零部署，按变体 label 看完成率/进阶率）======
  function track(action, value, category){
    try {
      if (typeof _hmt !== 'undefined' && _hmt.push) {
        _hmt.push(['_trackEvent', category || 'scratch_exp', action, variant.v.label, (value==null?1:value)]);
      }
    } catch(e){}
  }

  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr(); cv.height=H*dpr(); }
  function fit(){
    var nw=img.naturalWidth, nh=img.naturalHeight, s=W/nw < H/nh ? W/nw : H/nh;
    var dw=nw*s, dh=nh*s, dx=(W-dw)/2, dy=(H-dh)/2;
    fitRect={dx:dx,dy:dy,dw:dw,dh:dh};
    // mask 按图片比例
    var mw=MASK_W, mh=Math.round(MASK_W*dh/dw);
    mask=document.createElement('canvas'); mask.width=mw; mask.height=mh;
    mctx=mask.getContext('2d'); mctx.clearRect(0,0,mw,mh);
  }

  // ====== control 刮擦臂：铺满马赛克（原逻辑）======
  function drawMosaic(){
    size(); fit();
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='source-over';
    ctx.imageSmoothingEnabled=false;
    // 缩小再放大产生马赛克块：按放大后画布按块 drawImage
    var d=dpr();
    var px=fitRect.dx*d, py=fitRect.dy*d, pw=fitRect.dw*d, ph=fitRect.dh*d;
    var cell=Math.round(THUMB*Math.max(d,1));
    var t=document.createElement('canvas'); t.width=Math.max(1,Math.round(pw/cell)); t.height=Math.max(1,Math.round(ph/cell));
    var tc=t.getContext('2d'); tc.imageSmoothingEnabled=false;
    tc.drawImage(img,0,0,t.width,t.height);
    ctx.drawImage(t,px,py,pw,ph);
    panel.classList.remove('show');
  }

  // ====== tile 分块臂：构建离屏马赛克 + 网格 ======
  function buildCover(){
    size(); fit();
    coverCanvas = document.createElement('canvas');
    coverCanvas.width = cv.width; coverCanvas.height = cv.height;
    var cc = coverCanvas.getContext('2d');
    cc.imageSmoothingEnabled=false;
    var d=dpr();
    var px=fitRect.dx*d, py=fitRect.dy*d, pw=fitRect.dw*d, ph=fitRect.dh*d;
    var cell=Math.round(THUMB*Math.max(d,1));
    var t=document.createElement('canvas'); t.width=Math.max(1,Math.round(pw/cell)); t.height=Math.max(1,Math.round(ph/cell));
    var tc=t.getContext('2d'); tc.imageSmoothingEnabled=false;
    tc.drawImage(img,0,0,t.width,t.height);
    cc.drawImage(t,px,py,pw,ph);
    // 正方形网格：cols=rows=sqrt(n)
    cols = Math.max(1, Math.round(Math.sqrt(variant.v.n)));
    rows = cols;
    tileW = fitRect.dw/cols; tileH = fitRect.dh/rows;
    tileState = []; tileRevealed = []; revealedCount = 0;
    for (var i=0;i<cols*rows;i++){ tileState.push(1); tileRevealed.push(false); }
    renderTiles();
    panel.classList.remove('show');
  }

  // 仅绘制未揭示方块的马赛克（已揭示方块透明 → 透出底层真图）
  function renderTiles(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.imageSmoothingEnabled=false;
    var d=dpr();
    for (var r=0;r<rows;r++){
      for (var c=0;c<cols;c++){
        var ti=r*cols+c;
        if (tileState[ti] <= 0.01) continue;
        var x=(fitRect.dx + c*tileW), y=(fitRect.dy + r*tileH);
        ctx.globalAlpha = tileState[ti];
        ctx.drawImage(coverCanvas, x*d, y*d, tileW*d, tileH*d, x*d, y*d, tileW*d, tileH*d);
      }
    }
    ctx.globalAlpha=1;
    // 淡网格线：让"可点方块"可见（仅 tile 臂）
    var d=dpr();
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1;
    for (var c2=1;c2<cols;c2++){
      var gx=(fitRect.dx + c2*tileW)*d;
      ctx.beginPath(); ctx.moveTo(gx, fitRect.dy*d); ctx.lineTo(gx, (fitRect.dy+fitRect.dh)*d); ctx.stroke();
    }
    for (var r2=1;r2<rows;r2++){
      var gy=(fitRect.dy + r2*tileH)*d;
      ctx.beginPath(); ctx.moveTo(fitRect.dx*d, gy); ctx.lineTo((fitRect.dx+fitRect.dw)*d, gy); ctx.stroke();
    }
  }

  function revealTileAt(cx,cy){
    if (cx<fitRect.dx||cx>fitRect.dx+fitRect.dw||cy<fitRect.dy||cy>fitRect.dy+fitRect.dh) return;
    var c=Math.floor((cx-fitRect.dx)/tileW), r=Math.floor((cy-fitRect.dy)/tileH);
    if(c<0)c=0; if(c>=cols)c=cols-1; if(r<0)r=0; if(r>=rows)r=rows-1;
    var ti=r*cols+c;
    if (tileRevealed[ti]) return;
    tileRevealed[ti]=true; revealedCount++;
    animateTile(ti);
    if (!startLogged){ startLogged=true; track('start'); }
    tickTiles();
  }

  // 揭示动画：方块马赛克 alpha 1→0（约 220ms）
  function animateTile(ti){
    var start=performance.now(), dur=220;
    function step(now){
      var t=Math.min(1,(now-start)/dur);
      tileState[ti]=1-t;
      renderTiles();
      if(t<1) requestAnimationFrame(step);
      else { tileState[ti]=0; renderTiles(); }
    }
    requestAnimationFrame(step);
  }

  function tickTiles(){
    var pct = revealedCount/(cols*rows);
    bar.style.width=(pct*100)+'%';
    if (pct>=0.5 && !halfLogged){ halfLogged=true; track('half'); }
    if (revealedCount>=cols*rows && !unlocked){ unlock(); }
  }

  function pxof(e){
    var r=cv.getBoundingClientRect(), t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    return { x:t.clientX-r.left, y:t.clientY-r.top };
  }

  // ====== control 刮擦臂：擦除 + 面积统计 ======
  function erase(x,y){
    var d=dpr(), sd=Math.max(14, dpr()*28);      // 擦除半径
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(x*d, y*d, sd, 0, Math.PI*2); ctx.fill();
    // 同步到面积mask（只统计图片区域内）
    if(x>=fitRect.dx && x<=fitRect.dx+fitRect.dw && y>=fitRect.dy && y<=fitRect.dy+fitRect.dh){
      var mx=(x-fitRect.dx)/fitRect.dw*MASK_W, my=(y-fitRect.dy)/fitRect.dh*mask.height;
      mctx.globalCompositeOperation='destination-out';
      mctx.beginPath(); mctx.arc(mx,my, Math.max(1.5, MASK_W/fitRect.dw * 6), 0, Math.PI*2); mctx.fill();
    }
  }

  function ratio(){
    var data=mctx.getImageData(0,0,mask.width,mask.height).data, total=mask.width*mask.height, erased=0;
    for(var i=3;i<data.length;i+=4){ if(data[i]<128) erased++; }
    return erased/total;
  }

  function tick(){
    var r=ratio();
    bar.style.width=(r*100)+'%';
    if (!startLogged){ startLogged=true; track('start'); }
    if (r>=UNLOCK*0.5 && !halfLogged){ halfLogged=true; track('half'); }
    if(r>=UNLOCK && !unlocked) unlock();
  }

  // ====== 统一指针入口：按臂分流 ======
  function handlePoint(x,y){
    if (variant.v.mode==='scratch'){ erase(x,y); tick(); }
    else { revealTileAt(x,y); }
  }
  function onDown(e){ e.preventDefault(); scratching=true; handlePoint(pxof(e).x,pxof(e).y); }
  function onMove(e){ e.preventDefault(); if(!scratching) return; handlePoint(pxof(e).x,pxof(e).y); }
  function onUp(){ scratching=false; }

  function unlock(){
    unlocked=true;
    if (variant.v.mode==='scratch'){
      // 一键清空马赛克，露出真容
      ctx.clearRect(0,0,cv.width,cv.height);
    }
    bar.style.width='100%';
    hint.style.opacity='0';
    track('complete');

    if (singleMode && !downloadUnlocked) {
      // 单图模式：先看广告才能下载
      doneSub.textContent = '擦开马赛克，看专属美图';
      nextBtn.textContent = '▶ 观看广告，解锁保存';
      nextBtn.style.display = '';
      downloadBtn.style.display = 'none';
      saveTip.classList.remove('show');
    } else if (singleMode && downloadUnlocked) {
      // 广告看完：解锁下载
      doneSub.textContent = '已解锁，保存这张美图吧';
      nextBtn.style.display = 'none';
      downloadBtn.style.display = '';
      saveTip.classList.add('show');
    } else {
      // 轮播模式：看下一张
      doneSub.textContent = '这张美图专属于你';
      nextBtn.textContent = '▶ 看下一张（观看广告解锁）';
      nextBtn.style.display = '';
      downloadBtn.style.display = 'none';
      saveTip.classList.remove('show');
    }
    panel.classList.add('show');
  }

  function currentItem(){
    // 单图模式优先用 singleItem（动态取图或命中写死数组），否则取轮播数组
    if (singleMode && singleItem) return singleItem;
    return IMAGES[idx];
  }

  function load(i){
    idx=i; unlocked=false; downloadUnlocked=false; bar.style.width='0%'; panel.classList.remove('show');
    startLogged=false; halfLogged=false;
    var item = currentItem();
    if (_imgOverride) item = { id: item.id, url: _imgOverride };
    variant = resolveVariant(item.id);
    counter.textContent = singleMode ? '专属美图' : ((i+1)+'/'+IMAGES.length);
    expTag.style.display=''; expTag.textContent = '实验臂: ' + variant.v.label;
    hint.style.opacity='1';
    hint.textContent = (variant.v.mode==='scratch')
      ? '↓ 手指擦开马赛克，看美女真容'
      : '👆 点开方块，逐块揭秘真容';
    img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      bg.src=img.src;
      loading.style.display='none';
      if (variant.v.mode==='scratch'){ drawMosaic(); }
      else { buildCover(); }
    };
    img.onerror=function(){
      if (!singleMode && i+1<IMAGES.length){ load(i+1); }
      else { loading.style.display='none'; alert('图片加载失败'); }
    };
    img.src=item.url;
  }

  var pendingNext = null;   // 看完广告后要跳到的图索引

  // 触发快手小程序内置激励视频广告；广告播完由 showRewardedVideoAd 页带 finishedAd 跳回本页
  function showAdForNext(){
    track('advance');
    if (typeof ks !== 'undefined' && ks.navigateTo) {
      if (singleMode) {
        // 单图模式：广告用于解锁「保存」，回到同一张（兼容动态取图 id）
        var singleId = singleItem ? singleItem.id : parseInt(_rawId, 10);
        pendingNext = singleIdx;
        var singlePageId = 'nanrenbao/beauty-scratch?id=' + singleId;
        try {
          localStorage.setItem('bs_pending_next', String(pendingNext));
          localStorage.setItem('bs_current_idx', String(singleIdx >= 0 ? singleIdx : 0));
        } catch(e){}
        ks.navigateTo({
          url: "/pages/showRewardedVideoAd/showRewardedVideoAd?result_page_id=" + encodeURIComponent(singlePageId)
        });
      } else {
        pendingNext = (idx+1 < IMAGES.length) ? idx+1 : 0;
        try {
          localStorage.setItem('bs_pending_next', String(pendingNext));
          localStorage.setItem('bs_current_idx', String(idx));
        } catch(e){}
        ks.navigateTo({
          url: "/pages/showRewardedVideoAd/showRewardedVideoAd?result_page_id=nanrenbao/beauty-scratch"
        });
      }
    } else {
      // 浏览器/调试环境：无广告 SDK，直接解锁下载（MVP 兜底）
      if (singleMode) {
        downloadUnlocked = true;
        downloadBtn.style.display = '';
        saveTip.classList.add('show');
        nextBtn.style.display = 'none';
        doneSub.textContent = '已解锁，保存这张美图吧';
      } else if(idx+1<IMAGES.length){ load(idx+1); } else { load(0); }
    }
  }

  // 页面加载时检查是否刚看完广告跳回（finishedAd 由 showRewardedVideoAd 页带回来）
  // 注意：小程序返回 URL 形如 "?id=581?finishedAd=true"（query 被覆盖，畸形），
  // 故用模块级 finishedAd（location.search.indexOf）判定，而不是 URLSearchParams.get。
  function handleAdReturn(){
    if (finishedAd) {
      var nextIdx = null, curIdx = 0;
      try {
        nextIdx = parseInt(localStorage.getItem('bs_pending_next'), 10);
        curIdx  = parseInt(localStorage.getItem('bs_current_idx'), 10);
        localStorage.removeItem('bs_pending_next');
        localStorage.removeItem('bs_current_idx');
      } catch(e){}
      try { history.replaceState({}, document.title, location.pathname); } catch(e){}
      if (singleMode) {
        // 单图：回到同一张并解锁下载（命中数组或动态取图均适用）
        load(singleIdx >= 0 ? singleIdx : 0);
        downloadUnlocked = true;
      } else {
        var target = (!isNaN(nextIdx) && nextIdx>=0 && nextIdx<IMAGES.length) ? nextIdx
                   : (!isNaN(curIdx) && curIdx>=0 && curIdx<IMAGES.length) ? curIdx : 0;
        load(target);
      }
      return;
    }
    load(singleMode ? (singleIdx >= 0 ? singleIdx : 0) : 0);
  }

  function doDownload(){
    track('download');
    var item = (singleMode && singleItem) ? singleItem : IMAGES[idx];
    var u = item.url;
    var a = document.createElement('a');
    a.href = u;
    a.download = 'nanrenbao_' + item.id + '.jpg';
    a.target = '_blank';
    document.body.appendChild(a);
    try { a.click(); } catch(e){}
    a.remove();
    // 兜底：跨域 download 可能只打开新标签，提示用户长按/保存
    setTimeout(function(){ try { window.open(u, '_blank'); } catch(e){} }, 400);
  }

  cv.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);

  nextBtn.addEventListener('click',function(){ showAdForNext(); });
  downloadBtn.addEventListener('click',function(){ doDownload(); });
  // 单图→主页 衍生漏斗埋点：点击回主页时记录来源照片 id，并带到主页 URL；
  // 同时在服务端 /api/track 落一条 home_redirect 事件（失败静默，不影响体验）。
  $('homeBtn').addEventListener('click',function(){
    var fromId = (singleMode && singleItem) ? singleItem.id
               : (singleMode && _rawId ? parseInt(_rawId,10) : '');
    try { track('home_redirect', fromId ? Number(fromId) : 1, 'nanrenbao_funnel'); } catch(e){}
    try {
      if (fromId) {
        var ev = {
          event: 'home_redirect',
          appId: 'nanrenbao-scratch',
          from_photo_id: Number(fromId),
          source: 'beauty_scratch',
          timestamp: Date.now(),
          date: new Date().toISOString().split('T')[0]
        };
        // fetch keepalive：页面跳转后请求仍可完成（sendBeacon 在部分 WebView 会丢 body，已弃用）
        fetch('https://letmetry.cn/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ev),
          keepalive: true
        }).catch(function(){});
      }
    } catch(e){}
    var target = 'https://letmetryai.cn/nanrenbao/';
    if (fromId) target += '?from=photo_' + encodeURIComponent(fromId);
    location.href = target;
  });

  // 启动：单图模式且不在写死数组 → 先按 id 动态取图，再进入流程（治本修复 622 退化轮播）
  if (singleMode && !singleItem) {
    fetchBeautyUrl(_rawId).then(function(url){
      if (!url) { loading.style.display='none'; alert('未找到该美图，或尚未审核通过'); return; }
      singleItem = { id: parseInt(_rawId, 10), url: url };
      bumpViewCount(singleItem.id, singleItem.url);
      handleAdReturn();
    });
  } else {
    // 命中写死数组的单图深链同样计一次；轮播模式（无 id）不计数
    if (singleMode && singleItem) bumpViewCount(singleItem.id, singleItem.url);
    handleAdReturn();
  }
})();
</script>
</body>
</html>
