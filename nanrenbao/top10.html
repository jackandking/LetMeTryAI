    <div class="container">
        <div id="loading">正在加载榜单...</div>
        <div id="no-images">内容安全审核中，榜单暂未开放展示。</div>

    <!-- Modal for full image -->
    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        // Modal functionality
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const closeBtn = document.querySelector('.modal-close');

        function showModal(imageUrl) {
            modal.style.display = 'block';
            modalImg.src = imageUrl;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        closeBtn.onclick = closeModal;
        
        modal.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'block') {
                closeModal();
            }
        });

        // Load top 10 images from database
        async function loadTop10Images() {
            const loading = document.getElementById('loading');
            const gallery = document.getElementById('top10Gallery');
            const noImages = document.getElementById('no-images');
            const ctaSection = document.getElementById('ctaSection');

            try {
                const response = await fetch(window.API_ENDPOINTS.MYSQL_QUERY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sql: 'SELECT id, image_url, view_count, created_at FROM beauty_images WHERE deleted = 0 AND review_status = ? ORDER BY view_count DESC, created_at DESC LIMIT 10',
                        params: ['approved']
                    })
                });

                let data = await response.json();
                loading.style.display = 'none';

                // Sort: unseen images first (while keeping top 10)
                if (data && data.length > 0) {
                    data = PointsSystem.sortImagesByViewedStatus(data, 'id', 'beauty');
                }

                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        try {
                            const div = document.createElement('div');
                            div.className = 'top-item';
                            
                            const rankingBadge = document.createElement('div');
                            rankingBadge.className = 'ranking-badge' + (index < 3 ? ' top3' : '');
                            rankingBadge.textContent = index + 1;
                            
                            const imageContainer = document.createElement('div');
                            imageContainer.className = 'image-container';
                            
                            const img = document.createElement('img');
                            img.src = item.image_url;
                            img.alt = `第${index + 1}名美女`;
                            img.onerror = function() {
                                div.style.display = 'none';
                                console.log('图片加载失败，已隐藏:', item.image_url);
                            };
                            
                            const infoOverlay = document.createElement('div');
                            infoOverlay.className = 'info-overlay';
                            
                            const viewCount = item.view_count || 0;
                            infoOverlay.innerHTML = `
                                <div class="view-count">
                                    <span class="icon">🔥</span>
                                    ${viewCount} 人已欣赏
                                </div>
                            `;
                            
                            imageContainer.appendChild(img);
                            imageContainer.appendChild(infoOverlay);
                            
                            div.appendChild(rankingBadge);
                            div.appendChild(imageContainer);
                            
                            // Click to view full image
                            div.onclick = function() {
                                // Mark as viewed for prioritization
                                PointsSystem.markImageIdAsViewed(item.id, 'beauty');
                                showModal(item.image_url);
                            };
                            
                            gallery.appendChild(div);
                        } catch (itemError) {
                            console.error('创建图片项失败:', itemError, item);
                        }
                    });

                    // Show CTA section after images
                    ctaSection.style.display = 'block';
                } else {
                    noImages.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading top 10 images:', error);
                loading.textContent = '加载失败，请稍后重试';
            }
        }

        // Load images when page loads
        window.addEventListener('DOMContentLoaded', loadTop10Images);
    </script>
