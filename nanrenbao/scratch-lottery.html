<script>
(function(){
  'use strict';

  // ==== PURE-LOGIC-BEGIN ====
  // 实验臂配置（刮刮乐遮挡交互 A/n 实验，与 beauty-scratch.html 同款，
  // 同一张图按 id 哈希永远落同一臂，整体近似均匀）
  var EXP = {
    VARIANTS: [
      { mode:'scratch', n:0,  label:'control' },
      { mode:'tile',   n:4,   label:'tile_4'  },
      { mode:'tile',   n:9,   label:'tile_9'  },
      { mode:'tile',   n:16,  label:'tile_16' },
      { mode:'tile',   n:25,  label:'tile_25' }
    ]
  };
  function hashStr(s){ var h=2166136261; s=String(s); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
  function variantForId(id){ var vid = hashStr('nrbsalt_'+id) % EXP.VARIANTS.length; return { vid:vid, v:EXP.VARIANTS[vid] }; }

  // localStorage 键：刮刮乐自己的看过记录 + 图库池缓存
  var KEYS = { SCRATCH_SEEN: 'nrb_scratch_seen', POOL_CACHE: 'nrb_scratch_pool' };
  var POOL_TTL_MS = 6 * 60 * 60 * 1000;   // 图库缓存 6 小时
  var COST_PER_DRAW = 1;                  // 每抽一张 1 积分

  function readJson(key, fallback){
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function writeJson(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }

  // 看过判定：三源合并——
  //   ids:    PointsSystem 的 viewed_ids.beauty（各栏目通用的 ID 级记录）
  //   urls:   viewed_images（URL 级记录，3 天免费窗口，带付费语义）
  //   scratch: 刮刮乐自己的 nrb_scratch_seen（抽中即写，防中途退出重复抽）
  function isSeen(item, ctx){
    if (!item) return false;
    if (ctx.ids && ctx.ids[item.id]) return true;
    if (ctx.urls && ctx.urls[item.url]) return true;
    if (ctx.scratch && ctx.scratch[item.id]) return true;
    return false;
  }
  // 从池子里随机抽一个没看过的；全看过返回 null
  function pickUnseen(pool, ctx){
    var unseen = [];
    for (var i=0;i<pool.length;i++){ if (!isSeen(pool[i], ctx)) unseen.push(pool[i]); }
    if (!unseen.length) return null;
    return unseen[Math.floor(Math.random()*unseen.length)];
  }
  // prompt_dna 只抽 teaser 需要的三个字段（subject/scene/mood），
  // 不存 prompt_text/negative（控制缓存体积，localStorage 上限约 5MB）
  function extractDna(raw){
    try {
      var d = JSON.parse(raw || 'null');
      if (!d || typeof d !== 'object') return null;
      var dna = {};
      if (d.subject) dna.subject = String(d.subject);
      if (d.scene) dna.scene = String(d.scene);
      if (d.mood) dna.mood = String(d.mood);
      return (dna.subject || dna.scene || dna.mood) ? dna : null;
    } catch(e){ return null; }
  }
  // ---- 悬念提示 / 身份揭晓（刮前给线索不揭晓，刮开再亮身份）----
  // subject 形如「柳如烟（龙蛇起陆）reinterpret，非真人仿冒」→ 拆角色名与出处
  function splitSubject(subject){
    var s = String(subject || '').trim();
    if (!s) return { name: '', source: '' };
    var m = s.match(/^([^（(]{1,20})[（(]([^）)]{1,24})[）)]/);
    if (m) return { name: m[1].trim(), source: m[2].trim() };
    var t = s.split(/reinterpret/i)[0].split(/[，,]/)[0].trim();
    return { name: t.slice(0, 20), source: '' };
  }
  function firstSeg(v){ return String(v || '').split('·')[0].split('·')[0].trim(); }
  function buildTeaser(item){
    var dna = item && item.dna;
    if (!dna) return '🎭 今晚这位美人有点神秘，刮开见真容';
    var sp = splitSubject(dna.subject);
    var bits = [];
    if (sp.source) bits.push('她出自「' + sp.source + '」');
    else if (dna.scene) bits.push(firstSeg(dna.scene));
    var mood = firstSeg(dna.mood);
    if (mood) bits.push(mood);
    if (!bits.length) return '🎭 今晚这位美人有点神秘，刮开见真容';
    return '🎭 ' + bits.join(' · ') + ' · 猜猜她是谁？';
  }
  function buildReveal(item){
    var sp = splitSubject(item && item.dna && item.dna.subject);
    if (sp.name) {
      return sp.source
        ? ('她就是「' + sp.name + '」 · 出自 ' + sp.source)
        : ('她就是「' + sp.name + '」');
    }
    return '一位刚加入你观看记录的新美女';
  }
  // 快手同款称号（站内展示用，与发布任务标题同风格：美女+出处+角色+id）
  function buildKuaishouTitle(item){
    var sp = splitSubject(item && item.dna && item.dna.subject);
    var parts = ['美女'];
    if (sp.source) parts.push(sp.source);
    if (sp.name) parts.push(sp.name);
    if (item && item.id != null) parts.push(String(item.id));
    return parts.join('');
  }
  // ==== PURE-LOGIC-END ====

  var THUMB = 140;
  var UNLOCK = 0.30;
  var MASK_W = 96;

  var _expOverride = (function(){ try { return new URLSearchParams(location.search).get('exp'); } catch(e){ return null; } })();
  var _imgOverride = (function(){ try { return new URLSearchParams(location.search).get('img'); } catch(e){ return null; } })();
  function resolveVariant(id){
    if (_expOverride) {
      for (var k=0;k<EXP.VARIANTS.length;k++){ if (EXP.VARIANTS[k].label === _expOverride) return { vid:k, v:EXP.VARIANTS[k] }; }
    }
    return variantForId(id);
  }

  // 兜底图库（DB 拉取失败时使用，均为已审核 approved）
  var FALLBACK_POOL = [
    { id: 621, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-12T12-16-27-c.jpg" },
    { id: 581, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-08T23-36-44-c.jpg" },
    { id: 580, url: "https://letmetry.cn/images/A_hyperrealistic_high_fashion__2026-10-08T04-11-48-c.jpg" },
    { id: 575, url: "https://letmetry.cn/images/nanrenbao_beauty_20261002.jpg" },
    { id: 568, url: "https://letmetry.cn/images/30f5c5d9-acba-4ec8-a899-a79a60099fc3.jpg" },
    { id: 561, url: "https://letmetry.cn/images/79b959cd-5a66-47e3-9147-7b257fab60d4.jpg" },
    { id: 559, url: "https://letmetry.cn/images/c434df35-d1c3-4396-95b6-8ebadd01f100.jpg" },
    { id: 557, url: "https://letmetry.cn/images/3c7c5563-488d-418e-83ff-58876a64dfd2.jpg" },
    { id: 555, url: "https://letmetry.cn/images/141f60c5-33bc-4a6b-bd1e-95635a5cce73.jpg" },
    { id: 554, url: "https://letmetry.cn/images/4b76a095-7803-40bc-813f-4897158d1c94.jpg" },
    { id: 553, url: "https://letmetry.cn/images/9b04ed43-70b2-4561-9701-0de1ee60832f.jpg" },
    { id: 552, url: "https://letmetry.cn/images/3d5fd918-b432-40b6-8f38-94ca6e7ed08e.jpg" },
    { id: 551, url: "https://letmetry.cn/images/0832cd8b-3094-49d4-8ece-e0939ca5fb54.jpg" },
    { id: 550, url: "https://letmetry.cn/images/8acbc421-1124-40e3-b26d-fc5eae209f23.jpg" },
    { id: 549, url: "https://letmetry.cn/images/1c47501f-d218-4f30-aff7-7426af3f86d0.jpg" },
    { id: 548, url: "https://letmetry.cn/images/a7c4e3b4-5001-4c74-a278-8b2ccc76789b.jpg" },
    { id: 547, url: "https://letmetry.cn/images/18c918b1-c647-40aa-b380-b005db6988f3.jpg" },
    { id: 546, url: "https://letmetry.cn/images/15a2805f-3cbf-4f23-9452-7ef8ea801513.jpg" },

    { id: 540, url: "https://letmetry.cn/images/4f957fbc-cdc6-4974-af56-8c87a878d902.jpg" },
    { id: 539, url: "https://letmetry.cn/images/8c347da2-d365-4bba-9f12-b63fd7407a80.jpg" }
  ];

  function $(id){return document.getElementById(id);}
  function dpr(){ return Math.min(window.devicePixelRatio||1,2); }

  // ---- 埋点（百度统计）：scratch_lottery 业务事件 + scratch_exp 实验臂事件 ----
  function track(group, action, value){
    try {
      if (typeof _hmt !== 'undefined' && _hmt.push) {
        _hmt.push(['_trackEvent', group, action, variant.v.label, (value==null?1:value)]);
      }
    } catch(e){}
  }

  // ---- 图库池：DB 拉取 + localStorage 缓存（TTL 6h），失败用兜底数组 ----
  function fetchPoolFromDB(){
    var ep = (window.API_ENDPOINTS && window.API_ENDPOINTS.MYSQL_QUERY) || 'https://letmetry.cn/mysql/query';
    return fetch(ep, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sql: 'SELECT id, image_url, prompt_dna FROM beauty_images WHERE deleted = 0 AND review_status = ? ORDER BY id DESC LIMIT 500',
        params: ['approved']
      })
    }).then(function(r){ return r.json(); }).then(function(rows){
      var list = Array.isArray(rows) ? rows : (rows && Array.isArray(rows.data) ? rows.data : []);
      var items = [];
      for (var i=0;i<list.length;i++){
        var row = list[i];
        if (row && row.image_url) items.push({ id: parseInt(row.id,10), url: row.image_url, dna: extractDna(row.prompt_dna) });
      }
      return items.filter(function(x){ return !isNaN(x.id); });
    });
  }
  function loadPool(){
    var cached = readJson(KEYS.POOL_CACHE, null);
    if (cached && cached.ts && Array.isArray(cached.items) && cached.items.length &&
        (Date.now() - cached.ts) < POOL_TTL_MS) {
      return Promise.resolve(cached.items);
    }
    return fetchPoolFromDB().then(function(items){
      if (items && items.length) { writeJson(KEYS.POOL_CACHE, { ts: Date.now(), items: items }); return items; }
      return FALLBACK_POOL.slice();
    }).catch(function(){ return FALLBACK_POOL.slice(); });
  }

  // ---- 看过上下文：三源合并（PointsSystem ID 级 + URL 级 + 刮刮乐自有）----
  function buildSeenContext(){
    var ctx = { ids:{}, urls:{}, scratch:{} };
    try {
      var idsAll = JSON.parse(localStorage.getItem('nanrenbao_viewed_ids') || '{}');
      var beautyIds = idsAll.beauty || [];
      for (var i=0;i<beautyIds.length;i++) ctx.ids[beautyIds[i]] = true;
    } catch(e){}
    try {
      var viewed = JSON.parse(localStorage.getItem('nanrenbao_viewed_images') || '{}');
      for (var k in viewed){ if (Object.prototype.hasOwnProperty.call(viewed,k)) ctx.urls[k] = true; }
    } catch(e){}
    var scratchSeen = readJson(KEYS.SCRATCH_SEEN, []);
    for (var j=0;j<scratchSeen.length;j++) ctx.scratch[scratchSeen[j]] = true;
    return ctx;
  }
  function countUnseen(pool){
    var ctx = buildSeenContext(), n = 0;
    for (var i=0;i<pool.length;i++){ if (!isSeen(pool[i], ctx)) n++; }
    return n;
  }
  function markScratchSeen(id){
    var seen = readJson(KEYS.SCRATCH_SEEN, []);
    var s = String(id);
    if (seen.indexOf(s) === -1){ seen.push(s); writeJson(KEYS.SCRATCH_SEEN, seen); }
  }

  // ---- 画布 / 马赛克（control 刮擦臂 + tile 分块臂，与 beauty-scratch.html 同源）----
  var img = new Image();
  var bg=$('bg'), cv=$('scratch'), ctx2d=cv.getContext('2d');
  var bar=$('bar'), panel=$('panel'), hint=$('hint'), loading=$('loading'), loadingText=$('loadingText');
  var pointsEl=$('points'), expTag=$('expTag'), toast=$('toast');
  var drawBtn=$('drawBtn'), nextBtn=$('nextBtn'), rechargeBtn=$('rechargeBtn'), resetBtn=$('resetBtn');
  var panelTitle=$('panelTitle'), panelSub=$('panelSub');
  var panelIdentity=$('panelIdentity'), panelHarem=$('panelHarem');
  var teaser=$('teaser');
  var haremStatus='';   // '' | inactive | added | full（最近一次解锁时的后宫收录结果）
  var W=0,H=0, fitRect={dx:0,dy:0,dw:0,dh:0};
  var mask, mctx;
  var unlocked=false, scratching=false;
  var variant = { vid:0, v:EXP.VARIANTS[0] };
  var cols=1, rows=1, tileW=0, tileH=0;
  var tileState=[], tileRevealed=[], revealedCount=0;
  var coverCanvas=null;
  var startLogged=false, halfLogged=false;

  // ---- 业务状态 ----
  var pool = [];
  var current = null;        // 当前图 {id,url}
  var state = 'idle';        // idle | drawing | scratching | unlocked | insufficient | exhausted
  var drawRetries = 0;       // 加载失败重抽计数（防死循环）
  var MAX_DRAW_RETRIES = 5;

  function refreshPoints(){
    var p = 0;
    try { p = PointsSystem.getPoints(); } catch(e){}
    pointsEl.textContent = '积分 ' + p;
    return p;
  }
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }
  // 刮前悬念提示：给线索不揭晓；**开始刮即淡出**（刮的过程要无遮挡看图），换抽/解锁时也淡出
  function showTeaser(text){
    teaser.textContent = text;
    teaser.classList.add('show');
  }
  function hideTeaser(){
    teaser.classList.remove('show');
  }

  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr(); cv.height=H*dpr(); }
  function fit(){
    var nw=img.naturalWidth, nh=img.naturalHeight, s=W/nw < H/nh ? W/nw : H/nh;
    var dw=nw*s, dh=nh*s, dx=(W-dw)/2, dy=(H-dh)/2;
    fitRect={dx:dx,dy:dy,dw:dw,dh:dh};
    var mw=MASK_W, mh=Math.round(MASK_W*dh/dw);
    mask=document.createElement('canvas'); mask.width=mw; mask.height=mh;
    mctx=mask.getContext('2d'); mctx.clearRect(0,0,mw,mh);
  }

  function drawMosaic(){
    size(); fit();
    ctx2d.clearRect(0,0,cv.width,cv.height);
    ctx2d.globalCompositeOperation='source-over';
    ctx2d.imageSmoothingEnabled=false;
    var d=dpr();
    var px=fitRect.dx*d, py=fitRect.dy*d, pw=fitRect.dw*d, ph=fitRect.dh*d;
    var cell=Math.round(THUMB*Math.max(d,1));
    var t=document.createElement('canvas'); t.width=Math.max(1,Math.round(pw/cell)); t.height=Math.max(1,Math.round(ph/cell));
    var tc=t.getContext('2d'); tc.imageSmoothingEnabled=false;
    tc.drawImage(img,0,0,t.width,t.height);
    ctx2d.drawImage(t,px,py,pw,ph);
    panel.classList.remove('show');
  }

  function buildCover(){
    size(); fit();
    coverCanvas = document.createElement('canvas');
    coverCanvas.width = cv.width; coverCanvas.height = cv.height;
    var cc = coverCanvas.getContext('2d');
    cc.imageSmoothingEnabled=false;
    var d=dpr();
    var px=fitRect.dx*d, py=fitRect.dy*d, pw=fitRect.dw*d, ph=fitRect.dh*d;
    var cell=Math.round(THUMB*Math.max(d,1));
    var t=document.createElement('canvas'); t.width=Math.max(1,Math.round(pw/cell)); t.height=Math.max(1,Math.round(ph/cell));
    var tc=t.getContext('2d'); tc.imageSmoothingEnabled=false;
    tc.drawImage(img,0,0,t.width,t.height);
    cc.drawImage(t,px,py,pw,ph);
    cols = Math.max(1, Math.round(Math.sqrt(variant.v.n)));
    rows = cols;
    tileW = fitRect.dw/cols; tileH = fitRect.dh/rows;
    tileState = []; tileRevealed = []; revealedCount = 0;
    for (var i=0;i<cols*rows;i++){ tileState.push(1); tileRevealed.push(false); }
    renderTiles();
    panel.classList.remove('show');
  }

  function renderTiles(){
    ctx2d.clearRect(0,0,cv.width,cv.height);
    ctx2d.imageSmoothingEnabled=false;
    var d=dpr();
    for (var r=0;r<rows;r++){
      for (var c=0;c<cols;c++){
        var ti=r*cols+c;
        if (tileState[ti] <= 0.01) continue;
        var x=(fitRect.dx + c*tileW), y=(fitRect.dy + r*tileH);
        ctx2d.globalAlpha = tileState[ti];
        ctx2d.drawImage(coverCanvas, x*d, y*d, tileW*d, tileH*d, x*d, y*d, tileW*d, tileH*d);
      }
    }
    ctx2d.globalAlpha=1;
    ctx2d.strokeStyle='rgba(255,255,255,0.18)'; ctx2d.lineWidth=1;
    for (var c2=1;c2<cols;c2++){
      var gx=(fitRect.dx + c2*tileW)*d;
      ctx2d.beginPath(); ctx2d.moveTo(gx, fitRect.dy*d); ctx2d.lineTo(gx, (fitRect.dy+fitRect.dh)*d); ctx2d.stroke();
    }
    for (var r2=1;r2<rows;r2++){
      var gy=(fitRect.dy + r2*tileH)*d;
      ctx2d.beginPath(); ctx2d.moveTo(fitRect.dx*d, gy); ctx2d.lineTo((fitRect.dx+fitRect.dw)*d, gy); ctx2d.stroke();
    }
  }

  function revealTileAt(cx,cy){
    if (cx<fitRect.dx||cx>fitRect.dx+fitRect.dw||cy<fitRect.dy||cy>fitRect.dy+fitRect.dh) return;
    var c=Math.floor((cx-fitRect.dx)/tileW), r=Math.floor((cy-fitRect.dy)/tileH);
    if(c<0)c=0; if(c>=cols)c=cols-1; if(r<0)r=0; if(r>=rows)r=rows-1;
    var ti=r*cols+c;
    if (tileRevealed[ti]) return;
    tileRevealed[ti]=true; revealedCount++;
    animateTile(ti);
    if (!startLogged){ startLogged=true; track('scratch_exp','start'); }
    tickTiles();
  }

  function animateTile(ti){
    var start=performance.now(), dur=220;
    function step(now){
      var t=Math.min(1,(now-start)/dur);
      tileState[ti]=1-t;
      renderTiles();
      if(t<1) requestAnimationFrame(step);
      else { tileState[ti]=0; renderTiles(); }
    }
    requestAnimationFrame(step);
  }

  function tickTiles(){
    var pct = revealedCount/(cols*rows);
    bar.style.width=(pct*100)+'%';
    if (pct>=0.5 && !halfLogged){ halfLogged=true; track('scratch_exp','half'); }
    if (revealedCount>=cols*rows && !unlocked){ unlock(); }
  }

  function pxof(e){
    var r=cv.getBoundingClientRect(), t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    return { x:t.clientX-r.left, y:t.clientY-r.top };
  }

  function erase(x,y){
    var d=dpr(), sd=Math.max(14, dpr()*28);
    ctx2d.globalCompositeOperation='destination-out';
    ctx2d.beginPath(); ctx2d.arc(x*d, y*d, sd, 0, Math.PI*2); ctx2d.fill();
    if(x>=fitRect.dx && x<=fitRect.dx+fitRect.dw && y>=fitRect.dy && y<=fitRect.dy+fitRect.dh){
      var mx=(x-fitRect.dx)/fitRect.dw*MASK_W, my=(y-fitRect.dy)/fitRect.dh*mask.height;
      mctx.globalCompositeOperation='destination-out';
      mctx.beginPath(); mctx.arc(mx,my, Math.max(1.5, MASK_W/fitRect.dw * 6), 0, Math.PI*2); mctx.fill();
    }
  }

  function ratio(){
    var data=mctx.getImageData(0,0,mask.width,mask.height).data, total=mask.width*mask.height, erased=0;
    for(var i=3;i<data.length;i+=4){ if(data[i]<128) erased++; }
    return erased/total;
  }

  function tick(){
    var r=ratio();
    bar.style.width=(r*100)+'%';
    if (!startLogged){ startLogged=true; track('scratch_exp','start'); }
    if (r>=UNLOCK*0.5 && !halfLogged){ halfLogged=true; track('scratch_exp','half'); }
    if(r>=UNLOCK && !unlocked) unlock();
  }

  function handlePoint(x,y){
    if (variant.v.mode==='scratch'){ erase(x,y); tick(); }
    else { revealTileAt(x,y); }
  }
  function onDown(e){ e.preventDefault(); scratching=true; hideTeaser(); handlePoint(pxof(e).x,pxof(e).y); }
  function onMove(e){ e.preventDefault(); if(!scratching) return; handlePoint(pxof(e).x,pxof(e).y); }
  function onUp(){ scratching=false; }

  // ---- 揭示完成：全局去重记录 + DB view_count ----
  function bumpViewCount(id, url){
    if (!url) return;
    try {
      var key = 'sl_view_bumped_' + id;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
    } catch(e){}
    try {
      var ep = (window.API_ENDPOINTS && window.API_ENDPOINTS.MYSQL_QUERY) || 'https://letmetry.cn/mysql/query';
      fetch(ep, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sql: 'UPDATE beauty_images SET view_count = view_count + 1 WHERE image_url = ?',
          params: [url]
        })
      }).catch(function(){});
    } catch(e){}
  }

  function recordSeen(item){
    // 1) 刮刮乐自有记录（抽中时已写，这里双保险）
    markScratchSeen(item.id);
    // 2) 全局 ID 级记录：其他栏目（欣赏/背影杀/后宫）后续也会去重
    try { PointsSystem.markImageIdAsViewed(item.id, 'beauty'); } catch(e){}
    // 3) URL 级记录 + DB view_count（ PointsSystem.markImageViewed 内部含计数）
    try {
      if (PointsSystem && typeof PointsSystem.markImageViewed === 'function') {
        PointsSystem.markImageViewed(item.url).catch(function(){});
      } else {
        bumpViewCount(item.id, item.url);
      }
    } catch(e){ bumpViewCount(item.id, item.url); }
    // 4) 后宫收录（与欣赏/背影杀同规则：激活后刮开即自动收入，无需再花积分）
    haremStatus = '';
    try {
      if (window.isHaremActivated && window.isHaremActivated()) {
        var added = window.addHaremImage ? window.addHaremImage(item.url) : false;
        haremStatus = added ? 'added' : 'full';
      } else {
        haremStatus = 'inactive';
      }
    } catch(e){}
  }

  function renderIdentity(item){
    // 身份揭晓：她是谁 + 快手同款称号（与发布任务标题同风格）
    panelIdentity.innerHTML = '';
    var l1 = document.createElement('div');
    l1.className = 'identity-name';
    l1.textContent = buildReveal(item);
    panelIdentity.appendChild(l1);
    var l2 = document.createElement('div');
    l2.className = 'identity-title';
    l2.textContent = '快手同款称号：' + buildKuaishouTitle(item);
    panelIdentity.appendChild(l2);
    panelIdentity.style.display = (item && item.dna) ? '' : 'none';
  }
  function renderHaremNote(){
    var msg = '';
    if (haremStatus === 'added') {
      msg = '💗 已收入你的后宫，去「我的后宫」随时回看';
    } else if (haremStatus === 'full') {
      msg = '💗 后宫已满（可花 1 积分扩容 +1），这位暂未收录';
    } else if (haremStatus === 'inactive') {
      msg = '💗 花 50 积分激活「我的后宫」，刮到的美女自动收录';
    }
    panelHarem.textContent = msg;
    panelHarem.style.display = msg ? '' : 'none';
  }

  function unlock(){
    unlocked=true;
    if (variant.v.mode==='scratch'){ ctx2d.clearRect(0,0,cv.width,cv.height); }
    bar.style.width='100%';
    hint.style.opacity='0';
    hideTeaser();
    track('scratch_exp','complete');
    track('scratch_lottery','unlock');
    if (current) recordSeen(current);
    state='unlocked';
    panelTitle.textContent='真容解锁 ✨';
    renderIdentity(current);
    renderHaremNote();
    var left = countUnseen(pool);
    panelSub.textContent = left > 0
      ? ('这位美女已加入你的观看记录 · 图库还剩 ' + left + ' 位没看过')
      : '这位美女已加入你的观看记录';
    nextBtn.style.display = left > 0 ? '' : 'none';
    drawBtn.style.display='none';
    rechargeBtn.style.display='none';
    resetBtn.style.display = left > 0 ? 'none' : '';
    panel.classList.add('show');
  }

  // ---- 抽图（核心动作）：扣 1 积分 → 随机抽未看过 → 写 seen → 渲染 ----
  function draw(){
    if (state === 'drawing') return;
    hideTeaser();
    // 清掉上一张解锁面板的身份/后宫行，避免切态时残留
    panelIdentity.style.display='none';
    panelHarem.style.display='none';
    var points = refreshPoints();
    if (points < COST_PER_DRAW){
      state='insufficient';
      panelTitle.textContent='积分不足 😢';
      panelSub.textContent='抽一位新美女需要 ' + COST_PER_DRAW + ' 积分，每日访问男人宝可领 5 积分';
      drawBtn.style.display='none';
      nextBtn.style.display='none';
      rechargeBtn.style.display='';
      resetBtn.style.display='none';
      panel.classList.add('show');
      track('scratch_lottery','insufficient');
      return;
    }
    var item = pickUnseen(pool, buildSeenContext());
    if (!item){
      state='exhausted';
      panelTitle.textContent='🎉 全部刮完';
      panelSub.textContent='图库里没看过的新美女都刮完了，重开一轮可以再看一次';
      drawBtn.style.display='none';
      nextBtn.style.display='none';
      rechargeBtn.style.display='none';
      resetBtn.style.display='';
      panel.classList.add('show');
      track('scratch_lottery','exhausted');
      return;
    }
    // 扣费 + 抽中即记 seen（防刮到一半退出后刷新重复抽到同一张）
    try { PointsSystem.addPoints(-COST_PER_DRAW); } catch(e){}
    markScratchSeen(item.id);
    refreshPoints();
    track('scratch_lottery','draw');
    current = item;
    state='drawing';
    loadItem(item);
  }

  function loadItem(item){
    var it = item;
    if (_imgOverride) it = { id: it.id, url: _imgOverride, dna: it.dna };
    variant = resolveVariant(it.id);
    unlocked=false; bar.style.width='0%'; panel.classList.remove('show');
    startLogged=false; halfLogged=false;
    expTag.style.display=''; expTag.textContent = '实验臂: ' + variant.v.label;
    hint.style.opacity='1';
    hint.textContent = (variant.v.mode==='scratch')
      ? '↓ 手指擦开马赛克，看美女真容'
      : '👆 点开方块，逐块揭秘真容';
    img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      bg.src=img.src;
      loading.style.display='none';
      state='scratching';
      showTeaser(buildTeaser(it));
      if (variant.v.mode==='scratch'){ drawMosaic(); }
      else { buildCover(); }
    };
    img.onerror=function(){
      // 单张加载失败：退还积分 + 从 seen 里摘掉（不算看过），换一张重抽
      removeScratchSeen(it.id);
      try { PointsSystem.addPoints(COST_PER_DRAW); } catch(e){}
      refreshPoints();
      loading.style.display='none';
      drawRetries++;
      if (drawRetries > MAX_DRAW_RETRIES){
        drawRetries = 0;
        state='idle';
        showToast('网络不太稳，稍后再试 😵');
        showPaywall();
        return;
      }
      showToast('这张加载失败了，换一张 💫');
      state='idle';
      draw();
    };
    img.src=it.url;
  }

  function removeScratchSeen(id){
    var seen = readJson(KEYS.SCRATCH_SEEN, []);
    var s = String(id), out = [];
    for (var i=0;i<seen.length;i++){ if (seen[i] !== s) out.push(seen[i]); }
    writeJson(KEYS.SCRATCH_SEEN, out);
  }

  function showPaywall(){
    state='idle';
    panelIdentity.style.display='none';
    panelHarem.style.display='none';
    var left = countUnseen(pool);
    panelTitle.textContent='🎰 刮刮乐';
    panelSub.textContent = left > 0
      ? ('花 ' + COST_PER_DRAW + ' 积分随机抽一位没看过的新美女，刮开真容 · 图库还剩 ' + left + ' 位')
      : '图库里没看过的新美女都刮完了';
    drawBtn.style.display = left > 0 ? '' : 'none';
    nextBtn.style.display='none';
    rechargeBtn.style.display='none';
    resetBtn.style.display = left > 0 ? 'none' : '';
    panel.classList.add('show');
  }

  function resetRound(){
    // 清空刮刮乐自有记录 + 全局 ID 级记录（让其他栏目也重新按未看排序）；
    // 保留 viewed_images（URL 级付费窗口记录，避免重复扣费争议）
    writeJson(KEYS.SCRATCH_SEEN, []);
    try {
      var idsAll = JSON.parse(localStorage.getItem('nanrenbao_viewed_ids') || '{}');
      idsAll.beauty = [];
      localStorage.setItem('nanrenbao_viewed_ids', JSON.stringify(idsAll));
    } catch(e){}
    track('scratch_lottery','reset');
    showToast('已重开一轮 🔄');
    showPaywall();
  }

  cv.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);

  drawBtn.addEventListener('click', function(){ track('scratch_lottery','advance'); draw(); });
  nextBtn.addEventListener('click', function(){ track('scratch_lottery','advance'); draw(); });
  rechargeBtn.addEventListener('click', function(){ location.href='recharge.html'; });
  resetBtn.addEventListener('click', resetRound);
  $('homeBtn').addEventListener('click',function(){ location.href='index.html'; });

  // ---- 启动：初始化积分（新用户 3 + 每日 5）→ 拉图库 → 待机面板 ----
  try { PointsSystem.initialize(); } catch(e){}
  refreshPoints();
  loadPool().then(function(items){
    pool = items;
    loading.style.display='none';
    showPaywall();
  });
})();
</script>
