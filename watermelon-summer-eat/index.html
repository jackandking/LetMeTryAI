<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">西瓜大降价，您家夏天怎么吃？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">西瓜大降价，您家夏天怎么吃？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="direct-cut">
                            <div class="card-image">
                                <img src="images/direct-cut.svg" alt="一盘切好的西瓜块" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">切块装盘</h3>
                                <p class="option-desc">老规矩，切成小块放盘里，拿叉子慢慢吃。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chilled-spoon">
                            <div class="card-image">
                                <img src="images/chilled-spoon.svg" alt="用勺子挖冰西瓜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷藏挖着吃</h3>
                                <p class="option-desc">西瓜提前放冰箱，用勺子挖着吃，冰冰凉凉。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watermelon-juice">
                            <div class="card-image">
                                <img src="images/watermelon-juice.svg" alt="一杯西瓜汁" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">榨成西瓜汁</h3>
                                <p class="option-desc">去皮切块打成汁，一杯清甜解暑，老人喝着省事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watermelon-salad">
                            <div class="card-image">
                                <img src="images/watermelon-salad.svg" alt="西瓜水果沙拉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">做成水果沙拉</h3>
                                <p class="option-desc">西瓜搭配黄瓜或酸奶，换个花样拌着吃。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
