    <title>关注：社区活动你更想参加哪个？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：社区活动你更想参加哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="calligraphy-handicraft-class">
                            <div class="card-image">
                                <img src="images/calligraphy-handicraft-class.svg" alt="老人书画手工课堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书画与手工班</h3>
                                <p class="option-desc">一起练字、画画或做手工，动手又交流</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighbour-help-group">
                            <div class="card-image">
                                <img src="images/neighbour-help-group.svg" alt="邻里互助场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里互助小组</h3>
                                <p class="option-desc">互相帮助跑腿、陪同就医、日常关怀</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="volunteer-service-team">
                            <div class="card-image">
                                <img src="images/volunteer-service-team.svg" alt="老人志愿服务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">志愿服务队</h3>
                                <p class="option-desc">参加社区志愿、公益活动，做力所能及的贡献</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="square-dance-exercise-class">
                            <div class="card-image">
                                <img src="images/square-dance-exercise-class.svg" alt="广场舞健身" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞/健身操班</h3>
                                <p class="option-desc">集体活动兼顾社交和适度运动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
