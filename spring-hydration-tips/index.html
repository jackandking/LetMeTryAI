    <title>春季换季保湿投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季换季保湿，你常用哪种方法？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季时你更倾向哪种保湿方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="serum-first">
                            <div class="card-image">
                                <img src="images/serum-first.svg" alt="轻薄保湿精华" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精华打底</h3>
                                <p class="option-caption">先用轻薄保湿精华，改善吸收与肤感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="rich-cream">
                            <div class="card-image">
                                <img src="images/rich-cream.svg" alt="滋润面霜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">滋润面霜</h3>
                                <p class="option-caption">用滋润面霜锁住水分，适合偏干肤质</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hydrating-mist">
                            <div class="card-image">
                                <img src="images/hydrating-mist.svg" alt="补水喷雾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">补水喷雾</h3>
                                <p class="option-caption">随时喷雾即时补水，方便外出补给</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mask-boost">
                            <div class="card-image">
                                <img src="images/mask-boost.svg" alt="面膜护理" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">密集面膜</h3>
                                <p class="option-caption">周期性敷面膜做密集补水护理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
