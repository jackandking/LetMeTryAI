<head>

    <title>电车后视镜维修费投票页</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">电车后视镜维修费，你怎么看？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">面对电车后视镜维修费，你会怎么做？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="pay-original">
                            <div class="card-image">
                                <img src="images/pay-original.svg" alt="原厂维修示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自己付费修原厂</h3>
                                <p class="option-desc">按原厂标准维修，重视质量与保养记录。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="claim-insurance">
                            <div class="card-image">
                                <img src="images/claim-insurance.svg" alt="保险理赔示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先走保险或找厂家处理</h3>
                                <p class="option-desc">通过保险理赔或联系厂家争取承担费用或优惠。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="third-party-repair">
                            <div class="card-image">
                                <img src="images/third-party-repair.svg" alt="第三方维修示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">路边或第三方便宜修</h3>
                                <p class="option-desc">价格更低但质量与保固各异，追求性价比的选择。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="delay-or-diy-repair">
                            <div class="card-image">
                                <img src="images/delay-or-diy-repair.svg" alt="暂不修理示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暂时不修/自己临时替代</h3>
                                <p class="option-desc">短期用临时替代，等待更合适时机或更便宜方案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

        })();
    </script>
</body>
</html>
