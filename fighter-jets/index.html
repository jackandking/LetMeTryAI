    <title>全球战力：谁是现代空战之王？</title>

<body>
    <h1 id="pageTitle">全球战力：谁是现代空战之王？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">在现代空战体系中，你认为哪款战机是当之无愧的空中霸主？</p>
            <div class="button-group" id="optionsContainer">
                <!-- F-22 Raptor -->
                <label class="option">
                    <input type="radio" name="fighter" value="f22">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/F-22_Raptor_edit1_%28cropped%29.jpg/320px-F-22_Raptor_edit1_%28cropped%29.jpg" alt="F-22 猛禽" loading="lazy">
                    <span>F-22 猛禽</span>
                </label>
                
                <!-- J-20 Mighty Dragon -->
                <label class="option">
                    <input type="radio" name="fighter" value="j20">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/J-20_at_Airshow_China_2016.jpg/320px-J-20_at_Airshow_China_2016.jpg" alt="J-20 威龙" loading="lazy">
                    <span>J-20 威龙</span>
                </label>
                
                <!-- Su-57 Felon -->
                <label class="option">
                    <input type="radio" name="fighter" value="su57">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Sukhoi_Su-57_in_flight_at_MAKS-2019_%28cropped%29.jpg/320px-Sukhoi_Su-57_in_flight_at_MAKS-2019_%28cropped%29.jpg" alt="Su-57 恶棍" loading="lazy">
                    <span>Su-57 恶棍</span>
                </label>
                
                <!-- F-35 Lightning II -->
                <label class="option">
                    <input type="radio" name="fighter" value="f35">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/F-35A_flight_%28cropped%29.jpg/320px-F-35A_flight_%28cropped%29.jpg" alt="F-35 闪电II" loading="lazy">
                    <span>F-35 闪电II</span>
                </label>
                
                <!-- Rafale -->
                <label class="option">
                    <input type="radio" name="fighter" value="rafale">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Rafale_C_during_Bastille_Day_2019.jpg/320px-Rafale_C_during_Bastille_Day_2019.jpg" alt="阵风" loading="lazy">
                    <span>阵风战机</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在获取最新战力统计...</p>
    </div>
