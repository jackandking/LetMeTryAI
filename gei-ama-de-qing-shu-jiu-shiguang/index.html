    <title>给阿嬷的情书：你记得哪些旧时光</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">《给阿嬷的情书》唤起了哪些旧时光？揭秘你心底的温暖记忆</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">读完《给阿嬷的情书》，下面哪类旧时光更触动你？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-flavors">
                            <div class="card-image">
                                <img src="images/home-flavors.jpg" alt="老家餐桌与家常菜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老家味道</h3>
                                <p class="option-desc">那一碗热粥、咸菜和家常小炒的味道，让人瞬间想起厨房的灯光与饭香。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="yard-and-neighbors">
                            <div class="card-image">
                                <img src="images/yard-and-neighbors.jpg" alt="院子里孩子玩耍与邻里相聚" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">院子与邻里</h3>
                                <p class="option-desc">在院子里追逐、和邻居串门的午后，邻里笑声和熟悉的弄堂气息。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="photos-and-festivals">
                            <div class="card-image">
                                <img src="images/photos-and-festivals.jpg" alt="褪色的合影和年节场面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">年节老照片</h3>
                                <p class="option-desc">翻出褪色照片，年节合影和节日习俗的身影，像一帧帧时间的暖片段。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="toys-and-school">
                            <div class="card-image">
                                <img src="images/toys-and-school.jpg" alt="旧玩具与课本的细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">童年玩具与学堂</h3>
                                <p class="option-desc">木头玩具、弹珠、旧课本和老师的口头叮咛，那些简单的快乐与成长瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
