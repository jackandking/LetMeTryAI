<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">如何选护眼台灯？家长更看重哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：哪种护眼台灯更适合孩子？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="adjustable-color-temp">
                            <div class="card-image">
                                <img src="images/adjustable-color-temp.svg" alt="可调色温台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可调色温护眼灯</h3>
                                <p class="option-desc">可调色温与亮度，适应不同阅读/写作场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="anti-glare-desk-lamp">
                            <div class="card-image">
                                <img src="images/anti-glare-desk-lamp.svg" alt="防眩光台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防眩光护眼台灯</h3>
                                <p class="option-desc">采用防眩设计，减少眼疲劳与反光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="smart-sensor-lamp">
                            <div class="card-image">
                                <img src="images/smart-sensor-lamp.svg" alt="智能感应台灯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">智能感应节能灯</h3>
                                <p class="option-desc">支持感应/定时与省电，方便家长管理使用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
