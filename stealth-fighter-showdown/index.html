    <title>硬核对比：现代隐身战机谁更强？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：现代隐身战机谁更强？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款隐身战机？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="j-20">
                            <div class="card-image">
                                <img src="images/j-20.svg" alt="歼-20 侧视机身" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">歼-20（J-20）</h3>
                                <p class="option-desc">国产隐身重型战斗机，强调机动与本土化升级潜力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-22">
                            <div class="card-image">
                                <img src="images/f-22.svg" alt="F-22 机头特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-22 猛禽</h3>
                                <p class="option-desc">经典空优隐身机，侧重超音速机动和空战优势</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-35">
                            <div class="card-image">
                                <img src="images/f-35.svg" alt="F-35 机翼细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-35 闪电II</h3>
                                <p class="option-desc">多用途隐身机，注重传感器融合与任务灵活性</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
