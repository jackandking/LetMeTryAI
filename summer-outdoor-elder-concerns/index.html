    <title>暑天出门，老人你在意哪点？大家怎么看</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">暑天出门，老人你在意哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">暑天出门，老人你在意哪点？（可选一项）</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sunscreen-shade">
                            <div class="card-image">
                                <img src="images/sunscreen-shade.svg" alt="老人撑伞遮阳" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防晒遮阳</h3>
                                <p class="option-desc">带遮阳伞/帽子、涂防晒，怕晒黑和中暑</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cooling-ventilation">
                            <div class="card-image">
                                <img src="images/cooling-ventilation.svg" alt="老人手持小风扇" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">降温通风</h3>
                                <p class="option-desc">随身小风扇或找空调/阴凉处，讲究凉快</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="walking-safety">
                            <div class="card-image">
                                <img src="images/walking-safety.svg" alt="老人慢走手杖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">走路安全</h3>
                                <p class="option-desc">关注路面防滑、鞋子舒适、休息点充足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="toilet-access">
                            <div class="card-image">
                                <img src="images/toilet-access.svg" alt="公共厕所指示牌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">方便如厕</h3>
                                <p class="option-desc">外出时找厕所方便、排队不便影响出行</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
