    <title>高考现场那些瞬间，你遇过哪一条？来回忆一下</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">高考现场那些瞬间，你遇过哪一条？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">高考现场那些瞬间，你遇过哪一条？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="forgot-admission-ticket">
                            <div class="card-image">
                                <img src="images/forgot-admission-ticket.svg" alt="学生忘带准考证在门口焦急" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">忘带准考证</h3>
                                <p class="option-desc">到考场门口才发现准考证不见，瞬间慌张又无奈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="power-out-or-equipment-fail">
                            <div class="card-image">
                                <img src="images/power-out-or-equipment-fail.svg" alt="考场熄灯或计时器故障场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">考场突然停电或设备故障</h3>
                                <p class="option-desc">答题正投入时教室灯或计时设备出问题，时间感混乱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="desk-cheating-caught">
                            <div class="card-image">
                                <img src="images/desk-cheating-caught.svg" alt="同桌被抓作弊的紧张瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同桌被监考发现作弊</h3>
                                <p class="option-desc">旁边同学被抓，空气瞬间凝固，心里七上八下</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fill-wrong-subject-or-miss-mark">
                            <div class="card-image">
                                <img src="images/fill-wrong-subject-or-miss-mark.svg" alt="答题卡写错科目或漏涂的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">答题卡写错科目或漏涂</h3>
                                <p class="option-desc">交卷后才发现科目写错或答题卡漏涂，懊悔难平</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
