    <title>如何帮助孩子维持同学友谊</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">如何帮助孩子维持同学友谊：日常策略选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在日常生活中，你会支持哪种方式帮助孩子维持同学友谊？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="teach-initiate">
                            <div class="card-image">
                                <img src="images/teach-initiate.svg" alt="孩子与同学打招呼" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教孩子主动打招呼和邀请</h3>
                                <p class="option-caption">鼓励孩子主动问候、邀请同学一起玩或做作业，建立联系惯例</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-activities">
                            <div class="card-image">
                                <img src="images/regular-activities.svg" alt="孩子参加小组活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">建立固定的小组活动</h3>
                                <p class="option-caption">定期安排小型聚会或学习小组，创造持续互动的机会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="conflict-resolution">
                            <div class="card-image">
                                <img src="images/conflict-resolution.svg" alt="孩子与同学和平沟通" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教会解决冲突的技能</h3>
                                <p class="option-caption">引导孩子表达感受、设立边界并学会和平解决分歧</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="screen-time-guidelines">
                            <div class="card-image">
                                <img src="images/screen-time-guidelines.svg" alt="孩子与同学线下玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">减少社交压力，鼓励线下互动</h3>
                                <p class="option-caption">合理安排屏幕使用，鼓励面对面交流以减少误会和社交焦虑</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>

        </footer>
