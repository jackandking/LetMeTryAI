    <title>五一档观影偏好投票</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">五一档你更期待哪类影片？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">五一档你更期待哪类影片？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="action-blockbuster">
                            <div class="card-image">
                                <img src="images/action-blockbuster.jpg" alt="动作商业片海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动作/商业片</h3>
                                <p class="option-desc">要热闹刺激的大场面和特效</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="comedy-family">
                            <div class="card-image">
                                <img src="images/comedy-family.jpg" alt="喜剧家庭片海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喜剧/家庭片</h3>
                                <p class="option-desc">轻松幽默、适合全家放松观影</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="romance-drama">
                            <div class="card-image">
                                <img src="images/romance-drama.jpg" alt="爱情文艺片海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">爱情/文艺片</h3>
                                <p class="option-desc">走感情细腻路线、适合慢节奏品味</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sci-fi-fantasy">
                            <div class="card-image">
                                <img src="images/sci-fi-fantasy.jpg" alt="科幻奇幻片海报" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">科幻/奇幻片</h3>
                                <p class="option-desc">想看脑洞大、视效带感的未来或异世界故事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
