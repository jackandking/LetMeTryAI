    <title>带孩子逛博物馆：哪个镇馆之宝会让他惊呼？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子逛博物馆，哪个镇馆之宝会让他惊呼？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子逛博物馆，哪个镇馆之宝会让他惊呼？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="moving-dinosaur-model">
                            <div class="card-image">
                                <img src="images/moving-dinosaur-model.svg" alt="孩子注视仿真恐龙模型，张口惊呼的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会动的恐龙模型（仿真互动）</h3>
                                <p class="option-desc">巨大的骨架+仿真声效，像要活过来一样。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="giant-mural-handscroll">
                            <div class="card-image">
                                <img src="images/giant-mural-handscroll.svg" alt="父母和孩子在长卷前指着画中场景交流" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古代壁画或长卷（超大画面）</h3>
                                <p class="option-desc">一眼看到整幅长卷的细节，画面故事感强。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bronze-ritual-ding">
                            <div class="card-image">
                                <img src="images/bronze-ritual-ding.svg" alt="孩子伸手比对青铜鼎的巨大体积" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜大鼎（恢弘造型）</h3>
                                <p class="option-desc">厚重的金属光泽与复杂纹饰，带来历史震撼感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="famille-rose-vase">
                            <div class="card-image">
                                <img src="images/famille-rose-vase.svg" alt="孩子靠近展柜盯着彩绘瓷瓶的细部" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">粉彩花瓶（精致彩绘）</h3>
                                <p class="option-desc">细腻彩绘和鲜艳配色，吸引孩子盯看细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
