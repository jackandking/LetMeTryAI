<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家中长辈花钱你会怎么做？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">当家中长辈想花一笔钱时，你通常会怎么处理？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="respect-autonomy">
                            <div class="card-image">
                                <img src="images/respect-autonomy.svg" alt="尊重长辈自主消费" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">尊重长辈自主</h3>
                                <p class="option-caption">支持长辈自己决定，信任他们的选择与生活方式。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="discuss-budget">
                            <div class="card-image">
                                <img src="images/discuss-budget.svg" alt="与家人沟通预算" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">事先沟通预算</h3>
                                <p class="option-caption">遇到较大支出先和家人商量，明确预算与用途后再决定。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="help-manage-payments">
                            <div class="card-image">
                                <img src="images/help-manage-payments.svg" alt="协助办理或代付" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">协助办理或代付</h3>
                                <p class="option-caption">在需要时代为办理或代付，防止操作错误或被诈骗。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="offer-guidance">
                            <div class="card-image">
                                <img src="images/offer-guidance.svg" alt="陪同并提供建议" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">提供理财与防骗建议</h3>
                                <p class="option-caption">陪同选购并给出实用建议，提醒注意防骗与合同细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
