    <title>不吸烟也查出肺结节？哪个生活细节更让你担心</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">更近很多不吸烟的人也查出肺结节，你会更在意哪个生活细节？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">更近很多不吸烟的人也查出肺结节，你会更在意哪个生活细节？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="secondhand-smoke">
                            <div class="card-image">
                                <img src="images/secondhand-smoke.svg" alt="窗边有烟雾和茶杯的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家中二手烟</h3>
                                <p class="option-desc">家里亲戚或子女偶尔在室内抽烟，屋里常有烟味</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-renovation-formaldehyde">
                            <div class="card-image">
                                <img src="images/home-renovation-formaldehyde.svg" alt="带着阳光的客厅有搬新家具的情景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">新装修残留</h3>
                                <p class="option-desc">刚装修或添了新家具，房间有刺鼻气味、通风不够</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="urban-air-pollution">
                            <div class="card-image">
                                <img src="images/urban-air-pollution.svg" alt="城市街道有雾霾和车流的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">长期雾霾/尾气</h3>
                                <p class="option-desc">常年住在车辆多或雾霾严重的街区，外出空气浑浊</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="frequent-grilled-smoked-foods">
                            <div class="card-image">
                                <img src="images/frequent-grilled-smoked-foods.svg" alt="餐桌上有烧烤和烟雾的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常吃烟熏/烧烤</h3>
                                <p class="option-desc">喜欢吃烧烤、熏制食品或频繁油炸，餐桌是常态</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
