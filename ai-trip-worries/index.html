    <title>出游用AI带爸妈订行程，您担心哪种问题？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">出游用AI，带爸妈订行程您更担心哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">出游用AI，带爸妈订行程您更担心哪点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="safety-concerns">
                            <div class="card-image">
                                <img src="images/safety-concerns.svg" alt="景点住宿安全顾虑" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">景点或住宿不安全</h3>
                                <p class="option-desc">担心AI安排的景点或住宿是否考虑老人安全与出入口、无障碍、救援可达性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pace-too-tiring">
                            <div class="card-image">
                                <img src="images/pace-too-tiring.svg" alt="行程节奏过紧" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">行程节奏太紧太累</h3>
                                <p class="option-desc">担心走得太多、换点频繁，爸妈体力跟不上、休息时间不足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-medication-issues">
                            <div class="card-image">
                                <img src="images/food-medication-issues.svg" alt="饮食与用药问题" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">饮食与用药安排不周</h3>
                                <p class="option-desc">担心餐食口味、饮食卫生或服药时间被忽视，影响健康和体验。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-communication">
                            <div class="card-image">
                                <img src="images/emergency-communication.svg" alt="紧急情况与沟通" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">突发情况沟通与应急</h3>
                                <p class="option-desc">担心遇到临时变更或紧急状况时，沟通不畅或应急处理不到位。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
