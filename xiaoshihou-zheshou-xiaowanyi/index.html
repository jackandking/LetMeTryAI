    <title>小时候你常折哪种小玩意儿？回忆里的纸玩具</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">小时候你常折哪种小玩意儿？哪款一看就想起那个夏天</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">小时候你常折哪种小玩意儿？选出你经常折的那款</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-feiji">
                            <div class="card-image">
                                <img src="images/zhi-feiji.svg" alt="纸飞机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">纸飞机</h3>
                                <p class="option-desc">课堂后或院子里，一折就能飞的纸飞机</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-chuan">
                            <div class="card-image">
                                <img src="images/zhi-chuan.svg" alt="纸船" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">纸船</h3>
                                <p class="option-desc">雨天放进水沟或水盆里，看着顺流而去的纸船</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-mao">
                            <div class="card-image">
                                <img src="images/zhi-mao.svg" alt="纸帽" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">纸帽</h3>
                                <p class="option-desc">用报纸或练习本折的纸帽子，戴着晒太阳玩耍</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-he">
                            <div class="card-image">
                                <img src="images/zhi-he.svg" alt="纸鹤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">纸鹤</h3>
                                <p class="option-desc">折给同伴或夹在书里的纸鹤，带着小心愿的味道</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
