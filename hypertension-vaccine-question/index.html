    <title>听说有能管数月的降压疫苗，你会想知道哪点？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">听说有能管数月的降压疫苗，你想知道哪点？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">听说有能管数月的降压疫苗，你想知道哪方面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="side-effects">
                            <div class="card-image">
                                <img src="images/side-effects.svg" alt="老年人关心副作用图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">副作用安全性</h3>
                                <p class="option-desc">会不会头晕、肠胃不适或其他副作用，打了安全不安全？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="duration-months">
                            <div class="card-image">
                                <img src="images/duration-months.svg" alt="日历与时钟示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">维持多长时间</h3>
                                <p class="option-desc">真的能管数月吗？要多久补打一次才省心？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cost-insurance">
                            <div class="card-image">
                                <img src="images/cost-insurance.svg" alt="钱包与医保卡图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">费用和报销</h3>
                                <p class="option-desc">收费多少、能不能报医保或补贴，家里要不要提前准备钱？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="who-suits">
                            <div class="card-image">
                                <img src="images/who-suits.svg" alt="老年家庭咨询场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">适合哪些人</h3>
                                <p class="option-desc">哪些年纪或病史的人能打，家里老人适不适合去咨询？</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
