        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最怀念哪类经典老歌？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="spring-festival-hits">
                            <div class="card-image">
                                <img src="images/spring-festival-hits.svg" alt="春晚经典曲目" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">春晚经典曲目</h3>
                                <p class="option-desc">那些陪伴除夕夜的熟悉旋律</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="movie-theme-songs">
                            <div class="card-image">
                                <img src="images/movie-theme-songs.svg" alt="电影主题曲" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电影主题曲</h3>
                                <p class="option-desc">银幕上让人难忘的主题旋律</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老戏曲唱段</h3>
                                <p class="option-desc">传统戏曲里的动人唱段</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="pop-gold-60s-80s">
                            <div class="card-image">
                                <img src="images/pop-gold-60s-80s.svg" alt="流行金曲60s-80s" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">流行金曲（60s-80s）</h3>
