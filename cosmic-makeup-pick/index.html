    <title>宇宙感妆你会pick哪款？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">宇宙感妆你会pick哪款？惊艳背影还是梦幻极光？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">宇宙感妆你会pick哪款？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="silver-stardust">
                            <div class="card-image">
                                <img src="images/silver-stardust.svg" alt="银色星尘妆容，金属光泽和细碎亮片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">银色星尘</h3>
                                <p class="option-desc">镜面金属光＋细闪，冷调未来感，适合夜晚出街的科幻感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="aurora-dream">
                            <div class="card-image">
                                <img src="images/aurora-dream.svg" alt="梦幻极光妆容，粉紫绿珠光渐变" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">梦幻极光</h3>
                                <p class="option-desc">渐变珠光＋柔和色调，粉紫绿交织出仙气与梦幻感的光晕。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="deep-space-smokey">
                            <div class="card-image">
                                <img src="images/deep-space-smokey.svg" alt="深空烟熏妆容，深色烟熏和星点亮片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">深空烟熏</h3>
                                <p class="option-desc">深色烟熏＋点缀星点亮片，神秘又有层次，适合戏剧感造型。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
