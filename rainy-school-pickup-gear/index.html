<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">梅雨季接送娃，你的必备神器是啥？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">梅雨季接送娃，你的必备神器是啥？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="oversized-double-umbrella">
                            <div class="card-image">
                                <img src="images/oversized-double-umbrella.svg" alt="超大号双人伞插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">超大号双人伞</h3>
                                <p class="option-desc">一把伞罩住家长和孩子，走路接送全靠它</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kids-raincoat-boots-set">
                            <div class="card-image">
                                <img src="images/kids-raincoat-boots-set.svg" alt="儿童雨衣雨鞋套装插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">儿童雨衣雨鞋套装</h3>
                                <p class="option-desc">让孩子放开手脚踩水，家长省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="waterproof-diaper-bag">
                            <div class="card-image">
                                <img src="images/waterproof-diaper-bag.svg" alt="防水妈咪包插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防水妈咪包</h3>
                                <p class="option-desc">书本、餐具、备用衣服全装下，淋不湿</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="e-bike-rain-windshield">
                            <div class="card-image">
                                <img src="images/e-bike-rain-windshield.svg" alt="电动车挡风防雨棚插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电动车挡风防雨棚</h3>
                                <p class="option-desc">骑电动车接送，遮风挡雨不掉链子</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
