<head>
    <meta charset="UTF-8">

        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";

    <title>春季护肤步骤大讨论</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季护肤步骤，你更认同哪一种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春季护肤时，你更认同哪一种护肤步骤？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="simple-three-steps">
                            <div class="card-image">
                                <img src="images/simple-three-steps.svg" alt="精简护肤步骤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精简三步</h3>
                                <p class="option-caption">清洁、保湿、防晒，三步搞定换季</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="layered-care">
                            <div class="card-image">
                                <img src="images/layered-care.svg" alt="分层护肤步骤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分层护理</h3>
                                <p class="option-caption">精华、乳液、面霜层层叠加更安心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="on-demand-adjust">
                            <div class="card-image">
                                <img src="images/on-demand-adjust.svg" alt="按需调整护肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">按需调整</h3>
                                <p class="option-caption">根据当天皮肤状态灵活调整步骤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
