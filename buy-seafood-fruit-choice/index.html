<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">买海鲜和贵价水果时你会怎么选？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">买海鲜和贵价水果时你会怎么选？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="prioritize-freshness">
                            <div class="card-image">
                                <img src="images/prioritize-freshness.svg" alt="新鲜海鲜与当季水果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优先新鲜</h3>
                                <p class="option-desc">愿意多花钱换新鲜和更好口感，注重当日食用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="choose-by-price">
                            <div class="card-image">
                                <img src="images/choose-by-price.svg" alt="促销价格标签" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看价格促销</h3>
                                <p class="option-desc">以折扣和性价比为主，遇到优惠就下单</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-small-more-often">
                            <div class="card-image">
                                <img src="images/buy-small-more-often.svg" alt="少量购买的购物篮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">少量多次</h3>
                                <p class="option-desc">买少量回家立刻吃，避免囤积导致浪费</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="choose-preserved-or-alternatives">
                            <div class="card-image">
                                <img src="images/choose-preserved-or-alternatives.svg" alt="冷冻与罐装食物" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">选易保鲜或替代</h3>
                                <p class="option-desc">选冷冻/罐装或耐储存的水果，方便保存与分餐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
