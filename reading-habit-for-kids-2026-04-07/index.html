    <title>孩子每天读书，你支持哪种方式？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子每天读书，你支持哪种方式？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：如何帮孩子养成每天读书的习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="fixed-reading-time">
                            <div class="card-image">
                                <img src="images/fixed-reading-time.svg" alt="父母与孩子一起读书" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定时间一起读（每天15分钟）</h3>
                                <p class="option-desc">每天固定一起读书，形成稳定习惯</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="reading-stamp-reward">
                            <div class="card-image">
                                <img src="images/reading-stamp-reward.svg" alt="读书打卡表与贴纸奖励" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">读书打卡+小奖励</h3>
                                <p class="option-desc">孩子读书达标给小奖励，激励连续性</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="parent-read-15-min">
                            <div class="card-image">
                                <img src="images/parent-read-15-min.svg" alt="父母坐在孩子旁边陪读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">父母陪读15分钟（陪读优先）</h3>
                                <p class="option-desc">父母陪读，增强互动与榜样力量</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="child-choice-share">
                            <div class="card-image">
                                <img src="images/child-choice-share.svg" alt="孩子挑选喜欢的书并讲给家长听" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">让孩子自由选书并分享读后感</h3>
                                <p class="option-desc">尊重孩子选择，培养内在阅读动机并鼓励分享</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
