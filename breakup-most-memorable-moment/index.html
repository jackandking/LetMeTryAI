    <h1 id="pageTitle">女人爱热议：分手后最难忘的瞬间</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">分手后，你最难忘的是哪一刻？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="womanai" value="last-meeting">

                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="noticed-new-relationship">
                    <img src="images/breakup-noticed-new-relationship.svg" alt="发现新恋情通知" loading="lazy">
                    <span>社交动态或朋友告诉你他/她有了新对象</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="delete-contacts">
                    <img src="images/breakup-delete-contacts.svg" alt="删除联系方式的手指" loading="lazy">
                    <span>按下删除键的瞬间最痛或者最解脱</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="song-or-scent-trigger">
                    <img src="images/breakup-song-scent-trigger.svg" alt="听歌或闻到熟悉气味" loading="lazy">
                    <span>一首歌或一缕香就把回忆拉回去</span>
