<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：你最心水的香水风格是哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：你最心水的香水风格？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="floral-note">
                            <div class="card-image">
                                <img src="images/floral-note.svg" alt="花香调香水瓶与花朵" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花香调</h3>
                                <p class="option-desc">柔美、浪漫，适合约会与日常</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="woody-note">
                            <div class="card-image">
                                <img src="images/woody-note.svg" alt="木质调香水与木纹背景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木质调</h3>
                                <p class="option-desc">沉稳高级，适合职场与成熟风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="fresh-citrus">
                            <div class="card-image">
                                <img src="images/fresh-citrus.svg" alt="柑橘与清新背景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新柑橘</h3>
                                <p class="option-desc">轻盈清爽，夏日和通勤首选</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="gourmand-note">
                            <div class="card-image">
                                <img src="images/gourmand-note.svg" alt="甜香调香水与甜点" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甜香（美食调）</h3>
                                <p class="option-desc">甜蜜可爱，带亲和力的香氛风格</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
