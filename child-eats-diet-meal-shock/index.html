    <title>孩子吃到减脂餐像被震惊，你会怎么处理这顿饭？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子吃到减脂餐像被震惊，你会怎么处理这顿饭？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子吃到减脂餐像被震惊，你会怎么处理这顿饭？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="stop-and-replace">
                            <div class="card-image">
                                <img src="images/stop-and-replace.svg" alt="家长当场换菜安抚孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">当场制止并换成熟悉食物</h3>
                                <p class="option-desc">当场说不，立刻换成孩子常吃、能接受的饭菜，优先稳定情绪。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soothe-then-dispose">
                            <div class="card-image">
                                <img src="images/soothe-then-dispose.svg" alt="安抚后处理饭菜的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先安抚情绪，再悄悄处理剩菜</h3>
                                <p class="option-desc">先安抚孩子不要责怪，等情绪稳定后把不合适的饭菜处理掉或打包带走。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="talk-and-explain">
                            <div class="card-image">
                                <img src="images/talk-and-explain.svg" alt="家长与孩子对话解释餐食变化" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">当场用对话引导解释原因</h3>
                                <p class="option-desc">放低语气问孩子感觉，顺便简单说明为什么换了口味，培养理解与选择权。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="observe-and-feedback">
                            <div class="card-image">
                                <img src="images/observe-and-feedback.svg" alt="家长观察孩子进食反应并记录" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先观察不强求，回家再反馈或记录</h3>
                                <p class="option-desc">先看孩子反应有没有改善，回家与另一位家长或餐厅反馈，作为后续决定依据。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
