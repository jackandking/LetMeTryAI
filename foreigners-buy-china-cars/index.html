    <title>外国人为什么更愿意买中国车？投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">外国人为什么更愿意买中国车？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你认为外国人更愿意买中国车的主要原因是哪项？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="price-value">
                            <div class="card-image">
                                <img src="images/price-value.svg" alt="价格与性价比" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高性价比（价格/配置）</h3>
                                <p class="option-desc">以更低价格提供丰富配置，性价比优势吸引预算敏感的海外买家。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="smart-technology">
                            <div class="card-image">
                                <img src="images/smart-technology.svg" alt="智能化科技配置" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">智能化与科技配置</h3>
                                <p class="option-desc">搭载智能座舱、辅助驾驶和车机生态，技术感成为购买要素之一。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ev-and-range">
                            <div class="card-image">
                                <img src="images/ev-and-range.svg" alt="新能源汽车续航与成本" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">新能源与续航/成本优势</h3>
                                <p class="option-desc">新能源车型性价比和使用成本优势，以及适配的续航与充电方案吸引用户。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="local-service">
                            <div class="card-image">
                                <img src="images/local-service.svg" alt="售后与服务便利" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">本地化售后与服务便利</h3>
                                <p class="option-desc">在海外建立经销与保养网络、提供本地化支持让购买更省心更放心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
