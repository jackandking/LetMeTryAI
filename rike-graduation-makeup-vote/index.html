    <title>理科班毕业照妆容投票</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">理科班毕业照妆容风格投票：你会选哪种风格？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪种妆容风格更适合理科班的毕业照？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="natural-fresh">
                            <div class="card-image">
                                <img src="images/natural-fresh.svg" alt="自然清新妆容示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然清新</h3>
                                <p class="option-desc">淡雅底妆与桃色腮红，显得清爽亲切，突出学生气质。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="preppy-academic">
                            <div class="card-image">
                                <img src="images/preppy-academic.svg" alt="学院风妆容示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">学院风</h3>
                                <p class="option-desc">柔和眼线与整洁眉形，配合书卷风配饰，气质端庄又青春。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="korean-dewy">
                            <div class="card-image">
                                <img src="images/korean-dewy.svg" alt="韩系光感妆容示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">韩系光感</h3>
                                <p class="option-desc">玻光底妆与轻薄高光，皮肤看起来自然透亮有光泽。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="vintage-arty">
                            <div class="card-image">
                                <img src="images/vintage-arty.svg" alt="复古文艺妆容示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古文艺</h3>
                                <p class="option-desc">哑光唇色与柔焦眼影，营造静谧复古氛围，适合文艺风造型。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
