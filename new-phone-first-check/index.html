    <title>换新手机你会先看什么？自拍、外观、夜拍或续航哪个先打动你</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">换新手机你会先看什么？自拍颜值还是外观颜色？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换新手机你会先看什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="selfie-effect">
                            <div class="card-image">
                                <img src="images/selfie-effect.svg" alt="展示自拍效果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自拍颜值</h3>
                                <p class="option-desc">先试自拍：看美颜和细节能不能在线</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="phone-design">
                            <div class="card-image">
                                <img src="images/phone-design.svg" alt="手机外观与颜色展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">机身外观与颜色</h3>
                                <p class="option-desc">先看手感和颜色：一眼心动更容易下手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="night-photo">
                            <div class="card-image">
                                <img src="images/night-photo.svg" alt="夜拍样张展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夜拍画质</h3>
                                <p class="option-desc">先拍夜景：暗光表现决定好照片多少</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="battery-life">
                            <div class="card-image">
                                <img src="images/battery-life.svg" alt="续航与充电图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">续航与快充</h3>
                                <p class="option-desc">先看续航：全天候使用稳定最省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
