    <title>哪些隐藏高热量食物容易被忽视？ - 男人宝投票</title>

    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪些隐藏高热量食物容易被忽视？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在日常饮食中，你认为下面哪类隐藏高热量食物更容易被忽视？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sauces-dressings">
                            <div class="card-image">
                                <img src="images/sauces-dressings.svg" alt="多种调味酱瓶与沙拉酱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">调味酱与沙拉酱</h3>
                                <p class="option-desc">一点酱料就能显著增加热量，常被忽略。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="processed-snacks-bakery">
                            <div class="card-image">
                                <img src="images/processed-snacks-bakery.svg" alt="包装零食与烘焙面包" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">加工零食与烘焙品</h3>
                                <p class="option-desc">薯片、曲奇、面包等看似零食但热量累积快。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="drinks-sugary-alcohol">
                            <div class="card-image">
                                <img src="images/drinks-sugary-alcohol.svg" alt="奶茶杯与酒杯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">饮料与含糖酒精</h3>
                                <p class="option-desc">含糖饮料、奶茶和酒精饮品往往含大量隐性热量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="seemingly-healthy-takeout-salads">
                            <div class="card-image">
                                <img src="images/seemingly-healthy-takeout-salads.svg" alt="外卖沙拉盒和配料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">“健康”外卖与沙拉</h3>
                                <p class="option-desc">标注健康的外卖或沙拉，调料与配料可能让热量上升。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        </footer>
