    <title>孩子练乒乓，你会怎么陪？四种真实陪练场景</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子练乒乓，你会怎么陪？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子练乒乓时，你通常会怎么陪伴他们？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="coach-style">
                            <div class="card-image">
                                <img src="images/coach-style.svg" alt="家长示范打乒乓球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教练式陪练</h3>
                                <p class="option-desc">拿拍子示范动作、纠正姿势，强调技术细节和目标进步。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="play-with-child">
                            <div class="card-image">
                                <img src="images/play-with-child.svg" alt="家长和孩子玩乒乓游戏" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陪玩式练习</h3>
                                <p class="option-desc">把训练变成游戏和小比赛，轻松多球、计分小游戏，重在兴趣保持。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emotional-support">
                            <div class="card-image">
                                <img src="images/emotional-support.svg" alt="家长在旁边鼓励孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">情绪陪伴式</h3>
                                <p class="option-desc">在一旁鼓励、记录进步，关注孩子心态和自信建设，不常干预动作。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pro-or-video">
                            <div class="card-image">
                                <img src="images/pro-or-video.svg" alt="孩子跟着教学视频练习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">交给专业或视频</h3>
                                <p class="option-desc">请教练或跟教学视频练习，家长负责后勤、安排和鼓励，节省教学心力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
