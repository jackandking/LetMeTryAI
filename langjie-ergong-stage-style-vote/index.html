    <title>《浪姐》二公舞台造型投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">《浪姐》二公舞台造型投票：你喜欢哪个舞台造型？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你喜欢《浪姐》二公舞台哪个造型？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="elegant-gown">
                            <div class="card-image">
                                <img src="images/elegant-gown.svg" alt="华丽礼服长裙舞台造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">华丽礼服（长裙）</h3>
                                <p class="option-desc">长裙摆、亮片或刺绣，带出舞台大气感与女性曲线</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sharp-androgynous">
                            <div class="card-image">
                                <img src="images/sharp-androgynous.svg" alt="利落中性短装舞台造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">利落中性（短装）</h3>
                                <p class="option-desc">中性剪裁与短款造型，突出利落线条与力量感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="retro-elegance">
                            <div class="card-image">
                                <img src="images/retro-elegance.svg" alt="复古优雅舞台造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古优雅（复古风）</h3>
                                <p class="option-desc">复古元素与经典妆容，呈现优雅怀旧气质</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="minimal-modern">
                            <div class="card-image">
                                <img src="images/minimal-modern.svg" alt="简约现代舞台造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">简约现代（低调摩登）</h3>
                                <p class="option-desc">简洁线条与现代配饰，强调质感与细节处理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
