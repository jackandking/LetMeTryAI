            <h1 id="pageTitle">手机也能当时髦配饰吗？哪种搭配更带感</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">手机也能当时髦配饰吗？你更喜欢哪种搭配更带感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bright-chain-case">
                            <div class="card-image">
                                <img src="images/bright-chain-case.svg" alt="亮色手机壳搭配金属链条" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亮色链条壳</h3>
                                <p class="option-desc">亮色手机壳＋金属链条，手持或肩背都吸睛，画面感强</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mini-bag-phone-chain">
                            <div class="card-image">
                                <img src="images/mini-bag-phone-chain.svg" alt="手机与迷你小包连挂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精致手机链挂小包</h3>
                                <p class="option-desc">手机链串在迷你包上，生活化又有造型感，适合出街画面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mirror-art-case">

                                <img src="images/mirror-art-case.svg" alt="镜面手机壳反光效果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">镜面或艺术壳</h3>
                                <p class="option-desc">镜面或艺术印花壳，制造反光与视觉焦点，拍照效果抢眼</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="minimal-nude-jewels">
                            <div class="card-image">
                                <img src="images/minimal-nude-jewels.svg" alt="裸色手机壳与珠宝配饰" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">极简裸色配珠宝</h3>
                                <p class="option-desc">素色手机壳配细链戒指或腕表，低调又高级，适合气质场景</p>
