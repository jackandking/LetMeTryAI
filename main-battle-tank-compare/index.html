    <title>主战坦克：火力、防护与机动，你更看重哪一点？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">主战坦克对比投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在主战坦克的设计上，你最看重哪一项性能？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="firepower">
                            <div class="card-image">
                                <img src="images/firepower.svg" alt="坦克炮塔与主炮示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">火力优先（射控与口径）</h3>
                                <p class="option-caption">优先强大火力与射控精度，制胜远距离目标。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="protection">
                            <div class="card-image">
                                <img src="images/protection.svg" alt="坦克装甲与防护系统示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防护优先（装甲与主动防护）</h3>
                                <p class="option-caption">更重视装甲与主动防御，提升战场生存能力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mobility">
                            <div class="card-image">
                                <img src="images/mobility.svg" alt="坦克行进与越野能力示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">机动优先（悬挂与发动机）</h3>
                                <p class="option-caption">强调机动性與越野能力，快速部署与迂回打击。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
