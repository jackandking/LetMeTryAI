    <title>女人爱热议：恋爱中最让你心累的小事</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：恋爱中最让你心累的小事</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">恋爱中哪种行为最让你感到心累？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="late-or-no-reply">
                            <div class="card-image">
                                <img src="images/late-or-no-reply.svg" alt="手机聊天气泡已读不回" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不及时回复消息</h3>
                                <p class="option-desc">信息总被已读不回或很晚才回，让人很心累</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="say-one-do-another">
                            <div class="card-image">
                                <img src="images/say-one-do-another.svg" alt="承诺与现实反差" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">说一套做一套</h3>
                                <p class="option-desc">承诺和实际行为不一致，让人失望消耗感情</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="ignore-feelings-complain">
                            <div class="card-image">
                                <img src="images/ignore-feelings-complain.svg" alt="争吵与抱怨场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无视感受爱抱怨</h3>
                                <p class="option-desc">常把责任推给你或不停指责，情绪消耗大</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="absent-on-important-moments">
                            <div class="card-image">
                                <img src="images/absent-on-important-moments.svg" alt="空椅子代表缺席" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重要时刻缺席</h3>
                                <p class="option-desc">关键时刻不出现或不支持，伤感情比小事更重</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
