<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">在北京中轴线拍照，你会选哪个画面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在北京中轴线拍照，你会选哪个画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="gongqiang-beiying-sha">
                            <div class="card-image">
                                <img src="images/gongqiang-beiying-sha.svg" alt="宫墙前人物背影剪影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宫墙背影杀</h3>
                                <p class="option-desc">古典宫墙前的背影，历史感与人物剪影交织。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="duichen-changjie-xiantiao">
                            <div class="card-image">
                                <img src="images/duichen-changjie-xiantiao.svg" alt="中轴线对称长街线条" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">对称长街线条</h3>
                                <p class="option-desc">从中轴延伸的对称长街，极强的线条视角。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chenxi-zhonglou-guangying">
                            <div class="card-image">
                                <img src="images/chenxi-zhonglou-guangying.svg" alt="钟楼晨曦金色光影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">晨曦钟楼光影</h3>
                                <p class="option-desc">晨光照亮钟楼与屋檐，温暖的金色光影氛围。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="yemu-cheliu-dengdai">
                            <div class="card-image">
                                <img src="images/yemu-cheliu-dengdai.svg" alt="夜幕中车流形成光带" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夜幕车流灯带</h3>
                                <p class="option-desc">夜晚长曝光下的车流光带，现代城市动感十足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
