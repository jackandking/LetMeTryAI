<body>
    <h1 id="pageTitle">孩子说谎你会怎么处理？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长视角，你会怎样回应孩子说谎？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="gentle-guidance">
                    <img src="images/gentle-guidance.svg" alt="父母耐心倾听孩子" loading="lazy">
                    <span>先冷静询问原因，耐心引导孩子承认并解释</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="set-consequences">
                    <img src="images/set-consequences.svg" alt="父母严肃沟通" loading="lazy">
                    <span>告诉孩子规则并设立合理后果，帮助纠正行为</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="praise-honesty">
                    <img src="images/praise-honesty.svg" alt="父母表扬孩子" loading="lazy">
                    <span>发现孩子主动承认时给予表扬，鼓励诚实行为</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="model-behavior">
                    <img src="images/model-behavior.svg" alt="家长以身作则" loading="lazy">
                    <span>通过家长榜样来减少孩子说谎的动机</span>
                </label>
            </div>
        </div>
    </form>
