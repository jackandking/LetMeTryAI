    <title>如何安全分享身份证照片 — 爱老人投票页</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">如何安全分享身份证照片：长辈可选的实用做法</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到需要提供身份证信息时，你更倾向哪种分享方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="remove-sensitive-info">
                            <div class="card-image">
                                <img src="images/remove-sensitive-info.svg" alt="去敏后身份证照片示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">去敏后截图</h3>
                                <p class="option-desc">遮挡证号或住址，仅保留姓名和头像的照片，减少风险。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watermark-and-limit">
                            <div class="card-image">
                                <img src="images/watermark-and-limit.svg" alt="带水印的身份证照片示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">加水印并限制对象</h3>
                                <p class="option-desc">在照片上加水印并只发送给可信联系人或使用带过期的临时链接。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="in-person-verification">
                            <div class="card-image">
                                <img src="images/in-person-verification.svg" alt="当面出示身份证示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">当面核实不发图</h3>
                                <p class="option-desc">能当面出示身份证时尽量不拍照，直接现场核验以保护隐私。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="official-secure-upload">
                            <div class="card-image">
                                <img src="images/official-secure-upload.svg" alt="官方安全上传示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">通过官方或加密渠道上传</h3>
                                <p class="option-desc">优先使用银行、政务或平台的安全上传通道，避免普通聊天工具发送。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
