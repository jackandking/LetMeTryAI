        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">白玉兰颁奖夜，谁的获奖瞬间更打动你？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="veteran-actor-tearful">
                            <div class="card-image">
                                <img src="images/veteran-actor-tearful.svg" alt="实力派演员含泪领奖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厚积薄发的实力派</h3>
                                <p class="option-desc">多年沉淀终于圆梦，领奖时哽咽难言，让人看到了坚持的重量</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="newcomer-breakthrough">
                            <div class="card-image">
                                <img src="images/newcomer-breakthrough.svg" alt="新生代演员惊喜获奖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">逆袭突围的新生代</h3>
                                <p class="option-desc">从配角到领奖台，年轻面孔上的惊喜与坚定，写满了后来居上的故事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="behind-scenes-creator">

                                <img src="images/behind-scenes-creator.svg" alt="幕后创作者登台领奖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">幕后创作者的荣光</h3>
                                <p class="option-desc">导演、编剧或制片人登台那一刻，掌声属于不被看见的幕后英雄</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cast-reunion-honor">
                            <div class="card-image">
                                <img src="images/cast-reunion-honor.svg" alt="剧组重聚温情领奖" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同台致敬的温情时刻</h3>
                                <p class="option-desc">老搭档或剧组重聚颁奖台，一句话、一个拥抱，把回忆杀拉满</p>
                            </div>
