<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">天天吃鸡蛋还是少吃？你家长辈怎么吃蛋</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你家长辈是天天吃鸡蛋还是少吃？他们一般怎么吃蛋？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-one-daily">
                            <div class="card-image">
                                <img src="images/eat-one-daily.svg" alt="老人早餐吃鸡蛋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">天天吃一个</h3>
                                <p class="option-desc">早餐必备，几乎每天都吃一个鸡蛋</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="a-few-times-week">
                            <div class="card-image">
                                <img src="images/a-few-times-week.svg" alt="餐桌上的鸡蛋与碗筷" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">隔天或每周几次</h3>
                                <p class="option-desc">不是每天，但一周里会安排几次吃蛋</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="rarely-or-never">
                            <div class="card-image">
                                <img src="images/rarely-or-never.svg" alt="空盘与蔬菜餐盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">很少吃或几乎不吃</h3>
                                <p class="option-desc">很少把鸡蛋当常规食物，偶尔才吃一次</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="depending-on-constitution">
                            <div class="card-image">
                                <img src="images/depending-on-constitution.svg" alt="家人围桌讨论菜谱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看体质和习惯调整</h3>
                                <p class="option-desc">根据个人体质与口味，吃法和频率会调整</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
