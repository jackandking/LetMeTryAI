    <title>装备党首选：跑车声浪对比</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">装备党首选：跑车声浪对比</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">听声辨车，你更青睐哪种跑车的声浪质感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="ferrari-488">
                            <div class="card-image">
                                <img src="images/ferrari-488.svg" alt="Ferrari 488 排气尾段" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Ferrari 488</h3>
                                <p class="option-desc">法拉利：高亢激昂、转速感强</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="lamborghini-huracan">
                            <div class="card-image">
                                <img src="images/lamborghini-huracan.svg" alt="Lamborghini Huracán 声浪特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Lamborghini Huracán</h3>
                                <p class="option-desc">兰博基尼：粗犷嘶吼、回压感突出</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="porsche-911-gt3">
                            <div class="card-image">
                                <img src="images/porsche-911-gt3.svg" alt="Porsche 911 GT3 引擎舱" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Porsche 911 GT3</h3>
                                <p class="option-desc">保时捷：线性高转、机械律动感强</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
