    <title>女人爱热议：恋爱中你不能忍受的行为</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：恋爱中你不能忍受的行为</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给哪种恋爱中让人受不了的行为？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="ignore-communication">
                            <div class="card-image">
                                <img src="images/ignore-communication.svg" alt="忽视沟通的情侣" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">忽视沟通</h3>
                                <p class="option-desc">长期不交流、回避重要话题</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="frequent-lying">
                            <div class="card-image">
                                <img src="images/frequent-lying.svg" alt="撒谎的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">频繁撒谎</h3>
                                <p class="option-desc">小谎累积导致信任瓦解</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="controlling-behavior">
                            <div class="card-image">
                                <img src="images/controlling-behavior.svg" alt="被控制的感觉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">控制行踪</h3>
                                <p class="option-desc">强烈监控或限制社交与自由</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="long-term-aloofness">
                            <div class="card-image">
                                <img src="images/long-term-aloofness.svg" alt="冷漠的伴侣" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">长期冷漠</h3>
                                <p class="option-desc">无热情、无回应，让人感到被忽略</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
