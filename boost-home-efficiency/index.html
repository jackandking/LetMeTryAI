    <title>提升家庭效率的小方法投票</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">提升家庭效率的小方法：实用工具与日常习惯</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下面哪种做法更能帮助你在日常家庭生活中提升效率？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="time-blocking">
                            <div class="card-image">
                                <img src="images/time-blocking.svg" alt="时钟与日程表图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">时间分块法</h3>
                                <p class="option-desc">把一天划分为固定时段，为家务、陪伴和个人时间分配，减少频繁切换。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="shared-chore-chart">
                            <div class="card-image">
                                <img src="images/shared-chore-chart.svg" alt="家庭分工表图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">任务共享表</h3>
                                <p class="option-desc">将日常任务写清并分工，明确责任与轮换规则，降低重复沟通成本。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="single-task-focus">
                            <div class="card-image">
                                <img src="images/single-task-focus.svg" alt="专注单任务图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一次专注一件</h3>
                                <p class="option-desc">鼓励短时专注完成一项任务并打卡，避免多线并行带来的效率下降。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-5min-sync">
                            <div class="card-image">
                                <img src="images/family-5min-sync.svg" alt="家庭小会议图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭五分钟同步</h3>
                                <p class="option-desc">饭后或早晨花5分钟快速对齐当天安排与待办，减少临时冲突与误解。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
