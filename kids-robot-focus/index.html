    <title>孩子迷上机器人，你更看重哪一点？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子迷上机器人，你更看重哪一点？学习还是安全可控？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子迷上机器人，你更看重哪一点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="learning-ability">
                            <div class="card-image">
                                <img src="images/learning-ability.svg" alt="孩子通过机器人学习编程" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">学习能力</h3>
                                <p class="option-desc">通过机器人学编程、逻辑与问题解决，能带来长期能力积累</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hands-on-skills">
                            <div class="card-image">
                                <img src="images/hands-on-skills.svg" alt="孩子动手组装机器人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">动手能力</h3>
                                <p class="option-desc">鼓励拆装创作与实践操作，培养耐心和实际动手经验</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="safety-control">
                            <div class="card-image">
                                <img src="images/safety-control.svg" alt="机器人安全设置和家长控制" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安全与可控</h3>
                                <p class="option-desc">关注设备、内容与隐私安全，家长能设置和把控使用范围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="social-collaboration">
                            <div class="card-image">
                                <img src="images/social-collaboration.svg" alt="孩子与伙伴一起玩机器人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社交与合作</h3>
                                <p class="option-desc">借机器人促进与同伴合作、表达与沟通，不只是独自玩耍</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
