    <title>参与社区活动，你更愿意选哪个？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">参与社区活动，你更愿意选哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="guangchangwu-xiaozu">
                            <div class="card-image">
                                <img src="images/guangchangwu-xiaozu.svg" alt="广场舞队伍在广场上跳舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞小组</h3>
                                <p class="option-desc">每天傍晚一起跳舞运动、认识邻居</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="community-volunteer">
                            <div class="card-image">
                                <img src="images/community-volunteer.svg" alt="志愿者在社区帮助老人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社区志愿服务</h3>
                                <p class="option-desc">参与帮扶、环境清洁或邻里互助</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="senior-university-short-courses">
                            <div class="card-image">
                                <img src="images/senior-university-short-courses.svg" alt="老年人在教室认真听课" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">老年大学短课</h3>
                                <p class="option-desc">学习书法、电脑、手工等短期课程</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighborhood-book-club">
                            <div class="card-image">
                                <img src="images/neighborhood-book-club.svg" alt="几位长者围坐读书交流" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里读书会</h3>
                                <p class="option-desc">小组读书与茶话会，交流生活感受</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
