<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏天夜宵你必点啥？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">夏天晚上撸串，你必点的主角是啥？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="spicy-crayfish">
                            <div class="card-image">
                                <img src="images/spicy-crayfish.svg" alt="麻辣小龙虾夜宵美食" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">麻辣小龙虾</h3>
                                <p class="option-desc">麻辣鲜香，夏天夜宵C位担当</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lamb-skewers">
                            <div class="card-image">
                                <img src="images/lamb-skewers.svg" alt="炭火烤羊肉串" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">烤羊肉串</h3>
                                <p class="option-desc">炭火滋滋，撸串才是正经事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="garlic-oysters">
                            <div class="card-image">
                                <img src="images/garlic-oysters.svg" alt="蒜蓉烤生蚝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">蒜蓉生蚝</h3>
                                <p class="option-desc">蒜蓉粉丝配生蚝，鲜美过瘾</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="iced-draft-beer">
                            <div class="card-image">
                                <img src="images/iced-draft-beer.svg" alt="冰镇扎啤啤酒" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冰镇扎啤</h3>
                                <p class="option-desc">一口冰啤下肚，暑气全消</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
