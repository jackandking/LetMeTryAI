   <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    h1 {
        color: #ff5722;
        margin-bottom: 20px;
    }
    .grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    .grid-item {
        flex: 1 1 30%;
        margin: 10px;

        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

    @media (max-width: 768px) {

    }
    @media (max-width: 480px) {

<body>
    <div class="container">
        <h1>抖音旅游宝小程序 - 十大美女</h1>
        <h1>快手男人宝小程序 - 十大美女</h1>
        <div class="grid" id="imageGrid"></div>
    </div>

    <script>
        // JavaScript数组存储图片URL
        const imageUrls = [
        "https://letmetry.cn/images/ec4e7c30460e667f-c.jpg",
       // "https://letmetry.cn/images/3c5670c52b798d98-c.jpg",
        "https://letmetry.cn/images/a0bf22f9b12203ab-c.jpg",
        "https://letmetry.cn/images/ccd85e86ceaa38ce-c.jpg",
        "https://letmetry.cn/images/4d07b32955b056fa-c.jpg",
        "https://letmetry.cn/images/77a22c6d28af1e77-c.jpg",
        "https://letmetry.cn/images/55ac85f1f0f87d1d-c.jpg",
        "https://letmetry.cn/images/5b566f39edfcd718-c.jpg",
        "https://letmetry.cn/images/ebcf6870f20164b3-c.jpg",
        "https://letmetry.cn/images/230e76523a26a911-c.jpg",
        ];

        // 获取网格容器
        const gridContainer = document.getElementById('imageGrid');

        // 动态生成图片元素并添加到网格容器中
        imageUrls.forEach((url, index) => {
            const div = document.createElement('div');
            div.classList.add('grid-item');
            const img = document.createElement('img');
            img.src = url;
            img.alt = `美女${index + 1}`;
            div.appendChild(img);
            gridContainer.appendChild(div);
        });
    </script>
    
    <!-- VConsole for mobile debugging - loads only when ?debug=true is in URL -->
    <script>
        // Load and initialize VConsole only if debug parameter is present
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            
            if (debugMode) {
                // Dynamically load VConsole script only when needed
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() {
                    if (window.VConsole) {
                        const vConsole = new window.VConsole();
                        console.log('VConsole initialized for debugging');
                    }
                };
                script.onerror = function() {
                    console.warn('Failed to load VConsole. Debug mode unavailable.');
                };
                document.head.appendChild(script);
            }
        })();
    </script>

</body>
