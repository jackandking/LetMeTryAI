    <title>出街照里哪种唇色最抓眼球？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你更爱的唇色是哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你出门更会选哪种唇色？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="orange-sun-lip">
                            <div class="card-image">
                                <img src="images/orange-sun-lip.svg" alt="暖橘色唇妆近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">橘色阳光</h3>
                                <p class="option-desc">暖橘色，元气日常感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="berry-vintage-lip">
                            <div class="card-image">
                                <img src="images/berry-vintage-lip.svg" alt="浆果色唇妆近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古浆果</h3>
                                <p class="option-desc">浆果偏暗，复古气质</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nude-honey-lip">
                            <div class="card-image">
                                <img src="images/nude-honey-lip.svg" alt="裸色蜜糖唇妆近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">裸色蜜糖</h3>
                                <p class="option-desc">低调裸色，气色自然</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="classic-red-lip">
                            <div class="card-image">
                                <img src="images/classic-red-lip.svg" alt="饱和正红唇妆近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">正红经典</h3>
                                <p class="option-desc">饱和正红，出镜吸睛</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
