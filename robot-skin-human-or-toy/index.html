    <title>机器人穿上皮肤：你觉得它像人还是像玩具</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">机器人穿上皮肤，你会觉得它更像人还是像玩具？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">机器人穿上皮肤，你会觉得它更像人还是像玩具？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="more-human">
                            <div class="card-image">
                                <img src="images/more-human.svg" alt="看起来像人类的机器人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">更像人</h3>
                                <p class="option-desc">看起来像真人，会让人有温度又有点奇怪</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="more-toy">
                            <div class="card-image">
                                <img src="images/more-toy.svg" alt="看起来像玩具的机器人" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">更像玩具</h3>
                                <p class="option-desc">像玩偶或公仔，更亲切、更容易接纳</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="depends-scenario">
                            <div class="card-image">
                                <img src="images/depends-scenario.svg" alt="依场景而异的机器人感觉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看场景/看距离</h3>
                                <p class="option-desc">近看和远看、夜里和白天感觉会不一样</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
