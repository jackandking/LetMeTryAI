    <title>你自拍更爱哪种滤镜风格？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你自拍更爱哪种滤镜风格？奶油感、日系还是胶片背影杀</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你自拍更爱哪种滤镜风格？选一个你常用的</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="qing-xin-ri-xi">
                            <div class="card-image">
                                <img src="images/qing-xin-ri-xi.svg" alt="清新日系滤镜示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新日系</h3>
                                <p class="option-desc">明亮柔和，肤色通透，适合日常自然风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wen-rou-nai-you">
                            <div class="card-image">
                                <img src="images/wen-rou-nai-you.svg" alt="温柔奶油滤镜示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温柔奶油</h3>
                                <p class="option-desc">奶油色调，柔光细腻，营造温柔氛围</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gao-ji-leng-yan">
                            <div class="card-image">
                                <img src="images/gao-ji-leng-yan.svg" alt="高级冷艳滤镜示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高级冷艳</h3>
                                <p class="option-desc">对比与冷色调增强质感，适合摩登风格</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fu-gu-jiao-pian">
                            <div class="card-image">
                                <img src="images/fu-gu-jiao-pian.svg" alt="复古胶片滤镜示例" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古胶片</h3>
                                <p class="option-desc">颗粒与暖色复古感，带故事感的背影照很搭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
