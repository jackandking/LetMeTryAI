    <title>男人宝热榜：现代战机对比</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">男人宝热榜：现代战机对比</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">全网热议：男人宝热榜：现代战机对比，你的选择是？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="f-22">
                            <div class="card-image">
                                <img src="images/img-f-22" alt="F-22 战机 侧视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">F-22 Raptor</h3>
                                <p class="option-desc">美制隐身制空机，机动性与隐身强调</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="su-57">
                            <div class="card-image">
                                <img src="images/img-su-57" alt="Su-57 战机 起飞画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Su-57</h3>
                                <p class="option-desc">俄制多用途隐身战机，强调机动和近距作战</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="j-20">
                            <div class="card-image">
                                <img src="images/img-j-20" alt="J-20 战机 地面静态照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">J-20</h3>
                                <p class="option-desc">中式隐身重型战机，侧重远程传感与突防</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">

            </div>
