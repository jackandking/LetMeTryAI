    <title>约会前你会选哪种发型？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">约会前你会选哪种发型？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：约会前你会选哪种发型？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="natural-straight-long">
                            <div class="card-image">
                                <img src="images/natural-straight-long.svg" alt="自然垂顺的长发造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然垂顺长发</h3>
                                <p class="option-desc">简单利落，气质温柔适合多场合</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="low-ponytail">
                            <div class="card-image">
                                <img src="images/low-ponytail.svg" alt="低马尾随性发型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">低马尾随性风</h3>
                                <p class="option-desc">清爽又带点小心机，适合随性约会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="air-bang-short">
                            <div class="card-image">
                                <img src="images/air-bang-short.svg" alt="空气刘海短发造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">空气刘海短发</h3>
                                <p class="option-desc">俏皮又年轻，增添活力感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="loose-big-curls">
                            <div class="card-image">
                                <img src="images/loose-big-curls.svg" alt="慵懒大波浪卷发" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">慵懒大波浪</h3>
                                <p class="option-desc">浪漫感强的约会首选，写真感十足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
