    <title>哪些看似无害的食物热量偏高，应少吃？ — 爱老人投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪些看似无害的食物热量偏高，应少吃？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪些看似无害的食物热量偏高，应少吃？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="nuts-and-seeds">
                            <div class="card-image">
                                <img src="images/nuts-and-seeds.svg" alt="一小碟各类坚果和果仁" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">坚果与果仁</h3>
                                <p class="option-desc">富含健康脂肪，但每一小把热量不低，适量为宜。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="baked-sweets">
                            <div class="card-image">
                                <img src="images/baked-sweets.svg" alt="切片蛋糕与曲奇饼干" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">蛋糕与烘焙甜点</h3>
                                <p class="option-desc">看似小份却含较多糖脂，节日或偶尔享用更合适。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sweet-drinks-juices">
                            <div class="card-image">
                                <img src="images/sweet-drinks-juices.svg" alt="玻璃杯果汁与瓶装饮料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">果汁与甜饮料</h3>
                                <p class="option-desc">液体糖分容易被忽视，饮料热量有时比一份正餐高。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="processed-snacks-energy-bars">
                            <div class="card-image">
                                <img src="images/processed-snacks-energy-bars.svg" alt="几条能量棒与包装零食" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">能量棒与加工零食</h3>
                                <p class="option-desc">方便但常含隐藏糖脂，选购时建议看配料与份量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>
