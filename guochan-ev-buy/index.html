    <title>国产电动车通勤选哪款？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国产电动车，你会买哪款上班通勤？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">上班通勤你会更看重哪款车的综合体验？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="byd-seal">
                            <div class="card-image">
                                <img src="images/byd-seal.svg" alt="比亚迪海豹侧颜与内饰" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">比亚迪 海豹</h3>
                                <p class="option-desc">舒适内饰＋续航表现，城市通勤好用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tesla-model-3">
                            <div class="card-image">
                                <img src="images/tesla-model-3.svg" alt="特斯拉Model3街拍侧面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">特斯拉 Model 3</h3>
                                <p class="option-desc">加速体验和智能驾驶吸引人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nio-es6">
                            <div class="card-image">
                                <img src="images/nio-es6.svg" alt="蔚来ES6城市停车场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">蔚来 ES6</h3>
                                <p class="option-desc">空间与换电/服务体验更省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
