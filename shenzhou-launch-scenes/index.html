    <title>神舟发射时哪个画面把你看呆了？来看图选一张</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">神舟发射时哪个画面把你看呆了？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">神舟发射时哪个画面把你看呆了？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="ignition-flame">
                            <div class="card-image">
                                <img src="images/ignition-flame.svg" alt="点火瞬间火焰冲天" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">点火瞬间·火焰冲天</h3>
                                <p class="option-desc">火箭底部火焰喷薄而出，地面光影震撼，瞬间画面冲击力十足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stage-separation">
                            <div class="card-image">
                                <img src="images/stage-separation.svg" alt="分离瞬间火花烟雾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分离瞬间·火花与烟雾</h3>
                                <p class="option-desc">各级分离时金属与火花划过天际，节奏感强且充满动感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="smoke-trail">
                            <div class="card-image">
                                <img src="images/smoke-trail.svg" alt="尾迹划过蓝天" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">尾迹划天·白色长龙</h3>
                                <p class="option-desc">蓝天里拖出长长白色尾迹，画面延展感强，带来壮阔视觉。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="astronaut-closeup">
                            <div class="card-image">
                                <img src="images/astronaut-closeup.svg" alt="航天员近景表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">航天员/指挥近景·表情瞬间</h3>
                                <p class="option-desc">发射前后航天员或指挥官的近景表情，人与科技交织的动人瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
