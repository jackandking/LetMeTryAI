    <title>这些老手艺你还能认出几样？图文回忆</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这些老手艺你还能认出几样？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这些老手艺你还能认出几样？选出你认得的几项并说说回忆</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mu-jiang-sunmao">
                            <div class="card-image">
                                <img src="images/mu-jiang-sunmao.svg" alt="木匠用榫卯和手工刨子的老照片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木匠：榫卯与老刨子</h3>
                                <p class="option-desc">院子里用手工榫卯接合，老门窗和家具常见的做法。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-bu-zhijia">
                            <div class="card-image">
                                <img src="images/zhi-bu-zhijia.svg" alt="老式手摇织布机和布匹" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">织布：手摇织布机</h3>
                                <p class="option-desc">手摇织布机缓慢转动，把棉线织成家里用的布匹。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="jian-zhi-chuanghua">
                            <div class="card-image">
                                <img src="images/jian-zhi-chuanghua.svg" alt="剪纸窗花样式与剪刀" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">剪纸：窗花与年画</h3>
                                <p class="option-desc">春节窗花、年画剪纸，家里门窗常见的红色手工装饰。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhi-tao-shou-lapi">
                            <div class="card-image">
                                <img src="images/zhi-tao-shou-lapi.svg" alt="传统手拉坯制作陶瓷的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">制陶：手拉坯与瓷碗</h3>
                                <p class="option-desc">泥巴在手中变成碗，炉火烧出日常的陶器器皿。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
