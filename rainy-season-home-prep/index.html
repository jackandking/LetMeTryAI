    <title>遇到汛期，下雨天家里怎么准备才安心？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到汛期，下雨天家里怎么准备才安心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到汛期，下雨天家里怎么准备才安心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="stock-water-food">
                            <div class="card-image">
                                <img src="images/stock-water-food.svg" alt="桌上摆着水瓶与罐装食物" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">储备水粮与常用食物</h3>
                                <p class="option-desc">提前备好3天饮用水、易保存食物和热水，停水停电也能应对。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="secure-windows-drainage">
                            <div class="card-image">
                                <img src="images/secure-windows-drainage.svg" alt="老人检查窗户并清理屋檐排水沟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">加固门窗与清理排水</h3>
                                <p class="option-desc">检查窗户密封、清理屋檐与下水道，防止漏水和室内积水。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emergency-light-medkit">
                            <div class="card-image">
                                <img src="images/emergency-light-medkit.svg" alt="手电筒、充电宝与药箱整齐摆放" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">备应急照明与常用药箱</h3>
                                <p class="option-desc">准备手电、充电宝、备用电池和常用药物清单，夜间行动更安心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="temporary-evacuate-to-safe-place">
                            <div class="card-image">
                                <img src="images/temporary-evacuate-to-safe-place.svg" alt="家人陪同老人准备临时转移到亲友家或避难所" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">有条件就临时转移到安全处</h3>
                                <p class="option-desc">若居住地易涝，提前联系亲友或避难点，必要时临时搬离更稳妥。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
