    <h1 id="pageTitle">爱老人关注：每天你最愿意坚持哪种养生习惯？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">在日常生活中，你最想并且最容易坚持哪种养生习惯？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="morning-walk">

                    <span>清晨散步或轻松慢跑，呼吸新鲜空气</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="light-home-cooking">
                    <img src="images/light-home-cooking.svg" alt="清淡饮食" loading="lazy">
                    <span>少油少盐，多吃蔬菜粗粮，控制分量</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="stretching-or-taiji">
                    <img src="images/stretching-or-taiji.svg" alt="拉伸太极" loading="lazy">
                    <span>简单拉伸或太极动作，缓解僵硬、增强柔韧</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="regular-checkup">
                    <img src="images/regular-checkup.svg" alt="定期体检" loading="lazy">
                    <span>按期体检，记录血压血糖等指标</span>
