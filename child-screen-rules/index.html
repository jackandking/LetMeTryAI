<body>
    <h1 id="pageTitle">孩子用手机，你会怎么规定？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长爱用户视角，你会怎么选：孩子手机使用规则？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="no-phone-during-study">
                    <img src="images/no-phone-during-study.svg" alt="学习时间禁止使用手机" loading="lazy">
                    <span>学习和考试期间完全禁用，保证专注</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="limited-after-homework">
                    <img src="images/limited-after-homework.svg" alt="作业后限时使用手机" loading="lazy">
                    <span>完成作业后给30–60分钟自由使用奖励</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="only-weekends">
                    <img src="images/only-weekends.svg" alt="周末可以使用手机" loading="lazy">
                    <span>平日禁用，周末放宽用于社交与娱乐</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="parent-supervised-and-graded">
                    <img src="images/parent-supervised-and-graded.svg" alt="家长陪同分级管理手机" loading="lazy">
                    <span>陪同使用并限制社交/游戏类别与时长</span>
                </label>
            </div>
        </div>
    </form>
