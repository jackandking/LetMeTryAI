    <title>春季护肤困扰投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季护肤，你更想优先解决哪个困扰？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春季护肤，你更想优先解决哪个肌肤困扰？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hydration-care">
                            <div class="card-image">
                                <img src="images/hydration-care.svg" alt="补水保湿" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">补水保湿</h3>
                                <p class="option-caption">干燥起皮是春季常态，深层补水才能让底妆更服帖</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soothing-care">
                            <div class="card-image">
                                <img src="images/soothing-care.svg" alt="稳定舒缓" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">稳定舒缓</h3>
                                <p class="option-caption">换季容易泛红敏感，温和修护才是春季必修课</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sun-protection">
                            <div class="card-image">
                                <img src="images/sun-protection.svg" alt="防晒抗光老" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防晒抗光老</h3>
                                <p class="option-caption">紫外线逐渐增强，做好防晒才能安心享受阳光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="oil-control">
                            <div class="card-image">
                                <img src="images/oil-control.svg" alt="控油清洁" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">控油清洁</h3>
                                <p class="option-caption">气温回升出油变多，清爽毛孔让肤感更舒适</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
