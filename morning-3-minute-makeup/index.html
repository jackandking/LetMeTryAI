    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">早上时间不够，你的3分钟妆容是哪种？快手自然裸妆、名媛气场、温柔腮红还是精致眼线？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">早上时间不够，你的3分钟妆容是哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cushion-nude">
                            <div class="card-image">
                                <img src="images/cushion-nude.svg" alt="气垫裸妆正脸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">气垫裸妆</h3>
                                <p class="option-desc">隔离+气垫+眉毛+唇彩，清新自然出门</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="defined-eyes">
                            <div class="card-image">
                                <img src="images/defined-eyes.svg" alt="精致眼线妆特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精致眼线＋睫毛</h3>
                                <p class="option-desc">细眼线+睫毛膏，眼神更有戏感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="blush-tint">
                            <div class="card-image">
                                <img src="images/blush-tint.svg" alt="腮红唇釉妆侧颜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温柔腮红＋唇釉</h3>
                                <p class="option-desc">腮红带到脸颊+唇釉，立刻气色up</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="concealer-fix">
                            <div class="card-image">
                                <img src="images/concealer-fix.svg" alt="遮瑕定妆近景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">遮瑕定妆速成</h3>
                                <p class="option-desc">重点遮瑕+定妆，遮住疲惫和小瑕疵</p>
                            </div>
                            <div class="check-indicator">✓</div>
