    <title>台风夜陪护：哪种方式让孩子更安心？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风夜，哪种陪护方式会让孩子更安心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风夜，哪种陪护方式会让孩子更安心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="chuangbian-peiban">
                            <div class="card-image">
                                <img src="images/chuangbian-peiban.svg" alt="父母坐在床边握住孩子的手，轻声安抚" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">床边陪伴</h3>
                                <p class="option-desc">坐在床边、轻声安抚，握着孩子的手，让他听到熟悉的存在。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tongfang-gongshui">
                            <div class="card-image">
                                <img src="images/tongfang-gongshui.svg" alt="父母与孩子同房睡眠、照看随时回应" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同房共睡</h3>
                                <p class="option-desc">和孩子同一房间或同床睡，能马上回应惊醒与哭闹。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nearby-out-of-room">
                            <div class="card-image">
                                <img src="images/nearby-out-of-room.svg" alt="家长在房门外走廊静候，随时准备进入孩子房间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">房外待命</h3>
                                <p class="option-desc">留在走廊或客厅待命，既能快速到达又给孩子一点独立空间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prepare-comfort-tools">
                            <div class="card-image">
                                <img src="images/prepare-comfort-tools.svg" alt="夜灯、安抚玩偶和毛毯摆放在床边的安抚道具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">准备安抚工具</h3>
                                <p class="option-desc">开夜灯、放熟悉音乐、留玩偶和毛毯，借助物件安抚情绪。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

            </div>
        </footer>
