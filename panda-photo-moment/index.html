    <title>熊猫出国，哪个萌态更想合照？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">熊猫出国，哪个萌态更想合照？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">熊猫出国，哪个萌态更想合照？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="rolling-ball">
                            <div class="card-image">
                                <img src="images/rolling-ball.svg" alt="熊猫抱成圆球坐在草地上" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">滚成球球</h3>
                                <p class="option-desc">圆滚滚抱成球，在草地上萌化全场</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sleepy-blink">
                            <div class="card-image">
                                <img src="images/sleepy-blink.svg" alt="熊猫眯着眼睛露出睡眼朦胧表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">眯眼小迷糊</h3>
                                <p class="option-desc">半眯眼迷糊状，朦胧萌感超带感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stretching-yawn">
                            <div class="card-image">
                                <img src="images/stretching-yawn.svg" alt="熊猫伸懒腰张嘴打哈欠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">伸懒腰大作战</h3>
                                <p class="option-desc">打个大哈欠、伸个大懒腰，动态感十足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tree-hug-sweet">
                            <div class="card-image">
                                <img src="images/tree-hug-sweet.svg" alt="熊猫抱着树干露出可爱表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抱树撒娇</h3>
                                <p class="option-desc">抱着树干撒娇，亲近又想合影留念</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
