<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子逛博物馆，哪件国宝会让他记住民族英雄？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子逛博物馆，哪件国宝会让他记住民族英雄？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="houmuwu-ding">
                            <div class="card-image">
                                <img src="images/houmuwu-ding.svg" alt="后母戊鼎青铜鼎插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">后母戊鼎</h3>
                                <p class="option-desc">商代青铜巨鼎，族徽庄严，让孩子感受祖先守护家国的分量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="goujian-sword">
                            <div class="card-image">
                                <img src="images/goujian-sword.svg" alt="越王勾践剑插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">越王勾践剑</h3>
                                <p class="option-desc">卧薪尝胆的复仇之剑，告诉孩子什么叫隐忍与奋起。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="terracotta-warriors">
                            <div class="card-image">
                                <img src="images/terracotta-warriors.svg" alt="秦始皇兵马俑军阵插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">秦始皇兵马俑</h3>
                                <p class="option-desc">千军万马守护一统山河，孩子眼中的古代英雄军团。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="siyang-fangzun">
                            <div class="card-image">
                                <img src="images/siyang-fangzun.svg" alt="四羊方尊青铜尊插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">四羊方尊</h3>
                                <p class="option-desc">商代祭祀重器，四只羊首象征祥和与族群凝聚力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
