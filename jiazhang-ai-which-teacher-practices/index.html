    <title>家长视角：哪些老师做法让你放心？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪些老师做法让你放心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪些老师做法让你放心？选出你看重的老师行为。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="clear-class-goals">
                            <div class="card-image">
                                <img src="images/clear-class-goals.svg" alt="老师讲课堂目标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲清课堂目标</h3>
                                <p class="option-desc">上课前说清今天学什么、节奏如何，让孩子有预期不慌乱。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="timely-homework-feedback">
                            <div class="card-image">
                                <img src="images/timely-homework-feedback.svg" alt="老师批改作业" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">作业讲评及时</h3>
                                <p class="option-desc">作业批改及时并写明改进点，避免错题反复出现。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="transparent-parent-communication">
                            <div class="card-image">
                                <img src="images/transparent-parent-communication.svg" alt="家校沟通" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">与家长沟通透明</h3>
                                <p class="option-desc">定期汇报学习进展，遇到问题会先与家长沟通协商方案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="encourage-independent-thinking">
                            <div class="card-image">
                                <img src="images/encourage-independent-thinking.svg" alt="鼓励独立思考" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">鼓励独立思考</h3>
                                <p class="option-desc">引导孩子提出问题并提供方法，重视思考过程而非仅给答案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
