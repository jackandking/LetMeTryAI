    <title>暑假带娃体验哪种科技场景？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">机器人治沙漠上热搜，暑假你会带娃去体验哪种科技场景？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">暑假你会带娃去体验哪种科技场景？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="desert-robot-base">
                            <div class="card-image">
                                <img src="images/desert-robot-base.svg" alt="沙漠机器人治沙基地场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">沙漠机器人治沙基地</h3>
                                <p class="option-desc">看机器人怎么在沙漠里种树、固沙，孩子能直观感受科技改变环境</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ai-agriculture-park">
                            <div class="card-image">
                                <img src="images/ai-agriculture-park.svg" alt="AI农业采摘园场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">AI农业采摘园</h3>
                                <p class="option-desc">让娃亲手操控AI机器人摘果子，理解科技怎么让农田变聪明</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="self-driving-car">
                            <div class="card-image">
                                <img src="images/self-driving-car.svg" alt="无人车自动驾驶体验场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无人车自动驾驶体验</h3>
                                <p class="option-desc">坐一坐自动驾驶小巴，和孩子聊聊未来出行会变成什么样</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="science-museum-robots">
                            <div class="card-image">
                                <img src="images/science-museum-robots.svg" alt="科技馆机器人互动展场景插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">科技馆机器人互动展</h3>
                                <p class="option-desc">去科技馆跟人形机器人对话、做实验，激发孩子好奇心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
