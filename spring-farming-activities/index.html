<head>
    <meta charset="UTF-8">

    <title>春耕田园活动投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春耕季节的田园活动选择：您更想参与哪种田园活动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在春耕季节，您更愿意参与哪种田园活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="rice-planting">
                            <div class="card-image">
                                <img src="images/rice-planting.svg" alt="长者插秧体验" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">插秧体验</h3>
                                <p class="option-caption">手把手插秧，感受泥土与节气，适合团体参与与回忆交流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="flower-bed-planting">
                            <div class="card-image">
                                <img src="images/flower-bed-planting.svg" alt="花圃种植" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花圃种植</h3>
                                <p class="option-caption">种花种草、轻松打理，美化庭院又锻炼手指与耐心。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spring-garden-walk">
                            <div class="card-image">
                                <img src="images/spring-garden-walk.svg" alt="田园散步赏春" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">田园散步</h3>
                                <p class="option-caption">沿田埂慢行赏春景，边走边聊，既养心又活动筋骨。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="traditional-farming-tools">
                            <div class="card-image">
                                <img src="images/traditional-farming-tools.svg" alt="传统农具教学演示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统农具教学</h3>
                                <p class="option-caption">观摩或体验传统农具与手工农事，重温过往田园生活记忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
