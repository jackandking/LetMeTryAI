<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">沙溢狂减36斤逆袭，中年男人还该折腾吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">沙溢一年狂减36斤颜值回春，中年男人还该折腾吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="fight">
                            <div class="card-image">
                                <img src="images/fight.svg" alt="该拼" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">该拼，男人至死是少年</h3>
                                <p class="option-caption">身材管理是对自己的尊重</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buddha">
                            <div class="card-image">
                                <img src="images/buddha.svg" alt="佛系" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">佛系就好，开心最重要</h3>
                                <p class="option-caption">别跟自己过不去</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="money">
                            <div class="card-image">
                                <img src="images/money.svg" alt="看钱包" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看钱包，有钱再折腾</h3>
                                <p class="option-caption">健身私教不便宜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lay">
                            <div class="card-image">
                                <img src="images/lay.svg" alt="躺平" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">已经放弃，躺平了</h3>
                                <p class="option-caption">减肥？不存在的</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
