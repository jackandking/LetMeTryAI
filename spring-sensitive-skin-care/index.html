<head>
    <meta charset="UTF-8">

            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";

    <title>春季敏感肌护理投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季敏感肌，你更信赖哪种急救方式</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春季皮肤敏感泛红时，你更倾向用哪种方式急救？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="minimal-routine">
                            <div class="card-image">
                                <img src="images/minimal-routine.svg" alt="精简护肤示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精简护肤</h3>
                                <p class="option-caption">只用清水和基础面霜，给皮肤减负</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="repair-mask">
                            <div class="card-image">
                                <img src="images/repair-mask.svg" alt="修护面膜示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">修护面膜</h3>
                                <p class="option-caption">敷舒缓修护面膜，快速镇定泛红</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="gentle-serum">
                            <div class="card-image">
                                <img src="images/gentle-serum.svg" alt="温和精华示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温和精华</h3>
                                <p class="option-caption">用含神经酰胺或积雪草精华维稳</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                };
                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
