        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">太空里吃午饭、地球上吃晚饭：你想体验哪种太空画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="space-station-window-lunch">
                            <div class="card-image">
                                <img src="images/space-station-window-lunch.svg" alt="太空站窗前午餐俯瞰地球" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太空站窗前午餐</h3>
                                <p class="option-desc">在空间站靠窗位置悬浮吃便当，一边俯瞰蓝色地球</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="moon-earthset-dinner">
                            <div class="card-image">
                                <img src="images/moon-earthset-dinner.svg" alt="月面看地球落日晚餐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">月面看地球落日晚餐</h3>
                                <p class="option-desc">在月面摆开简易餐桌，看着地球慢慢落下，享受宁静晚餐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spacewalk-floating-snack">
                            <div class="card-image">
                                <img src="images/spacewalk-floating-snack.svg" alt="太空行走悬浮吃点心" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太空行走悬浮吃点心</h3>
                                <p class="option-desc">穿航天服在舱外短暂停留，悬浮中咬一口点心，身后是壮丽地球</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="earth-terrace-dinner-under-stars">
                            <div class="card-image">
                                <img src="images/earth-terrace-dinner-under-stars.svg" alt="地球露台看星晚餐" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">地球露台与朋友看星吃晚饭</h3>
                                <p class="option-desc">在地球的高楼露台与朋友围坐，看星空、举杯聊生活的温暖晚餐</p>
