    <title>未来战争：谁来指挥？</title>

<body>
    <h1 id="pageTitle">未来战争：谁来指挥？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">面对瞬息万变的战场，你愿意将指挥权交给谁？</p>
            <div class="button-group" id="optionsContainer">
                <!-- Human Intuition -->
                <label class="option">
                    <input type="radio" name="commander" value="human">
                    <img src="https://picsum.photos/seed/human/120/80" alt="人类直觉" loading="lazy">
                    <span>人类直觉</span>
                </label>
                
                <!-- AI Precision -->
                <label class="option">
                    <input type="radio" name="commander" value="ai">
                    <img src="https://picsum.photos/seed/ai/120/80" alt="AI 精准" loading="lazy">
                    <span>AI 精准</span>
                </label>
                
                <!-- Hybrid Command -->
                <label class="option">
                    <input type="radio" name="commander" value="hybrid">
                    <img src="https://picsum.photos/seed/hybrid/120/80" alt="人机协作" loading="lazy">
                    <span>人机协作</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在获取最新战力统计...</p>
    </div>
    
    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看全网选择</button>
