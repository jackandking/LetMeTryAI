        <header class="page-header">
            <h1 id="pageTitle">世界杯转播费你怎么看？付费、公共转播还是订阅？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">世界杯转播费你怎么看？你更倾向哪种观看方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="pay-for-hd">
                            <div class="card-image">
                                <img src="images/pay-for-hd.svg" alt="付费观看高清独家" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">愿意付费看高清独家</h3>
                                <p class="option-desc">为更好画质和独家内容愿意付费，支持版权方和转播投入。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="public-broadcast">
                            <div class="card-image">
                                <img src="images/public-broadcast.svg" alt="公共免费转播" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">应保持公共转播让更多人观看</h3>
                                <p class="option-desc">认为重大赛事应有免费或广覆盖的转播，利于全民参与与社会氛围。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="streaming-subscription">
                            <div class="card-image">
                                <img src="images/streaming-subscription.svg" alt="流媒体订阅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">选择流媒体订阅追比赛</h3>
                                <p class="option-desc">通过订阅流媒体服务分摊费用，享受灵活回放与多平台支持。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="group-watch-or-highlights">
                            <div class="card-image">
                                <img src="images/group-watch-or-highlights.svg" alt="集体观赛或回放" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">更倾向和朋友去酒吧或看官方回放</h3>
                                <p class="option-desc">偏好集体观赛场景或事后看官方回放与高光，不一定为单人付费。</p>

                            <div class="check-indicator">✓</div>
