    <title>台风过后皮肤急救：你会先做哪一步缓解泛红和不适？</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风过后皮肤急救，你先做哪一步？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风过后皮肤急救，你先做哪一步？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cleanse-first">
                            <div class="card-image">
                                <img src="images/cleanse-first.svg" alt="温和洁面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先温和清洁</h3>
                                <p class="option-desc">用温和洁面清走汗渍、防晒和灰尘，给后续修护打底。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hydra-boost">
                            <div class="card-image">
                                <img src="images/hydra-boost.svg" alt="补水精华与喷雾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">急速补水</h3>
                                <p class="option-desc">先用喷雾＋补水精华稳定水分，缓解紧绷感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="calm-and-repair">
                            <div class="card-image">
                                <img src="images/calm-and-repair.svg" alt="镇静面膜或冰敷" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">局部镇静修护</h3>
                                <p class="option-desc">敷镇静面膜或冰敷局部红肿，减轻不适再上保养。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="simplify-routine">
                            <div class="card-image">
                                <img src="images/simplify-routine.svg" alt="减少护肤步骤" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">减少护肤步骤</h3>
                                <p class="option-desc">停用刺激性产品，只做温和保湿和防晒，给皮肤喘息时间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
