<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到孩子发脾气你会怎么做？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：遇到孩子发脾气时？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="calm-listen">
                            <div class="card-image">
                                <img src="images/calm-listen.svg" alt="父母倾听孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷静倾听</h3>
                                <p class="option-desc">先听孩子说，再表达理解</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="soothing-praise">
                            <div class="card-image">
                                <img src="images/soothing-praise.svg" alt="抱着安抚的父母" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">适度安抚</h3>
                                <p class="option-desc">先安抚情绪再讲道理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="set-consequences">
                            <div class="card-image">
                                <img src="images/set-consequences.svg" alt="家长解释规则" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">设立后果</h3>
                                <p class="option-desc">明确规则和后果以建立边界</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="redirect-attention">
                            <div class="card-image">
                                <img src="images/redirect-attention.svg" alt="用游戏转移孩子注意力" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">转移注意力</h3>
                                <p class="option-desc">用活动或任务平复情绪</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

                <div class="loading-state">
