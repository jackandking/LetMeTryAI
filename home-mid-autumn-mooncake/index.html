    <title>家里中秋，你怀念哪种月饼味道？老味道回忆</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里中秋，你怀念哪种月饼味道？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里中秋，你怀念哪种月饼味道？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dou-sha">
                            <div class="card-image">
                                <img src="images/dou-sha.svg" alt="豆沙月饼切面，红豆沙馅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">豆沙月饼</h3>
                                <p class="option-desc">热腾腾的豆沙，甜而不腻，像奶奶端上桌的家味。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lian-rong">
                            <div class="card-image">
                                <img src="images/lian-rong.svg" alt="莲蓉月饼圆整切面，细腻馅料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">莲蓉月饼</h3>
                                <p class="option-desc">莲蓉细腻配一杯清茶，是客厅里慢慢聊往事的味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="xian-dan-huang">
                            <div class="card-image">
                                <img src="images/xian-dan-huang.svg" alt="咸蛋黄月饼切面，蛋黄流沙" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">咸蛋黄月饼</h3>
                                <p class="option-desc">流沙咸蛋黄香浓，带着节日的热闹与孩子们的欢笑记忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wu-ren">
                            <div class="card-image">
                                <img src="images/wu-ren.svg" alt="五仁月饼切面，坚果馅料" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">五仁月饼</h3>
                                <p class="option-desc">坚果与果仁的混杂香，像旧街市里买来的那份朴实口感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
