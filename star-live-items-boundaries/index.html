    <title>明星直播互动边界调查</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">明星直播的个人物品与互动边界：你怎么看</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在明星直播中，关于个人物品与互动边界，你更支持哪种态度或做法？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-touch-no-requests">
                            <div class="card-image">
                                <img src="images/no-touch-no-requests.svg" alt="不触碰不索要" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">尊重隐私不触碰或索要物品</h3>
                                <p class="option-caption">主播与粉丝保持界限，不接触或主动分享私人物品，优先保护个人空间与安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="host-initiated-sharing">
                            <div class="card-image">
                                <img src="images/host-initiated-sharing.svg" alt="主播主动展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">主播主动展示，粉丝不索要</h3>
                                <p class="option-caption">由主播自愿展示或介绍物品，粉丝以观赏与支持为主，不提出索要或私下交换请求。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="safe-interaction-no-items">
                            <div class="card-image">
                                <img src="images/safe-interaction-no-items.svg" alt="互动不涉及物品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">互动可接受但不涉及私人物品</h3>
                                <p class="option-caption">鼓励提问、小游戏等互动形式，但避免讨论或处理主播的私人物品，兼顾交流性与隐私保护。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="host-discretion">
                            <div class="card-image">
                                <img src="images/host-discretion.svg" alt="尊重主播意愿" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">根据主播意愿灵活处理</h3>
                                <p class="option-caption">由主播根据当时情境和个人意愿决定是否分享或回应物品相关互动，粉丝以尊重为先。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
