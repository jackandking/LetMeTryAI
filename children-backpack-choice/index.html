    <title>家长话题：儿童书包你更看重哪一点</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：儿童书包你更看重哪一点</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：儿童书包你更看重哪一点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="spine-support-backpack">
                            <div class="card-image">
                                <img src="images/spine-support-backpack.svg" alt="护脊背带与加固背板" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">护脊支撑型</h3>
                                <p class="option-desc">重视肩带与背板支撑，保护脊椎</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="lightweight-backpack">
                            <div class="card-image">
                                <img src="images/lightweight-backpack.svg" alt="轻量化材质书包" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻便减负型</h3>
                                <p class="option-desc">尽量轻，减轻孩子负担</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="durable-waterproof-backpack">
                            <div class="card-image">
                                <img src="images/durable-waterproof-backpack.svg" alt="防水耐用书包材质" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">耐用防水型</h3>
                                <p class="option-desc">耐磨抗水、适合日常粗用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="multi-pocket-backpack">
                            <div class="card-image">
                                <img src="images/multi-pocket-backpack.svg" alt="多隔层书包内部结构" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">多功能收纳型</h3>
                                <p class="option-desc">隔层多、便于分类收纳书本与物品</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
