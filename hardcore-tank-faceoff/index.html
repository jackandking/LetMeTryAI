    <title>当代主战坦克对比投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">当代主战坦克对比投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款主战坦克？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="m1a2-abrams">
                            <div class="card-image">
                                <img src="images/m1a2-abrams.svg" alt="M1A2 Abrams 坦克侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">M1A2 Abrams</h3>
                                <p class="option-desc">美制重装甲与复合装甲防护</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="t-90m">
                            <div class="card-image">
                                <img src="images/t-90m.svg" alt="T-90M 坦克侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">T-90M</h3>
                                <p class="option-desc">俄系机动与成本平衡之选</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="type-99a">
                            <div class="card-image">
                                <img src="images/type-99a.svg" alt="Type 99A 坦克侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Type 99A</h3>
                                <p class="option-desc">国产改进型主战坦克，综合性能强</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="leopard-2a7">
                            <div class="card-image">
                                <img src="images/leopard-2a7.svg" alt="Leopard 2A7 坦克侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">Leopard 2A7</h3>
                                <p class="option-desc">欧系火力与火控表现出色</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
