<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：80年代更好看的电视剧</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个选项：80年代最好看的电视剧？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="legend-condor-heroes">
                            <div class="card-image">
                                <img src="images/legend-condor-heroes.jpg" alt="射雕英雄传剧照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">《射雕英雄传》</h3>
                                <p class="option-desc">侠骨柔情，难忘经典</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="journey-to-the-west">
                            <div class="card-image">
                                <img src="images/journey-to-the-west.jpg" alt="西游记剧照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">《西游记》</h3>
                                <p class="option-desc">师徒四人，童年回忆</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="the-bund">
                            <div class="card-image">
                                <img src="images/the-bund.jpg" alt="上海滩剧照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">《上海滩》</h3>
                                <p class="option-desc">乱世风云，儿女情长</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="dream-red-mansion">
                            <div class="card-image">
                                <img src="images/dream-red-mansion.jpg" alt="红楼梦剧照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">《红楼梦》</h3>
                                <p class="option-desc">满纸荒唐言，一把辛酸泪</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
