    <title>连锁店退钱后你还会再去吗？你会怎么做</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">连锁店退钱后你还会再去吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">连锁店退钱后你还会再去吗？（遇到类似情况你会怎么选）</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="still-go-cautious">
                            <div class="card-image">
                                <img src="images/still-go-cautious.svg" alt="会继续去并谨慎" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会继续去（但更谨慎）</h3>
                                <p class="option-desc">认为只是个别情况，会再去但多注意服务与卫生</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-return">
                            <div class="card-image">
                                <img src="images/no-return.svg" alt="不会再去该连锁店" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会再去了</h3>
                                <p class="option-desc">失去信任，退钱也无法挽回决定不再光顾</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="order-only">
                            <div class="card-image">
                                <img src="images/order-only.svg" alt="仅线上下单" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">还会去，但只线上/点外卖</h3>
                                <p class="option-desc">避免线下接触风险，保留品牌但只接受线上服务</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="go-and-feedback">
                            <div class="card-image">
                                <img src="images/go-and-feedback.svg" alt="当面反馈并观察" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">会再去并当面反馈/投诉</h3>
                                <p class="option-desc">认为有改进空间，会当面反馈并观察店方反应再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
