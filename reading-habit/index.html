    <title>家长话题：如何帮孩子养成阅读习惯</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：如何帮孩子养成阅读习惯</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：孩子的阅读习惯该怎么养？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="fixed-reading-time">
                            <div class="card-image">
                                <img src="images/fixed-reading-time.jpg" alt="亲子一起读书" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定时间段一起读书</h3>
                                <p class="option-desc">每天固定安排 15-30 分钟亲子阅读</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="parent-modeling">
                            <div class="card-image">
                                <img src="images/parent-modeling.jpg" alt="父母示范阅读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">父母示范并讨论读后感</h3>
                                <p class="option-desc">父母做榜样，读完和孩子讨论感受</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="interest-booklist">
                            <div class="card-image">
                                <img src="images/interest-booklist.jpg" alt="孩子选书" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣书单与自由选书</h3>
                                <p class="option-desc">准备符合兴趣的书单，让孩子自主选择</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="reading-streak-reward">
                            <div class="card-image">
                                <img src="images/reading-streak-reward.jpg" alt="读书打卡奖励" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">读书打卡或小奖励</h3>
                                <p class="option-desc">用打卡或小贴纸激励持续阅读</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
