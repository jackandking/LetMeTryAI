    <title>孩子上大学想学哪类专业？带家长讨论的四种倾向</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子上大学想学哪类专业？家长更看重兴趣还是就业？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子上大学想学哪类专业？你更支持孩子追兴趣还是更看重未来就业？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="practical-stem">
                            <div class="card-image">
                                <img src="images/practical-stem.svg" alt="工程师在实验室与代码界面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">实用类（工科/计算机/金融）</h3>
                                <p class="option-desc">优先考虑就业率、薪资与职业稳定性，学以致用的路径。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="creative-arts">
                            <div class="card-image">
                                <img src="images/creative-arts.svg" alt="画笔与舞台灯光的创意场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣类（艺术/设计/传媒）</h3>
                                <p class="option-desc">以兴趣与表达为核心，培养创造力与个性化职业路线。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="humanities-social-science">
                            <div class="card-image">
                                <img src="images/humanities-social-science.svg" alt="书本与亲子对话的温暖画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">人文社科（教育/心理/社会学）</h3>
                                <p class="option-desc">重视沟通、理解与社会责任，适合教育、咨询与研究方向。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="emerging-interdisciplinary">
                            <div class="card-image">
                                <img src="images/emerging-interdisciplinary.svg" alt="分子结构与算法可视化的前沿感画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">交叉前沿（生物信息/人工智能/环境）</h3>
                                <p class="option-desc">跨学科整合，面向未来技术与复杂问题解决的成长路径。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
