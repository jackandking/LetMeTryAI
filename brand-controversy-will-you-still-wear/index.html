    <title>品牌有争议，你还会继续穿它吗？ | 女人爱</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">品牌有争议，你还会继续穿它吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">品牌有争议，你还会继续穿它吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="still-wear">
                            <div class="card-image">
                                <img src="images/still-wear.svg" alt="继续穿着该品牌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">我还会穿</h3>
                                <p class="option-desc">喜欢设计或质量，不介意外界争议</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pause-wearing">
                            <div class="card-image">
                                <img src="images/pause-wearing.svg" alt="暂时不穿该品牌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暂时停穿</h3>
                                <p class="option-desc">先观望，等风向或官方回应再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-only">
                            <div class="card-image">
                                <img src="images/home-only.svg" alt="仅在家中穿着" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只在家穿</h3>
                                <p class="option-desc">私下喜欢但不在公共场合展示</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="switch-brand">
                            <div class="card-image">
                                <img src="images/switch-brand.svg" alt="选择更换品牌" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">直接换品牌</h3>
                                <p class="option-desc">对价值观/立场有底线，选择替代品牌</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
