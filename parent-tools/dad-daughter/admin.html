<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爸爸带女儿玩什么 管理页面</title>
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
    <script src="../../util.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; background: #f5f5f5; color: #2d3436; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #e91e63; margin-bottom: 30px; text-align: center; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #fff0f5 0%, #ffe6f0 100%); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: #e91e63; margin-bottom: 10px; }
        .activities-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .activities-table th, .activities-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .activities-table th { background-color: #e91e63; color: white; }
        .action-btn { padding: 6px 12px; margin: 0 5px; border: none; border-radius: 5px; cursor: pointer; }
        .delete-btn { background-color: #e91e63; color: white; }
        .view-btn { background-color: #3498db; color: white; }
        .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #7f8c8d; }
        .back-link { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>爸爸带女儿玩什么 管理页面</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>总活动数</h3>
                <div class="number" id="totalActivities">0</div>
            </div>
            <div class="stat-card">
                <h3>总投票数</h3>
                <div class="number" id="totalVotes">0</div>
            </div>
        </div>

        <div id="loadingMessage" class="loading">正在加载数据...</div>

        <table class="activities-table" id="activitiesTable" style="display: none;">
            <thead>
                <tr>
                    <th>标题</th>
                    <th>描述</th>
                    <th>视频/文章链接</th>
                    <th>投票数</th>
                    <th>添加时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="activitiesTableBody"></tbody>
        </table>

        <div class="back-link">
            <a href="index.html">← 返回爸爸带女儿玩什么主页</a>
        </div>
    </div>

    <script>
        const dadDaughterConfig = { activitiesKey: "parent-tools-dad-daughter-activities" };
        let activities = [];
        document.addEventListener('DOMContentLoaded', loadActivities);

        function loadActivities() {
            readKeyValueStore(dadDaughterConfig.activitiesKey, (data) => {
                document.getElementById('loadingMessage').style.display = 'none';
                if (data) {
                    try { activities = JSON.parse(data); displayStats(); displayActivities(); }
                    catch (e) { console.error(e); alert('数据加载失败'); }
                } else { activities = []; displayStats(); }
            });
        }

        function displayStats() {
            document.getElementById('totalActivities').textContent = activities.length;
            const totalVotes = activities.reduce((s, a) => s + (a.votes || 0), 0);
            document.getElementById('totalVotes').textContent = totalVotes;
        }

        function displayActivities() {
            const tableBody = document.getElementById('activitiesTableBody');
            const table = document.getElementById('activitiesTable');
            tableBody.innerHTML = '';
            if (activities.length === 0) return;
            table.style.display = 'table';
            const sorted = [...activities].sort((a, b) => b.timestamp - a.timestamp);
            sorted.forEach(activity => {
                const row = document.createElement('tr');
                const dateStr = new Date(activity.timestamp).toLocaleDateString('zh-CN');
                row.innerHTML = `
                    <td>${activity.name}</td>
                    <td>${activity.description || '-'}</td>
                    <td><a href="${activity.videoLink}" target="_blank" style="color: #3498db;">查看</a></td>
                    <td>${activity.votes || 0}</td>
                    <td>${dateStr}</td>
                    <td>
                        <button class="action-btn view-btn" onclick="window.open('${activity.videoLink}', '_blank')">查看内容</button>
                        <button class="action-btn delete-btn" onclick="deleteActivity('${activity.id}')">删除</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function deleteActivity(id) {
            if (!confirm('确定要删除这个活动吗？')) return;
            activities = activities.filter(a => a.id !== id);
            try { await updateKeyValueStore(dadDaughterConfig.activitiesKey, JSON.stringify(activities)); alert('删除成功'); displayStats(); displayActivities(); }
            catch (e) { console.error(e); alert('删除失败'); }
        }
    </script>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.get('debug') === 'true';
            if (debugMode) {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js';
                script.onload = function() { if (window.VConsole) { new window.VConsole(); } };
                document.head.appendChild(script);
            }
        })();
    </script>

</body>
</html>
