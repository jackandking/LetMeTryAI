    <title>哪个吃播镜头让你想咬一口？来选出你的食欲瞬间</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪个吃播镜头让你想咬一口？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪个吃播镜头让你想咬一口？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cream-pull">
                            <div class="card-image">
                                <img src="images/cream-pull.svg" alt="拉丝奶油甜点近景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">奶油拉丝甜点</h3>
                                <p class="option-desc">奶油一拉丝，拉长的质感和光泽让人想马上咬一口</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sizzling-grill">
                            <div class="card-image">
                                <img src="images/sizzling-grill.svg" alt="炭火烤肉特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">炭火烤肉滋滋声</h3>
                                <p class="option-desc">炭火焦边油亮，滋滋声带出烟火气，食欲被勾起</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="slurp-noodles">
                            <div class="card-image">
                                <img src="images/slurp-noodles.svg" alt="大口吸面的特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">浓汤拌面大口吸</h3>
                                <p class="option-desc">面条吸溜入镜，浓汤挂面、热气腾腾让人想尝一口</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hotpot-dip">
                            <div class="card-image">
                                <img src="images/hotpot-dip.svg" alt="火锅夹肉落汤特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">热锅涮肉落汤</h3>
                                <p class="option-desc">夹肉入锅翻涌，热气与鲜亮肉色形成强烈画面感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
