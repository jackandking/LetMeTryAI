    <title>机车赛场造型投票</title>

    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">机车赛场风格：你偏好哪种赛场造型？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在机车赛场风格中，你更偏向哪种造型？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="modern-edge">
                            <div class="card-image">
                                <img src="images/modern-edge.svg" alt="硬朗摩登机车赛场造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">硬朗摩登</h3>
                                <p class="option-desc">皮革与金属感，帅气利落的赛道造型</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="vintage-sweet">
                            <div class="card-image">
                                <img src="images/vintage-sweet.svg" alt="甜美复古机车造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甜美复古</h3>
                                <p class="option-desc">复古卷发与柔和妆容，甜美带赛道元素</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="black-knight">
                            <div class="card-image">
                                <img src="images/black-knight.svg" alt="酷感黑骑士赛场造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">酷感黑骑士</h3>
                                <p class="option-desc">全黑造型与烟熏妆，低调冷酷的赛道风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="technical-sport">
                            <div class="card-image">
                                <img src="images/technical-sport.svg" alt="机能运动赛场造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">机能运动</h3>
                                <p class="option-desc">功能性面料与运动感配件，实用兼时尚</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
