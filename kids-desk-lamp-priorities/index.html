    <title>孩子书桌灯，你更看重哪个功能？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子书桌灯，你更看重哪个功能？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：孩子书桌灯最重要的功能是？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="brightness-adjust">
                            <div class="card-image">
                                <img src="images/brightness-adjust.svg" alt="亮度可调节 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亮度可调节</h3>
                                <p class="option-desc">可根据阅读场景调节亮度更舒适</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="color-temperature">
                            <div class="card-image">
                                <img src="images/color-temperature.svg" alt="色温可调节 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">色温可调节</h3>
                                <p class="option-desc">冷暖光切换减轻眼疲劳与氛围需求</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="no-flicker">
                            <div class="card-image">
                                <img src="images/no-flicker.svg" alt="无频闪护眼 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无频闪护眼</h3>
                                <p class="option-desc">稳定光源更护眼，适合长时间学习</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="portable-foldable">
                            <div class="card-image">
                                <img src="images/portable-foldable.svg" alt="便携折叠设计 图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">便携折叠设计</h3>
                                <p class="option-desc">适合小书桌与移动使用，收纳方便</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
