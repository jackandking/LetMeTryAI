    <title>送孩子上大学｜报到那天你会带什么？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">送孩子上大学，报到那天你会带什么去？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">送孩子上大学，报到那天你会带哪样东西去？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bedding-and-essentials">
                            <div class="card-image">
                                <img src="images/bedding-and-essentials.svg" alt="被子和床上用品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">生活床品</h3>
                                <p class="option-desc">被子、床单、洗漱包，先把宿舍铺好让孩子安心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="documents-and-stationery">
                            <div class="card-image">
                                <img src="images/documents-and-stationery.svg" alt="证件与学习用品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">证件与学习用品</h3>
                                <p class="option-desc">身份证、录取通知书、笔记本、常用教材与笔，报到办事利落</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hometown-snacks">
                            <div class="card-image">
                                <img src="images/hometown-snacks.svg" alt="家乡小吃" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家乡小吃</h3>
                                <p class="option-desc">家乡零食或特产，暖心又能缓解想家情绪</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="companionship-and-cash">
                            <div class="card-image">
                                <img src="images/companionship-and-cash.svg" alt="陪伴和生活费" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陪伴+生活费</h3>
                                <p class="option-desc">父母陪同报到并留点生活费，安心更重要</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
