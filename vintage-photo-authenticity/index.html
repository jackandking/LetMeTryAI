    <title>这些老照片真还是假的？你能看出破绽吗？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这些老照片真还是假的？你能看出破绽吗？揭秘藏在细节的线索</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这些老照片真还是假的？你能看出破绽吗？你觉得更像哪种情况？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="looks-authentic">
                            <div class="card-image">
                                <img src="images/looks-authentic.svg" alt="看着像真实老片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看着像真实老片</h3>
                                <p class="option-desc">色调、颗粒与纸张感都像老照片，像是真留存的记忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="obvious-retouch">
                            <div class="card-image">
                                <img src="images/obvious-retouch.svg" alt="像被修图或合成过" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">像被修图或合成过</h3>
                                <p class="option-desc">人物边缘、光影或背景有不自然的痕迹，像被后期改动。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="possible-rephotograph">
                            <div class="card-image">
                                <img src="images/possible-rephotograph.svg" alt="可能是翻拍或复原作品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可能是翻拍或复原作品</h3>
                                <p class="option-desc">可能是旧底片翻拍或修复后再拍，质感有人工处理的感觉。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="undecided-expert-needed">
                            <div class="card-image">
                                <img src="images/undecided-expert-needed.svg" alt="看不出来需专家确认" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">看不出来，需专家或家人确认</h3>
                                <p class="option-desc">肉眼难辨细微痕迹，建议询问家人或请鉴定者判定。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

        </footer>
