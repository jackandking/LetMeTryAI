    <title>爸妈出门穿哪双鞋｜场景对比帮他们选一双暖心鞋</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">爸妈出门你更想他们穿哪种鞋？稳妥安全还是舒服自在？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">爸妈出门你更想他们穿哪种鞋？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="non-slip-sneakers">
                            <div class="card-image">
                                <img src="images/non-slip-sneakers.svg" alt="防滑运动鞋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防滑运动鞋</h3>
                                <p class="option-desc">下雨和路滑时有底气，走远路更稳当</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="comfortable-cloth-shoes">
                            <div class="card-image">
                                <img src="images/comfortable-cloth-shoes.svg" alt="舒适布鞋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">舒适布鞋</h3>
                                <p class="option-desc">软底贴合脚型，短距离散步最舒服</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-sandals">
                            <div class="card-image">
                                <img src="images/light-sandals.svg" alt="轻便凉鞋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻便凉鞋</h3>
                                <p class="option-desc">夏天出门透气、好穿脱，适合近距离活动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
