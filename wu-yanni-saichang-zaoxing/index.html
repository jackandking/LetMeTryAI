                    <div class="options-grid" id="optionsContainer">

                            <div class="card-content">
                                <h3 class="option-title">明艳红唇 + 大波浪</h3>

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                            <div class="card-content">
                                <h3 class="option-title">复古卷发 + 玫瑰粉妆</h3>
                                <p class="option-desc">柔和粉色系妆容配复古大卷，温柔优雅，适合温暖场景出镜。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
