<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);

    <title>长者出行选择投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">长者出行：电动车与传统方式，你倾向哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">长者出行：电动车与传统方式，你倾向哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="electric-mobility">
                            <div class="card-image">
                                <img src="images/electric-mobility.svg" alt="电动代步车示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电动车代步</h3>
                                <p class="option-desc">省力、适合较远距离出行，关注续航与慢速安全防护。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="traditional-walking">
                            <div class="card-image">
                                <img src="images/traditional-walking.svg" alt="手杖与公交示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">传统方式（步行/助行器/公交）</h3>
                                <p class="option-desc">保持日常活动，成本低、短途灵活，适合有良好步行能力的长者。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-community-ride">
                            <div class="card-image">
                                <img src="images/family-community-ride.svg" alt="家人陪同接送示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭陪同或社区接送</h3>
                                <p class="option-desc">有人陪伴更安心，适合需要帮助、行李或长途出行场景。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
