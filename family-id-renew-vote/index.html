    <title>家庭身份证换证安排投票</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家庭身份证换证安排投票：哪种方式更适合你家？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会如何安排全家人的身份证换证？请选择最贴近你家的方案。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="weekend-family-visit">
                            <div class="card-image">
                                <img src="images/weekend-family-visit.svg" alt="周末全家集中办理身份证" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">周末集中办理</h3>
                                <p class="option-desc">选一个周末，一家人一起去窗口，一次办完所有人的证件</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="weekday-staggered">
                            <div class="card-image">
                                <img src="images/weekday-staggered.svg" alt="分散预约办理身份证" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分散预约办理</h3>
                                <p class="option-desc">按个人时间分批预约，错峰避免等待，灵活安排工作日办理</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="community-mobile-service">
                            <div class="card-image">
                                <img src="images/community-mobile-service.svg" alt="社区移动身份证服务点" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社区/移动服务办理</h3>
                                <p class="option-desc">利用社区服务点或移动证件受理点，在居住地附近办理或上门服务</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="entrust-agent">
                            <div class="card-image">
                                <img src="images/entrust-agent.svg" alt="委托代办身份证换证" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">委托代办</h3>
                                <p class="option-desc">准备好委托材料后，交由可信代办机构代办，节省家庭时间成本</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
