    <title>春天适合带娃的户外活动 | 家长爱</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春天适合带娃的户外活动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这个春天，你更想带娃体验哪种户外活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="park-picnic">
                            <div class="card-image">
                                <img src="images/park-picnic.svg" alt="公园野餐场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">公园野餐</h3>
                                <p class="option-caption">带上零食和风筝，在草地上享受阳光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hiking-trail">
                            <div class="card-image">
                                <img src="images/hiking-trail.svg" alt="郊野徒步场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">郊野徒步</h3>
                                <p class="option-caption">走进自然，观察花草昆虫，锻炼身体</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="family-cycling">
                            <div class="card-image">
                                <img src="images/family-cycling.svg" alt="亲子骑行场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亲子骑行</h3>
                                <p class="option-caption">沿着绿道骑行，感受春风拂面的快乐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
