    <title>排队五小时买相机，你会想拍哪种上镜大片？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">排队五小时买相机，你会想拍哪种上镜大片？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">排队五小时买到相机后，你先拍哪种上镜大片？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="city-backlight">
                            <div class="card-image">
                                <img src="images/city-backlight.svg" alt="黄昏城市背光人像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">城市背光·背影杀</h3>
                                <p class="option-desc">黄昏城市背光，长发背影配光晕，电影感十足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soft-japanese">
                            <div class="card-image">
                                <img src="images/soft-japanese.svg" alt="日系柔光清新人像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">日系柔光·清新人像</h3>
                                <p class="option-desc">柔和自然光、淡雅色调，皮肤质感温柔清新</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="film-vintage">
                            <div class="card-image">
                                <img src="images/film-vintage.svg" alt="胶片复古人像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">胶片复古·时光感</h3>
                                <p class="option-desc">颗粒感与低饱和色调，像旧照片里的故事画面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="high-fashion">
                            <div class="card-image">
                                <img src="images/high-fashion.svg" alt="时尚高饱和人像" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">时尚高饱和·大片感</h3>
                                <p class="option-desc">强烈色彩与利落构图，具备杂志级视觉冲击力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
