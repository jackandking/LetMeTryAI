    <title>春季应季食物你最常吃哪类？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季应季食物你最常吃哪类？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪类春季应季食物？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="seasonal-vegetables">
                            <div class="card-image">
                                <img src="images/seasonal-vegetables.svg" alt="春季时令蔬菜拼盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">seasonal-vegetables</h3>
                                <p class="option-desc">时令蔬菜（如芦笋、青菜）</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="seasonal-fruits">
                            <div class="card-image">
                                <img src="images/seasonal-fruits.svg" alt="春季应季水果篮" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">seasonal-fruits</h3>
                                <p class="option-desc">应季水果（如草莓、柑橘）</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="light-seafood">
                            <div class="card-image">
                                <img src="images/light-seafood.svg" alt="清蒸鱼与海鲜料理" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">light-seafood</h3>
                                <p class="option-desc">清淡鱼类或海鲜</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="grain-porridge">
                            <div class="card-image">
                                <img src="images/grain-porridge.svg" alt="营养杂粮粥碗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">grain-porridge</h3>
                                <p class="option-desc">杂粮汤粥或轻粥类</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
