    <title>国庆返程带娃出发时刻：家长都怎么安排</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国庆返程高峰，你会几点带孩子出发？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国庆返程高峰，你通常会几点带孩子出发？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="overnight-0-5">
                            <div class="card-image">
                                <img src="images/overnight-0-5.svg" alt="深夜出发带孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">深夜出发（0:00-5:00）</h3>
                                <p class="option-desc">深夜出发，路况更顺畅，但要安排好孩子睡眠与车内舒适。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="early-morning-5-7">
                            <div class="card-image">
                                <img src="images/early-morning-5-7.svg" alt="清晨出发带娃" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清晨出发（5:00-7:00）</h3>
                                <p class="option-desc">天刚亮就出发，力争在早高峰前经过主要路段，孩子通常还能继续小睡。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="morning-7-9">
                            <div class="card-image">
                                <img src="images/morning-7-9.svg" alt="早高峰出发" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">早高峰时段（7:00-9:00）</h3>
                                <p class="option-desc">按常规时间出发，方便行程安排但可能遇到车流高峰，适合作息稳定的家庭。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="after-9-am">
                            <div class="card-image">
                                <img src="images/after-9-am.svg" alt="上午后出发带娃" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">上午晚些出发（9:00以后）</h3>
                                <p class="option-desc">错峰出发，孩子白天精神更好，但途中或到达时可能遇到 局部车流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
