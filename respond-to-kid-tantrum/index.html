    <h1 id="pageTitle">孩子发脾气：你会怎么回应？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长视角，你会怎么选：孩子发脾气时你会怎么回应？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="listen-and-support">
                    <img src="images/listen-and-support.svg" alt="父母耐心倾听孩子情绪" loading="lazy">
                    <span>先冷静听孩子表达，再陪伴安抚，不马上训斥</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="time-out-and-calm">
                    <img src="images/time-out-and-calm.svg" alt="孩子独自冷静的场景" loading="lazy">
                    <span>给孩子短暂空间，让双方都冷静后再沟通</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="set-boundaries-now">
                    <img src="images/set-boundaries-now.svg" alt="父母清晰设限并讲解规则" loading="lazy">
                    <span>当场说明不可接受并明确边界和后果</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="talk-after">
                    <img src="images/talk-after.svg" alt="父母与孩子事后温和沟通" loading="lazy">
                    <span>等情绪过后再与孩子回顾原因并教情绪管理</span>
                </label>
            </div>
        </div>
