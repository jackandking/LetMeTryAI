<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>假期出行安全小调查</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">假期出行安全关切：您更关注哪方面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">假期出行时，您更关心哪类安全问题？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="pre-trip-preparation">
                            <div class="card-image">
                                <img src="images/pre-trip-preparation.svg" alt="出行前准备示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">出行前准备</h3>
                                <p class="option-desc">提前规划路线、准备证件与必需物品并告知家人行程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="on-the-road-traffic">
                            <div class="card-image">
                                <img src="images/on-the-road-traffic.svg" alt="途中交通与路况图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">途中交通与路况</h3>
                                <p class="option-desc">关注路况、选择舒适交通方式与合理休息安排，减少长时间颠簸。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="accommodation-and-safety">
                            <div class="card-image">
                                <img src="images/accommodation-and-safety.svg" alt="住宿与防骗示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">住宿选择与防骗</h3>
                                <p class="option-desc">选择可靠预订渠道和安全住宿环境，注意门锁与消费凭证。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="health-and-emergency-contacts">
                            <div class="card-image">
                                <img src="images/health-and-emergency-contacts.svg" alt="随身应急联系卡图片" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">随身应急联系与信息</h3>
                                <p class="option-desc">随身携带紧急联系方式与重要信息，便于突发状况时快速联络家人或邻居求助。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
