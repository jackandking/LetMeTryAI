    <title>女人爱热议：恋爱中最不能忍的行为</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：恋爱中最不能忍的行为</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">恋爱中你最不能忍受哪种行为？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="lying-or-hiding">
                            <div class="card-image">
                                <img src="images/lying-or-hiding.svg" alt="说谎的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">说谎/瞒着你</h3>
                                <p class="option-desc">频繁撒谎或隐瞒让人无法信任。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="silent-treatment">
                            <div class="card-image">
                                <img src="images/silent-treatment.svg" alt="冷漠的表情" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷暴力/忽视感受</h3>
                                <p class="option-desc">长时间冷落、不沟通让关系受伤。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="flirting-with-others">
                            <div class="card-image">
                                <img src="images/flirting-with-others.svg" alt="暧昧互动场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暧昧不停/对别人不专一</h3>
                                <p class="option-desc">暧昧不断或不尊重界限让人心寒。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="no-responsibility">
                            <div class="card-image">
                                <img src="images/no-responsibility.svg" alt="推卸责任的手势" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不承担/不分担责任</h3>
                                <p class="option-desc">对生活与情感不承担责任感疲惫。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
