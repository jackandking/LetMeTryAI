    <title>家庭地震应急准备投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家庭地震应急准备投票：家长会先准备什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在家庭地震应急准备中，你会优先准备哪一项？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-water-supply">
                            <div class="card-image">
                                <img src="images/food-water-supply.svg" alt="食物与饮用水的应急储备" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">食物与饮水储备</h3>
                                <p class="option-caption">准备三日（或更长）应急食物与安全饮用水，兼顾易保存与儿童适口性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="evacuation-plan">
                            <div class="card-image">
                                <img src="images/evacuation-plan.svg" alt="家庭避难与疏散路线图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">避难与疏散计划</h3>
                                <p class="option-caption">制定家中与外出的避难路线、集合点和分工，演练逃生与火险应对流程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="communication-meeting-point">
                            <div class="card-image">
                                <img src="images/communication-meeting-point.svg" alt="家庭通讯与集合点准备物品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家庭通讯与集合点</h3>
                                <p class="option-caption">设定离散时的联络方式与临时集合点，准备充电宝、备用电话卡与书面联系人名单。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="child-psych-support">
                            <div class="card-image">
                                <img src="images/child-psych-support.svg" alt="儿童情绪安抚和避险演练场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">儿童情绪安抚与安全教育</h3>
                                <p class="option-caption">事先与孩子演练避险动作、准备安抚包与简单说明，帮助孩子在灾后保持冷静与安全感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
