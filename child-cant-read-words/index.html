    <title>孩子认字遇阻，先做哪一步？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子拿着书却认不出字，你会先怎么做？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子拿着书却认不出字，你会先怎么做？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="point-and-read">
                            <div class="card-image">
                                <img src="images/point-and-read.svg" alt="家长用手指着书教孩子认字" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">边指边教，跟读示范</h3>
                                <p class="option-desc">家长指字+示范拼读，现场帮孩子认一个字一个字读起来。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="vision-development-check">
                            <div class="card-image">
                                <img src="images/vision-development-check.svg" alt="带孩子到医院或筛查点做视力检查" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先约视力/发育筛查</h3>
                                <p class="option-desc">担心视力或发育问题，先做专业筛查再决定教学策略。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="picture-story-guided">
                            <div class="card-image">
                                <img src="images/picture-story-guided.svg" alt="家长用图画书给孩子讲故事" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用图画故事吸引兴趣</h3>
                                <p class="option-desc">用图画、配图讲故事，把文字和画面连起来降低抵触感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="playful-literacy-app">
                            <div class="card-image">
                                <img src="images/playful-literacy-app.svg" alt="孩子在平板上玩识字类教育游戏" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">换成识字游戏或趣味App</h3>
                                <p class="option-desc">用游戏化识字或互动App把学习变成玩耍，先激发主动性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
