    <title>硬核对比：游戏显卡性能PK</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：游戏显卡性能PK</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款显卡？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="nvidia-rtx-4090">
                            <div class="card-image">
                                <img src="images/nvidia-rtx-4090.svg" alt="RTX 4090 显卡特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">NVIDIA RTX 4090</h3>
                                <p class="option-desc">旗舰级最高帧数，功耗与价格顶级</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="amd-rx-7900-xtx">
                            <div class="card-image">
                                <img src="images/amd-rx-7900-xtx.svg" alt="RX 7900 XTX 显卡侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">AMD Radeon RX 7900 XTX</h3>
                                <p class="option-desc">性价比强、能耗更优的高端选手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="nvidia-rtx-4080">
                            <div class="card-image">
                                <img src="images/nvidia-rtx-4080.svg" alt="RTX 4080 显卡图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">NVIDIA RTX 4080</h3>
                                <p class="option-desc">次旗舰，平衡性能与能耗的实用选择</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>

        <footer class="page-footer">
