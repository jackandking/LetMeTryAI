    <title>春日香氛选择：哪款香氛更适合你的春天？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春日香氛选择：哪款香氛更适合你的春天？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：春日香氛你更想带哪款？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="fresh-floral">
                            <div class="card-image">
                                <img src="images/fresh-floral.svg" alt="清新花香瓶身" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新花香</h3>
                                <p class="option-desc">明亮花香，适合日常约会与通勤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="fruity-sweet">
                            <div class="card-image">
                                <img src="images/fruity-sweet.svg" alt="果香香氛瓶身" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">果香甜调</h3>
                                <p class="option-desc">果味甜美，带青春活力感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="soft-powdery">
                            <div class="card-image">
                                <img src="images/soft-powdery.svg" alt="轻柔粉感香氛" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻柔粉感</h3>
                                <p class="option-desc">温柔粉感，气质感强，适合内敛风格</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="woody-fresh">
                            <div class="card-image">
                                <img src="images/woody-fresh.svg" alt="木质清新香氛" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">木质清新</h3>
                                <p class="option-desc">木质调带沉稳与自然气息，适合春日晚间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
