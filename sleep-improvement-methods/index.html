<body>
    <h1 id="pageTitle">关注：哪种睡眠提升方法更实用？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">亲，你最支持哪种改善睡眠的方法？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="sleep-warm-milk">
                    <img src="images/sleep-warm-milk.svg" alt="一杯热牛奶在床边" loading="lazy">
                    <span>温热饮品帮放松，适合睡前半小时</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="sleep-foot-soak">
                    <img src="images/sleep-foot-soak.svg" alt="泡脚盆与温水蒸汽" loading="lazy">
                    <span>热水泡脚助放松，改善入睡感受</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="sleep-fixed-schedule">
                    <img src="images/sleep-fixed-schedule.svg" alt="床头钟表显示固定时间" loading="lazy">
                    <span>规律作息，长期效果最好</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="sleep-less-screen-time">
                    <img src="images/sleep-less-screen-time.svg" alt="放下手机、关灯准备睡觉" loading="lazy">
                    <span>减少蓝光干扰，提前放下手机</span>
                </label>
            </div>
        </div>
    </form>
