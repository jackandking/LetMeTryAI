    <title>智能珠宝手表消费态度投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">智能珠宝手表的消费态度投票 — 你的选择？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会如何看待智能珠宝手表作为日常配饰与消费选择？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="fashion-first">
                            <div class="card-image">
                                <img src="images/fashion-first.svg" alt="以外观为先的智能珠宝手表" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以外观为先</h3>
                                <p class="option-caption">把它当成珠宝首饰看重设计与质感，愿意为颜值付费。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="feature-driven">
                            <div class="card-image">
                                <img src="images/feature-driven.svg" alt="以功能为主的智能珠宝手表" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以功能为主</h3>
                                <p class="option-caption">更看重健康监测、通知与续航等智能功能，兼顾实用性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="price-sensitive">
                            <div class="card-image">
                                <img src="images/price-sensitive.svg" alt="价格敏感型消费者" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">价格敏感型</h3>
                                <p class="option-caption">喜欢外观但预算有限，倾向于等折扣或选择更亲民款式。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prefer-traditional">
                            <div class="card-image">
                                <img src="images/prefer-traditional.svg" alt="偏好传统珠宝与手表" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">偏好传统款</h3>
                                <p class="option-caption">倾向经典珠宝或传统手表，不急于尝试智能珠宝手表。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
