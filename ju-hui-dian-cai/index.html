    <title>聚会点菜比一比：你会选哪道？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">朋友聚会你会点哪道下饭菜？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">朋友聚会时，你会优先点哪道下饭菜？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="chi-huo-guo">
                            <div class="card-image">
                                <img src="images/chi-huo-guo.svg" alt="一桌热气腾腾的火锅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">吃火锅</h3>
                                <p class="option-desc">热乎乎一桌，大家围着涮肉喝汤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kao-rou-lu-chan">
                            <div class="card-image">
                                <img src="images/kao-rou-lu-chan.svg" alt="烤肉和撸串的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">烤肉撸串</h3>
                                <p class="option-desc">边烤边聊，烟火气十足</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hai-xian-pin-pan">
                            <div class="card-image">
                                <img src="images/hai-xian-pin-pan.svg" alt="色彩丰富的海鲜拼盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">海鲜拼盘</h3>
                                <p class="option-desc">海味共享，适合多人开胃</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="jia-chang-cai">
                            <div class="card-image">
                                <img src="images/jia-chang-cai.svg" alt="丰盛的家常菜摆盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家常菜套餐</h3>
                                <p class="option-desc">简单家常味，更有归属感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
