    <title>关注：社区活动你更愿意参加哪类？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：社区活动你更愿意参加哪类？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个社区活动类型：社区活动你更愿意参加哪类？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="volunteer-service">
                            <div class="card-image">
                                <img src="images/volunteer-service.svg" alt="志愿服务活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">志愿服务</h3>
                                <p class="option-desc">参与社区志愿服务，帮助邻里、参与公益</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="short-trip">
                            <div class="card-image">
                                <img src="images/short-trip.svg" alt="短途旅行巴士" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短途旅行</h3>
                                <p class="option-desc">社区组织短途一日游或周边游，轻松出行</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="learning-classes">
                            <div class="card-image">
                                <img src="images/learning-classes.svg" alt="书法课堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兴趣学习班</h3>
                                <p class="option-desc">书法、绘画或手工班，学习新技能结交朋友</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="cultural-entertainment">
                            <div class="card-image">
                                <img src="images/cultural-entertainment.svg" alt="广场舞或戏曲" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">文娱聚会</h3>
                                <p class="option-desc">唱歌、戏曲观赏或广场舞等文娱聚会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
