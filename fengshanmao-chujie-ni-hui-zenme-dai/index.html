<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">风扇帽出街，你会怎么戴？背影更惊艳还是随性慵懒？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">风扇帽出街，你会怎么戴？选一个符合你日常的戴法</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="e-qian-zhengdai">
                            <div class="card-image">
                                <img src="images/e-qian-zhengdai.svg" alt="额前正戴风扇帽" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">额前正戴</h3>
                                <p class="option-desc">露出额头+清爽妆感，适合通勤和清新街拍的日常风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fan-dai-yonglan">
                            <div class="card-image">
                                <img src="images/fan-dai-yonglan.svg" alt="反戴风扇帽慵懒风" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">反戴慵懒</h3>
                                <p class="option-desc">帽檐向后慵懒随性，走街头悠闲路线，背影更有feel</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ce-xie-shaonu-gan">
                            <div class="card-image">
                                <img src="images/ce-xie-shaonu-gan.svg" alt="斜侧风扇帽少女感" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">侧斜少女感</h3>
                                <p class="option-desc">斜戴带弧度，配刘海或低马尾，背影和侧颜都带感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
