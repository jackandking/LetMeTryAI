    <title>春夏防晒习惯小调查</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春夏防晒你更看重哪一点</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春夏季节，你选择防晒产品时更看重什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="high-protection">
                            <div class="card-image">
                                <img src="images/high-protection.svg" alt="高倍防护" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">高倍防护</h3>
                                <p class="option-caption">防晒指数高，出门更安心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lightweight-texture">
                            <div class="card-image">
                                <img src="images/lightweight-texture.jpg" alt="清爽肤感" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清爽肤感</h3>
                                <p class="option-caption">不油腻、不闷痘，油皮大爱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="skincare-ingredients">
                            <div class="card-image">
                                <img src="images/skincare-ingredients.jpg" alt="养肤成分" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">养肤成分</h3>
                                <p class="option-caption">一边防晒一边修护肌肤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="good-value">
                            <div class="card-image">
                                <img src="images/good-value.jpg" alt="性价比高" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">性价比高</h3>
                                <p class="option-caption">平价大碗，全身涂不心疼</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
