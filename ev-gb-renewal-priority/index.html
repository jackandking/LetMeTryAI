            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">电动车国标换新，买车你先看哪一点？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="safety-brakes">
                            <div class="card-image">
                                <img src="images/safety-brakes.svg" alt="电动车刹车与车身稳定示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安全与制动</h3>
                                <p class="option-desc">更看重刹车、车身稳定和国标安全项，上路更安心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="battery-range">
                            <div class="card-image">
                                <img src="images/battery-range.svg" alt="电动车电池与续航里程示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">续航与电池</h3>
                                <p class="option-desc">续航里程和电池耐用更重要，长途出行不给力就麻烦</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="charging-convenience">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">充电与换电便捷</h3>
                                <p class="option-desc">快充、换电站和家充兼容，充电省时才更省心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="after-sales-warranty">
                            <div class="card-image">
                                <img src="images/after-sales-warranty.svg" alt="客服与维修网点服务示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">售后保修与服务</h3>
                                <p class="option-desc">保修条款、换电政策和网点覆盖决定后续使用体验</p>

                            <div class="check-indicator">✓</div>
