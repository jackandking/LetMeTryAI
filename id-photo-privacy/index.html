    <title>身份证照片隐私保护投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">身份证照片如何保护隐私</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你认为在分享或保存身份证照片时，哪种做法最能兼顾隐私与实用性？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mask-sensitive-info">
                            <div class="card-image">
                                <img src="images/mask-sensitive-info.svg" alt="遮挡身份证敏感信息示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">遮挡敏感信息（黑条/涂抹）</h3>
                                <p class="option-desc">用黑条或涂抹遮住身份证号等敏感信息后再分享或保存。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="blur-photo">
                            <div class="card-image">
                                <img src="images/blur-photo.svg" alt="模糊身份证照片示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">模糊或马赛克处理整张照片</h3>
                                <p class="option-desc">对整张身份证照片进行模糊或马赛克处理，保留轮廓但隐藏细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="partial-or-distance">
                            <div class="card-image">
                                <img src="images/partial-or-distance.svg" alt="部分拍摄身份证示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">部分拍摄或远距拍摄</h3>
                                <p class="option-desc">只拍姓名等必要信息或远景合影，避免清晰展示证件号与照片细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watermark-or-encrypt">
                            <div class="card-image">
                                <img src="images/watermark-or-encrypt.svg" alt="数字水印与加密示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">添加水印/使用加密与受限查看</h3>
                                <p class="option-desc">在照片上加入个人水印或通过加密、权限控制的平台分享，限制下载与二次传播。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
