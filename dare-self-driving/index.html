<head>

    <title>无人驾驶出行，你会怎么选？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">碰到无人驾驶出租车，你敢上车吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">碰到无人驾驶出租车，你会怎么做？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="ride-now">
                            <div class="card-image">
                                <img src="images/ride-now.svg" alt="乘客打开车门准备上车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">马上上车</h3>
                                <p class="option-desc">好奇心驱动，想马上体验一次</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="watch-first">
                            <div class="card-image">
                                <img src="images/watch-first.svg" alt="路边观察自动驾驶车辆行驶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先观察</h3>
                                <p class="option-desc">先看路况与车流再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="call-human">
                            <div class="card-image">
                                <img src="images/call-human.svg" alt="有人在等待有人开车来接" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">叫人来开</h3>
                                <p class="option-desc">还是找人代驾更放心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="never-ride">
                            <div class="card-image">
                                <img src="images/never-ride.svg" alt="拒绝上无人驾驶车辆的乘客" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会尝试</h3>
                                <p class="option-desc">暂时不信任，宁可不坐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
