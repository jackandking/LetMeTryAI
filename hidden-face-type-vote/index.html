                    <div class="options-grid" id="optionsContainer">

                            <div class="card-content">

                        </label>

                            <input type="radio" name="equipment" value="sweet-salty-style">

                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soft-natural-look">
