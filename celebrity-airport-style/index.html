    <h1 id="pageTitle">明星机场穿搭，你更爱哪种风格？</h1>

        <div class="question" id="questionArea">
            <p id="questionText">你更愿意把这一票投给谁的机场穿搭？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="womanai" value="minimal-chic">

                    <span>简洁剪裁+高级配色，低调显气质</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="mix-and-match">
                    <img src="images/mix-and-match.svg" alt="混搭时髦机场穿搭" loading="lazy">
                    <span>不同单品叠穿，个性又有看点</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="retro-goddess">
                    <img src="images/retro-goddess.svg" alt="复古女神机场穿搭" loading="lazy">
                    <span>复古元素+精致配饰，氛围感十足</span>
                </label>
            </div>
        </div>
    </form>
