<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">张雪赛后造型投票：你更喜欢哪套造型？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在赛后发布会中，哪套张雪的造型更吸引你？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="qingxin-yundong">
                            <div class="card-image">
                                <img src="images/qingxin-yundong.svg" alt="张雪清新运动风赛后造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清新运动风</h3>
                                <p class="option-caption">轻薄底妆与清爽马尾，显得活力利落</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="youya-hongtan">
                            <div class="card-image">
                                <img src="images/youya-hongtan.svg" alt="张雪优雅红毯风造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">优雅红毯风</h3>
                                <p class="option-caption">柔和烟熏眼妆配顺滑长发，典雅有气场</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ziran-changfa">
                            <div class="card-image">
                                <img src="images/ziran-changfa.svg" alt="张雪自然长发浪漫风造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然长发浪漫风</h3>
                                <p class="option-caption">自然大卷与暖色腮红，营造温柔日常感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ganlian-duanfafu">
                            <div class="card-image">
                                <img src="images/ganlian-duanfafu.svg" alt="张雪干练短发利落风造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">干练短发利落风</h3>
                                <p class="option-caption">中性短发搭配浅色唇妆，干练又有型</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>

        <footer class="page-footer">
