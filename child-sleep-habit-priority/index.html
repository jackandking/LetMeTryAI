    <title>孩子睡眠习惯，你更看重哪一点</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子睡眠习惯你更看重什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">孩子睡眠习惯你更看重什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-schedule">
                            <div class="card-image">
                                <img src="images/regular-schedule.svg" alt="规律作息" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">规律生物钟</h3>
                                <p class="option-desc">到点就睡、到点就醒，雷打不动的作息节奏</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="enough-duration">
                            <div class="card-image">
                                <img src="images/enough-duration.svg" alt="充足睡眠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡够时长</h3>
                                <p class="option-desc">不管几点睡，先把小时数睡够再说</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="deep-sleep">
                            <div class="card-image">
                                <img src="images/deep-sleep.svg" alt="深度睡眠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安稳不醒</h3>
                                <p class="option-desc">一觉到天亮，夜醒越少越好</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="self-soothe">
                            <div class="card-image">
                                <img src="images/self-soothe.svg" alt="自主入睡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自己入睡</h3>
                                <p class="option-desc">不用哄、不用陪，关灯就能自己睡着</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
