    <title>外婆的味道，一想就馋</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种“外婆味道”让你一想就馋？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪种“外婆味道”让你一想就馋？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hong-shao-rou">
                            <div class="card-image">
                                <img src="images/hong-shao-rou.svg" alt="红烧肉插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红烧肉</h3>
                                <p class="option-desc">肥瘦相间的红烧肉，一块就能配半碗饭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hand-made-dumplings">
                            <div class="card-image">
                                <img src="images/hand-made-dumplings.svg" alt="手工饺子插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手工饺子</h3>
                                <p class="option-desc">擀皮包馅的饺子，咬一口满是家的味道</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="pickled-vegetables">
                            <div class="card-image">
                                <img src="images/pickled-vegetables.svg" alt="腌菜插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">腌菜下饭</h3>
                                <p class="option-desc">玻璃罐里的腌菜，清粥白饭也吃得香</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="steamed-egg">
                            <div class="card-image">
                                <img src="images/steamed-egg.svg" alt="蒸蛋插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">嫩嫩蒸蛋</h3>
                                <p class="option-desc">滑溜溜的蒸蛋，拌饭能吃一大碗</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
