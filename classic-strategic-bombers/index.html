            <h1 id="pageTitle">硬核对比：经典战略轰炸机你投谁？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款经典战略轰炸机？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="b-2-spirit">
                            <div class="card-image">
                                <img src="images/b-2-spirit.svg" alt="B-2幽灵战略轰炸机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">B-2 幽灵</h3>
                                <p class="option-desc">隐身飞翼布局，科幻感拉满的空中幽灵</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="tu-160-black-swan">
                            <div class="card-image">
                                <img src="images/tu-160-black-swan.svg" alt="图-160白天鹅战略轰炸机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">图-160 白天鹅</h3>
                                <p class="option-desc">超音速变后掠翼，优雅与暴力并存</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="b-1b-lancer">
                            <div class="card-image">
                                <img src="images/b-1b-lancer.svg" alt="B-1B枪骑兵战略轰炸机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">B-1B 枪骑兵</h3>
                                <p class="option-desc">低空高速突防，载弹量惊人的可变翼战士</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="b-52-stratofortress">
                            <div class="card-image">
                                <img src="images/b-52-stratofortress.svg" alt="B-52同温层堡垒战略轰炸机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">B-52 同温层堡垒</h3>
                                <p class="option-desc">服役超过半个世纪，经典耐用的轰炸传奇</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
