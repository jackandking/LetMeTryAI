<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪场戏让《一九四二》口碑翻红了？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪场戏更戳中你？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="exodus-long-take">
                            <div class="card-image">
                                <img src="images/exodus-long-take.svg" alt="一九四二逃荒长镜头画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">逃荒长镜头</h3>
                                <p class="option-desc">黑压压的逃荒队伍一眼望不到头，老东家牵着毛驴走在人群里，那个镜头把乱世里普通人的无力感全拍出来了。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="huazhi-trades-herself">
                            <div class="card-image">
                                <img src="images/huazhi-trades-herself.svg" alt="一九四二花枝卖身换粮场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花枝换粮</h3>
                                <p class="option-desc">徐帆演的花枝为了一袋小米把自己卖了，临走前跟栓柱说'我跟你睡过，不亏'，这场戏看一次哭一次。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ending-foster-girl">
                            <div class="card-image">
                                <img src="images/ending-foster-girl.svg" alt="一九四二结尾老东家与孤女画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">结尾遇孤女</h3>
                                <p class="option-desc">老东家走到尽头，碰到同样没了家人的小女孩，两人相依为命往南走，那个回望让观众忽然懂了什么叫'活着'。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chiang-report-scene">
                            <div class="card-image">
                                <img src="images/chiang-report-scene.svg" alt="一九四二重庆看灾情报告场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重庆看报告</h3>
                                <p class="option-desc">蒋介石在办公室里看到河南灾情的报告，镜头没给一句台词，却把一个时代的决策与人性冲突全压在那几张纸上了。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
