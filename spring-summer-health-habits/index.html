    <title>春夏换季您如何养生</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春夏换季养生习惯</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春夏交替时节，您会特别注意以下哪个养生细节？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="early-sleep-early-rise">
                            <div class="card-image">
                                <img src="images/early-sleep.svg" alt="早睡早起养生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">早睡早起</h3>
                                <p class="option-desc">调整作息，早睡早起养精神</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-diet">
                            <div class="card-image">
                                <img src="images/light-diet.svg" alt="清淡饮食养生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清淡饮食</h3>
                                <p class="option-desc">多吃蔬菜瓜果，饮食清淡少油腻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="moderate-exercise">
                            <div class="card-image">
                                <img src="images/moderate-exercise.svg" alt="适度运动养生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">适度运动</h3>
                                <p class="option-desc">晨起散步或打太极，活动筋骨</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="happy-mood">
                            <div class="card-image">
                                <img src="images/happy-mood.svg" alt="心情愉悦养生" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">心情愉悦</h3>
                                <p class="option-desc">保持平和心态，遇事不急躁</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
