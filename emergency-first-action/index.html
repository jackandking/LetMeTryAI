    <title>遇到突发事故你会先做哪一步？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到突发事故你会先做哪一步？在家或路上遇到紧急情况</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到突发事故你会先做哪一步？（选出你的首要反应）</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="call-emergency">
                            <div class="card-image">
                                <img src="images/call-emergency.svg" alt="拨打急救电话的场景插图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">拨打急救电话</h3>
                                <p class="option-desc">立刻拨打急救电话请求专业救援</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="call-for-help">
                            <div class="card-image">
                                <img src="images/call-for-help.svg" alt="呼喊并召集周围人帮忙" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">呼喊并召集周围人帮忙</h3>
                                <p class="option-desc">大声呼救并请附近人协助联络或维持现场</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="contact-family">
                            <div class="card-image">
                                <img src="images/contact-family.svg" alt="联系家人或亲属的情景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">联系家人或亲属</h3>
                                <p class="option-desc">马上通知子女或亲属赶来或远程提供信息与支持</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="record-and-wait">
                            <div class="card-image">
                                <img src="images/record-and-wait.svg" alt="记录位置并等待救援" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">记录位置并等待救援</h3>
                                <p class="option-desc">拍照或记录位置与时间，保持原地便于救援抵达</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
