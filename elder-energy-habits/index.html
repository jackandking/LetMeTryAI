    <title>长辈日常精力小习惯：你家长辈更常做哪项？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">长辈日常精力小习惯投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">您觉得哪些日常小习惯更有助于长辈保持日常精力？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="morning-stretch">
                            <div class="card-image">
                                <img src="images/morning-stretch.svg" alt="长辈在家做晨间伸展动作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">晨间轻伸展</h3>
                                <p class="option-caption">每天早上做简单伸展与关节活动，唤醒身体。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-walk">
                            <div class="card-image">
                                <img src="images/light-walk.svg" alt="长辈在小区慢走" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短程轻松散步</h3>
                                <p class="option-caption">饭后或早晨外出短走，呼吸新鲜空气、活动筋骨。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="small-meals">
                            <div class="card-image">
                                <img src="images/small-meals.svg" alt="健康小点心与茶杯摆放" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">少量规律加餐</h3>
                                <p class="option-caption">少量多餐、补充易消化的营养小食，维持能量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="short-rest">
                            <div class="card-image">
                                <img src="images/short-rest.svg" alt="长辈在椅子上短时小憩" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短时小憩恢复</h3>
                                <p class="option-caption">午后或疲劳时短时间休息或闭目养神，恢复精神。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
