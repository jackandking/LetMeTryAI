    <title>朋友圈更新后你如何分享孩子照片？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">朋友圈更新后你如何分享孩子照片？家长分享策略</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">朋友圈更新后你如何分享孩子照片？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="private-family-group">
                            <div class="card-image">
                                <img src="images/private-family-group.svg" alt="家庭群里分享的孩子合影缩略" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只在家庭/亲友群分享</h3>
                                <p class="option-desc">仅发给家人和密友群，避免公开展示孩子信息。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="public-story-post">
                            <div class="card-image">
                                <img src="images/public-story-post.svg" alt="孩子笑脸配文字记录" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">在朋友圈公开配成长记录</h3>
                                <p class="option-desc">在朋友圈发原图并写成长故事，重视互动与记录。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="privacy-first-cropped">
                            <div class="card-image">
                                <img src="images/privacy-first-cropped.svg" alt="孩子背影或局部特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">发但裁剪/只露背影或打码</h3>
                                <p class="option-desc">裁剪、局部或打码，保留画面感同时保护隐私。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="creative-alternative">
                            <div class="card-image">
                                <img src="images/creative-alternative.svg" alt="孩子的绘画作品或代替图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用作品或创意图代替真实照片</h3>
                                <p class="option-desc">发布绘画、作品照或合成图，既分享日常又更安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

        </footer>
