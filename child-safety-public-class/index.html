    <title>孩子的安全公开课 — 哪些技能更实用</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">孩子的安全公开课：哪些技能更实用？揭秘家长常忽略的能力</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在孩子的安全公开课中，你认为哪类技能对孩子更实用？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="traffic-safety">
                            <div class="card-image">
                                <img src="images/traffic-safety.svg" alt="儿童交通安全" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">道路与交通自护</h3>
                                <p class="option-desc">教会孩子安全过马路、识别信号与候车时的自护要点，日常出行可直接使用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stranger-safety">
                            <div class="card-image">
                                <img src="images/stranger-safety.svg" alt="防拐与求助技巧" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陌生人防范与求助</h3>
                                <p class="option-desc">识别可疑接触、设立家庭密码词并练习向可信成人求助的具体步骤。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fire-escape">
                            <div class="card-image">
                                <img src="images/fire-escape.svg" alt="火灾逃生演练" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">居家火灾与紧急撤离</h3>
                                <p class="option-desc">熟悉家中逃生路线、避烟与集合点演练，提升全家应急反应能力。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="digital-privacy">
                            <div class="card-image">
                                <img src="images/digital-privacy.svg" alt="儿童数字隐私保护" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">数字安全与隐私保护</h3>
                                <p class="option-desc">管理账号隐私、识别网络诱导与设置安全边界，保护孩子线上安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
    </div>
