<head>

    <title>家里的剩菜剩饭怎么处理</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里的剩菜剩饭，你都会怎么处理？留着吃、改造还是扔掉？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里的剩菜剩饭，你都会怎么处理？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="keep-in-fridge">
                            <div class="card-image">
                                <img src="images/keep-in-fridge.svg" alt="保鲜盒里的剩菜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">放冰箱留着再吃</h3>
                                <p class="option-desc">分装保鲜盒，隔天热一下继续吃，省时省钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="eat-same-day">
                            <div class="card-image">
                                <img src="images/eat-same-day.svg" alt="餐桌上吃完的盘子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">当晚吃完不留</h3>
                                <p class="option-desc">当天吃完不留隔夜，吃得放心也减少浪费</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="repurpose-into-new-dish">
                            <div class="card-image">
                                <img src="images/repurpose-into-new-dish.svg" alt="把剩菜改造成新菜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">改造成新菜</h3>
                                <p class="option-desc">炒饭、煲汤或拌一拌，旧味道变新花样，更合老人胃口</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="freeze-for-later">
                            <div class="card-image">
                                <img src="images/freeze-for-later.svg" alt="冷冻袋装的剩菜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分装冷冻保存</h3>
                                <p class="option-desc">分小份冷冻保存，想吃再解冻，减少来回做饭麻烦</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
