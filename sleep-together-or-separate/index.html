    <title>你和另一半是同床睡还是分床睡？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你和另一半是同床睡还是分床睡？你的睡眠画面是哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你和另一半是同床睡还是分床睡？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="same-bed">
                            <div class="card-image">
                                <img src="images/same-bed.svg" alt="两人并排躺在床上靠在一起睡觉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">同床睡 — 喜欢靠着入睡</h3>
                                <p class="option-desc">习惯两人并排睡，睡前会靠着或拥抱，注重亲密感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="separate-beds">
                            <div class="card-image">
                                <img src="images/separate-beds.svg" alt="两张床或两侧各自睡觉的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分床睡 — 各自有独立空间</h3>
                                <p class="option-desc">为避免互相打扰或追求更好睡眠，各自占床睡得更舒服。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="flexible-schedule">
                            <div class="card-image">
                                <img src="images/flexible-schedule.svg" alt="夜晚一方在床上另一方偶尔过来同睡的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">灵活分配 — 看情况轮换</h3>
                                <p class="option-desc">平时分床，遇到加班、生病或想亲近时才同床，按场景调整。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
