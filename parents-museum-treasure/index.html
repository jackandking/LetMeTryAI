    <title>带孩子去博物馆，你先看哪件镇馆之宝？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子去博物馆，你先看哪件镇馆之宝？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子去博物馆时，你们会先看哪件镇馆之宝来开启参观？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dinosaur-fossil">
                            <div class="card-image">
                                <img src="images/dinosaur-fossil.svg" alt="孩子与恐龙化石合影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">恐龙化石</h3>
                                <p class="option-desc">巨大骨架很有画面感，孩子会迫不及待问为什么</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="ancient-jade">
                            <div class="card-image">
                                <img src="images/ancient-jade.svg" alt="古玉器特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">古代玉器</h3>
                                <p class="option-desc">精致神秘，适合讲古人的生活与匠人故事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="famous-painting">
                            <div class="card-image">
                                <img src="images/famous-painting.svg" alt="名画细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">名画真迹</h3>
                                <p class="option-desc">色彩与构图能激发想象，适合引导孩子描述画面</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bronze-ritual-vessel">
                            <div class="card-image">
                                <img src="images/bronze-ritual-vessel.svg" alt="青铜器展品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜器礼器</h3>
                                <p class="option-desc">沉甸甸的历史感，适合讲王朝与考古发现的故事</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
