    <title>家务分工谁说了算？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家务分工谁说了算？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：家务分工谁说了算？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="assign-by-age">
                            <div class="card-image">
                                <img src="images/assign-by-age.svg" alt="按年龄分配家务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">按年龄分配</h3>
                                <p class="option-desc">按孩子年龄和能力安排不同任务</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="rotation-system">
                            <div class="card-image">
                                <img src="images/rotation-system.svg" alt="轮流分配家务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轮流制</h3>
                                <p class="option-desc">每周轮换，让责任更公平</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="by-interest-and-skill">
                            <div class="card-image">
                                <img src="images/by-interest-and-skill.svg" alt="按兴趣能力分配家务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">按兴趣与能力分配</h3>
                                <p class="option-desc">根据孩子兴趣和能力选择合适家务</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="parents-big-kids-small">
                            <div class="card-image">
                                <img src="images/parents-big-kids-small.svg" alt="家长做大件孩子做小件" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家长负责大件，孩子做小件</h3>
                                <p class="option-desc">家长承担繁重任务，孩子做小而固定的小件</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
