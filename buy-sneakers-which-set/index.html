    <title>买运动鞋，你更吃哪一套？时尚、实用、颜值还是跑步性能？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">买运动鞋，你更吃哪一套？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">买运动鞋，你更吃哪一套？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="brand-trend">
                            <div class="card-image">
                                <img src="images/brand-trend.svg" alt="品牌潮款运动鞋上脚" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">追品牌潮款</h3>
                                <p class="option-desc">看重新款logo和话题，上脚回头率高，适合出街拍照。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="value-for-money">
                            <div class="card-image">
                                <img src="images/value-for-money.svg" alt="实惠耐穿运动鞋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">拼性价比</h3>
                                <p class="option-desc">注重耐穿耐洗、预算友好，穿着省心实用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sport-performance">
                            <div class="card-image">
                                <img src="images/sport-performance.svg" alt="跑步运动鞋功能展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">注重跑步性能</h3>
                                <p class="option-desc">买来认真跑步，优先减震和支撑，跑感为先。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="looks-style">
                            <div class="card-image">
                                <img src="images/looks-style.svg" alt="时尚百搭运动鞋" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">颜值百搭</h3>
                                <p class="option-desc">外形漂亮、好搭配，日常出街或约会都适合穿。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
