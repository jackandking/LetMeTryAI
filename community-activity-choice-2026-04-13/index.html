    <title>社区活动，你更愿意参加哪个？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">社区活动，你更愿意参加哪个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个社区活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighborhood-volunteer">
                            <div class="card-image">
                                <img src="images/neighborhood-volunteer.svg" alt="邻里志愿服务场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里志愿服务</h3>
                                <p class="option-desc">参与社区志愿、助老服务</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="community-interest-classes">
                            <div class="card-image">
                                <img src="images/community-interest-classes.svg" alt="社区兴趣班课堂" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">社区兴趣班</h3>
                                <p class="option-desc">参加书法、手工或合唱小班</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="square-dance-or-taiji">
                            <div class="card-image">
                                <img src="images/square-dance-or-taiji.svg" alt="广场舞或太极活动" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞或太极</h3>
                                <p class="option-desc">老友们一起锻炼与社交</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="neighborhood-walking-group">
                            <div class="card-image">
                                <img src="images/neighborhood-walking-group.svg" alt="邻里散步聚会" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">邻里散步小组</h3>
                                <p class="option-desc">约上邻居晨昏散步聊家常</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
