    <title>人形机器人参与马拉松应如何安排？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">人形机器人参与马拉松应如何安排？——赛制与角色投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你支持哪种人形机器人参与马拉松的安排方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="mixed-competition">
                            <div class="card-image">
                                <img src="images/mixed-competition.svg" alt="机器人与人类并排跑步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">混合竞赛</h3>
                                <p class="option-caption">机器人与人类同场按相同路线计时，直接比较速度与耐力（需明确规则）。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="separate-robot-category">
                            <div class="card-image">
                                <img src="images/separate-robot-category.svg" alt="机器人单独比赛组别" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">独立组别</h3>
                                <p class="option-caption">为机器人设立单独组别或分组，分别排名与颁奖，便于公平比较和统计数据。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="support-role-assist">
                            <div class="card-image">
                                <img src="images/support-role-assist.svg" alt="机器人作为陪跑或补给" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">辅助角色</h3>
                                <p class="option-caption">机器人担任陪跑、补给或导航辅助，不与人类直接竞争，提升赛事体验与安全。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="demo-and-testing">
                            <div class="card-image">
                                <img src="images/demo-and-testing.svg" alt="机器人展示与性能测试" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">展示与测试</h3>
                                <p class="option-caption">在赛事外围做展示和耐久测试，收集数据与优化技术，非正式竞赛环节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
