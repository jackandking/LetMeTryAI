    <h1 id="pageTitle">家长爱话题：孩子每天课外练习多久合适？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长爱用户视角，你会怎么选：孩子每天课外练习多久更合适？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">

                    <img src="images/15-min.svg" alt="15分钟练习图示" loading="lazy">
                    <span>短时多次，适合碎片时间巩固</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="30-min">
                    <img src="images/30-min.svg" alt="30分钟练习图示" loading="lazy">
                    <span>平衡效率与休息，家长常选项</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="45-min">
                    <img src="images/45-min.svg" alt="45分钟练习图示" loading="lazy">
                    <span>适合需要集中练习的阶段</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="60-min">
                    <img src="images/60-min.svg" alt="60分钟练习图示" loading="lazy">
                    <span>适合较大任务或学习期冲刺</span>
                </label>
            </div>
