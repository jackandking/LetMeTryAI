<head>
    <meta charset="UTF-8">
    <meta name="fighter" content="width=device-width, initial-scale=1.0">

        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?4ec6d2ddfd5746ce248a74a75c1d4fba";
            var s = document.getElementsByTagName("script")[0];

    <title>买手机续航说明你更信哪个？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">买手机时你更信哪种续航说明？厂商标称 vs 实测 vs 用户体验</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">买手机时你更信哪种续航说明？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="manufacturer-claim">
                            <div class="card-image">
                                <img src="images/manufacturer-claim.svg" alt="厂商标称电池容量" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厂商标称容量与续航</h3>
                                <p class="option-caption">按厂商给出的电池容量与官方续航数据来判断</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="third-party-test">
                            <div class="card-image">
                                <img src="images/third-party-test.svg" alt="第三方续航实测" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">第三方媒体或测评实测</h3>
                                <p class="option-caption">依靠权威媒体或测评机构的实测数据与跑分结果</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="real-world-user-experience">
                            <div class="card-image">
                                <img src="images/real-world-user-experience.svg" alt="用户真实续航体验" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">真实用户日常场景体验</h3>
                                <p class="option-caption">参考普通用户在日常使用下的续航与快充反馈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    </script>
</body>
</html>
