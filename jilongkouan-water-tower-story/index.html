    <title>带孩子看吉隆口岸水塔，你会怎么讲它的故事？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带孩子看吉隆口岸水塔，你会怎么讲它的故事？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带孩子看吉隆口岸水塔，你会怎么讲它的故事？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="explain-engineering">
                            <div class="card-image">
                                <img src="images/explain-engineering.svg" alt="讲解水塔结构和用途的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲它的“工作原理”</h3>
                                <p class="option-desc">把水塔当成大机器，讲结构、用途和工程小知识，带孩子学科普。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tell-local-people-story">
                            <div class="card-image">
                                <img src="images/tell-local-people-story.svg" alt="口岸居民和老照片风格插图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲口岸与人的故事</h3>
                                <p class="option-desc">讲附近口岸和守护者、渡口人的生活故事，让孩子感受地方人情与历史。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="imaginative-adventure-tale">
                            <div class="card-image">
                                <img src="images/imaginative-adventure-tale.svg" alt="孩子与水塔冒险的卡通场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">编个小冒险故事</h3>
                                <p class="option-desc">把水塔当成奇幻场景：守塔精灵、时间信箱，让孩子参与想象与角色扮演。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="observe-draw-activity">
                            <div class="card-image">
                                <img src="images/observe-draw-activity.svg" alt="孩子观察并画水塔的亲子活动照片风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">做观察游戏+绘画</h3>
                                <p class="option-desc">带孩子做观察打卡：找颜色、数步伐、画一张现场速写，结合开放式提问引导表达。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
