<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国潮妆里你会pick哪种美人感？背影惊艳还是温婉古韵？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">国潮妆里你会pick哪种美人感？选出你心动的那款。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="wenwan-gufeng">
                            <div class="card-image">
                                <img src="images/wenwan-gufeng.svg" alt="温婉古风妆容：花钿、柔和胭脂与细长眉型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温婉古风</h3>
                                <p class="option-desc">花钿与柔眉，含蓄温柔的古典美人感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chaoku-street">
                            <div class="card-image">
                                <img src="images/chaoku-street.svg" alt="潮酷街头国潮妆：重眼线、亮色眼影与金属配饰" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">潮酷街头</h3>
                                <p class="option-desc">重眼线与金属配饰，带着大胆态度的国潮范儿</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="huaniao-style">
                            <div class="card-image">
                                <img src="images/huaniao-style.svg" alt="花鸟国色妆容：花朵贴饰与泼墨感眼影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">花鸟国色</h3>
                                <p class="option-desc">花鸟元素与水彩眼影，像画卷般的东方美感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nishang-qingsha">
                            <div class="card-image">
                                <img src="images/nishang-qingsha.svg" alt="霓裳轻纱妆：珠光高光与透光肌理，带梦幻质感" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">霓裳轻纱</h3>
                                <p class="option-desc">珠光高光与轻纱感妆面，若隐若现的梦幻气质</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
