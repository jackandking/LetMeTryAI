    <div class="container">

        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">50万预算，开哪种车去约会更撩？宝马的稳成熟感还是蔚来的未来感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bmw-steady-mature">
                            <div class="card-image">
                                <img src="images/bmw-steady-mature.svg" alt="宝马车侧面低调优雅" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">宝马：稳成熟感</h3>
                                <p class="option-desc">绅士路线，低调有质感，适合优雅晚餐与见家人场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="nio-future-tech">
                            <div class="card-image">
                                <img src="images/nio-future-tech.svg" alt="蔚来车夜晚灯光未来感" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">蔚来：未来科技感</h3>
                                <p class="option-desc">科技氛围强，智能互动和灯光效果更有惊喜感，适合潮玩式约会</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">跑车风：瞬间视觉冲击</h3>
                                <p class="option-desc">造型与动力带来强烈视觉效果，短程惊艳登场更能吸睛</p>

                            <div class="check-indicator">✓</div>
