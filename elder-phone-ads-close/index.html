    <title>老人手机老弹广告，哪种关法更省心？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老人手机老弹广告，你会怎么帮TA关？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">老人手机老弹广告，你会怎么帮TA关？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="close-notifications">
                            <div class="card-image">
                                <img src="images/close-notifications.svg" alt="关闭通知示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">关通知／开免打扰</h3>
                                <p class="option-desc">在系统设置里关闭APP通知或开启免打扰，让广告不再打扰日常。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="uninstall-ad-apps">
                            <div class="card-image">
                                <img src="images/uninstall-ad-apps.svg" alt="卸载应用图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">卸载常弹广告的APP</h3>
                                <p class="option-desc">找到频繁弹广告的应用，直接卸载或停用，解决广告来源。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="install-ad-blocker">
                            <div class="card-image">
                                <img src="images/install-ad-blocker.svg" alt="广告拦截图标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">装拦截/清理软件并清缓存</h3>
                                <p class="option-desc">安装口碑安全清理或拦截类工具，定期清理缓存与弹窗广告。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="teach-close-x">
                            <div class="card-image">
                                <img src="images/teach-close-x.svg" alt="点击关闭按钮示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">教老人识别并点×或返回</h3>
                                <p class="option-desc">教TA按返回或点右上×，别随意点广告链接，减少二次弹窗陷阱。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
