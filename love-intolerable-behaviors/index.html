<body>
    <h1 id="pageTitle">恋爱中最不能忍的行为</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">恋爱中哪种行为最让你无法忍受？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="womanai" value="lying-or-hiding">
                    <img src="images/lying-or-hiding.svg" alt="说谎隐瞒" loading="lazy">
                    <span>对方经常说谎或隐瞒重要事情</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="cheating-or-betrayal">
                    <img src="images/cheating-or-betrayal.svg" alt="背叛劈腿" loading="lazy">
                    <span>出轨或背着你做出亲密行为</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="silent-treatment-no-communication">
                    <img src="images/silent-treatment-no-communication.svg" alt="不沟通冷暴力" loading="lazy">
                    <span>用冷处理回避问题、不愿沟通</span>
                </label>

                <label class="option">
                    <input type="radio" name="womanai" value="controlling-or-restricting">
                    <img src="images/controlling-or-restricting.svg" alt="过度控制" loading="lazy">
                    <span>干涉社交、行程或私生活的控制行为</span>
                </label>
            </div>
        </div>
    </form>
