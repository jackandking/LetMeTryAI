    <title>女人爱热议：眼影配色公式</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：眼影配色公式</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：眼影配色公式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="earth-tone">
                            <div class="card-image">
                                <img src="images/option-earth-tone" alt="经典大地色眼影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">经典大地色</h3>
                                <p class="option-desc">消肿又百搭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="pink-purple">
                            <div class="card-image">
                                <img src="images/option-pink-purple" alt="温柔粉紫色眼影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温柔粉紫色</h3>
                                <p class="option-desc">约会首选氛围感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="orange-brown">
                            <div class="card-image">
                                <img src="images/option-orange-brown" alt="元气橘棕色眼影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">元气橘棕色</h3>
                                <p class="option-desc">春夏显活力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="cement-grey">
                            <div class="card-image">
                                <img src="images/option-cement-grey" alt="清冷水泥灰眼影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清冷水泥灰</h3>
                                <p class="option-desc">高级冷艳拽姐风</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
