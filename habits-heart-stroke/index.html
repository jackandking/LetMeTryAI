    <title>哪些日常习惯跟心梗脑梗有关？几个生活场景可别忽视</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪些日常习惯跟心梗脑梗有关？你平时注意到哪些</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">哪些日常习惯跟心梗脑梗有关？在下面场景中选出你最担心或家里人常有的那些（可多选）</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="jusu-shao-dong">
                            <div class="card-image">
                                <img src="images/jusu-shao-dong.svg" alt="老人久坐看电视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">久坐少动（整天坐着看电视或不爱活动）</h3>
                                <p class="option-desc">整日坐着、上下楼少，常感觉腿脚发沉或走不动。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="zhong-kouwei-yinshi">
                            <div class="card-image">
                                <img src="images/zhong-kouwei-yinshi.svg" alt="咸菜与油炸食物特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重口味饮食（咸、油、外卖多）</h3>
                                <p class="option-desc">饭菜偏咸或油炸外卖多，平时爱吃重口味。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="aoye-ya-li">
                            <div class="card-image">
                                <img src="images/aoye-ya-li.svg" alt="老人半夜看手机失眠" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">熬夜少眠与长期精神压力</h3>
                                <p class="option-desc">经常晚睡、睡眠浅或长期烦心事，白天精神不稳。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="xiyan-xujiu">
                            <div class="card-image">
                                <img src="images/xiyan-xujiu.svg" alt="烟酒放在桌上的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">吸烟或过量饮酒（社交或独自饮酒）</h3>
                                <p class="option-desc">长期抽烟或饮酒较多，有时在家里或聚会常见。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
