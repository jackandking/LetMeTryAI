    <title>出门旅行遇到延误，你更希望得到哪种帮忙？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">出门旅行遇到延误，你更希望得到哪种帮忙？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">出门旅行遇到延误，你更希望得到哪种帮忙？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="help-rebook-refund">
                            <div class="card-image">
                                <img src="images/help-rebook-refund.svg" alt="帮忙改签或退票" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">帮我改签或退票</h3>
                                <p class="option-desc">帮忙联系车/机票改签或退票，省去排队和电话奔波。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-and-essentials">
                            <div class="card-image">
                                <img src="images/food-and-essentials.svg" alt="送餐与日用品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">买饭送水和日用品</h3>
                                <p class="option-desc">有人送餐、买药或水，让人在候车室也能安心休息。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="arrange-rest-accommodation">
                            <div class="card-image">
                                <img src="images/arrange-rest-accommodation.svg" alt="安排临时休息或住宿" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">安排临时休息或住宿</h3>
                                <p class="option-desc">帮找最近的休息处或临时住处，优先考虑安全和舒适。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="contact-family-and-accompany">
                            <div class="card-image">
                                <img src="images/contact-family-and-accompany.svg" alt="联系家人并陪伴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">联系家人并有人陪伴</h3>
                                <p class="option-desc">帮忙通知家人并有人陪伴，聊聊天、安抚情绪更踏实。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
