    <title>旅行中培养孩子安全与卫生习惯：哪种方式更容易坚持？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">旅行中如何培养孩子的安全与卫生习惯？你更常用哪种做法</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">旅行中你通常怎么培养孩子的安全与卫生习惯？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="rule-practice">
                            <div class="card-image">
                                <img src="images/rule-practice.svg" alt="孩子在地图前演练路线" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">固定规则+演练</h3>
                                <p class="option-desc">出行前列清单并反复演练路线与洗手流程，让孩子按步骤操作形成习惯。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="game-story">
                            <div class="card-image">
                                <img src="images/game-story.svg" alt="父母和孩子通过游戏学习洗手" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">用游戏和故事教</h3>
                                <p class="option-desc">把安全与洗手设为小游戏或冒险故事，提升孩子兴趣与主动性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="modeling-together">
                            <div class="card-image">
                                <img src="images/modeling-together.svg" alt="家长与孩子一起洗手示范" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">以身作则+共同习惯</h3>
                                <p class="option-desc">父母示范并与孩子一起执行（观察危险、勤洗手），用榜样力量带动孩子。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="reminder-reward">
                            <div class="card-image">
                                <img src="images/reminder-reward.svg" alt="贴纸奖励表和孩子开心领取贴纸" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">临时提醒+适时奖励</h3>
                                <p class="option-desc">用提醒卡、贴纸或小奖励维持短期好习惯，适合短途或忙碌行程。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
