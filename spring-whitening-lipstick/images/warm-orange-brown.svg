<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Warm Orange Brown Gradient -->
    <linearGradient id="orangeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4784a"/>
      <stop offset="50%" stop-color="#e4885a"/>
      <stop offset="100%" stop-color="#c4683a"/>
    </linearGradient>
    <linearGradient id="orangeTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a87a"/>
      <stop offset="100%" stop-color="#d4784a"/>
    </linearGradient>
    <!-- Bronze casing -->
    <linearGradient id="bronzeCase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6239"/>
      <stop offset="30%" stop-color="#b8926a"/>
      <stop offset="50%" stop-color="#d4b08a"/>
      <stop offset="70%" stop-color="#b8926a"/>
      <stop offset="100%" stop-color="#8b6239"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#fff7f3"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="40" fill="#ffd4c4" opacity="0.5"/>
  <circle cx="80" cy="320" r="60" fill="#ffd4c4" opacity="0.3"/>
  
  <!-- Shadow under lipstick -->
  <ellipse cx="200" cy="330" rx="60" ry="15" fill="url(#shadow)"/>
  
  <!-- Lipstick casing (bottom) -->
  <rect x="160" y="220" width="80" height="100" rx="4" fill="url(#bronzeCase)"/>
  <rect x="165" y="220" width="70" height="100" rx="2" fill="none" stroke="#7b5229" stroke-width="1" opacity="0.3"/>
  
  <!-- Lipstick base ring -->
  <rect x="155" y="210" width="90" height="15" rx="3" fill="#9b7249"/>
  
  <!-- Lipstick bullet (main body) -->
  <path d="M170 210 L170 140 Q170 120 190 115 Q210 110 230 115 Q230 140 230 140 L230 210 Z" fill="url(#orangeBody)"/>
  
  <!-- Lipstick tip (slanted) -->
  <path d="M170 140 Q170 120 190 115 Q210 110 230 115 L225 135 Q210 130 190 135 Q175 140 170 140 Z" fill="url(#orangeTip)"/>
  
  <!-- Highlight on lipstick -->
  <ellipse cx="190" cy="160" rx="8" ry="25" fill="#fff" opacity="0.3"/>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#c4683a" font-weight="600">橘棕暖阳</text>
</svg>