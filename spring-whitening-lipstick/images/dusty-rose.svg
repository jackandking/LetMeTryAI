<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Dusty Rose Gradient -->
    <linearGradient id="roseBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4868c"/>
      <stop offset="50%" stop-color="#d4969c"/>
      <stop offset="100%" stop-color="#b8767c"/>
    </linearGradient>
    <linearGradient id="roseTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcb6bc"/>
      <stop offset="100%" stop-color="#c4868c"/>
    </linearGradient>
    <!-- Rose gold casing -->
    <linearGradient id="roseGoldCase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4a5a0"/>
      <stop offset="30%" stop-color="#e8c4c0"/>
      <stop offset="50%" stop-color="#f8e0dc"/>
      <stop offset="70%" stop-color="#e8c4c0"/>
      <stop offset="100%" stop-color="#c4a5a0"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#fdf5f6"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="40" fill="#f0d4d8" opacity="0.5"/>
  <circle cx="80" cy="320" r="60" fill="#f0d4d8" opacity="0.3"/>
  
  <!-- Shadow under lipstick -->
  <ellipse cx="200" cy="330" rx="60" ry="15" fill="url(#shadow)"/>
  
  <!-- Lipstick casing (bottom) -->
  <rect x="160" y="220" width="80" height="100" rx="4" fill="url(#roseGoldCase)"/>
  <rect x="165" y="220" width="70" height="100" rx="2" fill="none" stroke="#b89690" stroke-width="1" opacity="0.3"/>
  
  <!-- Lipstick base ring -->
  <rect x="155" y="210" width="90" height="15" rx="3" fill="#b89690"/>
  
  <!-- Lipstick bullet (main body) -->
  <path d="M170 210 L170 140 Q170 120 190 115 Q210 110 230 115 Q230 140 230 140 L230 210 Z" fill="url(#roseBody)"/>
  
  <!-- Lipstick tip (slanted) -->
  <path d="M170 140 Q170 120 190 115 Q210 110 230 115 L225 135 Q210 130 190 135 Q175 140 170 140 Z" fill="url(#roseTip)"/>
  
  <!-- Highlight on lipstick -->
  <ellipse cx="190" cy="160" rx="8" ry="25" fill="#fff" opacity="0.3"/>
  
  <!-- Label -->
  <text x="200" y="360" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#b8767c" font-weight="600">豆沙玫瑰</text>
</svg>