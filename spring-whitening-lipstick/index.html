    <title>女人爱热议：春季最显白口红</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：春季最显白口红</h1>
            <p class="subtitle">选出你心中的春季显白王者 💄</p>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">如果是女人爱用户，你会把这一票投给谁：春季最显白口红？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="coral-peach">
                            <div class="card-image">
                                <img src="images/coral-peach.svg" alt="珊瑚蜜桃口红试色" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">珊瑚蜜桃</h3>
                                <p class="option-desc">轻薄通透，提亮气色，日常百搭</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="dusty-rose">
                            <div class="card-image">
                                <img src="images/dusty-rose.svg" alt="豆沙玫瑰口红试色" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">豆沙玫瑰</h3>
                                <p class="option-desc">温柔奶油感，提升气质显白</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="berry-mocha">
                            <div class="card-image">
                                <img src="images/berry-mocha.svg" alt="莓果奶茶口红试色" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">莓果奶茶</h3>
                                <p class="option-desc">甜美有深度，适合偏冷皮显白</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="warm-orange-brown">
                            <div class="card-image">
                                <img src="images/warm-orange-brown.svg" alt="橘棕暖阳口红试色" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">橘棕暖阳</h3>
                                <p class="option-desc">暖色提亮，亲和度高又显气色</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看实时票选结果</span>
            </button>

        <footer class="page-footer">
