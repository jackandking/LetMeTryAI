    <title>红毯造型心动榜</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这届红毯谁的造型让你一眼心动</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这届红毯谁的造型让你一眼心动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="cool-queen-style">
                            <div class="card-image">
                                <img src="images/cool-queen-style.svg" alt="冷艳御姐风红毯造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">冷艳御姐风</h3>
                                <p class="option-desc">气场全开，冷艳御姐一出场就压住全场。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sweet-princess-style">
                            <div class="card-image">
                                <img src="images/sweet-princess-style.svg" alt="甜美公主风红毯造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甜美公主风</h3>
                                <p class="option-desc">梦幻甜美，公主风造型让人忍不住多看几眼。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="retro-hongkong-style">
                            <div class="card-image">
                                <img src="images/retro-hongkong-style.svg" alt="复古港风红毯造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">复古港风</h3>
                                <p class="option-desc">复古红唇大波浪，港风造型永远有味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fairy-style">
                            <div class="card-image">
                                <img src="images/fairy-style.svg" alt="仙气飘飘风红毯造型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">仙气飘飘风</h3>
                                <p class="option-desc">轻盈飘逸，仙气满满宛如从画里走出来。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
