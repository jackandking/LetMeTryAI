    <title>家长话题：表扬方式哪种更有效</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：表扬方式哪种更有效</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：表扬孩子时更常用哪种方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-specific-behavior">
                            <div class="card-image">
                                <img src="images/praise-specific-behavior.svg" alt="具体行为表扬示例图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">具体行为表扬（说出做得好的地方）</h3>
                                <p class="option-desc">例如“你把碗收好了，整理得很仔细”</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-effort-process">
                            <div class="card-image">
                                <img src="images/praise-effort-process.svg" alt="过程与努力表扬示例图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">过程与努力表扬（强调努力和方法）</h3>
                                <p class="option-desc">例如“你这次很努力，练习了很多次才做到”</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-character-trait">
                            <div class="card-image">
                                <img src="images/praise-character-trait.svg" alt="性格表扬示例图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">性格/天赋表扬（夸孩子“聪明”或“乖”）</h3>
                                <p class="option-desc">例如“你真聪明/真懂事”</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-physical-affection">
                            <div class="card-image">
                                <img src="images/praise-physical-affection.svg" alt="肢体鼓励示例图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">适度肢体鼓励（拥抱、击掌等）</h3>
                                <p class="option-desc">用拥抱或手势表达认可与鼓励</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
