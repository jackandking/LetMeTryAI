<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你怀念的读书奋斗画面是哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你怀念的读书奋斗画面是哪种？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="desk-lamp-scribble">
                            <div class="card-image">
                                <img src="images/desk-lamp-scribble.svg" alt="台灯下伏案写字" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">台灯下的奋笔疾书</h3>
                                <p class="option-desc">卧室台灯边，手握笔记本，一盏灯亮着刷题到深夜的画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="blackboard-recitation">
                            <div class="card-image">
                                <img src="images/blackboard-recitation.svg" alt="黑板前朗读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">黑板前被老师点名朗读</h3>
                                <p class="option-desc">站在黑板前紧张背诵，老师在一旁注视的那一刻。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="corridor-whisper">
                            <div class="card-image">
                                <img src="images/corridor-whisper.svg" alt="走廊讨论" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">走廊角落和同学低声讨论</h3>
                                <p class="option-desc">课间走廊里翻笔记、互相低声讲答案的悄悄话场景。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="early-morning-study">
                            <div class="card-image">
                                <img src="images/early-morning-study.svg" alt="清晨自习" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清晨自习到天亮</h3>
                                <p class="option-desc">自习室里台灯与晨光交错，和书本一起守着天亮的静谧时刻。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
