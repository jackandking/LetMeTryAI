    <title>酒店衣物收纳与保养指南投票</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">酒店衣物收纳与保养投票 — 你的旅行衣物怎么处理？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在酒店期间，你通常选择哪种方式收纳与保养随身衣物？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="instant-folding">
                            <div class="card-image">
                                <img src="images/instant-folding.svg" alt="折叠收纳示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">即时折叠收纳</h3>
                                <p class="option-desc">把当天衣物按单天搭配折好收进行李或抽屉，方便第二天使用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hang-on-hangers">
                            <div class="card-image">
                                <img src="images/hang-on-hangers.svg" alt="衣架挂放示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">衣架挂放防皱</h3>
                                <p class="option-desc">用酒店衣架或随身衣架挂放衬衫与外套，减少皱褶和熨烫需求。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="packing-cubes">
                            <div class="card-image">
                                <img src="images/packing-cubes.svg" alt="收纳袋分区示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">旅行收纳袋与分区</h3>
                                <p class="option-desc">用收纳袋或分区盒把内衣、外套和配件分开，便于整理与防潮。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spot-cleaning-air">
                            <div class="card-image">
                                <img src="images/spot-cleaning-air.svg" alt="局部清洁与通风示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">局部清洁与通风</h3>
                                <p class="option-desc">遇轻微异味或污渍做局部清洁并放置通风处，延缓换洗频率。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
