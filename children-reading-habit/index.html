    <title>家长话题：孩子阅读习惯怎么养成</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：孩子阅读习惯怎么养成</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：养成孩子阅读习惯，哪种方式最可行？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="fixed-reading-time">
                            <div class="card-image">
                                <img src="images/fixed-reading-time.svg" alt="孩子在固定时间阅读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每天固定阅读时间</h3>
                                <p class="option-desc">每天固定 15–30 分钟，形成节奏</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="parent-child-reading">
                            <div class="card-image">
                                <img src="images/parent-child-reading.svg" alt="父母和孩子共读" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">亲子共读一起讨论</h3>
                                <p class="option-desc">家长陪读并讨论故事与感受</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="reading-corner-rewards">
                            <div class="card-image">
                                <img src="images/reading-corner-rewards.svg" alt="温馨阅读角" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">设置阅读角与奖励</h3>
                                <p class="option-desc">打造舒适角落并用小奖赏激励</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="library-bookstore-trip">
                            <div class="card-image">
                                <img src="images/library-bookstore-trip.svg" alt="家庭图书馆探险" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">图书馆/书店定期探险</h3>
                                <p class="option-desc">带孩子逛图书馆或书店，培养兴趣</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
