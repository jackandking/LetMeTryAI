<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风天出门，你会选哪种防水底妆？轻薄还是持久？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风天出门，你会选哪种防水底妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-longwear">
                            <div class="card-image">
                                <img src="images/matte-longwear.svg" alt="哑光持久防水底妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">哑光持久派</h3>
                                <p class="option-desc">控油抗汗、毛孔修饰，长时间外出不易浮粉。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-breathable">
                            <div class="card-image">
                                <img src="images/light-breathable.svg" alt="轻薄透气防水底妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄透气派</h3>
                                <p class="option-desc">薄透妆感＋防水隔离，不厚重也不闷，适合近距离聚会。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="setting-spray">
                            <div class="card-image">
                                <img src="images/setting-spray.svg" alt="定妆喷雾防水底妆示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">定妆喷雾加持</h3>
                                <p class="option-desc">任意粉底配防水定妆喷雾，补妆友好且能抗汗抗湿气。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spf-isolation-powder">
                            <div class="card-image">
                                <img src="images/spf-isolation-powder.svg" alt="防晒隔离与粉饼组合示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防晒隔离＋粉饼</h3>
                                <p class="option-desc">防晒兼顾遮瑕，粉饼便于快速补妆，适合短途外出经常补妆的人。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
