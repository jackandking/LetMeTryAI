                            </div>
                            <div class="card-content">
                                <h3 class="option-title">生态栖息说</h3>
                                <p class="option-desc">古塔砖缝冬暖夏凉，像天然洞穴，蛇钻进去安家避寒避暑。</p>
                            </div>
                            <div class="check-indicator">✓</div>

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">民间传说说</h3>
                                <p class="option-desc">老辈人说蛇是镇塔守护的灵物，守在塔里保佑一方平安。</p>

                            <div class="check-indicator">✓</div>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">建筑结构说</h3>
                                <p class="option-desc">辽塔历经800年风雨，塔身破损缝隙多，正好成了蛇藏身的通道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="food-theory">
