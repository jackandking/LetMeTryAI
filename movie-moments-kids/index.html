    <title>带娃看电影：孩子会回味哪个桥段？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">带娃看电影，哪个桥段会让孩子一直回味？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">带娃看电影，哪个桥段会让孩子一直回味？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="warm-hug-scene">
                            <div class="card-image">
                                <img src="images/warm-hug-scene.svg" alt="父母抱着孩子的温暖瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温馨拥抱</h3>
                                <p class="option-desc">父母温柔抱起孩子，画面安静又有安全感，孩子回忆里有家的味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="funny-gag-moment">
                            <div class="card-image">
                                <img src="images/funny-gag-moment.svg" alt="电影中搞笑角色逗笑孩子的场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">搞笑神来一脚</h3>
                                <p class="option-desc">一个意外的笑点让全家大笑，孩子会反复模仿那句台词或动作。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hero-rescue-scene">
                            <div class="card-image">
                                <img src="images/hero-rescue-scene.svg" alt="英雄救助他人的激动场面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">英雄救援</h3>
                                <p class="option-desc">主人公勇救同伴的紧张一刻，让孩子记住勇气和牺牲的小细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="magical-musical-scene">
                            <div class="card-image">
                                <img src="images/magical-musical-scene.svg" alt="绚丽舞台和角色歌舞的奇幻画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">奇幻歌舞</h3>
                                <p class="option-desc">色彩与旋律交织的奇幻段落，孩子会哼起旋律、念起画面细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
