<body>
    <h1 id="pageTitle">男人减速带：哪个最让你挪不动步？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">除了钓鱼和充电头，以下哪种画面能让你瞬间驻足，一看就是半小时？</p>
            <div class="button-group" id="optionsContainer">
                <!-- Excavator -->
                <label class="option">
                    <input type="radio" name="fighter" value="excavator">
                    <img src="https://picsum.photos/seed/excavator/300/200" alt="挖掘机" loading="lazy">
                    <span>挖掘机</span>
                </label>
                
                <!-- Forging -->
                <label class="option">
                    <input type="radio" name="fighter" value="forging">
                    <img src="https://picsum.photos/seed/blacksmith/300/200" alt="古法锻刀" loading="lazy">
                    <span>古法锻刀</span>
                </label>
                
                <!-- CNC -->
                <label class="option">
                    <input type="radio" name="fighter" value="cnc">
                    <img src="https://picsum.photos/seed/machining/300/200" alt="数控机床" loading="lazy">
                    <span>数控机床</span>
                </label>
                
                <!-- Dam -->
                <label class="option">
                    <input type="radio" name="fighter" value="dam">
                    <img src="https://picsum.photos/seed/dam/300/200" alt="大坝泄洪" loading="lazy">
                    <span>大坝泄洪</span>
                </label>
                
                <!-- Welding -->
                <label class="option">
                    <input type="radio" name="fighter" value="welding">
                    <img src="https://picsum.photos/seed/welding/300/200" alt="鱼鳞焊" loading="lazy">
                    <span>鱼鳞焊</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在获取最新猛男统计...</p>
