<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft · 图鉴</title>
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" />
<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --grass: #5d9c3f;
            --dirt: #7a5230;
            --panel: #f4f1e8;
            --ink: #2b2b2b;
        }
        html, body {
            min-height: 100%;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
        }
        .topbar {
            height: 10px;
            background: linear-gradient(to bottom, var(--grass) 0 55%, var(--dirt) 55% 100%);
        }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px 64px; }
        .greeting {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .subtitle { color: #777; font-size: 15px; margin-bottom: 28px; }
        .navbar { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
        .navbar button {
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 11px 26px;
            border: 3px solid #d8d2c0;
            border-radius: 4px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .navbar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
        .navbar button.active {
            background: var(--grass);
            color: #fff;
            border-color: var(--grass);
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 6px solid var(--grass);
        }
        .section-title.blocks { border-left-color: var(--dirt); }
        .section-title.items { border-left-color: #d4a017; }
        .section-title.mobs { border-left-color: var(--grass); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
            margin-bottom: 44px;
        }
        .card {
            background: var(--panel);
            border: 3px solid #d8d2c0;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }
        .card .thumb {
            aspect-ratio: 1 / 1;
            background:
                linear-gradient(180deg, #eef3e4 0%, #e3ecdb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .card .thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card .meta { padding: 14px 16px 18px; flex: 1; }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 3px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .badge.player { background: #7fc7e8; color: #123; }
        .badge.hostile { background: #e57373; color: #fff; }
        .badge.neutral { background: #b39ddb; color: #2a1e3f; }
        .badge.passive { background: #a5d6a7; color: #1b3a1e; }
        .badge.block { background: #a1887f; color: #fff; }
        .badge.item { background: #ffcc80; color: #5d3a00; }
        .badge.boss { background: #37474f; color: #ffd54f; }
        .card .name { font-size: 19px; font-weight: 700; }
        .card .name .cn { font-weight: 400; color: #666; font-size: 14px; margin-left: 6px; }
        .card .desc {
            font-size: 13.5px;
            color: #555;
            margin-top: 10px;
            line-height: 1.75;
        }
        .footnote {
            margin-top: 36px;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        .backbtn {
            display: inline-block; margin-bottom: 26px; text-decoration: none;
            font-size: 14px; font-weight: 600; color: #555;
            background: var(--panel); border: 3px solid #d8d2c0; border-radius: 4px;
            padding: 9px 20px;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }
        .backbtn:hover { transform: translateY(-2px); background: #fff; border-color: var(--grass); }
        .menu {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; max-width: 720px; margin-top: 8px;
        }
        .menu a {
            display: block; text-decoration: none; color: var(--ink);
            background: var(--panel); border: 3px solid #d8d2c0; border-radius: 4px;
            padding: 36px 20px; text-align: center;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }
        .menu a:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.12); border-color: var(--grass); }
        .menu a .t { font-size: 28px; font-weight: 700; }
        .menu a .en { font-size: 12px; color: #999; letter-spacing: 2px; margin-top: 6px; }
        .menu a .cnt { font-size: 13px; color: #666; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="topbar"></div>
    <div class="wrap">
        <div class="greeting">hi jason</div>
        <div class="subtitle">Minecraft · 图鉴：方块 / 物品 / 生物</div>

        <div class="menu">
            <a href="blocks.html"><div class="t">方块</div><div class="en">BLOCKS</div><div class="cnt">28 个条目</div></a>
            <a href="items.html"><div class="t">物品</div><div class="en">ITEMS</div><div class="cnt">28 个条目</div></a>
            <a href="mobs.html"><div class="t">生物</div><div class="en">MOBS</div><div class="cnt">32 个条目</div></a>
        </div>

        <div class="footnote">
            图片来源：<a href="https://minecraft.wiki" style="color:#888;">Minecraft Wiki</a> 官方渲染图与物品图标，仅供学习与图鉴展示；Minecraft 为 Mojang Studios 的商标。
        </div>
    </div>
</body>
</html>
