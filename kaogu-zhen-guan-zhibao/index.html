    <title>考古博物馆的镇馆之宝：带孩子看哪件更有趣？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">考古博物馆的镇馆之宝，你想带孩子看哪件？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">去考古博物馆，你最想带孩子去看下面哪件镇馆之宝？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="bing-ma-yong">
                            <div class="card-image">
                                <img src="images/bing-ma-yong.svg" alt="兵马俑陶俑排列" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兵马俑</h3>
                                <p class="option-desc">一排排陶俑像真人站队，和孩子讲古代士兵的故事，画面很震撼。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cai-hui-bi-hua">
                            <div class="card-image">
                                <img src="images/cai-hui-bi-hua.svg" alt="彩绘墓室壁画细节" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">彩绘墓室壁画</h3>
                                <p class="option-desc">色彩鲜明的壁画像打开的故事书，适合和孩子指认人物与场景细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="qing-tong-ding">
                            <div class="card-image">
                                <img src="images/qing-tong-ding.svg" alt="古代青铜大鼎侧影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜大鼎</h3>
                                <p class="option-desc">沉甸甸的青铜器质感强，可讲古代礼仪和铸造故事，引发好奇。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="han-dai-yu-qi">
                            <div class="card-image">
                                <img src="images/han-dai-yu-qi.svg" alt="汉代玉器特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">汉代玉器</h3>
                                <p class="option-desc">小巧精致的玉器像宝贝盒，适合近看细节，讲古人的生活与传说。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>

        </footer>
