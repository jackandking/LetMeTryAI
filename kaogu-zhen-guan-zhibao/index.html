    <title>考古展镇馆之宝：带孩子看哪个会让他惊呼？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">考古展的镇馆之宝，带孩子看哪个会让他惊呼？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在考古展里，哪件镇馆之宝会让你家孩子当场惊呼？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="qing-tong-ben-ma">
                            <div class="card-image">
                                <img src="images/qing-tong-ben-ma.svg" alt="青铜奔马雕像侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青铜奔马</h3>
                                <p class="option-desc">侧身腾跃的铜马像，能让孩子想象马匹奔跑的动感，适合模仿与故事联想。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="jin-mian-ju">
                            <div class="card-image">
                                <img src="images/jin-mian-ju.svg" alt="古代金面具特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">精致金面具</h3>
                                <p class="option-desc">闪亮的金属面具细节丰富，好奇心强的孩子会盯着纹饰看出好久。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bing-ma-yong">
                            <div class="card-image">
                                <img src="images/bing-ma-yong.svg" alt="兵马俑排队全景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">兵马俑军阵</h3>
                                <p class="option-desc">整排陶俑的排列气势十足，容易让孩子发出‘哇’并想象古代军队的故事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cai-tao-ren-xiang">
                            <div class="card-image">
                                <img src="images/cai-tao-ren-xiang.svg" alt="彩陶人像近照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">彩陶人像</h3>
                                <p class="option-desc">彩绘陶俑色彩与表情生动，适合低龄孩子观察颜色和古人服饰细节。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
