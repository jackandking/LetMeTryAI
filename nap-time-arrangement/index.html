    <title>午睡时间投票 — 爱老人</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">午睡时间您更偏向哪种安排</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">午睡时间您更偏向哪种安排？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="short-power-nap">
                            <div class="card-image">
                                <img src="images/short-power-nap.svg" alt="老人短暂午睡20到30分钟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短暂补眠（20-30分钟）</h3>
                                <p class="option-desc">午后短睡，醒来精神清爽，适合日常小憩。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="moderate-nap">
                            <div class="card-image">
                                <img src="images/moderate-nap.svg" alt="老人中等时长午睡40到60分钟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中等午睡（40-60分钟）</h3>
                                <p class="option-desc">稍长时间休息，帮助缓解疲劳但不影响夜间睡眠。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-nap-light-activity">
                            <div class="card-image">
                                <img src="images/no-nap-light-activity.svg" alt="老人午后散步或读书代替午睡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不睡午觉，做轻活动代替</h3>
                                <p class="option-desc">午后散步或读书，保持活动与社交，轻松度过下午时光。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
