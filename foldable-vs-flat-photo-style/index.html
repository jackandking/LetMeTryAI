        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">折叠屏拍照和直板手机，你更被哪种上镜风格圈粉？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="foldable-soft-glow">
                            <div class="card-image">
                                <img src="images/foldable-soft-glow.svg" alt="温柔高光上镜风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温柔高光派</h3>
                                <p class="option-desc">折叠屏微倾斜+虚化，肤质被高光衬出柔和感，像杂志封面那样温柔上镜。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="foldable-art-composition">

                                <img src="images/foldable-art-composition.svg" alt="艺术构图上镜风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">艺术构图派</h3>
                                <p class="option-desc">折叠屏的翻折/镜像构图制造创意画面，侧脸与反射形成高级感。</p>

                        </label>

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">自然清透派</h3>
                                <p class="option-desc">直板手机正脸取景、光线通透，妆容与肤色看起来清新自然，日常好看。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="slab-vivid-impact">
                            <div class="card-image">
                                <img src="images/slab-vivid-impact.svg" alt="鲜艳冲击上镜风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">鲜艳冲击派</h3>
