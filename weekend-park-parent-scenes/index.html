    <title>周末公园带娃，你更想看到哪种画面？4个具体亲子场景</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">周末公园带娃，你更想看到哪种画面？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">周末公园带娃，你更想看到哪种画面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="picnic-reading">
                            <div class="card-image">
                                <img src="images/picnic-reading.svg" alt="家长和孩子在草地上野餐读绘本" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">野餐读绘本</h3>
                                <p class="option-desc">铺上毯子，孩子翻着图画书，你在一旁微笑陪读。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chasing-butterflies">
                            <div class="card-image">
                                <img src="images/chasing-butterflies.svg" alt="孩子在草地上追蝴蝶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">草地追蝴蝶</h3>
                                <p class="option-desc">孩子奔跑追逐蝴蝶，阳光和色彩填满画面与回忆。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kite-flying-silhouette">
                            <div class="card-image">
                                <img src="images/kite-flying-silhouette.svg" alt="一家人在公园放风筝的背影" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">放风筝背影</h3>
                                <p class="option-desc">父母牵线放风筝，慢镜头般的背影温馨又有画面感。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="swing-laughter">
                            <div class="card-image">
                                <img src="images/swing-laughter.svg" alt="孩子在秋千上笑着玩耍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">秋千嬉笑</h3>
                                <p class="option-desc">孩子坐秋千大笑，父母轻推，空气里都是快乐声。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
