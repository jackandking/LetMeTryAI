    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">追剧必看古装剧｜你最想追哪一部？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">追剧必看古装剧投票：你会把这一票投给哪一部？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="zhen-huan-chuan">
                            <div class="card-image">
                                <img src="images/zhen-huan-chuan.jpg" alt="甄嬛传海报风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甄嬛传 — 后宫智斗与古风妆造</h3>
                                <p class="option-desc">宫斗女主逆袭、精致妆造与细腻情感，让人一看入坑停不下来。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="langya-bang">
                            <div class="card-image">
                                <img src="images/langya-bang.jpg" alt="琅琊榜海报风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">琅琊榜 — 权谋智斗与兄弟情深</h3>
                                <p class="option-desc">故事节奏紧凑、台词与人物立体，既有智斗也有催泪兄弟情。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="yanxi-gonglue">
                            <div class="card-image">
                                <img src="images/yanxi-gonglue.jpg" alt="延禧攻略海报风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">延禧攻略 — 机智女主×宫廷成长史</h3>
                                <p class="option-desc">女主靠智慧与手段成长，妆造与场景时尚感强，刷剧体验代入感十足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="sansheng-sanshi-taohua">
                            <div class="card-image">
                                <img src="images/sansheng-sanshi-taohua.jpg" alt="三生三世十里桃花海报风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">三生三世十里桃花 — 爱情仙侠的大戏</h3>
                                <p class="option-desc">浪漫唯美的仙侠爱情，画面与服化道具极具观赏性，适合少女心追剧。</p>
                            </div>
                            <div class="check-indicator">✓</div>
