    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：孩子发脾气怎么回应</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：孩子发脾气时最可能采取哪种回应方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="listen-and-guide">
                            <div class="card-image">
                                <img src="images/listen-and-guide.svg" alt="父母耐心倾听孩子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">耐心倾听并引导</h3>
                                <p class="option-desc">先听孩子表达，再引导情绪和原因</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="give-calm-time">
                            <div class="card-image">
                                <img src="images/give-calm-time.svg" alt="给孩子冷静空间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短暂冷静等待</h3>
                                <p class="option-desc">让孩子先冷静，再找时间沟通</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="stop-and-explain">
                            <div class="card-image">
                                <img src="images/stop-and-explain.svg" alt="父母立即制止并解释" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立即设界限并讲道理</h3>
                                <p class="option-desc">马上制止不当行为并解释原因</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>
