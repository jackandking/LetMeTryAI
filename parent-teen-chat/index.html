    <title>如何跟青春期孩子聊天</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">如何跟青春期孩子聊天</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：如何跟青春期孩子聊天？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="option-1">
                            <div class="card-image">
                                <img src="images/invite-conversation.svg" alt="家长与孩子面对面聊天" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">主动邀请谈话</h3>
                                <p class="option-desc">在合适时机主动约谈，表达关心不批评</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="option-2">
                            <div class="card-image">
                                <img src="images/regular-talk-time.svg" alt="家庭定期谈心场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">设定固定谈心时间</h3>
                                <p class="option-desc">每周固定时段聊近况，建立常态沟通</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="option-3">
                            <div class="card-image">
                                <img src="images/chat-during-activity.svg" alt="家长和孩子一起散步聊天" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">通过活动打开话题</h3>
                                <p class="option-desc">边做家务或散步时自然交流，压力更小</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="option-4">
                            <div class="card-image">
                                <img src="images/seek-third-party.svg" alt="家长咨询老师或专家" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">寻求第三方支持</h3>
                                <p class="option-desc">必要时请老师或心理专家介入辅助沟通</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
