    <title>老家这些农具，你还记得几样？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老家这些农具，你还记得几样？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下面这些农具，你还记得几样？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="hoe">
                            <div class="card-image">
                                <img src="images/hoe.svg" alt="传统锄头农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">锄头</h3>
                                <p class="option-desc">翻地除草，田里最常见的老伙计</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="winnowing-fan">
                            <div class="card-image">
                                <img src="images/winnowing-fan.svg" alt="传统风车农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">风车</h3>
                                <p class="option-desc">摇动手柄，谷子糠皮分得一清二楚</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stone-mill">
                            <div class="card-image">
                                <img src="images/stone-mill.svg" alt="传统石磨农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">石磨</h3>
                                <p class="option-desc">一圈圈推磨，豆浆面粉都带着香味</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bamboo-hat">
                            <div class="card-image">
                                <img src="images/bamboo-hat.svg" alt="传统斗笠农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">斗笠</h3>
                                <p class="option-desc">遮阳挡雨，挂在屋檐下的旧时光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
</html>
