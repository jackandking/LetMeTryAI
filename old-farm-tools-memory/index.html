    <title>这些老农具，你还记得几个？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">这些老农具，你还记得几个？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">下面这些老农具，你还记得几个？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="winnowing-fan">
                            <div class="card-image">
                                <img src="images/winnowing-fan.svg" alt="传统木制风车老农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">风车</h3>
                                <p class="option-desc">摇一摇就能把糠和米粒分开，晒谷场上离不开它。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="stone-mill">
                            <div class="card-image">
                                <img src="images/stone-mill.svg" alt="老石磨农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">石磨</h3>
                                <p class="option-desc">一圈圈推出来的豆浆、米粉，是小时候熟悉的味道。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wooden-plow">
                            <div class="card-image">
                                <img src="images/wooden-plow.svg" alt="木犁老农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">犁</h3>
                                <p class="option-desc">牛拉人扶，翻开沉睡一冬的泥土，春耕就从这里开始。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="harrow-rake">
                            <div class="card-image">
                                <img src="images/harrow-rake.svg" alt="铁耙老农具" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">耙</h3>
                                <p class="option-desc">犁完地后再用它把土块打碎耙平，为播种铺好一张软床。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
