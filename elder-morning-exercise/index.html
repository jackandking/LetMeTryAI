    <title>老人晨练偏好调查</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">老人晨练，你家长辈更喜欢哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你家里长辈早上更常做什么活动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="morning-walk">
                            <div class="card-image">
                                <img src="images/morning-walk.svg" alt="老人晨间散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">晨间散步</h3>
                                <p class="option-desc">清晨去公园或小区走走，呼吸新鲜空气。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="tai-chi">
                            <div class="card-image">
                                <img src="images/tai-chi.svg" alt="老人练太极" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太极拳</h3>
                                <p class="option-desc">在小区或公园跟着动作练太极，节奏缓和。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="square-dance">
                            <div class="card-image">
                                <img src="images/square-dance.svg" alt="老人跳广场舞" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场舞</h3>
                                <p class="option-desc">跟着节奏跳广场舞，活动身体也能社交。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="home-stretch">
                            <div class="card-image">
                                <img src="images/home-stretch.svg" alt="居家舒展动作" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">居家舒展</h3>
                                <p class="option-desc">在家做简单拉伸或体操，舒服又省事。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
