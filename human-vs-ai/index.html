    <title>未来空战：人类飞行员 vs AI无人机</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="pageTitle">未来空战：人类飞行员 vs AI无人机</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">在未来的空战中，你认为谁将主宰天空？</p>
            <div class="button-group" id="optionsContainer">
                <!-- Human Pilots -->
                <label class="option">
                    <input type="radio" name="fighter" value="human">
                    <img src="images/human.svg" alt="人类王牌" loading="lazy">
                    <span>人类王牌</span>
                </label>
                
                <!-- AI Drones -->
                <label class="option">
                    <input type="radio" name="fighter" value="ai_drone">
                    <img src="images/ai_drone.svg" alt="AI无人机" loading="lazy">
                    <span>AI无人机</span>
                </label>
                
                <!-- Human-AI Teaming -->
                <label class="option">
                    <input type="radio" name="fighter" value="human_ai">
                    <img src="images/human_ai.svg" alt="人机共生" loading="lazy">
                    <span>人机共生</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
        <p>正在获取最新战力统计...</p>
    </div>
    
    <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看全球战力榜</button>

    <div class="more" id="more"><a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a></div>

    <!-- VConsole for mobile debugging -->

                script.onload = function() {
                    if (window.VConsole) new window.VConsole();
                };
                document.head.appendChild(script);
            }
        })();
    </script>
</body>
</html>
