    <title>换季护肤投票：你的首要需求是？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">换季护肤你更在意什么</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">换季护肤时，你会把精力放在哪个环节？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="use-hydration-serum">
                            <div class="card-image">
                                <img src="images/use-hydration-serum.svg" alt="保湿精华产品瓶身" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">加强保湿精华</h3>
                                <p class="option-desc">早晚精华/安瓶为主，注重持久保湿</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-oil-control">
                            <div class="card-image">
                                <img src="images/light-oil-control.svg" alt="清爽质地的护肤品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清爽控油步骤</h3>
                                <p class="option-desc">减轻油腻感，选择清爽配方与吸油手法</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hydration-mask-boost">
                            <div class="card-image">
                                <img src="images/hydration-mask-boost.svg" alt="面膜敷面场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">急救补水面膜</h3>
                                <p class="option-desc">周间密集面膜或片状面膜做快速补水</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="soothing-repair">
                            <div class="card-image">
                                <img src="images/soothing-repair.svg" alt="舒缓修护护肤产品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">舒缓修护方案</h3>
                                <p class="option-desc">使用修复类和舒缓成分缓解红肿敏感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
