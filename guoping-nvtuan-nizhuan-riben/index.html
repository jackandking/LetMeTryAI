<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国乒女团逆转日本：哪个比赛瞬间让你印象深刻？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在国乒女团逆转日本的比赛中，哪个瞬间让你印象深刻？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="wang-yidi-serve-comeback">
                            <div class="card-image">
                                <img src="images/wang-yidi-serve-comeback.svg" alt="王艺迪发球瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">王艺迪关键发球反超</h3>
                                <p class="option-desc">王艺迪在关键局的发球连续得分，帮助球队反超比分。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="sun-yingsha-rally">
                            <div class="card-image">
                                <img src="images/sun-yingsha-rally.svg" alt="孙颖莎得分瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">孙颖莎连得分追平逆转</h3>
                                <p class="option-desc">孙颖莎连取多分，将比分拉回并重燃逆转希望。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="chen-meng-block">
                            <div class="card-image">
                                <img src="images/chen-meng-block.svg" alt="陈梦封网瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">陈梦防守封网守住关键分</h3>
                                <p class="option-desc">陈梦在关键回合的防守与封网，阻断对方反攻。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="team-celebration-morale">
                            <div class="card-image">
                                <img src="images/team-celebration-morale.svg" alt="队员庆祝瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">团队合力庆祝士气回升</h3>
                                <p class="option-desc">全队合力庆祝与互相激励，成为赛场情绪的转折点。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
