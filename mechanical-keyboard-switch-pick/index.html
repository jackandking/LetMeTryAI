    <title>硬核对比：机械键盘轴体选择</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">硬核对比：机械键盘轴体选择</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你更喜欢哪种机械轴体的手感？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="red-switch">
                            <div class="card-image">
                                <img src="images/red-switch.svg" alt="红轴特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红轴（线性）</h3>
                                <p class="option-desc">顺滑线性、适合游戏与快速敲击</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="blue-switch">
                            <div class="card-image">
                                <img src="images/blue-switch.svg" alt="青轴键帽与轴体" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">青轴（段落感）</h3>
                                <p class="option-desc">清脆段落感，适合打字手感派</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="brown-switch">
                            <div class="card-image">
                                <img src="images/brown-switch.svg" alt="茶轴近摄" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">茶轴（平衡）</h3>
                                <p class="option-desc">兼顾打字与游戏的中庸手感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="silver-switch">
                            <div class="card-image">
                                <img src="images/silver-switch.svg" alt="银轴侧视" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">银轴（轻触速度）</h3>
                                <p class="option-desc">触发快、响应准，主打竞技体验</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

    </script>
</body>
