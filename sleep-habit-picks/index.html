    <title>改善睡眠：你更倾向哪种睡前小习惯？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">改善睡眠：你更倾向哪种睡前小习惯？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你认为哪种睡前习惯最有助于入睡？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="warm-milk">
                            <div class="card-image">
                                <img src="images/warm-milk.svg" alt="温牛奶 杯子在夜灯下" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝一杯温牛奶</h3>
                                <p class="option-desc">睡前喝温牛奶，温暖舒缓</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="listen-light-music">
                            <div class="card-image">
                                <img src="images/listen-light-music.svg" alt="收音机或轻音乐 场景" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">听轻柔音乐或收音机</h3>
                                <p class="option-desc">播放轻音乐或广播让心情放松</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="gentle-stretch-or-walk">
                            <div class="card-image">
                                <img src="images/gentle-stretch-or-walk.svg" alt="夜间轻松散步 或 简单伸展" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">温和伸展或慢步散步</h3>
                                <p class="option-desc">做些轻柔伸展或短距离散步放松身体</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="mild-tcm-tea">
                            <div class="card-image">
                                <img src="images/mild-tcm-tea.svg" alt="温和中医茶杯 文化风格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝杯温和的中医茶饮</h3>
                                <p class="option-desc">用温和的草本茶（非强疗效）助放松</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
