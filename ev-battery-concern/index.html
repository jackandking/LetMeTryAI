    <title>新一代电动车电池你更关注哪方面？投票页</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">新一代电动车电池你更关注哪方面？续航 / 充电 / 安全 / 寿命</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">新一代电动车电池你更关注哪方面？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="range">
                            <div class="card-image">
                                <img src="images/range.svg" alt="续航里程图示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">续航里程</h3>
                                <p class="option-caption">一次充电能跑多远，决定日常通勤和长途便利性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fast-charging">
                            <div class="card-image">
                                <img src="images/fast-charging.svg" alt="快充桩与充电动画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">充电速度</h3>
                                <p class="option-caption">充电时间越短，上路恢复越快，影响长途与快节奏生活体验。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="thermal-management">
                            <div class="card-image">
                                <img src="images/thermal-management.svg" alt="热管理与安全示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">热管理与安全</h3>
                                <p class="option-caption">防止过热与起火的设计，关系到用车安全与整车可靠性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lifespan-degradation">
                            <div class="card-image">
                                <img src="images/lifespan-degradation.svg" alt="电池寿命曲线示意" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">电池寿命与衰减</h3>
                                <p class="option-caption">电池随时间衰减速度影响长期成本与二手保值率。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
