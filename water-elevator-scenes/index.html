    <title>水上电梯：哪个场景让你看呆？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你被水上电梯的哪个场景惊艳到了？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你被水上电梯的哪个场景惊艳到了？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sea-view-glass-cabin">
                            <div class="card-image">
                                <img src="images/sea-view-glass-cabin.svg" alt="海景玻璃电梯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">海景玻璃舱</h3>
                                <p class="option-desc">透明玻璃舱悬空看海，海天连成一线的画面感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="underwater-aquarium-elevator">
                            <div class="card-image">
                                <img src="images/underwater-aquarium-elevator.svg" alt="水下鱼群电梯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水下鱼群环绕</h3>
                                <p class="option-desc">像穿梭在巨大水族箱中，鱼群从身边游过的沉浸感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="waterfall-passage-elevator">
                            <div class="card-image">
                                <img src="images/waterfall-passage-elevator.svg" alt="瀑布穿过电梯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">瀑布穿越式电梯</h3>
                                <p class="option-desc">电梯穿过瀑布与水雾，像走进电影镜头的瞬间</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
