    <title>教室改造为活动室，你会选哪个角落坐坐？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">小时候的教室变成老人活动室，你会去哪个角落坐坐？哪个角落能把你带回当年？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">小时候的教室变成老人活动室，你会去哪个角落坐坐？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="window-desk">
                            <div class="card-image">
                                <img src="images/window-desk.svg" alt="靠窗的旧课桌，阳光和操场景色" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">靠窗的旧课桌</h3>
                                <p class="option-desc">阳光洒在旧课桌上，窗外操场的声音带来熟悉的节奏。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="front-teacher-chair">
                            <div class="card-image">
                                <img src="images/front-teacher-chair.svg" alt="讲台前的老师椅与黑板" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">讲台前的老师椅</h3>
                                <p class="option-desc">坐在讲台旁像回到被老师点名的时刻，能回味讲课的氛围。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bookcase-nook">
                            <div class="card-image">
                                <img src="images/bookcase-nook.svg" alt="书柜旁的安静阅读角" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">书柜旁的阅读角</h3>
                                <p class="option-desc">书香与旧课本并存，适合静静翻看昔日笔记和相册。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="windowledge-playground-view">
                            <div class="card-image">
                                <img src="images/windowledge-playground-view.svg" alt="窗台外的操场视角" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">窗台或操场边</h3>
                                <p class="option-desc">倚着窗台看操场，回想课间追逐与嬉闹的画面。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
