    <title>世界杯神仙画面·哪个暖到你</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">世界杯这些神仙画面，哪个让你心头一暖？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">世界杯这些神仙画面，哪个让你心头一暖？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="celebrate-for-family">
                            <div class="card-image">
                                <img src="images/celebrate-for-family.svg" alt="世界杯进球献给家人的暖心画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">献给家人</h3>
                                <p class="option-desc">球员进球后双手指天，把庆祝献给看台上的家人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="teammate-ties-shoelace">
                            <div class="card-image">
                                <img src="images/teammate-ties-shoelace.svg" alt="世界杯队友系鞋带的温情瞬间" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">队友系鞋带</h3>
                                <p class="option-desc">队友单膝跪地，为受伤倒地的伙伴系紧鞋带</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="player-hugs-young-fan">
                            <div class="card-image">
                                <img src="images/player-hugs-young-fan.svg" alt="世界杯球员拥抱小球迷的治愈画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">抱小球迷合影</h3>
                                <p class="option-desc">赛后球员蹲下身，把冲下来的小球迷抱进球场合影</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="team-pile-celebration">
                            <div class="card-image">
                                <img src="images/team-pile-celebration.svg" alt="世界杯绝杀后全队叠罗汉庆祝" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">全队叠罗汉</h3>
                                <p class="option-desc">绝杀后全队叠罗汉冲向角旗区，热血与拥抱一起迸发</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
