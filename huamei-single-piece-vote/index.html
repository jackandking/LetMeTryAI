<head>
    <meta charset="UTF-8">

    <title>话梅单颗高价：你的选择</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">话梅卖到单颗高价，你会怎么选？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">话梅卖到单颗高价，你会怎么选？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-single-try">
                            <div class="card-image">
                                <img src="images/buy-single-try.svg" alt="只买一颗尝鲜的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只买一颗尝鲜</h3>
                                <p class="option-desc">花小钱试新品，体验口感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-full-box">
                            <div class="card-image">
                                <img src="images/buy-full-box.svg" alt="整盒购买的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">整盒入手更划算</h3>
                                <p class="option-desc">算算单价，整盒更省钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="wait-discount">
                            <div class="card-image">
                                <img src="images/wait-discount.svg" alt="等待折扣的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">等折扣或促销</h3>
                                <p class="option-desc">耐心等待再下手，省心又省钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="make-or-alternative">
                            <div class="card-image">
                                <img src="images/make-or-alternative.svg" alt="自制或替代零食的示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不买，自己做或替代</h3>
                                <p class="option-desc">自己腌制或找替代零食，应付口馋</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

        })();
    </script>
</body>
</html>
