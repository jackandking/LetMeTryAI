<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">女人爱热议：最让你心动的想念方式</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你会把这一票投给谁：最让你心动的想念方式？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="late-night-message">
                            <div class="card-image">
                                <img src="images/late-night-message.svg" alt="深夜贴心话" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">深夜一句贴心话</h3>
                                <p class="option-desc">深夜的一句：我在，记得睡好</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="morning-i-miss-you">
                            <div class="card-image">
                                <img src="images/morning-i-miss-you.svg" alt="清晨想你" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">清晨的第一条想你</h3>
                                <p class="option-desc">醒来收到一句就暖了整天</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="unexpected-gift">
                            <div class="card-image">
                                <img src="images/unexpected-gift.svg" alt="小礼物惊喜" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">意外的小礼物惊喜</h3>
                                <p class="option-desc">毫无预告的小心意最让人动心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="quiet-companionship">
                            <div class="card-image">
                                <img src="images/quiet-companionship.svg" alt="默默陪伴" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">默默陪伴的日常举动</h3>
                                <p class="option-desc">不张扬的陪伴更能打动人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
