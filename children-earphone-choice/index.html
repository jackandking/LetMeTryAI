    <title>家长话题：儿童耳机选购 — 有线还是无线？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家长话题：儿童耳机选购 — 有线还是无线？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：儿童耳机 — 有线还是无线？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="wired-earphones">
                            <div class="card-image">
                                <img src="images/wired-earphones.svg" alt="有线耳机示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">有线更省电更耐用</h3>
                                <p class="option-desc">有线不担心续航、结构简单更耐摔</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="wireless-earbuds">
                            <div class="card-image">
                                <img src="images/wireless-earbuds.svg" alt="无线耳塞示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">无线更灵活防缠绕</h3>
                                <p class="option-desc">无线便携不缠线，适合出行和运动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="age-based-choice">
                            <div class="card-image">
                                <img src="images/age-based-choice.svg" alt="按年龄选择示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">按年龄/用途来选</h3>
                                <p class="option-desc">幼儿与学龄儿童需求不同，分情况选购</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
