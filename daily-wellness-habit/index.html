<body>
    <h1 id="pageTitle">爱老人关注：日常养生习惯投票</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">如果是爱老人用户，你最支持哪个日常养生习惯？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="elder-love" value="foot-soak-morning-evening">
                    <img src="images/foot-soak-morning-evening.svg" alt="温水泡脚盆" loading="lazy">
                    <span>温水泡脚，助眠助血液循环</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="daily-warm-water">
                    <img src="images/daily-warm-water.svg" alt="杯子里的温开水" loading="lazy">
                    <span>起床温水润肠，习惯简单易坚持</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="short-afternoon-nap">
                    <img src="images/short-afternoon-nap.svg" alt="老人午睡靠椅小憩" loading="lazy">
                    <span>短午休提神又不影响夜间睡眠</span>
                </label>

                <label class="option">
                    <input type="radio" name="elder-love" value="walk-30-minutes">
                    <img src="images/walk-30-minutes.svg" alt="太阳下散步的老人" loading="lazy">
                    <span>规律步行，心肺更舒服，易坚持</span>
                </label>
            </div>
        </div>
    </form>

    <div class="result" id="result">
