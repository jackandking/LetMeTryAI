    <title>春季护肤困扰投票</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">春季换季，你的肌肤困扰是什么？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">春季换季，你的肌肤困扰是什么？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="sensitive-redness">
                            <div class="card-image">
                                <img src="images/sensitive-redness.svg" alt="敏感泛红图标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">敏感泛红</h3>
                                <p class="option-caption">脸颊容易发红发热，屏障受损</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dry-flaking">
                            <div class="card-image">
                                <img src="images/dry-flaking.svg" alt="干燥起皮图标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">干燥起皮</h3>
                                <p class="option-caption">皮肤紧绷，上妆卡粉不服帖</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="oily-acne">
                            <div class="card-image">
                                <img src="images/oily-acne.svg" alt="出油冒痘图标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">出油冒痘</h3>
                                <p class="option-caption">T区出油增多，容易长闭口痘痘</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dull-skin">
                            <div class="card-image">
                                <img src="images/dull-skin.svg" alt="暗沉无光图标" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">暗沉无光</h3>
                                <p class="option-caption">肤色暗黄，看起来没有精神</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
