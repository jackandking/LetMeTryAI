    <title>24年后夺冠，你当年在哪儿看球？回忆你的看球瞬间</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">24年后夺冠，你当年在哪儿看球？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">24年后夺冠，你当年是在哪儿看球的？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="at-home-with-family">
                            <div class="card-image">
                                <img src="images/at-home-with-family.svg" alt="家人围坐电视看球的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">家里和家人一起</h3>
                                <p class="option-desc">在客厅里跟家人围着电视，看球时的欢笑或落泪都在这一刻</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="community-square-screen">
                            <div class="card-image">
                                <img src="images/community-square-screen.svg" alt="社区广场大屏前看球的人群" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">广场或社区大屏</h3>
                                <p class="option-desc">和邻居们在广场大屏前看球，热闹又接地气</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="restaurant-teahouse">
                            <div class="card-image">
                                <img src="images/restaurant-teahouse.svg" alt="茶馆或小饭店里看球的长辈" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">饭店或茶馆里</h3>
                                <p class="option-desc">在饭店或茶馆一边喝茶一边看球，边吃边聊的氛围很有生活感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="friends-fan-gathering">
                            <div class="card-image">
                                <img src="images/friends-fan-gathering.svg" alt="朋友聚在一起看球庆祝的场面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">朋友家或球迷聚会</h3>
                                <p class="option-desc">和老友或球迷在一起看球，大家一起讨论、起哄、庆祝或落寞</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
