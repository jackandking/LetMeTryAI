<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">大热天出门，你pick哪种不脱妆的清爽妆？轻薄防晒or控油定妆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">大热天出门，你pick哪种不脱妆的清爽妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-sunscreen-makeup">
                            <div class="card-image">
                                <img src="images/light-sunscreen-makeup.svg" alt="轻薄防晒隔离妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄防晒隔离妆</h3>
                                <p class="option-desc">以防晒与薄隔离为主，妆感透气，适合短时外出和户外阳光下的通勤</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="oil-control-powder-foundation">
                            <div class="card-image">
                                <img src="images/oil-control-powder-foundation.svg" alt="控油定妆粉底妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">控油定妆粉底妆</h3>
                                <p class="option-desc">先控油再上粉底并用定妆喷雾或粉扑，适合易出油、想要拍照干净妆面的场景</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="dewy-skin-mist-makeup">
                            <div class="card-image">
                                <img src="images/dewy-skin-mist-makeup.svg" alt="水光亮肌喷雾妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">水光亮肌喷雾妆</h3>
                                <p class="option-desc">突出光泽与水感，用保湿妆前+定妆喷雾营造健康光泽，适合想要自然光感的人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-longwear-makeup">
                            <div class="card-image">
                                <img src="images/matte-longwear-makeup.svg" alt="哑光持久妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">哑光薄透持妆妆</h3>
                                <p class="option-desc">以哑光薄透粉底和吸油定妆为主，控油效果明显，适合全天候通勤或室内外切换</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
