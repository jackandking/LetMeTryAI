<head>

    <title>暑期档电影推荐</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">暑期档哪部电影值得追？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">这个夏天，哪类电影让你想冲进影院？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="domestic-action">
                            <div class="card-image">
                                <img src="images/domestic-action.svg" alt="国产动作片海报风格图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">国产动作片</h3>
                                <p class="option-desc">热血燃炸，拳拳到肉</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hollywood-sci-fi">
                            <div class="card-image">
                                <img src="images/hollywood-sci-fi.svg" alt="好莱坞科幻大片风格图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">好莱坞科幻</h3>
                                <p class="option-desc">视觉奇观，脑洞大开</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="suspense-crime">
                            <div class="card-image">
                                <img src="images/suspense-crime.svg" alt="悬疑犯罪片风格图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">悬疑犯罪片</h3>
                                <p class="option-desc">层层反转，烧脑过瘾</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="comedy-family">
                            <div class="card-image">
                                <img src="images/comedy-family.svg" alt="喜剧合家欢风格图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喜剧合家欢</h3>
                                <p class="option-desc">欢乐解压，笑中带泪</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

                document.head.appendChild(script);

    </script>
</body>
</html>
