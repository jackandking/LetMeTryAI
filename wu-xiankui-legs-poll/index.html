    <title>吴贤揆这腿，你觉得好看吗？</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">吴贤揆这腿，你觉得好看吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">吴贤揆这腿，你觉得好看吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="good-looking-smooth">
                            <div class="card-image">
                                <img src="images/good-looking-smooth.svg" alt="吴贤揆腿型好看" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">好看，线条很流畅</h3>
                                <p class="option-desc">比例好，看着舒服</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="average-not-noticed">
                            <div class="card-image">
                                <img src="images/average-not-noticed.svg" alt="没注意吴贤揆腿型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一般吧，没太注意</h3>
                                <p class="option-desc">路人视角，只看脸了</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="not-my-type">
                            <div class="card-image">
                                <img src="images/not-my-type.svg" alt="不太get吴贤揆腿型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不太get到</h3>
                                <p class="option-desc">不是我的审美</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="prefer-strong-legs">
                            <div class="card-image">
                                <img src="images/prefer-strong-legs.svg" alt="喜欢健康力量感腿型" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">更喜欢健康力量感</h3>
                                <p class="option-desc">有力量的腿型更耐看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
