<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#fdf8e8"/>
  
  <!-- 牛奶杯 -->
  <path d="M65 50 L70 120 Q70 130 80 130 L100 130 Q110 130 110 120 L115 50 Z" fill="#ffffff" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="90" cy="50" rx="25" ry="8" fill="#f0f0f0" stroke="#d4a574" stroke-width="2"/>
  
  <!-- 牛奶 -->
  <ellipse cx="90" cy="55" rx="20" ry="5" fill="#fffef5"/>
  <path d="M72 55 L75 115 Q75 122 80 122 L100 122 Q105 122 105 115 L108 55" fill="#fffef5"/>
  
  <!-- 全麦面包片 -->
  <rect x="125" y="70" width="50" height="45" rx="5" fill="#d4a574"/>
  <rect x="130" y="75" width="40" height="35" rx="3" fill="#e8c9a0"/>
  
  <!-- 面包纹理 -->
  <line x1="135" y1="85" x2="165" y2="85" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  <line x1="135" y1="95" x2="165" y2="95" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="80" x2="140" y2="100" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="80" x2="150" y2="100" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="80" x2="160" y2="100" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  
  <!-- 小麦装饰 -->
  <path d="M50 40 Q55 30 60 40" stroke="#c4a35a" stroke-width="2" fill="none"/>
  <ellipse cx="52" cy="38" rx="2" ry="4" fill="#8b6914"/>
  <ellipse cx="55" cy="35" rx="2" ry="4" fill="#8b6914"/>
  <ellipse cx="58" cy="38" rx="2" ry="4" fill="#8b6914"/>
  
  <!-- 小装饰 -->
  <circle cx="165" cy="35" r="5" fill="#c4a35a" opacity="0.3"/>
  <circle cx="40" cy="110" r="4" fill="#c4a35a" opacity="0.2"/>
</svg>