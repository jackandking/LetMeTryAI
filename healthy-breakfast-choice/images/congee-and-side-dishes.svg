<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#fdf8e8"/>
  
  <!-- 碗 -->
  <ellipse cx="100" cy="95" rx="55" ry="18" fill="#d4a574"/>
  <path d="M45 95 Q45 125 100 130 Q155 125 155 95" fill="#e8c9a0"/>
  <ellipse cx="100" cy="95" rx="50" ry="14" fill="#fff8e7"/>
  
  <!-- 粥 -->
  <ellipse cx="100" cy="95" rx="45" ry="11" fill="#f5e6c8"/>
  
  <!-- 热气 -->
  <path d="M85 70 Q90 60 85 50" stroke="#c4a35a" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M100 65 Q105 55 100 45" stroke="#c4a35a" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M115 70 Q120 60 115 50" stroke="#c4a35a" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- 小菜盘子 -->
  <ellipse cx="160" cy="110" rx="25" ry="10" fill="#d4a574"/>
  <ellipse cx="160" cy="109" rx="20" ry="7" fill="#e8dcc0"/>
  
  <!-- 咸菜 -->
  <ellipse cx="155" cy="108" rx="6" ry="3" fill="#7a9a4a"/>
  <ellipse cx="165" cy="110" rx="5" ry="2.5" fill="#8baa5a"/>
  <ellipse cx="160" cy="107" rx="4" ry="2" fill="#6a8a3a"/>
  
  <!-- 筷子 -->
  <rect x="48" y="45" width="3" height="45" fill="#8b6914" transform="rotate(-15 48 45)"/>
  <rect x="55" y="45" width="3" height="45" fill="#8b6914" transform="rotate(-10 55 45)"/>
  
  <!-- 装饰性元素 -->
  <circle cx="30" cy="30" r="8" fill="#c4a35a" opacity="0.3"/>
  <circle cx="170" cy="40" r="6" fill="#c4a35a" opacity="0.2"/>
</svg>