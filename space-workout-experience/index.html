<head>

    <title>在太空健身是啥体验？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">在太空健身是啥体验？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">在太空健身，你想先体验哪种训练？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="treadmill-harness-run">
                            <div class="card-image">
                                <img src="images/treadmill-harness-run.svg" alt="宇航员在太空跑步机上训练" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">跑步机绑带跑</h3>
                                <p class="option-desc">用弹力带把人固定在跑步机上，边跑边飘，感受失重跑步的酸爽。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="floating-dumbbell-lift">
                            <div class="card-image">
                                <img src="images/floating-dumbbell-lift.svg" alt="太空漂浮举哑铃训练" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">漂浮举哑铃</h3>
                                <p class="option-desc">哑铃不落地，人和哑铃一起飘，练的是平衡不是重量。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="space-stationary-bike">
                            <div class="card-image">
                                <img src="images/space-stationary-bike.svg" alt="宇航员骑太空动感单车" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">太空动感单车</h3>
                                <p class="option-desc">没有重力压迫，双脚狂蹬却感受不到汗水往下流。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="resistance-band-strength">
                            <div class="card-image">
                                <img src="images/resistance-band-strength.svg" alt="太空弹力带力量训练" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">弹力带抗阻训练</h3>
                                <p class="option-desc">一根弹力带练遍全身，靠拉力对抗肌肉萎缩。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
