    <title>你小时候家里开的哪款老车？翻开记忆相册</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">你小时候家里开的哪款老车？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你小时候家里开的哪款老车？选出你家的那一辆，并说一句回忆。</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="dazhong-santana">
                            <div class="card-image">
                                <img src="images/dazhong-santana.svg" alt="大众桑塔纳 老车 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">大众桑塔纳</h3>
                                <p class="option-desc">老式家用车，载着全家去郊游的时光</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hongqi-classic">
                            <div class="card-image">
                                <img src="images/hongqi-classic.svg" alt="红旗 老式轿车 正面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">红旗老轿车</h3>
                                <p class="option-desc">长辈眼中的体面座驾，回家路有庄重感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="beetle-classic">
                            <div class="card-image">
                                <img src="images/beetle-classic.svg" alt="甲壳虫 老式小车 侧面照" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">甲壳虫（老式小车）</h3>
                                <p class="option-desc">圆圆小车像玩具，院子里孩子们围着看</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="minivan-breadvan">
                            <div class="card-image">
                                <img src="images/minivan-breadvan.svg" alt="面包车 老式微面 后视图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">面包车/微面</h3>
                                <p class="option-desc">装满菜和年货，过年回家少不了它的忙碌身影</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
