    <title>普通人什么时候能用上 6G？来投票说说你的判断</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">普通人什么时候能用上 6G？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">你认为普通人什么时候能用上 6G？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="within-3-years">
                            <div class="card-image">
                                <img src="images/within-3-years.svg" alt="短期3年内6G可用" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">短期（3年内）</h3>
                                <p class="option-desc">技术和部署提速，部分地区或场景可能先行可用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="years-3-7">
                            <div class="card-image">
                                <img src="images/years-3-7.svg" alt="中期3到7年6G" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">中期（3-7年）</h3>
                                <p class="option-desc">需完成标准和基础设施升级，3-7年进入更广泛部署</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="years-7-15">
                            <div class="card-image">
                                <img src="images/years-7-15.svg" alt="长期7到15年6G" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">长期（7-15年）</h3>
                                <p class="option-desc">技术成熟与成本下降后逐步替代现有网络</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="years-15-plus">
                            <div class="card-image">
                                <img src="images/years-15-plus.svg" alt="超过15年或不确定6G" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不确定/更久（15年以上或难以判断）</h3>
                                <p class="option-desc">受频谱、政策与商业模式制约，可能超过15年或难以确定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
