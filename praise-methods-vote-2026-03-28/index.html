    <title>哪种表扬更能激励孩子？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">哪种表扬更能激励孩子？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">站在家长视角，你会怎么选：哪种表扬方式更能激励孩子？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-effort">
                            <div class="card-image">
                                <img src="images/praise-effort.svg" alt="家长夸孩子努力" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夸努力与过程</h3>
                                <p class="option-desc">强调孩子的努力与付出，让孩子重视过程</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-progress">
                            <div class="card-image">
                                <img src="images/praise-progress.svg" alt="表扬孩子进步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夸小进步与改进</h3>
                                <p class="option-desc">关注每次进步，鼓励持续改进</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-character">
                            <div class="card-image">
                                <img src="images/praise-character.svg" alt="夸孩子品格" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">夸品格与好习惯</h3>
                                <p class="option-desc">表扬孩子的品格、责任感和好习惯</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="parent-tools" value="praise-guided">
                            <div class="card-image">
                                <img src="images/praise-guided.svg" alt="引导孩子自评" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">引导自我评价与反思</h3>
                                <p class="option-desc">通过提问引导孩子自我认可，减少直接鼓励依赖</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
