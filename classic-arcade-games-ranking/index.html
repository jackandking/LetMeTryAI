    <title>经典街机游戏排行 — 你心中的街机王者</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">经典街机游戏排行 — 你心中的街机王者</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你会把票投给哪一款经典街机游戏（按操作手感/对战性/怀旧度）？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="street-fighter-ii">
                            <div class="card-image">
                                <img src="images/street-fighter-ii.svg" alt="街霸2对战画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">街霸 II（Street Fighter II）</h3>
                                <p class="option-desc">格斗经典，连招与对战平衡、对手手感决定胜负；PVP氛围极强，最能体现格斗纯粹性。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="metal-slug">
                            <div class="card-image">
                                <img src="images/metal-slug.svg" alt="合金弹头像素射击" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">合金弹头（Metal Slug）</h3>
                                <p class="option-desc">横版射击神作，疾速移动与华丽像素动作，单人闯关与协作爽快感十足。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="pac-man">
                            <div class="card-image">
                                <img src="images/pac-man.svg" alt="吃豆人迷宫画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">吃豆人（Pac-Man）</h3>
                                <p class="option-desc">迷宫与策略的经典代表，节奏轻快但高分策略考验操作与规划，怀旧指数满分。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="contra">
                            <div class="card-image">
                                <img src="images/contra.svg" alt="魂斗罗经典关卡" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">魂斗罗（Contra）</h3>
                                <p class="option-desc">双人硬核过关标杆，弹幕与反应考验并存，高难度带来极强成就感与社交炫耀价值。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
