    <title>演唱会上出汗，哪种底妆更合你心？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">演唱会上出汗，你更信哪种底妆？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">演唱会上出汗，你更信哪种底妆？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="matte-long-wear">
                            <div class="card-image">
                                <img src="images/matte-long-wear.svg" alt="哑光持久粉底" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">哑光持久粉底+妆前乳</h3>
                                <p class="option-desc">妆感服贴、不易脱妆，适合油肌和想控油的人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="waterproof-setting-spray">
                            <div class="card-image">
                                <img src="images/waterproof-setting-spray.svg" alt="防水定妆喷雾" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">防水定妆喷雾+轻薄粉底</h3>
                                <p class="option-desc">用喷雾把妆面锁住，汗水也不容易花</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cushion-touch-up">
                            <div class="card-image">
                                <img src="images/cushion-touch-up.svg" alt="气垫补妆" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">气垫随手补妆</h3>
                                <p class="option-desc">随时按压补妆，保持光泽感与自然气色</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bb-sweat-control">
                            <div class="card-image">
                                <img src="images/bb-sweat-control.svg" alt="控油BB霜与吸汗粉" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">控油BB/隔离+吸汗小物</h3>
                                <p class="option-desc">轻薄不厚重，配吸汗小物更耐汗，适合怕面具感的人</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
