    <title>760元护肤品值得买吗？剁手还是观望？</title>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">760元一粒的护肤品，你会为它剁手吗？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">760元一粒的护肤品，你会为它剁手吗？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-immediately">
                            <div class="card-image">
                                <img src="images/buy-immediately.svg" alt="立刻购买护肤品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">立刻买单</h3>
                                <p class="option-desc">心动就下单，效果/体验值得花这笔钱</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="try-sample-first">
                            <div class="card-image">
                                <img src="images/try-sample-first.svg" alt="先试用小样" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">先试样品</h3>
                                <p class="option-desc">先要小样或试用，确认有效再决定</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="buy-for-special-occasions">
                            <div class="card-image">
                                <img src="images/buy-for-special-occasions.svg" alt="特殊场合购买护肤品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">只在重要场合买</h3>
                                <p class="option-desc">只为婚礼或重要约会准备，平时不常用</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="never-buy-too-expensive">
                            <div class="card-image">
                                <img src="images/never-buy-too-expensive.svg" alt="拒绝高价护肤品" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">不会买太贵</h3>
                                <p class="option-desc">太贵且性价比不行，拒绝剁手</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
