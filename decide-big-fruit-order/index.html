    <title>遇到大份网购水果怎么分？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">遇到大份网购水果，家里怎么决定？家庭分配方式投票</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">遇到大份网购水果，家里通常怎么决定分配？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="even-share">
                            <div class="card-image">
                                <img src="images/even-share.svg" alt="平均分水果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">平均分给每人</h3>
                                <p class="option-desc">把水果按数量或重量平均分给每个家庭成员，简单公平。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="preference-based">
                            <div class="card-image">
                                <img src="images/preference-based.svg" alt="按喜好分水果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">按喜好优先分配</h3>
                                <p class="option-desc">先满足每人喜欢的品种或口味，剩下再分配给其他人。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="rotate-and-store">
                            <div class="card-image">
                                <img src="images/rotate-and-store.svg" alt="轮流挑选水果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轮流挑选或分期吃</h3>
                                <p class="option-desc">轮流挑选自己想吃的，或分批存放分几天吃，避免一次吃不完变质。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="share-with-neighbors">
                            <div class="card-image">
                                <img src="images/share-with-neighbors.svg" alt="分享给邻居" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">分享给邻居或朋友</h3>
                                <p class="option-desc">将多余或不便保存的水果分给邻居、朋友或社区，减少浪费并增进邻里关系。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
