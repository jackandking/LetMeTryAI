    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">国产越野车硬核对决</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">作为硬核玩家，你更认可哪款国产越野车的越野实力？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="tank-300-short-axle">
                            <div class="card-image">
                                <img src="images/tank-300-short-axle.svg" alt="坦克300 短轴改装越野实拍" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">坦克300·短轴硬派改装版</h3>
                                <p class="option-desc">短轴+高通过性，市区与山地兼备，改装爱好者心头好。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="tank-500-flagship">
                            <div class="card-image">
                                <img src="images/tank-500-flagship.svg" alt="坦克500 越野路况展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">坦克500·旗舰越野SUV</h3>
                                <p class="option-desc">大排量+强劲扭矩，公路舒适与野外征服力并存。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="haval-h9-hardcore">
                            <div class="card-image">
                                <img src="images/haval-h9-hardcore.svg" alt="哈弗H9 越野通过性镜头" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">哈弗H9·传统硬派底盘派</h3>
                                <p class="option-desc">承载式车身优化底盘，稳定通过和可靠载重是它的招牌。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="nanrenbao" value="bj40-mod-potential">
                            <div class="card-image">
                                <img src="images/bj40-mod-potential.svg" alt="北京BJ40 改装越野展示" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">北京BJ40·越野改装潜力王</h3>
                                <p class="option-desc">轻量车身+大空间改装位，越野改装社区热度高。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
