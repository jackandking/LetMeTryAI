    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">AI脸看多了，哪种自然妆容更让你心动？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">AI脸看多了，哪种自然妆容更让你心动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="water-makeup">
                            <div class="card-image">
                                <img src="images/water-makeup.svg" alt="白开水自然妆容插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">白开水妆</h3>
                                <p class="option-desc">淡到像水一样干净，皮肤会呼吸的轻盈感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="no-makeup-look">
                            <div class="card-image">
                                <img src="images/no-makeup-look.svg" alt="伪素颜自然妆容插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">伪素颜妆</h3>
                                <p class="option-desc">仿佛没化妆，却悄悄变好看的妈生好皮</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="clear-makeup">
                            <div class="card-image">
                                <img src="images/clear-makeup.svg" alt="日杂清透自然妆容插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">日杂清透妆</h3>
                                <p class="option-desc">日系透明感，像杂志里走出来的元气女孩</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="glow-makeup">
                            <div class="card-image">
                                <img src="images/glow-makeup.svg" alt="气血感自然妆容插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">气血感妆容</h3>
                                <p class="option-desc">由内而外的红润好气色，像刚运动完的健康光泽</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
