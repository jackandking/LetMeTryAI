    <title>夏天带娃出门续命神器</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">夏天带娃出门，你靠哪样神器续命？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">夏天带娃出门，你靠哪样神器续命？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="portable-mini-fan">
                            <div class="card-image">
                                <img src="images/portable-mini-fan.svg" alt="便携小风扇插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">便携小风扇</h3>
                                <p class="option-desc">挂脖或手持小风扇，走哪儿吹哪儿，娃不闹汗，夏日出门救命好物。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="kids-sun-hat">
                            <div class="card-image">
                                <img src="images/kids-sun-hat.svg" alt="儿童防晒帽插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">儿童防晒帽</h3>
                                <p class="option-desc">大帽檐遮阳帽，物理防晒让家长更安心，户外活动刚需装备。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="mosquito-repellent-spray">
                            <div class="card-image">
                                <img src="images/mosquito-repellent-spray.svg" alt="驱蚊喷雾插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">驱蚊喷雾</h3>
                                <p class="option-desc">喷一喷蚊虫绕道，公园草地野餐露营都离不开它。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="insulated-water-bottle">
                            <div class="card-image">
                                <img src="images/insulated-water-bottle.svg" alt="保温水壶插画" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">保温水壶</h3>
                                <p class="option-desc">冰水保冷、热水保温，一口凉白开让娃快速回血。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
