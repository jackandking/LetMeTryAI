<body>
    <h1 id="pageTitle">家长话题：你觉得最能培养孩子阅读兴趣的方法？</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在家长视角，你会怎么选：最能让孩子爱上阅读的方法是？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="parent-tools" value="daily-short-read">
                    <img src="images/daily-short-read.svg" alt="父母与孩子每天读书" loading="lazy">
                    <span>每天固定10-20分钟，共读培养习惯和安全感。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="child-choose-books">
                    <img src="images/child-choose-books.svg" alt="孩子在书店选书" loading="lazy">
                    <span>根据孩子兴趣选书，增强自主性与好奇心。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="picture-books-storytime">
                    <img src="images/picture-books-storytime.svg" alt="图画书阅读场景" loading="lazy">
                    <span>用图画书和互动式讲述点燃想象力。</span>
                </label>

                <label class="option">
                    <input type="radio" name="parent-tools" value="home-book-corner-reward">
                    <img src="images/home-book-corner-reward.svg" alt="家庭书角与陪伴" loading="lazy">
                    <span>打造固定阅读空间并用小奖励维持动力。</span>
                </label>
            </div>
        </div>
    </form>
