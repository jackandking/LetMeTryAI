    <title>关注：晚上更能助眠的好方法？</title>
    <script src="../util.js"></script>
    <script src="app.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">关注：晚上更能助眠的好方法？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">亲，你最支持哪个助眠方法？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="elder-love" value="pre-sleep-walk">
                            <div class="card-image">
                                <img src="images/pre-sleep-walk.svg" alt="老人傍晚散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">睡前散步15分钟</h3>
                                <p class="option-desc">轻松散步，放松身心不剧烈运动</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="relaxing-music">
                            <div class="card-image">
                                <img src="images/relaxing-music.svg" alt="播放音乐的手机与耳机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">听轻音乐/放松音频</h3>
                                <p class="option-desc">播放柔和音乐或冥想引导助放松</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="dim-lights-and-phone-off">
                            <div class="card-image">
                                <img src="images/dim-lights-and-phone-off.svg" alt="卧室昏暗灯光与静音手机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">调暗灯光与断开手机</h3>
                                <p class="option-desc">睡前关小灯、远离手机屏幕更易入睡</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="elder-love" value="warm-milk-or-tea">
                            <div class="card-image">
                                <img src="images/warm-milk-or-tea.svg" alt="热牛奶杯子" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">喝一杯热牛奶/花茶</h3>
                                <p class="option-desc">睡前喝温热饮品（不含刺激性饮料）</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在汇总实时投票结果...</p>
                </div>
            </div>

            <button class="show-result-btn" style="display:none;" id="showResultBtn" onclick="showAd()">查看实时票选结果</button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
