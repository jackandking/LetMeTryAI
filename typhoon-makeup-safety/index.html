    <title>台风天出门妆容对比：轻妆省心还是全防水更安心？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">台风天出门，妆容怎么安排？哪种更安心？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">台风天要出门，你会怎么安排妆容，哪种更让你安心？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="full-waterproof-makeup">
                            <div class="card-image">
                                <img src="images/full-waterproof-makeup.svg" alt="全防水持妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">全防水持妆</h3>
                                <p class="option-desc">底妆防水、眼妆加固、唇色定妆，雨天也不怕脱妆，适合正式场合或需要全天持妆的时候。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="lightweight-no-makeup-look">
                            <div class="card-image">
                                <img src="images/lightweight-no-makeup-look.svg" alt="轻薄无妆感妆容示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">轻薄无妆感（防晕）</h3>
                                <p class="option-desc">以轻薄护肤为主，做局部防晕处理，看起来自然又能应对湿气，不想妆花时的首选。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="spot-proof-essentials">
                            <div class="card-image">
                                <img src="images/spot-proof-essentials.svg" alt="重点局部防护妆示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">重点局部防护</h3>
                                <p class="option-desc">只在易显脏的部位加强防水（底妆+眼线/睫毛），其他地方保持简洁，兼顾精致和实用。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="bareface-with-gear">
                            <div class="card-image">
                                <img src="images/bareface-with-gear.svg" alt="素颜并佩戴帽子口罩示意图" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">素颜＋物理防护</h3>
                                <p class="option-desc">选择素颜或轻护肤，戴帽子/口罩/雨具加强防护，追求最省心的出门方案。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>
