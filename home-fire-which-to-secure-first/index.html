    <title>家里哪些东西容易着火？先收哪样更保险？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里哪些东西容易着火？先收哪样更保险？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里哪些东西容易着火？你会先收哪样更保险？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="kitchen-stove">
                            <div class="card-image">
                                <img src="images/kitchen-stove.svg" alt="厨房灶台与燃气灶" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">厨房灶具</h3>
                                <p class="option-desc">炒菜油烟和明火附近易起火，先把油瓶、抹布和易燃调料收远离灶台更保险。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="charging-devices">
                            <div class="card-image">
                                <img src="images/charging-devices.svg" alt="手机与充电宝正在充电" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">充电设备</h3>
                                <p class="option-desc">手机、充电宝充电发热时有风险，优先断电并收起充电器能降低隐患。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="heaters">
                            <div class="card-image">
                                <img src="images/heaters.svg" alt="电暖器与电热毯" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">取暖电器</h3>
                                <p class="option-desc">电暖器、电热毯靠近布料容易引燃，先拔掉插头并移远窗帘衣物更稳妥。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="combustible-clutter">
                            <div class="card-image">
                                <img src="images/combustible-clutter.svg" alt="纸箱与衣物堆放" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">可燃杂物</h3>
                                <p class="option-desc">纸箱、旧衣物堆放助燃，优先清理或收纳可阻止火势扩散。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">

            </div>
        </footer>
    </div>
