                            <div class="card-content">
                                <h3 class="option-title">文艺杯面</h3>

                                <p class="option-desc">加入配菜与摆盘，打造高级美食照，适合吃播或精致风。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
