    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">家里老人手机老弹广告你会怎么帮？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">家里老人手机老弹广告你会怎么帮？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="remote-setup">
                            <div class="card-image">
                                <img src="images/remote-setup.svg" alt="远程设置手机以减少广告" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">远程代设</h3>
                                <p class="option-desc">远程帮关通知、卸载可疑应用并调整权限</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hand-holding-teach">
                            <div class="card-image">
                                <img src="images/hand-holding-teach.svg" alt="教老人如何关闭广告和识别弹窗" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">手把手教</h3>
                                <p class="option-desc">陪同演示操作并留步骤截图或写提醒便签</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="install-ad-blocker">
                            <div class="card-image">
                                <img src="images/install-ad-blocker.svg" alt="安装广告拦截与清理软件" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">装广告拦截</h3>
                                <p class="option-desc">为老人安装并配置广告拦截或清理类软件，定期清理后台</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="switch-senior-phone">
                            <div class="card-image">
                                <img src="images/switch-senior-phone.svg" alt="更换为更简洁的老人手机" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">换简洁机/接管</h3>
                                <p class="option-desc">备份数据后换成界面简洁的老人机或暂时代为管理手机</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
