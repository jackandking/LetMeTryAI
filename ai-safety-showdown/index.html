    <h1 id="pageTitle">硬核AI防线｜AI安全技术PK</h1>

    <form id="questionnaire">
        <div class="question" id="questionArea">
            <p id="questionText">站在男人宝用户视角，你更想把票投给谁：硬核AI防线——哪种技术更靠谱？</p>
            <div class="button-group" id="optionsContainer">
                <label class="option">
                    <input type="radio" name="nanrenbao" value="deepfake-detection">
                    <img src="images/deepfake-detection.svg" alt="深度假脸检测示意" loading="lazy">
                    <span>专门识别伪造人像/视频的检测器</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="model-audit">

                    <span>揭示模型内因果与决策逻辑的审计工具</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="edge-local-ai">
                    <img src="images/edge-local-ai.svg" alt="边缘AI设备示意" loading="lazy">
                    <span>把AI运算放到本地/设备以降低数据泄露风险</span>
                </label>

                <label class="option">
                    <input type="radio" name="nanrenbao" value="provenance-watermark">
                    <img src="images/provenance-watermark.svg" alt="内容水印示意" loading="lazy">
                    <span>在生成内容里嵌入可溯源水印与签名</span>
                </label>
            </div>
        </div>
    </form>
