<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">看航天发射，你被哪个画面打动？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">看航天发射，你被哪个画面打动？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="ignition-blaze">
                            <div class="card-image">
                                <img src="images/ignition-blaze.svg" alt="火箭点火升空时的火光与浓烟" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">点火升空的火光与浓烟</h3>
                                <p class="option-desc">火焰冲天、白烟翻涌，那一刻震撼心跳。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fairing-separation">
                            <div class="card-image">
                                <img src="images/fairing-separation.svg" alt="整流罩分离的慢动作画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">整流罩分离时的慢动作</h3>
                                <p class="option-desc">护罩抛离、裸露核心，像电影里的慢镜头。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="astronaut-wave">
                            <div class="card-image">
                                <img src="images/astronaut-wave.svg" alt="航天员在驾驶舱里微笑并挥手的画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">航天员驾驶舱里的微笑与挥手</h3>
                                <p class="option-desc">舱内表情、挥手致意，温暖又亲切的瞬间。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="booster-landing">
                            <div class="card-image">
                                <img src="images/booster-landing.svg" alt="助推器回收着陆的壮观画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">一级助推器回收落地的壮观</h3>
                                <p class="option-desc">助推器精准降落，科技与诗意同在。</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
