    <title>想不发福，爸妈更靠哪个日常习惯?</title>
    <script src="../util.js"></script>

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">想不发福，爸妈更靠哪个日常习惯?</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">想不发福，爸妈更靠哪个日常习惯?</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="light-dinner">
                            <div class="card-image">
                                <img src="images/light-dinner.svg" alt="老人吃一碗清淡晚饭" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">晚饭清淡少量</h3>
                                <p class="option-desc">晚饭吃清淡、少碳水，习惯早吃不过晚点心</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="daily-walking">
                            <div class="card-image">
                                <img src="images/daily-walking.svg" alt="老人在小区散步" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">每天饭后散步</h3>
                                <p class="option-desc">饭后散步20–30分钟，换上鞋子在小区走一圈</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="regular-housework">
                            <div class="card-image">
                                <img src="images/regular-housework.svg" alt="老人打扫房间做家务" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">常做家务动起来</h3>
                                <p class="option-desc">经常做家务、打扫菜市场搬菜，上下身都动起来</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="cut-snacks">
                            <div class="card-image">
                                <img src="images/cut-snacks.svg" alt="老年人拿着一小碗坚果" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">控制零食甜点</h3>
                                <p class="option-desc">少吃零食和甜点，用水果或坚果当加餐</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">

            </div>
        </footer>
