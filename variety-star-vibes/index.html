        <main>
            <form id="questionnaire">

                    <p id="questionText" class="question-text">你会把这一票投给谁：哪位女明星综艺感更强？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="womanai" value="yang-chaoyue">
                            <div class="card-image">
                                <img src="images/yang-chaoyue.jpg" alt="杨超越综艺形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">yang-chaoyue</h3>

                            </div>

                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="di-li-re-ba">
                            <div class="card-image">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">di-li-re-ba</h3>

                        <label class="option-card">

                            </div>
                            <div class="card-content">
                                <h3 class="option-title">yang-mi</h3>
                                <p class="option-desc">反应快、有话题制造能力</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="womanai" value="zhou-dongyu">
                            <div class="card-image">
                                <img src="images/zhou-dongyu.jpg" alt="周冬雨综艺形象" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">zhou-dongyu</h3>
