    <title>熬夜追剧/看球，今晚你会吃哪种夜宵？</title>
    <script src="../util.js"></script>
    <script src="app.js?v=2"></script>
    <link rel="stylesheet" href="styles.css">

<body>
    <div class="container">
        <header class="page-header">
            <h1 id="pageTitle">熬夜追剧看球，夜宵你会选哪种？</h1>
        </header>

        <main>
            <form id="questionnaire">
                <div class="question" id="questionArea">
                    <p id="questionText" class="question-text">追剧或看球熬夜，你会点哪种夜宵？</p>
                    <div class="options-grid" id="optionsContainer">
                        <label class="option-card">
                            <input type="radio" name="equipment" value="kao-chuan">
                            <div class="card-image">
                                <img src="images/kao-chuan.svg" alt="烤串与啤酒的夜宵画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">烤串配啤酒</h3>
                                <p class="option-desc">烤串＋冰啤，边看边聊很带感</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="fried-chicken-burger">
                            <div class="card-image">
                                <img src="images/fried-chicken-burger.svg" alt="炸鸡汉堡特写" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">炸鸡汉堡</h3>
                                <p class="option-desc">方便又过瘾，追剧标配</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="hot-noodles-congee">
                            <div class="card-image">
                                <img src="images/hot-noodles-congee.svg" alt="热汤面或粥的温暖画面" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">热汤面/粥</h3>
                                <p class="option-desc">暖胃派，更适合深夜回家后</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>

                        <label class="option-card">
                            <input type="radio" name="equipment" value="snack-platter">
                            <div class="card-image">
                                <img src="images/snack-platter.svg" alt="丰富零食拼盘" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3 class="option-title">小零食拼盘</h3>
                                <p class="option-desc">零食拼盘+饮料，懒人首选</p>
                            </div>
                            <div class="check-indicator">✓</div>
                        </label>
                    </div>
                </div>
            </form>

            <div class="result" id="result">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>正在获取最新数据...</p>
                </div>
            </div>

            <button class="show-result-btn" id="showResultBtn" onclick="showAd()" style="display:none;">
                <span>查看结果</span>
            </button>
        </main>

        <footer class="page-footer">
            <div class="more" id="more">
                <a target="_blank" onclick="jumpToIndex()">返回主页查看更多</a>
            </div>
        </footer>
    </div>

</body>
